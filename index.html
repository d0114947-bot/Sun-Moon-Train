/* 駕駛室：號誌與車門聯鎖（等待後才會轉綠／亮起） */
const CAB={leg:null,signal:'red',doors:'open',timers:[],
 begin(){ if(state.currentPhase!=='docked') return; const k=state.journeyCount+'@'+state.currentLocation; if(this.leg===k) return; this.leg=k;
  this.timers.forEach(clearTimeout); this.timers=[];
  this.signal=state.duty.signal?'green':sigColor(); if(this.signal==='green') sigAuto(); this.doors=state.duty.doors?'lit':'open';
  const re=()=>{ if(RUNNING&&state.currentCarriage==='cab'&&state.currentPhase==='docked'){ const bg=document.querySelector('#scene svg.bg'); if(bg) bg.outerHTML=svgScene(ART.car.cab(state)); hsRefresh(); } };  // 只更新畫面與熱點狀態，不重建場景
  this.re=re; if(this.signal!=='green') this.sched();
  if(this.doors!=='lit') this.timers.push(setTimeout(()=>{ this.doors='closing'; re(); },900),setTimeout(()=>{ this.doors='lit'; re(); },3000)); },
 reset(){ this.leg=null; this.timers.forEach(clearTimeout); this.timers=[]; },
 /* 廣播之後開始倒數：紅 → 琥珀 → 綠 */
 sched(){ const d=state.duty; if(!d.mic||!d.sigAt) return; const left=d.sigAt-Date.now();
  if(left<=0){ this.signal='green'; sigAuto(); this.re&&this.re(); return; }
  if(left>5000) this.timers.push(setTimeout(()=>{ this.signal='amber'; this.re&&this.re(); },left-5000)); else this.signal='amber';
  this.timers.push(setTimeout(()=>{ this.signal='green'; SFX.tone(988,0,.8,'sine',.03); sigAuto(); this.re&&this.re(); },left)); },
 signalView(){ return state.currentPhase==='voyage'?'green':this.signal; },
 doorView(){ return state.currentPhase==='voyage'?'lit':this.doors; }
};
/* 星光號誌是系統自動切換的：紅 → 琥珀 → 綠，轉綠時自動記錄，不算一個值勤步驟 */
function sigAuto(){ if(state.currentPhase!=='docked'||state.duty.signal) return; state.duty.signal=true; logJ('前方星光號誌轉為綠光：平安號誌。'); save(); setTimeout(()=>{ try{ hsRefresh(); }catch(e){} },0); setTimeout(boardCheck,800); }

/* ================================================================
   乘客在車上走動：想看植物就去溫室，想看星星就去觀測車廂，想看風景就去展望台或下車走走
   - 精靈感覺得到乘客去了哪裡
   - 走到同一節車廂，乘客會好奇地問問題、跟你聊天
   - 下車的乘客有時會忘了回來：出發前要下車去請牠回來
   ================================================================ */
const ROAM_PLACE={nature:'溫室',observation:'星月觀測車廂',deck:'展望台',outside:'月台外'};
const ROAM_SAY={nature:['我想去溫室，看看那些植物。','溫室的花……今天開了嗎？我去看看。'],observation:['我想去觀測車廂看星星。','觀測車廂的窗很大。我想去看看星星。'],deck:['我想去後面看看風景。','展望台的風，聽說很舒服。'],outside:['我想下車，看看這個地方。','外面的空氣……我想去聞聞看。']};
const ROAM_CHAT={nature:[['這株植物，為什麼會發光呢？','因為它把照到的光，存了一點起來。'],['你每天都會來照顧它們嗎？','嗯。它們長大的樣子，我都記得。'],['這裡的味道，跟我的家有一點像。','那你可以常常來。']],
 observation:[['那顆最亮的星星，叫什麼名字？','我也不知道。……下次一起在星座盤上找找看。'],['從這裡看，天空好大。','對呀。可是列車會帶我們一點一點走過去。'],['你看得見我的家嗎？','說不定哪一顆，就是你的家。']],
 outside:[['這裡的地，踩起來軟軟的。','走慢一點，別跌倒了。'],['我想把這裡的風帶回車上。','那就多吸一口吧。'],['你也是第一次來嗎？','嗯。……能和你一起來，真好。']]};
const ROAM_SLOT={nature:[{x:66,y:76},{x:78,y:80},{x:24,y:86}],observation:[{x:42,y:78},{x:58,y:80},{x:30,y:84}],outside:[{x:62,y:78},{x:40,y:82},{x:78,y:84}]};
const roamList=pl=>Object.keys(PASSENGERS).filter(id=>aboard(id)&&state.passengers[id].place===pl);
function roamSlot(id){ if(state.passengers[id].place==='nature'){ const k=likedBloom(id)[0]; if(k!==undefined&&POD_AT[k]){ const A=POD_AT[k], same=roamList('nature').filter(x=>likedBloom(x)[0]===k), i=Math.max(0,same.indexOf(id)); return {x:A.x+A.w*.7+3+i*5,y:A.y+4}; } } const pl=state.passengers[id].place, L=roamList(pl), S=ROAM_SLOT[pl]||ROAM_SLOT.nature; return S[Math.max(0,L.indexOf(id))%S.length]; }
const outsideList=()=>roamList('outside');
const hasOutside=loc=>HSDEF.some(h=>{ const d=Object.getOwnPropertyDescriptor(h,'scene'); return d&&('value' in d)&&d.value==='out:'+loc&&h.act==='back:'; });   /* 只看固定的場景，不讀會變動的 scene */
const canOut=()=>state.currentPhase==='docked'&&state.currentLocation!=='origin'&&hasOutside(state.currentLocation);
/* 這位乘客現在在不在玩家眼前 */
function seeHere(id){ if(!aboard(id)) return false; const pl=state.passengers[id].place, sc=HS_SCENE();
 if(sc==='habitat') return !pl; if(sc==='observatory') return pl==='deck'; if(sc==='nature'||sc==='observation') return pl===sc; if(sc.startsWith('out:')) return pl==='outside'||state.companion===id; return false; }
const hereList=()=>Object.keys(PASSENGERS).filter(seeHere);
function roamGo(id,pl,quiet){ const s=state.passengers[id], p=PASSENGERS[id], saw=seeHere(id);
 const line=ROAM_SAY[pl][Math.floor(Math.random()*ROAM_SAY[pl].length)];
 const doIt=()=>{ s.place=pl; s.roamAt=Date.now(); s.roamChat=0; save(); render(); };
 if(saw&&!document.querySelector('#layer .dlg,#layer .cine,#layer .ov:not(.drawer)')) return dialogueScript([[id,line],['self',`好，去吧。${pl==='outside'?'發車前要回來喔。':''}`]],doIt);
 doIt(); if(!quiet||PLACE_CAR[pl]===state.currentCarriage) sense(`（……${p.name}好像${pl==='outside'?'下車了，在月台外面':'去了'+ROAM_PLACE[pl]}。）`); }   /* 自己走動的時候，不會一直通知；走到你所在的車廂才會注意到 */
function roamBack(id,quiet){ const s=state.passengers[id], pl=s.place; s.place=undefined; s.roamAt=0; save(); render(); if(!quiet&&!seeHere(id)) sense(`（${PASSENGERS[id].name}從${ROAM_PLACE[pl]||'外面'}回到棲息車廂了。）`); }
function roamTalk(id){ const s=state.passengers[id], p=PASSENGERS[id], pl=s.place;
 if(pl==='outside'&&state.duty.signal) return dialogueScript([['self',`${p.name}！要出發了喔。`],[id,'……啊！對不起，看得太入迷了。'],[id,'我現在就回去。']],()=>{ roamBack(id,true); toast(`${p.name}回到車上了`); boardCheck(); });
 if(pl==='nature'&&likedBloom(id).length&&s.talks<p.talks.length){ s.roamChat=1; save(); const L=PLANTS[state.pods[likedBloom(id)[0]].p]; return dialogueScript([[id,`……這株${L.name}，讓我想起了以前的事。`],[id,'我想說給你聽。']],()=>talk(id)); }
 const C=ROAM_CHAT[pl]||ROAM_CHAT.nature, k=(s.roamChatN||0)%C.length; s.roamChatN=(s.roamChatN||0)+1; s.roamChat=1; save();
 dialogueScript([[id,C[k][0]],['self',C[k][1]]].concat(pl==='outside'?[[id,'……再看一下，我就回去。']]:[]),()=>render()); }
setInterval(()=>{ if(!RUNNING||document.hidden||navigator.webdriver&&!window.STORY_TEST) return; if(document.querySelector('#layer .cine,#layer .board')||TRANS.busy) return;
 const ids=Object.keys(PASSENGERS).filter(id=>aboard(id)&&(state.passengers[id].stage||0)>=1);

 ids.forEach(id=>{ const s=state.passengers[id]; if(!s.place||s.place==='deck'||!s.roamAt) return; const t=Date.now()-s.roamAt;
  if(t>90000&&Math.random()<(s.place==='outside'?.25:.4)) roamBack(id); });
 pairSync(false); skyInvite(); socialStep(); if(Math.random()>.18) return;
 const free=ids.filter(id=>!state.passengers[id].place&&state.companion!==id); if(!free.length) return;
 const id=free[Math.floor(Math.random()*free.length)], opts=['nature','observation','nature','observation'];

 const pl=roamPick(id,opts); if(!pl) return;
 if(pl==='deck'){ const s=state.passengers[id]; if(seeHere(id)&&!document.querySelector('#layer .dlg,#layer .ov:not(.drawer)')) return dialogueScript([[id,ROAM_SAY.deck[0]],['self','好，去吧。']],()=>{ s.place='deck'; s.roamAt=Date.now(); save(); render(); });
  s.place='deck'; s.roamAt=Date.now(); save(); render(); return sense(`（……${PASSENGERS[id].name}好像去了展望台。）`); }

 SFX.init(); SFX.stopDrone(); TRAINSFX.stop(); BGM.start(); CAB.reset(); state=Object.assign(freshState(),clone(st)); normalizeState(); save();
 PANO.active=null; layout.centered=false; RUNNING=true; render();
 if(state.currentPhase==='voyage') SFX.startDrone(); else if(state.currentPhase==='docked'){ NOFEEL=true; arrivalChecks(); }

/* 這一站有誰上車：誰、幾位都是隨機的（第一次停靠一定會遇到一位）；來自這個界域的生命比較容易出現 */
function rollBoarders(){ if(state.currentLocation==='origin') return [];
 const waiting=state.boardQ||[], pool=Object.keys(PASSENGERS).filter(id=>EVENTS['board_'+id]&&!done('board_'+id)&&!state.discoveredLifeforms.includes(id)&&!waiting.includes('board_'+id));
 const room=6-Object.keys(PASSENGERS).filter(aboard).length-waiting.length; if(!pool.length||room<=0) return [];
 const seen=state.scopeSeen||[];
 const lure=!!state.storyFlags.lightLure, r=Math.random(), n=Math.min(room,Math.max(voyBless()==='jelly'||(lure&&Math.random()<.6)?1:0,state.visitedLocations.length<=1&&!state.discoveredLifeforms.length?1:r<.3?0:r<.8?1:2)), out=[];
 for(let k=0;k<n&&pool.length;k++){ const w=pool.map(id=>(PASSENGERS[id].home===state.currentLocation?3:1)*(seen.includes(id)?4:1)*(lure&&PASSENGERS[id].type==='lost'?5:1)), tot=w.reduce((a,b)=>a+b,0); let x=Math.random()*tot, at=0;
  while(x>w[at]){ x-=w[at]; at++; } out.push('board_'+pool.splice(Math.min(at,pool.length-1),1)[0]); }
 return out; }

 silentVoid:[['……好安靜。安靜到可以聽見自己的心跳。','這裡什麼都沒有。可是好像有什麼，在很遠的地方看著。'],['寂滅虛空。這次，我比較不怕了。','聽，心跳聲還在。我還在。']],

let NOFEEL=false;
function locFeel(){ const id=state.currentLocation, F=LOC_FEEL[id]; if(!F||NOFEEL||state.storyFlags.noFeel){ NOFEEL=false; return null; } state.feelSeen=state.feelSeen||[];
 if(!state.feelSeen.includes(id)){ state.feelSeen.push(id); return F[0]; }
 return (state.journeyCount+id.length)%2===0?[F[1][state.journeyCount%F[1].length]]:null; }

 byeSync(); Object.keys(PASSENGERS).forEach(id=>{ if(byeReady(id)&&leaveOKAt(id,state.currentLocation)) q.push(next=>farewell(id,next));   /* 故事、筆記、速寫都完成，而且到了適合牠的地方才下車 */ });
 { const es=echoSign(); if(es) q.push(es); }
 zonePlantArrive();
 // 乘客的請求：帶牠到某個地點
 Object.keys(REQ).forEach(id=>{ const r=reqOf(id); if(aboard(id)&&r&&r.st==='on'&&REQ[id].kind==='loc'&&REQ[id].loc===state.currentLocation&&state.journeyCount>r.j) q.push(next=>dialogueScript(REQ[id].done,()=>{ reqDone(id); next(); })); });
 // 停靠事件
 const brd=rollBoarders(); if(state.storyFlags.lightLure&&brd.length) setTimeout(()=>toast('✦ 跟著星光來的生命，正在月台上等著'),3600); state.storyFlags.lightLure=false;
 Object.entries(EVENTS).forEach(([id,e])=>{ if(e.trigger==='arrive'&&!id.startsWith('board_')&&(!e.loc||e.loc===state.currentLocation)&&!done(id)&&(!e.need||e.need())) q.push(next=>e.run(next)); });
 if(brd.length){ state.boardQ=(state.boardQ||[]).filter(x=>!brd.includes(x)).concat(brd); save();
}
 { const fl=locFeel(); if(fl) q.unshift(next=>setTimeout(()=>dialogueScript(fl.map(t=>['self',t]),next),400)); save(); }
 if(state.storyFlags.eqBack){ state.storyFlags.eqBack=0; logJ('把三件航程裝備放回裝備台。'); q.push(next=>dialogueScript([['self','列車停穩了。……把三件裝備放回裝備台吧。'],['self','星途符牒要重新寫入下一段航程，星軌羅盤要重新校準，界域護符也要靜靜充一下能。'],['self','（裝備台的光一件一件亮起來。）……好了。下次出發前，再來領。']],next)); }
 const run=()=>{ const f=q.shift(); if(f) hintsIdle(()=>f(run)); else { render(); checkCarriageEvents(); } }; run();   /* 每一段劇情之間，先等提示顯示完 */
}

function talk(id,next){

 if(REQ[id]&&!reqOf(id)&&s.talks>=2&&state.currentCarriage==='habitat'&&state.currentPhase!=='outside') return reqAsk(id,next);

 const idx=Math.min(s.talks,p.talks.length-1), node=p.talks[idx], fresh=s.talks<p.talks.length;

 if(!fresh&&NOTES[id]){ const N=NOTES[id], miss=N.secs.filter(k=>filedOf(id)[k]===undefined&&!notesOf(id).some(i=>N.list[i].k===k));
  if(miss.length){ const ni=p.talks.findIndex(t=>t.lines.some(l=>N.list.some(x=>miss.includes(x.k)&&l.includes(x.p))));
   if(ni>=0) return dialogue(id,lines,[{t:'能再跟我說一次之前那些事嗎？',r:'……好。這次聽仔細喔。',go:1}].concat(canGift(id)?[{t:'我帶了一樣東西給你。',r:'……給我的？',gift:1}]:[],[{t:'沒事，只是來看看你。',r:'嗯。'}]),c=>{

 if(!fresh&&canGift(id)) return dialogue(id,lines,[{t:'我帶了一樣東西給你。',r:'……給我的？',gift:1},{t:'沒事，只是來看看你。',r:'嗯。'}],c=>{ if(c&&c.gift) return giftPicker(id,next); render(); next&&next(); });
 dialogue(id,lines,fresh?node.choices:null,()=>{

   const ns=Math.min(3, s.talks>=p.talks.length?3: s.talks>=2?2:1); if(ns>s.stage){ s.stage=ns; s.records.push({j:state.journeyCount,t:'關係：'+STAGE_NAMES[ns]}); toast(p.name+'・'+STAGE_NAMES[ns]); }
   if(node.give&&addItem(node.give,true)){ toast('取得種子：'+COLLECTIBLES[node.give].name); s.records.push({j:state.journeyCount,t:'留下了'+COLLECTIBLES[node.give].name+'。'}); logJ(p.name+'留下了'+COLLECTIBLES[node.give].name+'。'); }
   if(node.clue){ addClue(node.clue); s.records.push({j:state.journeyCount,t:'說起了一個關於古代列車的故事。'}); }
   save(); }
  const so=SOOTHE[id]; if(so&&TAINT.purify('soothe_'+id,so.n,null,p.name+'的安撫')) toast(so.t.replace(/。$/,'')+'・界染度下降');
  render(); next&&next();
 });
}
function idleLine(id){ const L=LOCATIONS[state.currentLocation].name;
 if(id==='titan') return state.currentPhase==='voyage'?'……車在搖。像地脈……在翻身。':'……（牠一動也不動。肩上的蕨葉間，一隻小蟲正在散步。）';
 if(id==='lynx') return state.currentPhase==='voyage'?'……（圓環上空空的。過了一會兒，你才發現牠一直趴在你頭頂上方。）':'外面有雪的味道嗎？……沒有。算了。';
 if(id==='strider') return state.currentPhase==='voyage'?'……（牠的長角一直對著車窗，像在替列車聽前面的風。）':'外面的風停了。……停靠的時候，總是這麼安靜。';
 if(id==='windkoi') return state.currentPhase==='voyage'?'……（牠在圓環之間慢慢迴旋，鰭一張一合，像在替列車撥開前面的風。）':'停下來的時候，風也停了。……我在等它再吹起來。';
 if(id==='mnemo') return state.currentPhase==='voyage'?'……（冰晶的光泡一顆一顆亮著。航行的時候，好像有很多記憶從窗外漂過。）':'停下來的時候，好安靜。……我在聽，這個地方的記憶。';
 if(id==='cabbfrog') return state.currentPhase==='voyage'?'……（葉子捲得緊緊的，只露出一隻眼睛。列車一搖，牠就跟著輕輕晃一下。）':'……呱。停下來了。（牠鬆開一片葉子，伸了個懶腰。）';
 if(id==='skywhale') return state.currentPhase==='voyage'?'……（牠的鰭肢慢慢張開，像在替列車擋住窗外的風。車廂幾乎一點也不晃。）':'……停下來了。我在上面，睡一下。';
 if(id==='treeling') return state.currentPhase==='voyage'?'……（它站得直直的，像一棵在車廂裡旅行的樹。列車一晃，頭頂的枝葉就沙沙地響。）':'停下來了。……我去看看那些盆栽。';
 if(id==='sandwyrm') return state.currentPhase==='voyage'?'……（牠把身體盤在沙堆裡，隨著列車的晃動，輕輕發出低低的鳴聲。）':'停下來了。……地板不震了，我有點不習慣。';
 if(id==='moonwyrm') return state.currentPhase==='voyage'?'……（巨龍半閉著眼，在冷霧裡安靜地呼吸。每一次呼氣，車窗上就結一層薄霜。）':'停下來了。……我再睡一下。';
 if(id==='skyfox') return state.currentPhase==='voyage'?'……（牠趴在圓環上，尾巴尖的藍光隨著列車的晃動，在車廂裡畫出一圈一圈的光。）':'停下來了！我可以去外面玩嗎？';
 if(id==='grinfox') return state.currentPhase==='voyage'?'……（休憩區的角落裡，一排白牙安安靜靜地浮在黑暗中。偶爾，星形墜飾閃一下。）':'停下來了……外面黑嗎？我去看看有沒有人迷路。';
 if(id==='dawnsail') return state.currentPhase==='voyage'?'……（牠收著翅膀站在晶石平台上，背上的鰭帆隨著列車的方向輕輕轉動，像在替列車看路。）':'停下來了。……現在，是日出還是日落？';
 if(id==='scythe') return state.currentPhase==='voyage'?'……（它一動也不動地站著，只有背後的指針，一格一格地走。每走一格，列車就輕輕晃一下。）':'停下來了。（中間的鳥）……時間，也停一下。';
 if(id==='sirenora') return state.currentPhase==='voyage'?'……外面有霧的聲音。我在聽。':'這盞燈很溫暖。我再停一下就好。';
 if(id==='frost') return state.currentPhase==='voyage'?'……航道外面很冷。很像家。':'這裡的地板有點涼，是我。抱歉。';
 if(id==='vandora') return state.currentPhase==='voyage'?'……別出聲。我在聽車廂外面的風。':'這裡太亮了。我在葉子底下待著。';
 if(id==='pyro') return state.currentPhase==='voyage'?'……車在搖。很穩。我不討厭。':'外面不夠熱。我待在這裡就好。';

 if(id==='cinder') return '這裡的光很暖。我把帆收一半，在休息。';

 if(id==='felinia') return state.currentPhase==='voyage'?'這裡的風很穩。我在聽。':'外面的風裡有別的味道。不是山，不過也不壞。';

  : (state.currentLocation==='starIslands'?'星河的潮汐今天很溫柔。我的島應該也在某處被這樣拍著吧。':'這裡沒有星河，但是有你們。也算是一種潮汐。'); }

 if(reqOn(id)){ fl=['之前拜託你的那件事……沒關係。下次再一起吧。'].concat(fl); state.req[id].st='miss'; }

 sc.push(...fl.slice(0,-1).map(t=>[id,t]));
 if(B.gift&&PLANTS[B.gift]) sc.push([id,`這盆${PLANTS[B.gift].name}，我會好好種在${O.h||'那裡'}。`]);
 if(B.stars) sc.push([id,'那天在展望台看的星星……我會記得。']);
 if(B.mem) sc.push(['self','這段旅程，我收進回憶水晶了。'],[id,'……那，我就不怕忘記了。']);

 sc.push([id,fl[fl.length-1]]);

  /* 7 精靈自己的感受（依這段旅程實際發生過的事） */

  if(B.gift&&PLANTS[B.gift]) refl.push(['self',`牠帶走了我種的${PLANTS[B.gift].name}。……希望那裡的光，也照得到它。`]);
  else if((s.outings||[]).length||Object.values(state.hiddenFound||{}).some(f=>f.who===id)) refl.push(['self','下次再經過我們一起走過的地方，我會記得往那邊看一眼。']);
  else refl.push(['self',`${n}趟旅程。……原來，有這麼久了。`]);
  refl.push(['self',bd?`${PASSENGERS[bd.o].name}還站在車門邊，看著外面。……我也陪牠站一下。`:'列車好像輕了一點。……可是，也好像比較暖了。']);

  ${others.length?`<div class="zask">${others.map(id=>`<button class="btn ghost" data-inv="${id}">邀請${PASSENGERS[id].name}${state.passengers[id].stage>=2?'':'（還不夠熟）'}</button>`).join('')}</div>`:'<p class="nb-empty">棲息車廂裡沒有其他乘客。</p>'}
  ${here.length?`<p style="color:var(--mute);font-size:13px">現在在展望台：${here.map(id=>PASSENGERS[id].name).join('、')}</p>`:''}`,'care');
 ov.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{ const id=b.dataset.inv, p=PASSENGERS[id], s=state.passengers[id];
  const yes=s.stage>=2&&deckList().length<DECK_SLOT.length, line=yes?'好。我也想看看列車後面的天空。':deckList().length>=DECK_SLOT.length?'展望台好像已經站滿了。下次吧。':'……我還想待在棲息車廂。等我們再熟一點吧。';
  closeOv(ov); dialogueScript([['self',`${p.name}，要不要一起去展望台看星星？`],[id,line]],()=>{ if(!yes) return SFX.tone(392,0,.3,'sine',.02);
   s.place='deck'; save(); SFX.tone(1046,0,.5,'sine',.03); render(); toast(`${p.name}穿過星月觀測車廂，來到了展望台`); }); }); }

/* ================================================================
   展望台的地面刻紋：每到一個地方，地板上會浮現那裡的刻紋。沿著淡淡的刻痕把刻紋描完，拓本會收進記憶典藏車廂。
   ================================================================ */
const ENGR={origin:[6,1,'沉睡之環'],dawnForest:[5,2,'晨光之星'],starIslands:[7,3,'星河之結'],reverseRealm:[8,3,'逆流之輪'],boundlessCorridor:[9,4,'迴廊之門'],silentVoid:[5,1,'寂靜之印'],timeriftSea:[7,2,'時潮之紋']};
const ENGR_OK=loc=>(state.engr||[]).includes(loc);
function engrPts(loc){ const [n]=ENGR[loc]; return Array.from({length:n},(_,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [200+150*Math.cos(a),200+150*Math.sin(a)]; }); }
function engrEdges(loc){ const [n,k]=ENGR[loc]; return Array.from({length:n},(_,i)=>[i,(i+k)%n]); }
function engrSvg(loc,got,cur,cls){ const P=engrPts(loc), E=engrEdges(loc);
 return `<svg class="${cls||''}" viewBox="0 0 400 400" aria-label="${ENGR[loc][2]}"><circle cx="200" cy="200" r="190" fill="#3a2c1c"/><circle cx="200" cy="200" r="182" fill="none" stroke="#c8a85e" stroke-width="2" opacity=".7"/><circle cx="200" cy="200" r="168" fill="none" stroke="#c8a85e" stroke-width=".8" stroke-dasharray="2 6" opacity=".6"/>
  ${E.map(([a,b],i)=>`<line class="eg-l" x1="${P[a][0].toFixed(1)}" y1="${P[a][1].toFixed(1)}" x2="${P[b][0].toFixed(1)}" y2="${P[b][1].toFixed(1)}" stroke="${got&&got.has(i)?'#ffd98a':'#a08860'}" stroke-width="${got&&got.has(i)?5:1.6}" ${got&&got.has(i)?'':'stroke-dasharray="4 7" opacity=".55"'} stroke-linecap="round"/>`).join('')}
  ${P.map(([x,y],i)=>`<g class="eg-n" data-en="${i}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="22" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${cur===i?10:7}" fill="${cur===i?'#fff3c4':'#e8c983'}" stroke="#3a2c1c" stroke-width="2"/></g>`).join('')}</svg>`; }
function engravePanel(){ const loc=state.currentLocation;
 if(state.currentPhase==='voyage') return panel(`<div class="eyebrow">火車尾展望台</div><h2>地面刻紋</h2>${meSay('航行的時候，刻紋很淡，什麼都看不出來。等停靠的時候再來看看。')}`,'small stage');
 if(ENGR_OK(loc)) return panel(`<div class="eyebrow">火車尾展望台・${LOCATIONS[loc].name}</div><h2>${ENGR[loc][2]}</h2>${engrSvg(loc,new Set(engrEdges(loc).map((_,i)=>i)),null,'eg-board done')}${meSay('這裡的刻紋已經拓下來了，收在記憶典藏車廂的刻紋拓本裡。')}`,'stage');
 const ov=panel('','stage engov'), pn=ov.querySelector('.panel'), E=engrEdges(loc), P=engrPts(loc), got=new Set(); let cur=null, down=false, fin=false;
 /* 手指按住一個點，沿著刻痕滑到下一個點：一筆一筆描出來（像星座連線） */
 pn.innerHTML=`<button class="close" aria-label="關閉">✕</button><div class="eyebrow">火車尾展望台・${LOCATIONS[loc].name}</div><h2>地面刻紋</h2><div class="eg-wrap"></div><p class="eg-cnt"></p>${meSay('地板上浮現了淡淡的刻痕……按住一個點，沿著刻痕滑到下一個點。')}`;
 const wrap=pn.querySelector('.eg-wrap'), cnt=pn.querySelector('.eg-cnt');
 const paint=()=>{ wrap.innerHTML=engrSvg(loc,got,cur,'eg-board'+(fin?' done':'')); const sv=wrap.querySelector('svg'); sv.insertAdjacentHTML('beforeend','<line class="eg-rub" x1="0" y1="0" x2="0" y2="0" stroke="#fff3c4" stroke-width="3" stroke-linecap="round" opacity="0"/>'); cnt.textContent=fin?'':`${got.size} / ${E.length}`; };
 const toSvg=e=>{ const sv=wrap.querySelector('svg'), r=sv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*400,(e.clientY-r.top)/r.height*400]; };
 const nodeAt=e=>{ const [x,y]=toSvg(e); let best=-1, bd=28; P.forEach(([px,py],k)=>{ const d=Math.hypot(px-x,py-y); if(d<bd){ bd=d; best=k; } }); return best; };
 const rub=e=>{ const l=wrap.querySelector('.eg-rub'); if(!l) return; if(cur===null||!down){ l.setAttribute('opacity','0'); return; } const [x,y]=toSvg(e); l.setAttribute('x1',P[cur][0]); l.setAttribute('y1',P[cur][1]); l.setAttribute('x2',x); l.setAttribute('y2',y); l.setAttribute('opacity','.8'); };
 const reach=i=>{ if(i<0||i===cur) return; if(cur===null){ cur=i; SFX.tone(660,0,.25,'sine',.02); return paint(); }
  const k=E.findIndex(([a,b])=>(a===cur&&b===i)||(a===i&&b===cur)); if(k<0) return;
  if(!got.has(k)){ got.add(k); SFX.tone(784+got.size*50,0,.35,'sine',.03); } cur=i;
  if(got.size===E.length){ fin=true; down=false; cur=null; state.engr=state.engr||[]; state.engr.push(loc); logJ(`在展望台描完了${LOCATIONS[loc].name}的刻紋「${ENGR[loc][2]}」。`,'find'); save(); SFX.chime(); render();
   paint(); sayReset(ov); pn.insertAdjacentHTML('beforeend',meSay(`描完了！刻紋亮了起來……是「${ENGR[loc][2]}」。<br>拓本收進記憶典藏車廂了。`)); return; }
  paint(); };
 wrap.addEventListener('pointerdown',e=>{ if(fin) return; e.preventDefault(); down=true; const i=nodeAt(e); if(i>=0){ if(cur===null||i===cur||E.some(([a,b])=>(a===cur&&b===i)||(a===i&&b===cur))) reach(i); else { cur=i; paint(); } } });
 const mv=e=>{ if(!down||fin) return; const i=nodeAt(e); if(i>=0) reach(i); rub(e); };
 const up=()=>{ down=false; const l=wrap.querySelector('.eg-rub'); if(l) l.setAttribute('opacity','0'); };
 window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
 const ob=new MutationObserver(()=>{ if(!ov.isConnected){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); ob.disconnect(); } }); ob.observe(document.getElementById('layer'),{childList:true});
 paint(); }
function rubbingPanel(){ const ids=['origin',...LOC_ORDER];
 return floatField({cls:'rubs',title:'刻紋拓本',sub:()=>`在展望台拓下的刻紋 ${ids.filter(ENGR_OK).length} / ${ids.length}`,
  items:ids.map(id=>({id,have:ENGR_OK(id),cls:'gem rub',inner:engrSvg(id,new Set(engrEdges(id).map((_,i)=>i)),null,''),label:ENGR[id][2]})),
  view:id=>`<h2>${ENGR[id][2]}</h2><div style="width:min(360px,70vw);margin:0 auto">${engrSvg(id,new Set(engrEdges(id).map((_,i)=>i)),null,'eg-board done')}</div>${meSay(`在${LOCATIONS[id].name}停靠的時候，展望台的地板上浮現的刻紋。`)}`}); }

/* 同行的乘客：下車一陣子後，會主動跟你說話 */
let COMPT=0;
function compAuto(){ clearTimeout(COMPT); if(state.currentPhase!=='outside'||!state.companion) return; const key='ca_'+state.journeyCount+'_'+state.currentLocation;
 if(state.storyFlags[key]) return;
 COMPT=setTimeout(()=>{ if(state.currentPhase!=='outside'||!state.companion||state.storyFlags[key]) return;
  if(document.querySelector('#layer .ov,#layer .dlg,#layer .cine')||TRANS.busy) return compAuto();
  state.storyFlags[key]=1; save(); compTalk(); },7000); }

function deckTalk(id){ const p=PASSENGERS[id], s=state.passengers[id], voy=state.currentPhase==='voyage', first=!(s.deckSeen);
 if(HOME_C[id]&&s.stage>=2&&!(state.homeConsts||[]).includes(id)) return homePoint(id);
 dialogue(id,[`（${p.name}倚在展望台的欄杆邊，看著${voy?'列車後方流走的星光':LOCATIONS[state.currentLocation].name+'的天空'}。）`,DECK_LINE[id][voy?0:1]],
  [{t:'再一起看一會兒吧。',r:'嗯。'},{t:'要回棲息車廂休息嗎？',r:'好。我先回去了。',go:1}],c=>{
   if(first){ s.deckSeen=1; s.records.push({j:state.journeyCount,t:'在展望台和你一起看了天空。'}); logJ(`和${p.name}在展望台一起看了天空。`,'life'); }
   if(c&&c.go){ s.place=undefined; toast(`${p.name}回到了棲息車廂`); }
   save(); render(); }); }

/* ================================================================
   觀星
   1. 星象：每趟航程都有一個星象（流星雨、界壁極光、星河潮汐、日月交疊）。
      星月望遠鏡會預報出現的時段；星象出現時待在火車尾展望台就能觀賞。
      第一次看見會凝結成回憶水晶；星光也會淡化一些界染度（每次星象一次）。
      在展望台上的乘客會說出看見星象時的話；喜歡天空的乘客會自己跑去展望台。
   2. 星座連線：在星月觀測車廂的星座盤，把星點連成星座。日界和月界看得見的星座不同。
   3. 乘客會自己在出發和到站時走去展望台，或回到棲息車廂。
   ================================================================ */
const SKY={
 meteor:{name:'流星雨',desc:'無數細小的光從天頂落下，拖著金色的尾巴，劃過列車後方的天空。',fx:'meteor'},
 aurora:{name:'界壁極光',desc:'列車穿越界壁時，界壁的邊緣燃起一層流動的光幕，綠與紫交替著，像天空在呼吸。',fx:'aurora'},
 tide:{name:'星河潮汐',desc:'整條星河漲了起來，星光像潮水一樣一波一波湧向列車，又緩緩退去。',fx:'tide'},
 eclipse:{name:'日月交疊',desc:'在日與月的界線上，太陽和月亮短暫地重疊在一起。天空暗了一瞬，邊緣亮起一圈金色的光環。',fx:'eclipse'}
};
const SKY_LINE={
 meteor:{sola:'流星！快許願！……我許了「找到我的島」。說出來就不靈了嗎？那我再許一次。',felinia:'它們劃過去的樣子，像山谷裡的滑翔。',cinder:'跑得好快。比我還快。',aelis:'我聽得見它們燒起來的聲音。很細，像沙子。'},
 aurora:{leviathaurora:'……那片光在動。像深海裡，很久很久以前看過的同伴。',frost:'冰原的極夜，天空也會這樣燒起來。……我想家了。',sirenora:'光在霧裡流動……那些夢，也是這個顏色。',vandora:'光太多了。不過……很好看。'},
 tide:{sola:'是星河的潮汐！……我的島，就是被這樣的潮汐帶走的。',sirenora:'潮水和霧，都在往同一個方向走。',leviathaurora:'這是天空的潮汐。……原來天上也有海。'},
 eclipse:{pyro:'日和月重疊了。……大地發抖的時候，天空也是這樣暗下來。',aelis:'暮色。白天裡的暮色。是我的時間。',frost:'光變冷了。'}
};
const SKY_FANS=['sola','leviathaurora','felinia','sirenora','aelis','frost'];   /* 喜歡天空的乘客：星象出現時會自己去展望台 */
const SKY_WIN=.22;
function skyForecast(dest){ const jc=state.journeyCount, moon=realmKey(dest)==='moon', list=moon?['aurora','tide','meteor']:['meteor','eclipse'];
 if(jc<2) return null;   /* 新手的前兩趟航行沒有星象 */
 return {type:list[jc%list.length],at:+(.45+((jc*37)%25)/100).toFixed(2),started:false,ended:false,watched:false}; }
const skyNow=()=>state.currentPhase==='voyage'&&state.voyage&&state.voyage.sky&&state.voyage.sky.started&&!state.voyage.sky.ended?state.voyage.sky:null;
function skyTick(v){ const k=v.sky; if(!k) return false;
 if(!k.started&&v.progress>=k.at){ k.started=true; setTimeout(()=>skyGarden(k.type),2500); const went=skyFansGo();
  toast(`✦ 星象出現：${SKY[k.type].name}　到火車尾展望台觀賞吧${went.length?`（${went.join('、')}已經跑過去了）`:''}`); SFX.chime();
  const fl=(state.pods||[]).filter(c=>c&&c.st<2&&SKY_BLOOM[k.type].includes(c.p)); if(fl.length) setTimeout(()=>toast(`溫室的${fl.map(c=>PLANTS[c.p].name).join('、')}好像也在等這片天空……打開天窗看看`),3200); return true; }
 if(k.started&&!k.ended&&v.progress>=k.at+SKY_WIN){ k.ended=true; if(!k.watched) toast(`${SKY[k.type].name}結束了`); return true; }
 return false; }
function skyFansGo(){ const went=[]; SKY_FANS.forEach(id=>{ const s=state.passengers[id]; if(aboard(id)&&!atDeck(id)&&deckList().length<DECK_SLOT.length&&s.stage>=1){ s.place='deck'; went.push(PASSENGERS[id].name); } }); save(); return went; }
/* 乘客自己走去展望台、或回到棲息車廂（出發與到站時） */
function deckWander(){ const msg=[];
 Object.keys(PASSENGERS).filter(aboard).forEach(id=>{ const s=state.passengers[id];
  if(atDeck(id)){ if(Math.random()<.45){ s.place=undefined; msg.push(`${PASSENGERS[id].name}回到了棲息車廂`); } }
  else if(s.stage>=2&&deckList().length<DECK_SLOT.length&&Math.random()<.25){ s.place='deck'; msg.push(`${PASSENGERS[id].name}自己走去了展望台`); } });
 if(msg.length){ save(); setTimeout(()=>toast(msg.join('　')),2600); } }
/* 展望台的天空效果 */
function skyFx(type){
 if(type==='meteor'){ let g=''; for(let i=0;i<14;i++){ const x=100+((i*173)%1400), y=((i*97)%260), d=(i%7)*.45; g+=`<line class="mt" x1="${x}" y1="${y}" x2="${x-120}" y2="${y+70}" stroke="url(#gGold)" stroke-width="3" style="animation-delay:${d}s"/><circle class="mt" cx="${x}" cy="${y}" r="3" fill="#fff6d8" style="animation-delay:${d}s"/>`; } return `<g class="skyfx sky-meteor">${g}</g>`; }
 if(type==='aurora') return `<g class="skyfx sky-aurora">${[0,1,2].map(i=>`<path d="M-50 ${200+i*50} C 300 ${100+i*60}, 600 ${280+i*30}, 900 ${150+i*50} S 1400 ${120+i*40}, 1650 ${220+i*40}" stroke="${['#7dffb4','#b48cff','#8fe8ff'][i]}" stroke-width="${60-i*12}" fill="none" opacity=".35" filter="url(#fSoft)" style="animation-delay:${i*1.3}s"/>`).join('')}</g>`;
 if(type==='tide') return `<g class="skyfx sky-tide">${[0,1,2,3].map(i=>`<ellipse cx="800" cy="260" rx="${300+i*220}" ry="${60+i*45}" fill="none" stroke="#dff4ff" stroke-width="${6-i}" opacity=".45" style="animation-delay:${i*.9}s"/>`).join('')}</g>`;
 return `<g class="skyfx sky-eclipse"><circle cx="800" cy="200" r="110" fill="url(#gGold)" opacity=".9"/><circle cx="800" cy="200" r="70" fill="#fff3c4"/><circle class="moon" cx="830" cy="196" r="70" fill="#1a1c3a"/><circle cx="800" cy="200" r="78" fill="none" stroke="#ffe9a8" stroke-width="4" opacity=".9"/></g>`; }
function skyWatch(){ const k=skyNow(); if(!k) return toast('現在的天空很平靜。');
 const S=SKY[k.type], here=deckList(), first=!(state.skySeen||[]).includes(k.type), was=k.watched;
 const script=[['self',`${S.name}……${S.desc}`]].concat(here.map(id=>[id,(SKY_LINE[k.type]||{})[id]||`（${PASSENGERS[id].name}抬頭看著天空，看得出神了。）`]));
 if(!was) script.push(['self',`星光落在身上，好輕。${first?'這一幕，會凝結成回憶水晶吧。':''}`]);
 if(!was){ k.watched=true; state.skyAt={j:state.journeyCount+1,type:k.type}; { const D=deckList(); for(let i=0;i<D.length;i++) for(let j=i+1;j<D.length;j++){ const r=relOf(D[i],D[j]); if(r.firsts.sky==null){ r.firsts.sky=state.journeyCount; shareMem('f_sky_'+relKey(D[i],D[j])+'_'+k.type,`一起看了${SKY[k.type].name}`,[D[i],D[j]],`${PASSENGERS[D[i]].name}和${PASSENGERS[D[j]].name}在展望台，一起看了${SKY[k.type].name}。`); } relAdd(D[i],D[j],2); } } TAINT.add(voyBless()==='wing'?-10:-5); if(k.type==='aurora') addClue('clue_wall'); state.skySeen=state.skySeen||[]; if(first) state.skySeen.push(k.type);
  state.skyLog=state.skyLog||[]; state.skyLog.push({k:'sky',type:k.type,j:state.journeyCount+1,with:here.slice()});
  logJ(`在展望台觀賞了${S.name}${here.length?`，和${here.map(id=>PASSENGERS[id].name).join('、')}一起`:''}。`,'find');
  here.forEach(id=>state.passengers[id].records.push({j:state.journeyCount+1,t:`在展望台一起看了${S.name}。`})); save(); SFX.chime(); }
 const rq=here.filter(id=>reqOn(id)&&REQ[id].kind==='sky'&&REQ[id].sky===k.type);
 rq.forEach(id=>{ script.push(...REQ[id].done); reqDone(id); });
 dialogueScript(script); }

function seeded(n){ let t=n>>>0; return ()=>{ t+=0x6D2B79F5; let r=Math.imul(t^t>>>15,1|t); r^=r+Math.imul(r^r>>>7,61|r); return ((r^r>>>14)>>>0)/4294967296; }; }
function forageNow(){ const loc=state.currentLocation, F=FORAGE[loc]; if(!F) return null; const key=state.journeyCount+'@'+loc;
 const f0=state.forage, refill=f0&&f0.key===key&&f0.doneAt&&(f0.n||0)<2&&Date.now()-f0.doneAt>120000;   /* 採完之後過一陣子，只會再長出一點常見的材料 */
 if(refill){ const n=(f0.n||0)+1, R=seeded(state.journeyCount*131+loc.length*17+n*977), com=F.pool.filter(([m])=>MATS[m]), tot=com.reduce((a,[,w])=>a+w,0); let r=R()*tot, m=com[0][0]; for(const [x,w] of com){ if((r-=w)<0){ m=x; break; } }
  const i=(n-1)%3, [x,y]=F.spots[i]; f0.n=n; f0.doneAt=null; f0.spots.forEach(sp=>sp.taken=true); f0.spots[i]={x:Math.max(6,Math.min(94,x+(R()-.5)*14)),y,m,taken:false,re:1}; save(); return f0; }
 if(!state.forage||state.forage.key!==key){ const n=refill?(f0.n||0)+1:0, R=seeded(state.journeyCount*131+loc.length*17+n*977), tot=F.pool.reduce((a,[,w])=>a+w,0);

  state.forage={key,n,spots:F.spots.map(([x,y])=>({x:Math.max(6,Math.min(94,x+(n?(R()-.5)*14:0))),y,m:pick(),taken:false}))}; }
 return state.forage; }

/* ================================================================
   360° 環景（圓柱體內側映射，WebGL 直接繪製）
   - 圖片：CARRIAGES[x].pano.image，原圖不裁切、不拉伸
   - 熱點：以柱面座標記錄（yaw 水平角 0–360°、elev 仰角），隨場景旋轉
   - 熱點資料：統一熱點表 HSDEF（scene:'memory'，at 為 yaw／elev），位置固定
   ================================================================ */
const D2R=Math.PI/180;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PANO={gl:undefined,active:null,list:[],
 lon:180,lat:0,tLon:180,tLat:0,fov:60,hfov:90,maxLat:0,w:1,h:1,need:true,tex:{},ready:{},dims:{},raf:0,suppress:0};
function panoDims(){ const c=PANO.active&&CARRIAGES[PANO.active].pano; return PANO.dims[PANO.active]||{w:c?c.w:2,h:c?c.h:1}; }
PANO.hr=()=>{ const d=panoDims(); return 2*Math.PI*d.h/d.w; };      /* 圓柱高度 ÷ 半徑 */
PANO.topElev=()=>Math.atan(PANO.hr()/2)/D2R;                         /* 圖片上下緣的仰角 */
function pxToSph(col,row,W,H){ const yaw=(360*(1-col/W))%360, t=(0.5-row/H)*2*Math.PI*H/W; return {yaw:+yaw.toFixed(2),elev:+(Math.atan(t)/D2R).toFixed(2)}; }

const MP=(c,r)=>pxToSph(c,r,2576,1274);
const NP=(c,r)=>pxToSph(c,r,1634,887);   /* 森羅溫室環景的像素座標 */
const clone=o=>JSON.parse(JSON.stringify(o));

function isPanoView(){ return state.currentPhase!=='outside' && !!CARRIAGES[state.currentCarriage].pano && panoInit(); }
/* 平面左右平移：原圖等比例縮放到畫面高度，不做任何投影，畫面清晰不變形 */
function panoInit(){ return true; }
function panoImg(car){
 PANO.imgs=PANO.imgs||{}; let img=PANO.imgs[car]; if(img) return img;
 img=PANO.imgs[car]=new Image(); img.className='pano-img'; img.alt=''; img.draggable=false; img.decoding='async';
 img.onload=()=>{ PANO.dims[car]={w:img.naturalWidth,h:img.naturalHeight}; PANO.ready[car]=true;
  if(PANO.active===car){ const l=document.querySelector('.pano-loading'); if(l) l.remove(); panoResize(); } };
 img.onerror=()=>panoFail(car);
 img.src=CARRIAGES[car].pano.image; return img; }
function panoTexture(car){ panoImg(car); }
/* 熱點座標：pano 車廂可用 {x,y}（原圖百分比）或 {yaw,elev}（舊的柱面座標），一律換成原圖像素 */
function hsPx(at,car){ const c=CARRIAGES[car].pano, W=c.w, H=c.h;
 if(at.x!=null) return {col:at.x/100*W,row:at.y/100*H};
 const yaw=((at.yaw%360)+360)%360; return {col:W*(1-yaw/360),row:H*(0.5-Math.tan(at.elev*D2R)*W/(2*Math.PI*H))}; }
function panoMount(car){
 const host=$('#pano'); if(!host) return;
 PANO.active=car; PANO.list=hsList(car).map(h=>Object.assign({hotspotId:h.id},hsPx(h.at,car)));
 const ent=ENTRY_FROM&&PANO_ENTRY[car]&&PANO_ENTRY[car][ENTRY_FROM]; PANO.backTo=ENTRY_FROM||PANO.backTo; ENTRY_FROM=null;
 const v=ent!=null&&ent!==false?{lon:ent,lat:0}:((state.view||{})[car]||{lon:180,lat:0}); PANO.lon=PANO.tLon=v.lon; PANO.lat=PANO.tLat=0;
 const img=panoImg(car); PANO.img=img; host.prepend(img);
 const tw=PANO.twin&&PANO.twin.isConnected?PANO.twin:document.createElement('img'); tw.className='pano-twin'; tw.alt=''; tw.draggable=false; tw.src=img.src; img.after(tw); PANO.twin=tw;   /* 第二份圖接在後面，左右可以一直繞圈 */
 if(PANO.ready[car]){ const l=host.querySelector('.pano-loading'); if(l) l.remove(); } else panoWatch(car);
 panoBuild(); panoBind(host); panoResize(); PANO.lon=PANO.tLon; panoSnap(); panoDraw(); panoPlace(); PANO.need=false; [PANO.img,PANO.twin].forEach(im=>{ if(im) im.style.filter=''; }); natTint();   /* 熱點立刻就位 */
 if(!PANO.raf) PANO.raf=requestAnimationFrame(panoFrame);
}
function panoResize(){
 if(!PANO.active) return; const st=$('#stage'); const w=st.clientWidth||1, h=st.clientHeight||1, d=panoDims();
 PANO.w=w; PANO.h=h; PANO.k=Math.max(h/d.h,w/d.w); PANO.dw=d.w*PANO.k; PANO.oy=(d.h*PANO.k-h)/2; PANO.fov=PANO.hfov=360*w/PANO.dw; PANO.maxLat=0;
 [PANO.img,PANO.twin].forEach(im=>{ if(im){ im.style.height=(d.h*PANO.k)+'px'; im.style.width=PANO.dw+'px'; } });
 PANO.tLon=panoClamp(PANO.tLon); PANO.lon=panoClamp(PANO.lon); PANO.tLat=PANO.lat=0; PANO.need=true;
}
/* 視角（lon）↔ 原圖中心欄位；左右可以一直拖，畫面會繞圈（接縫已經處理過） */
const lonCol=lon=>panoDims().w*(1-(((lon%360)+360)%360)/360);
function panoClamp(lon){ return lon; }
const panoWrap=x=>{ const dw=PANO.dw||PANO.w||1; return ((x%dw)+dw)%dw; };
function panoOff(){ return panoWrap(lonCol(PANO.lon)*PANO.k-PANO.w/2); }
/* 把視角轉到某個熱點（左右到底就停在邊緣） */
function panoFace(id){ const o=PANO.list.find(x=>x.hotspotId===id); if(!o) return; PANO.tLon=PANO.lon=panoClamp(360*(1-o.col/panoDims().w)); PANO.need=true; }
function panoDraw(){ const o=panoOff(), y=-(PANO.oy||0);
 if(PANO.img) PANO.img.style.transform=`translate3d(${(-o).toFixed(1)}px,${y.toFixed(1)}px,0)`;
 if(PANO.twin) PANO.twin.style.transform=`translate3d(${((PANO.dw||0)-o).toFixed(1)}px,${y.toFixed(1)}px,0)`; }
function panoProject(o){ let x=panoWrap(o.col*PANO.k-panoOff()); const y=o.row*PANO.k-(PANO.oy||0); if(x>PANO.w+60) x-=PANO.dw; if(x<-60||x>PANO.w+60) return null; return [x,y]; }
function panoPlace(){ const layer=$('#phs'); if(!layer) return;
 layer.querySelectorAll('[data-hid]').forEach(el=>{ const o=PANO.list.find(x=>x.hotspotId===el.dataset.hid); const p=o&&panoProject(o);
  if(!p){ el.style.visibility='hidden'; return; } el.style.visibility='visible'; el.style.left=p[0].toFixed(1)+'px'; el.style.top=p[1].toFixed(1)+'px'; }); }
function panoFrame(){
 PANO.raf=0; if(!PANO.active||!$('#pano')) return;
 const dl=PANO.tLon-PANO.lon, dt=PANO.tLat-PANO.lat;
 if(Math.abs(dl)>.02||Math.abs(dt)>.02){ PANO.lon+=dl*.35; PANO.lat+=dt*.35; PANO.need=true; }
 else if(dl||dt){ PANO.lon=PANO.tLon; PANO.lat=PANO.tLat; PANO.need=true; }
 if(PANO.need){ PANO.need=false; panoDraw(); panoPlace(); }
 PANO.raf=requestAnimationFrame(panoFrame);
}
function panoSaveView(){ const n=Math.floor(PANO.tLon/360)*360; PANO.tLon-=n; PANO.lon-=n;
 state.view=state.view||{}; state.view[PANO.active]={lon:+PANO.tLon.toFixed(1),lat:+PANO.tLat.toFixed(1)}; save(); }
function panoBuild(){ const layer=$('#phs'); if(!layer) return;
 layer.innerHTML=hsList(PANO.active).map(h=>hsBtn(h,true)).join('');
 PANO.need=true; }
/* 每節車廂兩個視角（朝前、朝後），按畫面左右的按鈕轉身 */
const PANO_VIEWS={memory:['mem-door','mem-rear'],nature:['nat-door','nat-back'],habitat:['hab-door','hab-back'],observation:['obs-front','obs-back']};
function panoViewLons(car){ const ids=PANO_VIEWS[car]||[]; return ids.map(id=>{ const h=HSDEF.find(x=>x.id===id); if(!h) return 0; const c=hsPx(h.at,car).col; return 360*(1-c/panoDims().w); }); }
function panoSnap(){ const L=panoViewLons(PANO.active); if(!L.length) return; const d=a=>Math.abs((((PANO.tLon-a)%360)+540)%360-180); const k=d(L[0])<=d(L[1])?0:1; PANO.view=k; const t=PANO.tLon+((((L[k]-PANO.tLon)%360)+540)%360-180); PANO.tLon=PANO.lon=t; PANO.need=true; }
function panoTurn(){ const L=panoViewLons(PANO.active); if(!L.length) return; PANO.view=1-(PANO.view||0); const a=L[PANO.view]; PANO.tLon=PANO.tLon+((((a-PANO.tLon)%360)+540)%360-180); SFX.tone(740,0,.3,'sine',.02); panoSaveView(); if(!PANO.raf) PANO.raf=requestAnimationFrame(panoFrame); }
function panoBind(host){
 host.insertAdjacentHTML('beforeend','<button class="pano-turn l" aria-label="轉身">‹</button><button class="pano-turn r" aria-label="轉身">›</button>');
 host.querySelectorAll('.pano-turn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); panoTurn(); });
 return;
 let g=null;
 host.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0) return;
  g={id:e.pointerId,x:e.clientX,y:e.clientY,lon:PANO.tLon,lat:PANO.tLat,moved:false};
 });
 host.addEventListener('pointermove',e=>{
  if(!g||e.pointerId!==g.id) return; const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.moved){ if(Math.hypot(dx,dy)<7) return; g.moved=true; try{ host.setPointerCapture(e.pointerId); }catch(_){} host.classList.add('drag');
   const hint=host.querySelector('.pano-hint'); if(hint){ hint.style.opacity=0; state.storyFlags.panoHintDone=1; } }
  PANO.tLon=panoClamp(g.lon+dx*360/(PANO.dw||PANO.w));
  if(!PANO.raf) PANO.raf=requestAnimationFrame(panoFrame);
 });
 const end=e=>{ if(!g||e.pointerId!==g.id) return; if(g.moved){ PANO.suppress=performance.now()+400; host.classList.remove('drag'); panoSaveView(); } g=null; };
 host.addEventListener('pointerup',end); host.addEventListener('pointercancel',end);
}

 const hit=(state.pods||[]).map((c,i)=>c&&c.st<2&&SKY_BLOOM[k.type].includes(c.p)?i:-1).filter(i=>i>=0), first=!k.flower;
 const sc=[['self','（拉開天窗的遮光簾。）'],['self',`${S.name}……光從玻璃穹頂灑下來，落在一排培育艙上。`]];
 if(first&&hit.length){ hit.forEach(i=>{ const c=state.pods[i]; c.st=2; sc.push(['self',`${POD_N[i]}艙的${PLANTS[c.p].name}好像聽見了天空的聲音，一下子開花了！`]); logJ(`${S.name}照進溫室，${PLANTS[c.p].name}提早開花了。`,'grow'); }); SFX.chime(); }
 else sc.push(['self',hit.length?'植物們抬著頭，靜靜看著天空。':'培育艙裡的植物安靜地看著天空。……不是每一種花，都在等這片天空。']);
 k.flower=1; save(); dialogueScript(sc,()=>render()); }

function gardenSync(){ state.pods=state.pods||[null,null,null,null]; while(state.pods.length<4) state.pods.push(null);
 if(!state.gardenV){ state.gardenV=1; state.seedKnown=state.seedKnown||[]; state.grown=state.grown||[];
  Object.entries(PLANTS).forEach(([p,P])=>{ if(!P.rare) return; if(state.collectibles.includes('seed_'+p)&&!state.seedKnown.includes(p)) state.seedKnown.push(p);
   if(state.collectibles.includes('plant_'+p)&&!state.grown.includes(p)){ state.grown.push(p); state.plantBag=state.plantBag||{}; state.plantBag[p]=(state.plantBag[p]||0)+1; } });
  const c=state.culture; if(c&&c.seed){ const p=c.seed.replace('seed_',''); if(PLANTS[p]) state.pods[0]={p,st:c.bloomed?2:1,j:state.journeyCount}; } state.culture=null; }

 Object.entries(PLANTS).forEach(([p,P])=>{ if(P.rare&&state.collectibles.includes('seed_'+p)&&!state.seedGot.includes(p)){ state.seedGot.push(p); state.seedBag=state.seedBag||{}; state.seedBag[p]=(state.seedBag[p]||0)+1; if(state.gardenV&&RUNNING) seedIntro(); } }); }

const GROW_STEPS=[
 {id:'nat-vault',t:'看看種子',done:()=>state.storyFlags.gt_vault},
 {id:'nat-special',t:'請守望藤看看',done:()=>!Object.keys(PLANTS).some(p=>seedN(p)>0&&!seedKnown(p))},
 {id:'nat-crystal',t:'調整光照',done:()=>state.storyFlags.gt_light},
 {id:'nat-pod-a',t:'種下種子',done:()=>state.storyFlags.gt_plant},
 {id:'nat-pod-a',t:'收成',done:()=>state.storyFlags.gt_harvest,wait:()=>!podsBloom()},

function growStep(){ if(!RUNNING||!growTutOn()) return null; for(let i=0;i<GROW_STEPS.length;i++){ const g=GROW_STEPS[i]; if(g.done()) continue; if(g.wait&&g.wait()) return null; return {i,g}; }
 state.storyFlags.gt_done=1; return null; }
const growBadge=h=>{ return ''; const c=growStep(); return c&&c.g.id===h.id?`<span class="step cur"><b>${c.i+1}</b><i>${c.g.t}</i></span>`:''; };

/* ================================================================

function journal(o){
 const make=()=>typeof o.pages==='function'?o.pages():o.pages; let pages=make(), N=pages.length;
 const sp=innerWidth>=860, al=k=>sp?k-(k%2):k, TILT=[-4,2,-2,3,-1,4,-3,1,-2,2,-3,1];
 let i=al(Math.max(0,Math.min(o.page||0,N-1))), busy=false, turn=null;
 const ov=document.createElement('div'); ov.className='ov jr '+(o.cls||'');
 ov.innerHTML=`<div class="jr-book tome ${sp?'jr-two':'single'}" role="dialog" aria-label="${o.title}"><div class="jr-tabs">${o.tabs.map(([t,p],k)=>`<button class="jr-tab" data-go="${p}" style="--tilt:${TILT[k%TILT.length]}deg" aria-label="${t}"><svg class="cord" viewBox="0 0 30 46" aria-hidden="true"><path d="M13 46 C 8 36, 6 24, 12 14 C 16 6, 24 4, 27 1" fill="none" stroke="#2b211a" stroke-width="2.4" stroke-linecap="round"/><path d="M17 46 C 18 36, 20 26, 14 16" fill="none" stroke="#2b211a" stroke-width="2.4" stroke-linecap="round"/><g transform="rotate(-28 15 20)"><rect x="9" y="14" width="12" height="13" rx="4" fill="#d9b25c" stroke="#7a5a20" stroke-width="1"/><path d="M10.5 18h9M10.5 21h9M10.5 24h9" stroke="#7a5a20" stroke-width=".9"/></g></svg><span class="bm"><span class="bt">${t}</span></span></button>`).join('')}</div>
  <div class="jr-pages"><div class="jr-sheet L"></div><div class="jr-sheet R"></div><div class="jr-flip"><div class="jr-sheet face fr"></div><div class="jr-sheet face bk"></div></div></div>
  <button class="jr-nav prev" hidden aria-label="上一頁">‹</button><button class="jr-nav next" hidden aria-label="下一頁">›</button><div class="jr-folio"></div><div class="jr-drag-hint">‹ 按住書頁左右拉，就能翻頁 ›</div><button class="close" aria-label="闔上">✕</button></div>`;
 $('#layer').appendChild(ov);
 const q=c=>ov.querySelector(c), L=q('.jr-sheet.L'), R=q('.jr-sheet.R'), F=q('.jr-flip'), fr=q('.fr'), bk=q('.bk'), prev=q('.prev'), next=q('.next');
 if(!sp) L.remove();
 const put=(el,k)=>{ const ok=k>=0&&k<N; el.innerHTML=`<i class="jr-frame"></i>${ok?`<div class="jr-in page">${pages[k]}</div>`:''}`; el.classList.toggle('blank',!ok); };
 const sync=()=>{ q('.jr-folio').textContent=sp?`${i+1}${i+1<N?'–'+(i+2):''} / ${N}`:`${i+1} / ${N}`; const on=o.tabs.reduce((a,t)=>al(t[1])<=i?t[1]:a,o.tabs.length?o.tabs[0][1]:0);
  ov.querySelectorAll('.jr-tab').forEach(t=>t.classList.toggle('on',+t.dataset.go===on)); prev.disabled=i<=0; next.disabled=i+(sp?2:1)>=N; ov.dataset.page=i; };
 const show=()=>{ if(sp){ put(L,i); put(R,i+1); } else put(R,i); sync(); };
 const ang=a=>{ F.style.transform=`rotateY(${a}deg)`; };
 const begin=to=>{ to=al(to); if(busy||to===i||to<0||to>=N) return false; const dir=to>i?1:-1; turn={to,dir};
  F.className='jr-flip on '+(dir>0?'fwd':'bwd');
  if(sp){ if(dir>0){ put(fr,i+1); put(bk,to); put(R,to+1); } else { put(fr,i); put(bk,to+1); put(L,to); } ang(0); }
  else { bk.innerHTML=''; if(dir>0){ put(fr,i); put(R,to); ang(0); } else { put(fr,to); ang(-180); } }
  void F.offsetWidth; return true; };
 const drag=p=>{ const d=turn.dir; ang(sp?(d>0?Math.max(-180,Math.min(0,p*180)):Math.min(180,Math.max(0,p*180))):(d>0?Math.max(-180,Math.min(0,p*180)):Math.max(-180,Math.min(0,-180+p*180)))); };
 const mv=(from,to)=>{ to.replaceChildren(...from.childNodes); to.classList.toggle('blank',from.classList.contains('blank')); };
 const end=commit=>{ if(!turn) return; const t=turn; turn=null; busy=true; F.classList.add('anim');
  ang(sp?(commit?(t.dir>0?-180:180):0):(commit?(t.dir>0?-180:0):(t.dir>0?0:-180)));
  setTimeout(()=>{ busy=false;
   if(sp){ if(commit){ if(t.dir>0) mv(bk,L); else mv(bk,R); } else { if(t.dir>0) mv(fr,R); else mv(fr,L); } }
   else { if(commit){ if(t.dir<0) mv(fr,R); } else if(t.dir>0) mv(fr,R); }
   F.className='jr-flip'; fr.replaceChildren(); bk.replaceChildren(); if(commit){ i=t.to; } sync(); },970); if(commit) setTimeout(()=>SFX.pageLand(),520); };
 /* 書籤：直接翻到那一頁（不播自動翻頁的動畫）；翻頁只靠手拉 */
 const go=to=>{ to=al(to); if(busy||turn||to<0||to>=N||to===i) return; i=to; SFX.page(); show(); };
 const step=sp?2:1;
 prev.onclick=e=>{ e.stopPropagation(); go(i-step); }; next.onclick=e=>{ e.stopPropagation(); go(i+step); };
 ov.querySelectorAll('.jr-tab').forEach(t=>t.onclick=e=>{ e.stopPropagation(); SFX.tap(); go(+t.dataset.go); });
 ov.addEventListener('click',e=>{ if(ov.noClick&&performance.now()<ov.noClick){ e.stopPropagation(); return; } if(e.target===ov||e.target.closest('.jr-book>.close')) return closeOv(ov); if(o.onClick) o.onClick(e,ov); },true);
 ov.tabIndex=-1; ov.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(i+step); if(e.key==='ArrowLeft') go(i-step); });
 /* 按住左右拖曳：紙頁跟著手指翻起來，放開時翻過去或落回原位 */
 const book=q('.jr-pages'); let g=null;
 book.addEventListener('pointerdown',e=>{ if(busy||e.target.closest('input,textarea')) return; if(e.pointerType==='mouse'&&e.button!==0) return; g={id:e.pointerId,x:e.clientX,y:e.clientY,on:false,w:book.clientWidth/(sp?2:1)}; });
 book.addEventListener('pointermove',e=>{ if(!g||e.pointerId!==g.id) return; const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.on){ if(Math.abs(dx)<10||Math.abs(dx)<Math.abs(dy)) return; if(!begin(dx<0?i+step:i-step)){ g=null; return; } g.on=true; SFX.pageLift(); try{ book.setPointerCapture(e.pointerId); }catch(_){} }
  drag(Math.max(-1,Math.min(1,dx/g.w))); });
 const up=e=>{ if(!g||e.pointerId!==g.id) return; const on=g.on, dx=e.clientX-g.x, w=g.w; g=null; if(on) ov.noClick=performance.now()+350; if(!on||!turn) return; end(turn.dir>0?dx<-w*.3:dx>w*.3); };
 book.addEventListener('pointerup',up); book.addEventListener('pointercancel',up);
 ov.refresh=()=>{ const keep=[...ov.querySelectorAll('.jr-sheet:not(.face) .jr-in')].map(x=>x.scrollTop); pages=make(); N=pages.length; i=al(Math.min(i,N-1)); show(); ov.querySelectorAll('.jr-sheet:not(.face) .jr-in').forEach((x,k)=>x.scrollTop=keep[k]||0); };
 ov.goTo=k=>go(k); ov.jump=k=>go(k);
 show(); SFX.page(); return ov; }

const PEN_SVG=`<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="penG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#c8a85e"/></linearGradient></defs><path d="M50 4c6 2 10 8 8 14L24 52l-12 4 4-12L50 4z" fill="#3a2a4e" stroke="#c8a85e" stroke-width="1.6"/><path d="M50 4c6 2 10 8 8 14l-6 6c-2-6-6-10-12-12z" fill="url(#penG)"/><path d="M16 44l4 4-8 8z" fill="#c8a85e"/><path d="M12 56l2-2" stroke="#1a1020" stroke-width="2" stroke-linecap="round"/></svg>`;
const penKey=t=>{ let h=0; for(const c of String(t)) h=(h*31+c.charCodeAt(0))|0; return 'p'+(h>>>0).toString(36); };

 return `<p class="${cls} pen-w" data-pk="${k}" data-t="${encodeURIComponent(t)}"><span class="pen-txt"></span><button class="pen-ic" type="button" aria-label="提筆，寫下我的想法" title="點一下，寫下我的想法">${PEN_SVG}</button></p>`; }
function penWrite(w){ if(!w||w.dataset.go) return; w.dataset.go=1; const t=decodeURIComponent(w.dataset.t), box=w.querySelector('.pen-txt'), pen=w.querySelector('.pen-ic'); pen.classList.add('writing');

  const sp=document.createElement('span'); sp.className='pc'; sp.textContent=chars[i++]; box.appendChild(sp);
  const r=sp.getBoundingClientRect(), R=w.getBoundingClientRect(); pen.style.left=(r.right-R.left-4)+'px'; pen.style.top=(r.top-R.top-30)+'px';

function carousel3d(host,cells,per,o){ o=o||{};
 const G=[]; for(let i=0;i<cells.length;i+=per) G.push(cells.slice(i,i+per)); if(!G.length) G.push([]);
 const F=Math.max(3,G.length); while(G.length<F) G.push([]);
 host.innerHTML=`<div class="c3"><div class="c3-stage"><div class="c3-ring">${G.map((g,i)=>`<div class="c3-face ${g.length?'':'none'}" data-f="${i}"><div class="c3-grid" style="--cols:${o.cols||per}">${g.join('')}</div></div>`).join('')}</div></div>
  ${F>1?`<div class="c3-nav"><button class="c3-arr" data-d="-1" aria-label="上一組">‹</button><span class="c3-dots">${G.map((g,i)=>`<i data-i="${i}" class="${g.length?'':'e'}"></i>`).join('')}</span><button class="c3-arr" data-d="1" aria-label="下一組">›</button></div>`:''}</div>`;
 const stage=host.querySelector('.c3-stage'), ring=host.querySelector('.c3-ring'), faces=[...host.querySelectorAll('.c3-face')], dots=[...host.querySelectorAll('.c3-dots i')];
 let cur=Math.max(0,Math.min(F-1,o.start||0)), ang=-cur*360/F, R=0;
 const lay=()=>{ const w=stage.clientWidth; R=F<3?0:(w/2)/Math.tan(Math.PI/F)+w*.06; faces.forEach((f,i)=>f.style.transform=F===1?'none':`rotateY(${i*360/F}deg) translateZ(${R}px)`); ring.style.transform=F===1?'none':`translateZ(${-R}px) rotateY(${ang}deg)`; };

document.addEventListener('click',e=>{ let el=e.target.closest('[data-hs]'); if(!el||!el.closest('#scene')) return;
 if(el.classList.contains('sprite')&&!e.target.closest('.lb')&&!spriteHit(el,e.clientX,e.clientY)){   // 點到動態立繪的透明處 → 交給下方的熱點
  el=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest&&n.closest('[data-hs]')).find(n=>n&&n!==el&&n.closest('#scene')); if(!el) return; }
 hsClick(el.dataset.hs,el); });
function spriteHit(el,x,y){ const img=el.querySelector('.spr img'); if(!img||!img.naturalWidth) return true;
 const r=img.getBoundingClientRect(), k=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight), ox=r.left+(r.width-img.naturalWidth*k)/2, oy=r.top+(r.height-img.naturalHeight*k)/2;
 const px=(x-ox)/k, py=(y-oy)/k; if(px<0||py<0||px>=img.naturalWidth||py>=img.naturalHeight) return false;
 const R=Math.max(2,Math.round(6/k)), D=R*2+1;   // 容許點擊位置周圍約 6px：動態生物在移動，點擊要寬容一點
 const c=spriteHit.c||(spriteHit.c=document.createElement('canvas')); c.width=c.height=D; const g=c.getContext('2d',{willReadFrequently:true});
 g.clearRect(0,0,D,D); g.drawImage(img,R-Math.floor(px),R-Math.floor(py)); try{ const d=g.getImageData(0,0,D,D).data; for(let i=3;i<d.length;i+=4) if(d[i]>40) return true; return false; }catch(err){ return true; } }
function hsClick(id,el){
 const now=performance.now();
 if(now<HSC.until||(HSC.last===id&&now<HSC.lastT+700)||TRANS.busy||document.querySelector('#layer .cine,#layer .dlg,#layer .ov:not(.closing):not(.drawer)')) return;
 const h=HSDEF.find(x=>x.id===id); if(!h||h.scene!==HS_SCENE()||(h.show&&!h.show())) return;
 HSC.until=now+260; HSC.last=id; HSC.lastT=now; hsBurst(el); tipHit(id);
 const lk=h.lock&&h.lock();
 if(lk){ SFX.tone(330,0,.3,'sine',.02); if(h.onLocked){ HSC.layer=2; try{ h.onLocked(); }finally{ HSC.layer=0; } return; } return whisper(el,lk,'lock'); }
 SFX.tone(1175,0,.35,'sine',.015);
 if(h.layer===1) whisper(el,typeof h.hint==='function'?h.hint():h.hint);
 else { const n=$('#layer').children.length; HSC.layer=h.layer;
  try{ typeof h.act==='function'?h.act(el):runAct(h.act); }finally{ HSC.layer=0; }
  const last=$('#layer').lastElementChild; if($('#layer').children.length>n&&last&&last.classList.contains('ov')) last.dataset.key=id; }
 if(h.track!==false&&(h.shape||'obj')==='obj'){ state.seen=state.seen||{}; state.seen[id]=hsVer(h); save(); }
 setTimeout(hsRefresh,40);
}
function runAct(a){ const i=a.indexOf(':'); act(a.slice(0,i),a.slice(i+1)); }
function hsBurst(el){ const mk=el.querySelector('.mk')||el.querySelector('.orb')||el.querySelector('.spr'); if(!mk) return; const b=document.createElement('i'); b.className='hsb'; mk.appendChild(b); setTimeout(()=>b.remove(),700); }
function whisper(el,text,kind){
 document.querySelectorAll('.whisper').forEach(w=>w.remove()); document.querySelectorAll('.talking').forEach(x=>x.classList.remove('talking'));
 clearTimeout(whisper.t1); clearTimeout(whisper.t2);
 if(!el||!el.isConnected||!text) return;
 const w=document.createElement('div'); w.className='whisper'+(kind?' '+kind:''); w.setAttribute('role','status'); w.textContent=text;
 const r=el.getBoundingClientRect(), cx=r.left+r.width/2;
 if(cx<160) w.classList.add('wl'); else if(cx>innerWidth-160) w.classList.add('wr');
 if(r.top<130) w.classList.add('wb');
 el.classList.add('talking'); el.appendChild(w);
 const dur=2000, bye=()=>{ clearTimeout(whisper.t1); clearTimeout(whisper.t2); w.classList.add('out'); setTimeout(()=>{ w.remove(); el.classList.remove('talking'); },300); document.removeEventListener('pointerdown',bye,true); };
 whisper.t1=setTimeout(bye,dur); setTimeout(()=>document.addEventListener('pointerdown',bye,true),0);
}
function spotEvent(spot){ return Object.entries(EVENTS).find(([id,e])=>e.trigger==='spot'&&e.spot===spot&&!done(id)&&(!e.need||e.need())); }

/* 視窗：淡入（CSS）與淡出；Esc 關閉最上層 */
function panel(html,cls=''){ if(!cls&&HSC.layer===2) cls='small';
 const ov=document.createElement('div'), t0=performance.now(); ov.className='ov '+cls; ov.innerHTML=`<div class="panel">${html}<button class="close" aria-label="關閉">✕</button></div>`;
 ov.addEventListener('click',e=>{ if(e.target===ov&&performance.now()-t0<450) return; if(e.target===ov||e.target.closest('.close')) closeOv(ov); }); $('#layer').appendChild(ov); return ov; }
function closeOv(ov){ if(!ov||!ov.isConnected||ov.classList.contains('closing')) return; ov.classList.add('closing'); setTimeout(()=>{ ov.remove(); hsRefresh(); },260); }
/* 鍵盤：空白鍵＝下一段對話；A／D＝向左／向右轉身（展望台是左右移動）；W＝走進面前的車廂；S＝退回背後的車廂 */
document.addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key.toLowerCase();
 if(k===' '||e.code==='Space'){ const d=[...document.querySelectorAll('#layer .dlg')].pop(), cn=document.querySelector('#layer .cine'), sb=[...document.querySelectorAll('#layer .say-box:not(.gone)')].pop();
  if(d){ e.preventDefault(); const b=d.querySelector('.chs button')?null:d.querySelector('.box'); if(b) b.click(); return; }
  if(cn){ e.preventDefault(); cn.click(); return; } if(sb){ e.preventDefault(); sb.click(); } return; }
 if(!RUNNING||!'wasd'.includes(k)||k.length!==1||document.querySelector('#layer .dlg,#layer .cine,#layer .ov:not(.closing):not(.drawer),#layer .board,#mainscreen')||TRANS.busy) return;
 const c=state.currentCarriage, C=CARRIAGES[c];
 if(state.currentPhase==='outside'){ if(k==='s'||k==='w'){ const b=document.querySelector('#scene [data-hs^="out-back"],#scene [data-hs^="out-board"]'); if(b){ e.preventDefault(); b.click(); } } return; }
 if(k==='a'||k==='d'){ e.preventDefault();
  if(c==='observatory'&&document.getElementById('osky')){ OSKY.f+=k==='a'?-.12:.12; oskyPut(); return; }
  if(C&&C.views) return turnView(); return; }
 /* 面前的門＝畫面上看得到的門；背後的門＝這節車廂另一頭的門 */
 const goes=HSDEF.filter(h=>h.scene===c&&typeof h.act==='string'&&h.act.startsWith('go:')&&(!h.show||h.show())), vis=goes.filter(h=>hsView(h)), hid=goes.filter(h=>!hsView(h));
 let h=null;
 if(k==='w') h=C&&C.views?vis[0]:null;
 else h=C&&C.views?hid[0]:goes[0];
 if(!h){ toast(k==='w'?(c==='cab'?'前方是曦淵引領的航道。':'前面已經沒有車廂了。'):'背後沒有門。'); return; }
 e.preventDefault(); moveTo(h.act.slice(3)); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; const ov=[...document.querySelectorAll('#layer .ov:not(.closing)')].pop(); if(ov) closeOv(ov); });

/* 車廂轉場：開門動畫 → 載入相鄰車廂 → 開門；動畫期間不接受第二次切換 */
const TRANS={busy:false}; let ENTRY_FROM=null;
function transition(change,after,door){
 if(TRANS.busy) return; TRANS.busy=true; whisper(null);
 const sc=$('#scene'), fx=$('#doorfx'), swap=()=>{ try{ change(); render(); }catch(err){ console.error(err); } };
 const fin=d=>setTimeout(()=>{ TRANS.busy=false; if(after) after(); },d);
 if(door&&fx){ SFX.door(); fx.classList.add('shut');
  setTimeout(()=>{ swap(); sceneReady(slow=>{ fx.classList.toggle('slow',slow); fx.classList.remove('shut'); fin(slow?950:480); setTimeout(()=>fx.classList.remove('slow'),1000); }); },340); }
 else { sc.classList.add('out'); setTimeout(()=>{ swap(); requestAnimationFrame(()=>sc.classList.remove('out')); fin(520); },480); }
}
/* 過場門關上後，等新車廂的圖片載入完才開門；等比較久的話，門開得慢一點 */
const IMG_OK={};
function sceneReady(go,max=9000){ const t0=performance.now(), sc=$('#scene'); if(!sc) return go(false);
 const urls=new Set(); sc.querySelectorAll('img[src]').forEach(i=>{ if(!i.complete) urls.add(i.getAttribute('src')); });
 sc.querySelectorAll('image').forEach(i=>{ const u=i.getAttribute('href')||i.getAttribute('xlink:href'); if(u&&!u.startsWith('data:')&&!IMG_OK[u]) urls.add(u); });
 const pend=[...urls].map(u=>new Promise(r=>{ const im=new Image(); im.onload=im.onerror=()=>{ IMG_OK[u]=1; r(); }; im.src=u; if(im.complete){ IMG_OK[u]=1; r(); } }));
 let done=false; const fin=()=>{ if(done) return; done=true; go(performance.now()-t0>260); };
 const pano=()=>!PANO.active||PANO.active!==state.currentCarriage||PANO.ready[PANO.active];
 Promise.all(pend).then(()=>{ const w=()=>{ if(pano()||performance.now()-t0>max) fin(); else setTimeout(w,90); }; w(); });
 setTimeout(fin,max); }
/* 星光：只開關柱頂的光，不重畫整個畫面（避免閃一下） */
function starLightSync(){ const sc=$('#scene'), bg=sc&&sc.querySelector('img.bg'); if(!sc) return; sc.querySelectorAll('.starlight,.stray').forEach(x=>x.remove());
 if(state.storyFlags.starLight&&bg) bg.insertAdjacentHTML('afterend','<div class="starlight"></div>'+(state.currentPhase==='voyage'&&state.voyage&&state.voyage.light&&state.voyage.progress>.3?'<div class="stray" aria-hidden="true"><i></i></div>':''));
 hsRefresh(); }

/* ================================================================
   場景裡的光：守望藤的光流向培育艙、材料化成柔光散開、澆灌時光滴落進培育艙
   ================================================================ */
function fxPt(el){ if(!el) return null; const r=el.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]; }
function fxHs(id){ const e=document.querySelector(`#scene [data-hs="${id}"]`); return e?fxPt(e.querySelector('.mk,.spr,.orb')||e):null; }
function fxPodPt(k){ const sc=$('#scene'), A=POD_AT[k]; if(!sc||!A) return null; const r=sc.getBoundingClientRect(); return [r.left+r.width*A.x/100, r.top+r.height*(A.y-8)/100]; }
function fxFlow(a,b,c,n,dur){ if(!a||!b) return; for(let i=0;i<(n||14);i++){ const d=document.createElement('i'); d.className='fxdot'; d.style.setProperty('--c',c); document.body.appendChild(d);
  const mx=(a[0]+b[0])/2+(Math.random()-.5)*120, my=Math.min(a[1],b[1])-60-Math.random()*90, T=(dur||1600)+Math.random()*500, delay=i*70;
  const kf=[]; for(let t=0;t<=1.0001;t+=.1){ const x=(1-t)*(1-t)*a[0]+2*(1-t)*t*mx+t*t*b[0], y=(1-t)*(1-t)*a[1]+2*(1-t)*t*my+t*t*b[1]; kf.push({transform:`translate(${x}px,${y}px) scale(${.6+Math.sin(t*Math.PI)*.8})`,opacity:t<.1?t*10:t>.85?(1-t)*6:1}); }
  d.animate(kf,{duration:T,delay,easing:'ease-in-out',fill:'both'}).onfinish=()=>{ d.remove(); fxRing(b,c); }; } }
function fxRing(p,c){ if(!p) return; const r=document.createElement('i'); r.className='fxring'; r.style.setProperty('--c',c); r.style.left=p[0]+'px'; r.style.top=p[1]+'px'; document.body.appendChild(r);
 r.animate([{transform:'scale(.4)',opacity:.9},{transform:'scale(4)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>r.remove(); }
function fxBurst(p,c,n){ if(!p) return; fxRing(p,c); for(let i=0;i<(n||22);i++){ const d=document.createElement('i'); d.className='fxdot'; d.style.setProperty('--c',c); document.body.appendChild(d);
  const a=Math.random()*Math.PI*2, R=60+Math.random()*120;
  d.animate([{transform:`translate(${p[0]}px,${p[1]}px) scale(.4)`,opacity:1},{transform:`translate(${p[0]+Math.cos(a)*R}px,${p[1]+Math.sin(a)*R-50}px) scale(1.3)`,opacity:0}],{duration:1400+Math.random()*900,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove(); } }
/* 在哪裡點的就在哪裡散開：先找場景裡對應的熱點，找不到就用按鈕的位置 */
function fxBurstAt(btn,c){ const id=HSC.last, p=(id&&fxHs(id))||fxPt(btn); setTimeout(()=>fxBurst(p,c),60); }
function fxVineToPods(){ const a=fxHs('nat-special'); (state.pods||[]).forEach((c,k)=>{ if(c&&c.st<2) setTimeout(()=>fxFlow(a,fxPodPt(k),'#c8ffb0',12,1700),k*260); }); }
function fxPour(k,c){ const b=fxPodPt(k); if(!b) return; const a=[b[0],b[1]-220]; fxFlow(a,b,c,10,900); }
/* 棲息車廂：往前看／往後看 */
function turnView(){ if(TRANS.busy) return; SFX.tone(740,0,.3,'sine',.02); const sc=$('#scene'); sc.style.transition='opacity .28s'; sc.style.opacity=0;
 setTimeout(()=>{ { const k=vKey(state.currentCarriage); state[k]=1-(state[k]||0); } render(); sc.style.opacity=1; setTimeout(()=>sc.style.transition='',320); },280); }
const POOL_FX=`<div class="pool-fx" aria-hidden="true"><svg viewBox="0 0 100 24" preserveAspectRatio="none">${[[30,12,0],[62,10,1.3],[48,15,2.6],[74,13,3.7],[20,11,4.6]].map(([x,y,d])=>`<ellipse cx="${x}" cy="${y}" rx="1" ry=".3" fill="none" stroke="#e8fbff" stroke-width=".25"><animate attributeName="rx" values="1;12" dur="5s" begin="${d}s" repeatCount="indefinite"/><animate attributeName="ry" values=".3;3.4" dur="5s" begin="${d}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="5s" begin="${d}s" repeatCount="indefinite"/></ellipse>`).join('')}</svg><i class="pool-shine"></i></div>`;
function moveTo(car){
 if(TRANS.busy) return;
 const nb=neighbors(state.currentCarriage); if(car!==nb.fwd&&car!==nb.back) return; // 只能前往相鄰車廂
 const from=state.currentCarriage;
 transition(()=>{ ENTRY_FROM=from; state.currentCarriage=car; if(car==='habitat') state.hview=from==='observation'?1:0; /* 第一人稱：從後面的車廂走回來，面向車頭（前方）；從前面的車廂走過來，面向車尾（後方） */ if(car==='observation') state.oview=from==='observatory'?0:1; if(car==='memory') state.mview=from==='cab'?1:0; if(car==='nature') state.nview=from==='memory'?1:0; },()=>checkCarriageEvents(),true);
}

/* 環景載入失敗：提供重試與返回 */
function panoWatch(car){ clearTimeout(PANO.wt); PANO.wt=setTimeout(()=>{ if(PANO.active===car&&!PANO.ready[car]) panoFail(car); },15000); }
function panoFail(car){ const host=$('#pano'); if(!host||PANO.active!==car) return; clearTimeout(PANO.wt);
 const l=host.querySelector('.pano-loading'); if(l) l.remove();
 let f=host.querySelector('.pano-fail'); if(!f){ f=document.createElement('div'); f.className='pano-fail'; host.appendChild(f); }
 const nb=neighbors(car), back=(PANO.backTo===nb.fwd||PANO.backTo===nb.back)?PANO.backTo:nb.fwd;
 f.innerHTML=`<p>車廂圖片沒有載入成功。</p><div class="row" style="justify-content:center"><button class="btn" data-pf="retry">重新載入</button><button class="btn ghost" data-pf="back">返回${CARRIAGES[back].name}</button></div>`;
 f.addEventListener('pointerdown',e=>e.stopPropagation());
 f.querySelector('[data-pf=retry]').onclick=()=>{ if(PANO.imgs&&PANO.imgs[car]){ PANO.imgs[car].remove(); delete PANO.imgs[car]; } PANO.ready[car]=false; f.remove(); host.insertAdjacentHTML('afterbegin','<div class="pano-loading">車廂載入中</div>'); PANO.img=panoImg(car); host.prepend(PANO.img); panoWatch(car); };
 f.querySelector('[data-pf=back]').onclick=()=>moveTo(back);
}

/* ---------- 背景音樂：進入遊戲後自動播放，10 首隨機循環（每輪全部播完才重新洗牌，不會連續重複同一首） ---------- */
const BGM={list:['assets/bgm-01.mp3','assets/bgm-02.mp3','assets/bgm-03.mp3','assets/bgm-04.mp3','assets/bgm-05.mp3','assets/bgm-06.mp3','assets/bgm-07.mp3','assets/bgm-08.mp3','assets/bgm-09.mp3','assets/bgm-10.mp3'].filter(Boolean),
 el:null,queue:[],last:null,on:false,vol:.24,fails:0,_fade:0,
 ensure(){ if(this.el) return this.el; const a=this.el=new Audio(); a.preload='auto'; a.volume=0;
  a.addEventListener('ended',()=>{ if(this.on) this.next(); });
  a.addEventListener('playing',()=>{ this.fails=0; });
  a.addEventListener('error',()=>{ if(!this.on) return; if(++this.fails>=this.list.length){ this.on=false; return; } setTimeout(()=>{ if(this.on) this.next(); },400); });
  return a; },
 shuffle(){ const q=this.list.slice(); for(let i=q.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
  if(q.length>1&&q[0]===this.last){ const k=1+Math.floor(Math.random()*(q.length-1)); [q[0],q[k]]=[q[k],q[0]]; } return q; },
 next(){ const a=this.ensure(); if(!this.queue.length) this.queue=this.shuffle(); const f=this.queue.shift(); this.last=f; a.src=f; this.play(); },
 play(){ const a=this.el; if(!a) return; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); this.fadeTo(this.vol,1800); },
 fadeTo(v,ms,done){ const a=this.el; if(!a) return; clearInterval(this._fade); const v0=a.volume, t0=performance.now();
  this._fade=setInterval(()=>{ const k=Math.min(1,(performance.now()-t0)/ms); try{ a.volume=Math.max(0,Math.min(1,v0+(v-v0)*k)); }catch(e){} if(k>=1){ clearInterval(this._fade); if(done) done(); } },50); },
 start(){ if(!this.list.length||!SFX.on()) return; this.on=true; const a=this.ensure(); if(!a.src) this.next(); else if(a.paused) this.play(); else this.fadeTo(this.vol,1200); },
 stop(ms=1200){ this.on=false; const a=this.el; if(!a||a.paused) return; this.fadeTo(0,ms,()=>{ if(!this.on) a.pause(); }); },
 nowPlaying(){ return this.on&&this.last; }
};
/* 分頁切到背景時暫停，回來時繼續；手機若擋下自動播放，下一次點擊畫面時補播 */
document.addEventListener('visibilitychange',()=>{ const a=BGM.el; if(!a||!BGM.on) return; if(document.hidden) a.pause(); else BGM.play(); });
document.addEventListener('pointerdown',()=>{ if(BGM.on&&BGM.el&&BGM.el.paused&&!document.hidden) BGM.play(); },true);

/* ---------- 主畫面：火車音效（合成：行駛低鳴、蒸汽噴氣、鐵軌節奏，開頭一聲汽笛） ---------- */
const TRAINSFX={out:null,srcs:[],timer:0,next:0,beat:0,
 start(){ if(this.out||!SFX.on()) return; const c=SFX.init(); if(!c) return; const t=c.currentTime;
  const out=this.out=c.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(.5,t+1.6); out.connect(SFX.bus());
  const loop=(type,f,q,vol)=>{ const s=c.createBufferSource(); s.buffer=SFX.noiseBuf(); s.loop=true; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
   const g=c.createGain(); g.gain.value=vol; s.connect(fl); fl.connect(g); g.connect(out); s.start(t); this.srcs.push(s); return g; };
  const rumble=loop('lowpass',140,.7,.16);            // 車輪與車身的低沉行駛聲
  loop('bandpass',900,.4,.012);                         // 車外的風聲
  const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=.35; lg.gain.value=.04; lfo.connect(lg); lg.connect(rumble.gain); lfo.start(t); this.srcs.push(lfo);
  this.whistle(t+.6); this.next=t+.3; this.beat=0;
  this.timer=setInterval(()=>this.tick(),120); this.tick(); },
 burst(at,dur,type,f0,f1,q,vol){ const c=SFX.ctx; if(!c||!this.out) return; const s=c.createBufferSource(); s.buffer=SFX.noiseBuf(); const fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q;
  fl.frequency.setValueAtTime(f0,at); fl.frequency.exponentialRampToValueAtTime(f1,at+dur); const g=c.createGain(); g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(vol,at+dur*.18); g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  s.connect(fl); fl.connect(g); g.connect(this.out); s.start(at,Math.random()*1.5); s.stop(at+dur+.05); },
 thump(at,vol){ const c=SFX.ctx; if(!c||!this.out) return; const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.setValueAtTime(110,at); o.frequency.exponentialRampToValueAtTime(55,at+.09);
  g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.12); o.connect(g); g.connect(this.out); o.start(at); o.stop(at+.15); },
 tick(){ const c=SFX.ctx; if(!c||!this.out) return; const ahead=c.currentTime+.5;
  while(this.next<ahead){ const at=this.next, b=this.beat%8;
   this.burst(at,.26,'bandpass',1500,520,1.1,b%4===0?.11:.07);          // 蒸汽噴氣「嚓」：每拍一次，每四拍一重音
   if(b===0||b===4){ this.burst(at+.05,.025,'highpass',3200,2600,.7,.05); this.thump(at+.05,.06); this.burst(at+.19,.025,'highpass',3000,2500,.7,.045); this.thump(at+.19,.05); }  // 鐵軌接縫「喀噠」
   this.beat++; this.next+=.42; } },
 whistle(at){ const c=SFX.ctx; if(!c||!this.out) return; const g=c.createGain(); g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(.035,at+.25); g.gain.setValueAtTime(.035,at+1.1); g.gain.exponentialRampToValueAtTime(.0001,at+1.9); g.connect(this.out);
  const vib=c.createOscillator(), vg=c.createGain(); vib.frequency.value=5.5; vg.gain.value=4; vib.connect(vg);
  [523.3,659.3,784].forEach(f=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.value=f; vg.connect(o.frequency); o.connect(g); o.start(at); o.stop(at+2); }); vib.start(at); vib.stop(at+2); },
 stop(){ const c=SFX.ctx; clearInterval(this.timer); this.timer=0; if(!c||!this.out) return; const t=c.currentTime, out=this.out, srcs=this.srcs; this.out=null; this.srcs=[];
  out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value,t); out.gain.linearRampToValueAtTime(0,t+.7); srcs.forEach(s=>{ try{ s.stop(t+.8); }catch(e){} }); setTimeout(()=>{ try{ out.disconnect(); }catch(e){} },1000); }
};

/* 車廂環境音（合成，極低音量；可由 ♪ 關閉） */
const AMBIENT={
 nature:{noise:['bandpass',1500,.7,.009,.07],tones:[[196,.003]]},
 habitat:{noise:['lowpass',520,.5,.014,.11]},
 observation:{tones:[[110,.007],[164.8,.004]]},
 memory:{tones:[[523.3,.0022],[784,.0015],[130.8,.0035]]},
 cab:{tones:[[73.4,.008],[110,.0035]]},
 prep:{tones:[[98,.005]]},
 observatory:{noise:['bandpass',420,.6,.018,.09]},
 'out:dawnForest':{noise:['bandpass',2300,.5,.006,.05]},
 'out:starIslands':{tones:[[220,.0028],[329.6,.0018]]}
};
Object.assign(SFX,{amb:null,ambKey:null,_nb:null,
 noiseBuf(){ if(this._nb) return this._nb; const c=this.ctx,n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return this._nb=b; },
 ambient(key){ if(key===this.ambKey) return; this.ambKey=key; this.stopAmb(); const c=this.ctx, cfg=key&&AMBIENT[key]; if(!this.on()||!c||!cfg) return;
  const out=c.createGain(); out.gain.setValueAtTime(0,c.currentTime); out.gain.linearRampToValueAtTime(.45,c.currentTime+1.4); out.connect(SFX.bus()); const nodes=[];
  (cfg.tones||[]).forEach(([f,v])=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; g.gain.value=v; o.connect(g); g.connect(out); o.start(); nodes.push(o); });
  if(cfg.noise){ const [type,f,q,v,lfo]=cfg.noise, s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain(); s.buffer=this.noiseBuf(); s.loop=true; fl.type=type; fl.frequency.value=f; fl.Q.value=q; g.gain.value=v;
   s.connect(fl); fl.connect(g); g.connect(out); if(lfo){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=lfo; lg.gain.value=v*.6; l.connect(lg); lg.connect(g.gain); l.start(); nodes.push(l); } s.start(); nodes.push(s); }
  this.amb={out,nodes}; },
 stopAmb(){ const c=this.ctx,a=this.amb; this.amb=null; if(!c||!a) return; const t=c.currentTime; a.out.gain.cancelScheduledValues(t); a.out.gain.setValueAtTime(a.out.gain.value,t); a.out.gain.linearRampToValueAtTime(0,t+.8); a.nodes.forEach(n=>{ try{ n.stop(t+.9); }catch(e){} }); },
 door(){ this.noise(.5,260,1300,.028); this.tone(523,.08,.7,'sine',.018); },
 /* 翻書：紙頁掀起的沙沙聲；落下時輕輕一拍 */
 page(){ this.noise(.42,4200,1200,.05); this.noise(.28,2200,700,.03); },
 pageLift(){ this.noise(.3,5200,2400,.035); },
 pageLand(){ this.noise(.36,3600,900,.05); this.noise(.12,900,300,.05); },
 glass(){ [2093,2637,3136].forEach((f,i)=>this.tone(f,i*.05,.9-i*.2,'sine',.022)); this.tone(4186,.02,.25,'triangle',.008); },
 tap(){ this.tone(523,0,.12,'triangle',.02); }
});

/* ---------- 主畫面：整列列車 + 火車頭「上班」 ---------- */
/* 主畫面火車：使用提供的影片（已去除浮水印、首尾交疊成無縫循環）；舊的 SVG 列車 ART.trainExterior 保留未刪 */
const MAIN_TRAIN={video:'assets/train-main.mp4',poster:'assets/train-main.jpg',anim:'assets/train-main.webp',ar:864/496};
/* 滿版排版：容器保持影片比例並蓋滿畫面；直向畫面把焦點放在火車頭（影片寬度 27% 處） */
function msLayout(){ const ms=document.getElementById('mainscreen'); if(!ms) return; const vw=ms.clientWidth, vh=ms.clientHeight;
 const W=Math.max(vw,vh*MAIN_TRAIN.ar), H=W/MAIN_TRAIN.ar, portrait=vw/vh<1.05, fx=portrait?.27:.5;
 const L=Math.min(0,Math.max(vw-W,vw/2-fx*W)), T=Math.min(0,Math.max(vh-H,vh/2-.5*H));
 ms.classList.toggle('portrait',portrait); const st=ms.querySelector('.ms-train').style;
 st.setProperty('--mw',W+'px'); st.setProperty('--mh',H+'px'); st.setProperty('--ml',L+'px'); st.setProperty('--mt',T+'px'); }
window.addEventListener('resize',msLayout); window.addEventListener('orientationchange',()=>setTimeout(msLayout,200));
/* 確保火車在動：影片自動播放被擋（例如手機低耗電模式）時，改用動態 WebP（一定會動） */
function msPlay(ms){ const v=ms.querySelector('video'); if(!v) return;
 const swap=()=>{ if(!v.isConnected) return; const im=document.createElement('img'); im.className='ms-anim'; im.alt=''; im.src=MAIN_TRAIN.anim; v.replaceWith(im); };
 const tryPlay=()=>{ v.muted=true; v.defaultMuted=true; const p=v.play(); if(p&&p.catch) p.catch(()=>{}); };
 tryPlay(); v.addEventListener('error',swap);
 setTimeout(()=>{ if(!v.isConnected) return; if(v.paused||v.currentTime<.05){ tryPlay(); setTimeout(()=>{ if(v.isConnected&&(v.paused||v.currentTime<.05)) swap(); },900); } },1600);
 ms.addEventListener('pointerdown',()=>{ if(v.isConnected&&v.paused) tryPlay(); },{once:true}); }
/* 從火車頭「上班」長出的金色枝條，分別伸向兩個選項（座標系 1600×918，對應影片比例） */
ART.branchV=function(lx=288,rx=976,ly=292){
 const leaf=(x,y,r,d)=>`<ellipse class="leaf" cx="${x}" cy="${y}" rx="11" ry="5" fill="#e8f5c8" transform="rotate(${r} ${x} ${y})" style="animation-delay:${d}s"/>`;
 return `<path class="br" pathLength="440" d="M400 578 C ${400+(lx-400)*.15} 480 ${400+(lx-400)*.55} 390 ${lx} ${ly}"/><path class="br" pathLength="440" d="M400 578 C ${400+(rx-400)*.14} 450 ${400+(rx-400)*.55} 330 ${rx} ${ly}"/>
 <path class="tw" pathLength="90" d="M378 474 C 360 446 338 434 312 436"/><path class="tw" pathLength="90" d="M540 428 C 560 400 584 390 612 390"/>
 ${leaf(390,520,-70,.35)}${leaf(348,410,-40,.5)}${leaf(312,436,-15,.62)}${leaf(452,500,40,.35)}${leaf(612,390,20,.55)}${leaf(760,330,25,.66)}
 <circle class="leaf" cx="${lx}" cy="${ly}" r="10" fill="#fff6d8" style="animation-delay:.75s"/><circle class="leaf" cx="${rx}" cy="${ly}" r="10" fill="#fff6d8" style="animation-delay:.75s"/>`; };
function showMain(){
 RUNNING=false; TAINT.fx(); SFX.stopDrone(); SFX.ambient(null); BGM.stop(); closeAll(); const old=$('#mainscreen'); if(old) old.remove();
 const hasAny=!!state.introDone||slotsGet().length>0;
 const el=document.createElement('div'); el.className='mainscreen'; el.id='mainscreen';
 el.innerHTML=`<div class="ms-logo"><div class="logo">曦月渡</div><div class="en">The Ferry Between Dawn &amp; Moon</div></div>
 <div class="ms-train" id="mst">
  <video class="ms-anim" src="${MAIN_TRAIN.video}" poster="${MAIN_TRAIN.poster}" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
  <svg class="ms-branch" viewBox="0 0 1600 918" preserveAspectRatio="none" aria-hidden="true"><g class="bl">${ART.branchV(288,976,328)}</g><g class="bp">${ART.branchV(304,544,292)}</g></svg>
  <button class="hs exit cta" id="ms-work"><span class="mk"></span><span class="lb">上班</span></button>
  <button class="ms-opt" id="ms-new" tabindex="-1">初次值勤<span class="s">開始新的旅程</span></button>
  <button class="ms-opt ${hasAny?'':'off'}" id="ms-cont" tabindex="-1">接續旅程<span class="s">${hasAny?'喚回封存的記憶':'尚無可接續的旅程'}</span></button>
 </div>
 <div class="ms-shade"></div>
 <button class="snd ms-snd ${PREFS.sound===false?'off':''}" id="ms-snd" aria-label="音樂與音效">♪</button>
 <div class="ms-note" id="ms-note">輕觸火車頭的「上班」開始值勤</div>`;
 document.body.appendChild(el); msLayout(); msPlay(el);
 /* 火車音效：瀏覽器規定要先有一次點擊才能出聲，所以在主畫面第一次點擊時開始；已解鎖（例如從遊戲回到主畫面）就直接播放 */
 if(SFX.ctx&&SFX.ctx.state==='running') TRAINSFX.start();
 const wake=()=>{ if($('#mainscreen')===el) TRAINSFX.start(); }; el.addEventListener('pointerdown',wake,{once:true}); el.addEventListener('keydown',wake,{once:true});
 el.querySelector('#ms-snd').onclick=e=>{ e.stopPropagation(); PREFS.sound=PREFS.sound===false; savePrefs(); e.currentTarget.classList.toggle('off',PREFS.sound===false);
  if(PREFS.sound===false) TRAINSFX.stop(); else TRAINSFX.start(); };
 const mst=el.querySelector('#mst'), note=el.querySelector('#ms-note');
 el.querySelector('#ms-work').onclick=()=>{ const o=!mst.classList.contains('open'); mst.classList.toggle('open',o);
  el.querySelectorAll('.ms-opt').forEach(b=>b.tabIndex=o?0:-1); note.textContent=o?'選擇今天的值勤方式':'輕觸火車頭的「上班」開始值勤'; if(o) SFX.tone(1318,0,.7,'sine',.03); };
 el.querySelector('#ms-new').onclick=()=>{
  startNew(); };
 el.querySelector('#ms-cont').onclick=()=>{ if(!hasAny){ note.textContent='目前尚無可接續的旅程。請先選擇「初次值勤」。'; return; } savePanel('title'); };
}
function startNew(){ const ms=$('#mainscreen'); if(ms){ ms.id='mainscreen-out'; ms.style.transition='opacity .9s ease'; ms.style.pointerEvents='none'; requestAnimationFrame(()=>ms.style.opacity=0); setTimeout(()=>ms.remove(),950); } SFX.init(); TRAINSFX.stop(); BGM.start(); CAB.reset(); state=freshState(); state.currentPhase='outside'; state.currentCarriage='cab'; save(); PANO.active=null; RUNNING=true; render(); intro(); }

/* ---------- 開場（原有開場文字，未改動） ---------- */
function intro(){
 cine.cls='intro'; cine(['很久很久，什麼都沒有動。','然後，一點光落在你身上。','你睜開眼睛。四周是白色的石、金色的弧，與一扇巨大的窗。','這是一列由古代守護者建造的列車。它沉睡了很久，而現在，它和你一起醒來了。','你不知道它為什麼停在這裡，也不知道建造它的人去了哪裡。','你只知道一件事：從今天起，由你來巡視它。'],()=>{
  state.introDone=true; addClue('clue_wake');
  /* 開場結束 → 站在沉睡之地的月台上，點「上車」才進入駕駛室 */
  state.currentLocation='origin'; state.currentPhase='outside'; state.currentCarriage='cab'; state.feelSeen=['origin']; render();
  if(!state.ngPlus) setTimeout(()=>dialogueScript(LOC_FEEL.origin[0].map(t=>['self',t])),700);
  if(state.ngPlus) cine(['（這一點光……好像在哪裡見過。）','（你想不起來。可是心裡有一個地方，暖暖的。）'],()=>render());
 });
}
function boot(){ try{ new Image().src=INTRO_BG; }catch(e){} normalizeState(); render(); showMain(); }
boot();
</script>
