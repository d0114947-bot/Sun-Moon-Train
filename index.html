/* ---------- 浮空典藏書：naturalist field-guide parchment ---------- */
.ov.book{z-index:34;background:radial-gradient(ellipse at 50% 42%,rgba(58,38,22,.88),rgba(10,7,4,.96));backdrop-filter:blur(3px);padding-top:calc(env(safe-area-inset-top,0px) + 66px)}
.tome{--paper:#efe3c5;--paper-2:#e2cfa5;--ink:#3a2817;--ink-2:#5f472c;--ink-3:#93744c;--hand:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
 position:relative;width:min(1200px,100%);height:min(780px,100%);display:flex;background:#2a1a0f;border-radius:8px;padding:12px;
 box-shadow:0 40px 100px rgba(0,0,0,.75),inset 0 0 0 2px #4b311f,inset 0 0 0 6px #22150b;animation:tomeIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes tomeIn{from{opacity:0;transform:translateY(22px) scale(.97)}}
.spread{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:3px;overflow:hidden;background:var(--paper)}
.spread::after{content:"";position:absolute;z-index:2;left:50%;top:0;bottom:0;width:70px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(90,58,26,.18) 38%,rgba(50,30,12,.42) 50%,rgba(90,58,26,.18) 62%,transparent)}
.spread.turn .page{animation:pageIn .45s ease-out}
.spread.turn .page.r{animation-delay:.06s;animation-fill-mode:backwards}
@keyframes pageIn{from{opacity:.35;transform:translateX(8px)}}
.page{position:relative;min-width:0;overflow:auto;padding:34px 40px 54px;color:var(--ink);font-family:var(--hand);font-size:15px;line-height:1.85;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .28 0 0 0 0 .12 0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
 radial-gradient(ellipse at 16% 10%,rgba(150,108,52,.2),transparent 42%),radial-gradient(ellipse at 88% 92%,rgba(140,96,44,.22),transparent 46%),linear-gradient(180deg,var(--paper),var(--paper-2));
 scrollbar-width:thin;scrollbar-color:rgba(106,80,52,.45) transparent}
.page.l{box-shadow:inset -18px 0 30px -24px rgba(60,36,12,.55)}
.page.r{box-shadow:inset 18px 0 30px -24px rgba(60,36,12,.55)}
.page h3{font-family:var(--hand);font-weight:700;font-size:clamp(22px,2.3vw,31px);letter-spacing:.14em;margin:0;color:var(--ink);text-wrap:balance}
.page .rule{display:block;width:min(260px,70%);height:12px;margin:2px 0 12px;color:var(--ink-2)}
.page .rule path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.page p{margin:.4em 0 .8em;color:var(--ink-2);max-width:36em}
.page p.aside{font-size:14px;color:var(--ink-3);border-left:2px solid rgba(147,116,76,.5);padding-left:12px}
.page h5{font-family:var(--hand);font-size:17px;font-weight:700;letter-spacing:.12em;margin:18px 0 2px;color:var(--ink);display:flex;align-items:center;gap:8px}
.page h5 svg{width:22px;height:22px;color:var(--ink-2);flex:none}
.page .blur{filter:blur(3.5px);opacity:.75}
.page .tally{font-size:13.5px;color:var(--ink-3)}
.page .end{text-align:center;color:var(--ink-3);font-size:14px;margin-top:40%}
.no{font-family:var(--f-latin);font-style:italic;font-weight:500;color:var(--ink-3);letter-spacing:.04em;margin-right:8px}
.folio{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 34px;font-family:var(--f-latin);font-style:italic;color:var(--ink-3);font-size:14px}
.folio>*{flex:1}.folio>*:nth-child(2){flex:none}.folio>*:last-child{text-align:right}
.folio button{all:unset;cursor:pointer;font-family:var(--hand);font-style:normal;color:var(--ink-2);letter-spacing:.1em;padding:6px 4px;border-bottom:1px solid transparent}
.folio button:hover,.folio button:focus-visible{border-color:var(--ink-3)}
.ribbons{position:absolute;top:-66px;right:72px;display:flex;gap:8px;z-index:3}
.ribbons button{border:0;cursor:pointer;writing-mode:vertical-rl;white-space:nowrap;font-family:var(--hand);font-size:13px;letter-spacing:.12em;line-height:1;color:#f8ecd2;padding:10px 11px 22px;height:96px;background:var(--rb);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transform:translateY(-4px);transition:transform .25s,filter .25s;filter:brightness(.82)}
.ribbons button.on{transform:translateY(10px);filter:none}
.ribbons button:hover,.ribbons button:focus-visible{transform:translateY(4px);filter:none;outline:none}
.ribbons button.on:hover{transform:translateY(10px)}
.seal-close{position:absolute;top:-16px;left:-14px;z-index:4;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:#f6dccb;font-size:16px;background:radial-gradient(circle at 35% 30%,#b9473f,#7a211c 70%);box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.08)}
.seal-close:focus-visible{outline:2px solid #f8ecd2;outline-offset:2px}
.specs{display:flex;flex-direction:column;gap:20px;margin-top:6px}
.spec{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:16px;align-items:start;padding:8px;border-radius:4px;cursor:pointer;transition:background .25s}
.spec:hover{background:rgba(130,90,40,.08)}
.spec:focus-visible{outline:1.5px dashed var(--ink-3);outline-offset:2px}
.spec.unk{cursor:default}.spec.unk:hover{background:none}
.plate{position:relative;aspect-ratio:4/5;max-width:100%}
.plate .wash{position:absolute;inset:8% 6% 4%;border-radius:48% 52% 44% 56%/56% 46% 54% 44%;filter:blur(12px) sepia(.4);opacity:.42}
.plate>svg,.plate>img{position:relative;width:100%;height:100%;object-fit:contain;filter:sepia(.2) saturate(.9) drop-shadow(0 6px 6px rgba(70,46,20,.22))}
.spec.unk .plate>svg{filter:none}
.spec.unk .wash{background:radial-gradient(circle,rgba(90,60,30,.5),transparent 70%)}
.spec h4{margin:0 0 4px;font-family:var(--hand);font-size:20px;letter-spacing:.12em;font-weight:700;color:var(--ink);border-bottom:1px solid rgba(95,71,44,.35);padding-bottom:4px}
.spec h4 small{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:8px;letter-spacing:.08em}
.notes{list-style:none;margin:6px 0;padding:0;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.notes li::before{content:"‐ ";color:var(--ink-3)}
.spec p{margin:6px 0 0;font-size:14px;line-height:1.85;color:var(--ink)}
.spec .more{display:inline-block;margin-top:6px;font-size:13px;color:var(--ink-3);letter-spacing:.1em}
.plate.big{aspect-ratio:3/4;width:min(100%,280px);margin:4px auto 0}
.caption{text-align:center;font-size:13px;color:var(--ink-3)!important;letter-spacing:.12em;margin:4px auto!important}
.studies{display:flex;justify-content:center;gap:22px;margin-top:10px}
.studies .sk{width:70px;height:90px;transform:rotate(var(--rot));filter:grayscale(1) sepia(.7) contrast(1.7) brightness(1.06);mix-blend-mode:multiply;opacity:.55}
.studies .sk>*{width:100%;height:100%;object-fit:contain}
.dl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 12px;font-size:14px;margin:8px 0}
.dl dt{color:var(--ink-3)}.dl dd{margin:0;color:var(--ink)}
.bond{display:inline-flex;gap:6px;align-items:center}
.bond i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink-3)}
.bond i.on{background:var(--ink-2);border-color:var(--ink-2)}
.bond span{margin-left:6px}
.recs{list-style:none;margin:6px 0;padding:0;font-size:13.5px;color:var(--ink-2)}
.recs li{display:grid;grid-template-columns:3.8em minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px dotted rgba(95,71,44,.3)}
.recs .no{margin:0}
.backlink{all:unset;cursor:pointer;font-size:14px;color:var(--ink-2);letter-spacing:.1em;margin:14px 0 6px;display:inline-block;border-bottom:1px solid transparent}
.backlink:hover,.backlink:focus-visible{border-color:var(--ink-3)}
.facts{margin:6px 0;padding-left:1.1em;color:var(--ink-2)}
.facts li{margin:2px 0}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:4px}
.types div{font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.types b{display:block;font-size:15px;letter-spacing:.1em;color:var(--ink)}
.types b small{font-weight:400;font-size:12px;color:var(--ink-3)}
.inkmap{width:100%;height:auto;display:block;margin-top:4px;color:var(--ink-2);font-family:var(--hand)}
.places{display:flex;flex-direction:column;gap:14px;padding-bottom:36px}
.place{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.place .vg{aspect-ratio:3/2;max-width:100%;border-radius:3px;overflow:hidden;filter:sepia(.55) saturate(.8) contrast(.95);box-shadow:0 0 0 1px rgba(95,71,44,.4)}
.place .vg svg{width:100%;height:100%;display:block}
.place.unk .vg{filter:grayscale(1) brightness(.55) sepia(.4) blur(1px)}
.place b{font-size:16px;letter-spacing:.1em}
.place small{display:block;color:var(--ink-3);font-size:12px;letter-spacing:.08em}
.place p{margin:2px 0 0;font-size:13.5px;line-height:1.75}
@media (max-width:820px){
 .ov.book{padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
 .tome{height:100%;padding:8px}

}

/* animated passenger sprite (de-backgrounded video) */

<script>
const HAB_FRONT='assets/habitat-front.jpg', HAB_BACK_IMG='assets/habitat-back.jpg', OBS_FRONT='assets/observation-front.jpg', OBS_BACK_IMG='assets/observation-back.jpg';
const vKey=c=>c==='observation'?'oview':'hview';
/* ================================================================
   日月更迭 — MVP
   模組：LOCATIONS / CARRIAGES / PASSENGERS / EVENTS / COLLECTIBLES / state / nav
   換正式美術：替換 ART.scene 中的函式，或在 CARRIAGES[x].image / LOCATIONS[x].image 填入圖片路徑。
   ================================================================ */
const $ = s => document.querySelector(s);
const SAVE_KEY = 'riyue-save-v1';

/* ---------- 美術：SVG 場景與立繪（可替換成圖片） ---------- */
const ART = {};
ART.defs = `<defs>
 <radialGradient id="gGold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d8"/><stop offset=".5" stop-color="#f1d58e" stop-opacity=".5"/><stop offset="1" stop-color="#f1d58e" stop-opacity="0"/></radialGradient>
 <radialGradient id="gViolet" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e7e2ff"/><stop offset=".5" stop-color="#9a8cff" stop-opacity=".45"/><stop offset="1" stop-color="#6a5cff" stop-opacity="0"/></radialGradient>
 <radialGradient id="gCyan" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eaffff"/><stop offset=".5" stop-color="#7fe6f0" stop-opacity=".45"/><stop offset="1" stop-color="#7fe6f0" stop-opacity="0"/></radialGradient>
 <radialGradient id="gGreen" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f2ffe0"/><stop offset=".5" stop-color="#a6e39a" stop-opacity=".45"/><stop offset="1" stop-color="#7cc98a" stop-opacity="0"/></radialGradient>
 <linearGradient id="gStone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f4ef"/><stop offset="1" stop-color="#c9c6d6"/></linearGradient>
 <linearGradient id="gStoneD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9894b4"/><stop offset="1" stop-color="#e9e6f2"/></linearGradient>
 <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d6e6"/><stop offset="1" stop-color="#f6f3fb"/></linearGradient>
 <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dff4ff" stop-opacity=".35"/><stop offset=".3" stop-color="#ffffff" stop-opacity=".12"/><stop offset=".7" stop-color="#cfe9ff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".4"/></linearGradient>
 <linearGradient id="gSpace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f2e"/><stop offset=".6" stop-color="#25205a"/><stop offset="1" stop-color="#4a3a86"/></linearGradient>
 <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
 <linearGradient id="gDragonS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#d8dcff"/><stop offset="1" stop-color="#9a8cff" stop-opacity=".35"/></linearGradient>
 <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d5536"/><stop offset="1" stop-color="#c99c6c"/></linearGradient>
 <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>`;
function rnd(seed){ let s=seed; return ()=> (s=(s*9301+49297)%233280)/233280; }
function stars(n,seed,x0=0,y0=0,w=1600,h=900,col='#fff'){ const r=rnd(seed); let o=''; for(let i=0;i<n;i++){const x=x0+r()*w,y=y0+r()*h,s=r()*1.6+.3; o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.toFixed(2)}" fill="${col}" opacity="${(.4+r()*.6).toFixed(2)}"/>`;} return o; }

/* 地點外景（也用於觀測窗與圖鑑縮圖） */
ART.loc = {
 dawnForest(){ const r=rnd(7); let trees='';
  for(let i=0;i<14;i++){const x=r()*1600,w=40+r()*70,h=500+r()*300; trees+=`<rect x="${x}" y="${900-h}" width="${w}" height="${h}" fill="#3a4a3e" opacity="${.25+r()*.25}"/>`;}
  let rays=''; for(let i=0;i<7;i++){const x=600+i*90; rays+=`<polygon points="${x},0 ${x+40},0 ${x-180+i*30},900 ${x-260+i*30},900" fill="#fff4c8" opacity=".07"/>`;}
  let motes=''; for(let i=0;i<40;i++){motes+=`<circle cx="${r()*1600}" cy="${300+r()*560}" r="${2+r()*4}" fill="url(#gGreen)"/>`;}
  return `<rect width="1600" height="900" fill="#c9d8b8"/><rect width="1600" height="900" fill="url(#dawnSky)"/>
  <defs><linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe7c4"/><stop offset=".45" stop-color="#d7e3c0"/><stop offset="1" stop-color="#4e6a52"/></linearGradient></defs>
  <ellipse cx="800" cy="260" rx="420" ry="260" fill="url(#gGold)" opacity=".9"/>${rays}${trees}
  <path d="M640 900 C 690 700 660 560 700 420 C 640 380 520 330 470 250 C 560 290 640 320 720 360 C 700 260 640 160 650 60 C 700 160 760 260 790 340 C 820 230 900 140 990 90 C 930 200 860 290 850 370 C 940 320 1060 300 1150 240 C 1060 330 960 390 900 430 C 930 560 910 720 970 900 Z" fill="#2c3a30"/>
  <path d="M700 420 C 760 400 840 400 900 430" stroke="#e8c983" stroke-width="3" fill="none" opacity=".7"/>
  <circle cx="800" cy="560" r="34" fill="none" stroke="#f3dc9a" stroke-width="3" opacity=".85"/><circle cx="800" cy="560" r="20" fill="none" stroke="#f3dc9a" stroke-width="2" opacity=".85"/><path d="M800 526 V594 M766 560 H834" stroke="#f3dc9a" stroke-width="2" opacity=".8"/>
  <circle cx="800" cy="560" r="70" fill="url(#gGold)" opacity=".5"/>
  <ellipse cx="800" cy="900" rx="1100" ry="120" fill="#2f4532"/>${motes}
  <g opacity=".9">${[[260,820],[330,840],[1240,830],[1330,850],[1180,860]].map(([x,y])=>`<path d="M${x-22} ${y} Q${x} ${y-40} ${x+22} ${y} Z" fill="#e9f5d9" opacity=".75"/><rect x="${x-4}" y="${y}" width="8" height="18" fill="#e9f5d9" opacity=".6"/><circle cx="${x}" cy="${y-10}" r="20" fill="url(#gGreen)"/>`).join('')}</g>`; },
 starIslands(){ const r=rnd(21); let isl='';
  [[300,520,150],[820,420,230],[1320,560,140],[560,740,90],[1100,780,80]].forEach(([x,y,s],i)=>{
   isl+=`<g><ellipse cx="${x}" cy="${y}" rx="${s}" ry="${s*.22}" fill="#cfd3f5"/><path d="M${x-s} ${y} Q ${x} ${y+s*1.1} ${x+s} ${y} Z" fill="#5d5aa0"/><path d="M${x-s*.7} ${y+5} Q ${x} ${y+s*.8} ${x+s*.7} ${y+5}" fill="#3c3b7a"/>
   <polygon points="${x-s*.25},${y} ${x-s*.15},${y-s*.75} ${x-s*.05},${y}" fill="#bfe6ff" opacity=".9"/><polygon points="${x+s*.05},${y} ${x+s*.2},${y-s*.5} ${x+s*.32},${y}" fill="#d9c8ff" opacity=".85"/>
   <circle cx="${x-s*.15}" cy="${y-s*.5}" r="${s*.35}" fill="url(#gCyan)"/></g>`; });
  return `<rect width="1600" height="900" fill="url(#gSpace)"/>${stars(260,3)}
  <path d="M-100 700 C 300 520 600 520 900 380 S 1400 160 1750 120" stroke="#cdbcff" stroke-width="160" fill="none" opacity=".13" filter="url(#fSoft)"/>
  <path d="M-100 700 C 300 520 600 520 900 380 S 1400 160 1750 120" stroke="#fff" stroke-width="40" fill="none" opacity=".12" filter="url(#fSoft)"/>
  ${stars(160,9,0,0,1600,700,'#e9e2ff')}<circle cx="1260" cy="180" r="70" fill="#f0e6ff" opacity=".85"/><circle cx="1260" cy="180" r="170" fill="url(#gViolet)"/>${isl}`; },
 locked(seed,hue){ return `<rect width="1600" height="900" fill="#0b0c1c"/>${stars(120,seed)}<circle cx="800" cy="450" r="300" fill="hsl(${hue} 70% 60%)" opacity=".18" filter="url(#fSoft)"/><text x="800" y="480" text-anchor="middle" font-size="110" fill="#fff" opacity=".25" font-family="serif">？</text>`; }
};

/* 車廂共用：透視走廊 */
function corridor(o={}){ const wall=o.wall||'url(#gStone)';
 return `<rect width="1600" height="900" fill="#e8e5f0"/>
 <polygon points="0,0 1600,0 1020,330 580,330" fill="${o.ceil||'#f4f1f8'}"/>
 <polygon points="0,900 1600,900 1020,600 580,600" fill="url(#gFloor)"/>
 <polygon points="0,0 580,330 580,600 0,900" fill="${wall}"/><polygon points="1600,0 1020,330 1020,600 1600,900" fill="${wall}"/>
 ${[0,1,2,3,4].map(i=>{const t=i/5,x1=0+580*t*1.0, y1=0+330*t, y2=900-300*t; return `<line x1="${x1}" y1="${y1}" x2="${x1}" y2="${y2}" stroke="#c8a85e" stroke-width="${3-i*.4}" opacity=".6"/><line x1="${1600-x1}" y1="${y1}" x2="${1600-x1}" y2="${y2}" stroke="#c8a85e" stroke-width="${3-i*.4}" opacity=".6"/>`}).join('')}
 ${[0,1,2,3,4,5].map(i=>{const t=i/6; return `<path d="M${580*t} ${330*t} Q 800 ${-120+400*t} ${1600-580*t} ${330*t}" stroke="#d6b66a" stroke-width="${4-i*.5}" fill="none" opacity=".75"/>`}).join('')}
 <ellipse cx="800" cy="760" rx="360" ry="70" fill="none" stroke="#c8a85e" stroke-width="3" opacity=".55"/><ellipse cx="800" cy="760" rx="250" ry="46" fill="none" stroke="#c8a85e" stroke-width="2" opacity=".45"/>
 <path d="M720 600 V 420 Q 800 340 880 420 V 600 Z" fill="${o.door||'#cfd8ff'}"/><path d="M738 600 V 425 Q 800 360 862 425 V 600" fill="none" stroke="#c8a85e" stroke-width="3"/>
 <path d="M720 600 V 420 Q 800 340 880 420 V 600" fill="url(#gViolet)" opacity=".7"/>`; }

ART.car = {
 observation(state){
  const L = state.currentPhase==='voyage' ? ART.loc.voyage : LOCATIONS[state.currentLocation].art;
  return `<rect width="1600" height="900" fill="#151834"/>
  <svg x="230" y="60" width="1140" height="640" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">${ART.defs}${L()}</svg>
  <path d="M0 0 H1600 V900 H0 Z M230 700 V 300 Q 230 60 800 60 Q 1370 60 1370 300 V 700 Z" fill="url(#gStone)" fill-rule="evenodd"/>
  <path d="M230 700 V 300 Q 230 60 800 60 Q 1370 60 1370 300 V 700 Z" fill="url(#gGlass)"/>
  <path d="M230 700 V 300 Q 230 60 800 60 Q 1370 60 1370 300 V 700" fill="none" stroke="#c8a85e" stroke-width="10"/>
  <path d="M800 60 V700 M230 380 H1370" stroke="#c8a85e" stroke-width="3" opacity=".5"/>
  <path d="M735 700 V 615 Q 800 560 865 615 V 700 Z" fill="#e3dcff"/><path d="M735 700 V 615 Q 800 560 865 615 V 700" fill="none" stroke="#c8a85e" stroke-width="5"/><path d="M735 700 V 615 Q 800 560 865 615 V 700 Z" fill="url(#gViolet)" opacity=".6"/>
  <g transform="translate(115 300)"><circle r="80" fill="#1d2150" stroke="#c8a85e" stroke-width="4"/><g class="spin r">${[0,1,2,3,4,5,6].map(i=>{ const a=i*.9+.3, r=20+i*6; return `<circle cx="${(Math.cos(a)*r).toFixed(1)}" cy="${(Math.sin(a)*r).toFixed(1)}" r="2.6" fill="#fff6d8"/>`; }).join('')}<circle r="60" fill="none" stroke="#bfe6ff" stroke-width="1" stroke-dasharray="2 6"/></g><circle r="34" fill="none" stroke="#c8a85e" stroke-width="1.5" opacity=".7"/><circle r="6" fill="#fff6d8"/></g>
  <polygon points="0,900 1600,900 1420,700 180,700" fill="url(#gFloor)"/>
  <ellipse cx="800" cy="820" rx="520" ry="60" fill="none" stroke="#c8a85e" stroke-width="3" opacity=".6"/>
  <g transform="translate(800 470)"><circle r="120" fill="none" stroke="#f1d58e" stroke-width="2" opacity=".9"/><g class="spin"><ellipse rx="120" ry="40" fill="none" stroke="#f1d58e" stroke-width="2" opacity=".8"/></g><g class="spin r"><ellipse rx="40" ry="120" fill="none" stroke="#f1d58e" stroke-width="2" opacity=".8"/></g><g class="spin fast"><line x1="-150" y1="0" x2="150" y2="0" stroke="#fff6d8" stroke-width="1.5" opacity=".4"/></g>
   <circle r="170" fill="url(#gGold)" opacity=".25"/>${[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4;return `<circle cx="${Math.cos(a)*120}" cy="${Math.sin(a)*120}" r="4" fill="#fff6d8"/>`}).join('')}<circle r="10" fill="#fff6d8"/></g>
  <g transform="translate(230 640)"><rect x="-90" y="0" width="180" height="200" fill="url(#gStone)"/><rect x="-90" y="0" width="180" height="10" fill="#c8a85e"/><circle cx="0" cy="-30" r="60" fill="none" stroke="#c8a85e" stroke-width="5"/><ellipse cx="0" cy="-30" rx="60" ry="18" fill="none" stroke="#c8a85e" stroke-width="3" transform="rotate(-25)"/><circle cx="0" cy="-30" r="14" fill="#9a8cff"/><circle cx="0" cy="-30" r="60" fill="url(#gViolet)" opacity=".6"/></g>
  <g transform="translate(1175 700)"><path d="M-8 0 H8 L12 150 H-12 Z" fill="#c8a85e"/><ellipse cy="150" rx="46" ry="9" fill="#c8a85e" opacity=".6"/><path d="M-62 -6 L0 6 L62 -6 L58 -44 L0 -32 L-58 -44 Z" fill="#2a2c5a" stroke="#c8a85e" stroke-width="3"/>
   <path d="M-54 -12 L-2 -2 L-4 -36 L-52 -45 Z M54 -12 L2 -2 L4 -36 L52 -45 Z" fill="#f6eedb"/>${[[-38,-30],[-22,-20],[-30,-14],[30,-30],[18,-22],[38,-18]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="#3d3a7a"/>`).join('')}<path d="M-38 -30 L-22 -20 L-30 -14 M30 -30 L18 -22 L38 -18" stroke="#3d3a7a" stroke-width="1" fill="none"/><circle cy="-24" r="70" fill="url(#gGold)" opacity=".35"/></g>
  <g transform="translate(1360 640)"><rect x="-110" y="0" width="220" height="200" fill="url(#gStone)"/><rect x="-110" y="0" width="220" height="10" fill="#c8a85e"/><rect x="-90" y="-110" width="180" height="96" rx="6" fill="#1d2150" stroke="#c8a85e" stroke-width="3"/>
   <text x="0" y="-70" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="22" fill="#bfe6ff">${state.currentPhase==='voyage'?'— · —':String(LOCATIONS[state.currentLocation].coord)}</text><text x="0" y="-40" text-anchor="middle" font-size="14" fill="#9a8cff" letter-spacing="4">COORD</text></g>
  <g transform="translate(1490 230)"><polygon points="0,-60 26,0 0,60 -26,0" fill="#dff4ff" opacity=".85"/><polygon points="0,-60 26,0 0,0" fill="#fff"/><circle class="pulse c" r="70" fill="${anomFound().length>0&&(state.seen||{})['obs-anomrec']!==String(anomFound().length)?'url(#gGold)':'url(#gCyan)'}"/></g>`; },
 nature(state){
  const mode=state.storyFlags.natureLight||'dawn', tint={dawn:'#ffe7a8',moon:'#bcd2ff',star:'#cdb8ff'}[mode], glow={dawn:'url(#gGold)',moon:'url(#gCyan)',star:'url(#gViolet)'}[mode], gem={dawn:'#fff1c8',moon:'#dfeaff',star:'#ebe2ff'}[mode];
  const cul=(state.pods||[])[0], podA=!cul?'empty':cul.st>=2?'bloom':'sprout', colA=cul?PLANTS[cul.p].color:'#a6e39a';
  const grown=state.grown||[], podB=grown.length?'bloom':'dormant', colB=grown.length?PLANTS[grown[0]].color:'#7ccf86';
  const tube=(x,y,s,m,col,cls)=>{ const w=110*s,h=330*s,base=y+h/2-20,top=y-h/2+40;
   let plant='';
   if(m!=='empty'){ const k=m==='sprout'?.45:1, ty=base-(base-top)*k, stem=m==='dormant'?'#6f9a78':'#5fae6e', lf=m==='dormant'?'#88b394':'#7ccf86';
    plant=`<g class="sway ${cls}"><path d="M${x} ${base} C ${x-30*k} ${(base+ty)/2} ${x+30*k} ${ty+40*k} ${x} ${ty}" stroke="${stem}" stroke-width="${6*s}" fill="none"/>
     ${[0,1,2,3].slice(0,m==='sprout'?2:4).map(i=>{ const lx=x+(i%2?18:-18)*s, ly=base-60*s*k-i*55*s*k; return `<ellipse cx="${lx}" cy="${ly}" rx="${22*s*k+4}" ry="${9*s*k+2}" fill="${lf}" transform="rotate(${i%2?-25:25} ${lx} ${ly})"/>`; }).join('')}
     ${m==='bloom'||m==='grown'?`<circle cx="${x}" cy="${ty}" r="${16*s}" fill="${m==='bloom'?col:'#fff4c8'}"/><circle class="pulse ${cls}" cx="${x}" cy="${ty}" r="${60*s}" fill="url(#gGold)"/>`:''}</g>`; }
   const bub=[0,1,2].map(i=>`<circle class="bub" style="--t:-${(h-70).toFixed(0)}px;animation-delay:${(-i*1.8-x/400).toFixed(1)}s" cx="${(x-14*s+i*14*s).toFixed(1)}" cy="${(y+h/2-30).toFixed(1)}" r="${(3*s).toFixed(1)}" fill="#fff" opacity=".7"/>`).join('');
   return `<g><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${w/2}" fill="${tint}" opacity="${m==='empty'?.1:.2}"/>${plant}${bub}
    <rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${w/2}" fill="url(#gGlass)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
    <rect x="${x-w/2-8}" y="${y+h/2-6}" width="${w+16}" height="22" fill="#c8a85e"/><rect x="${x-w/2-8}" y="${y-h/2-14}" width="${w+16}" height="16" fill="#c8a85e"/></g>`; };
  let vault=''; for(let r=0;r<5;r++)for(let c=0;c<4;c++){ const x=40+c*58, y=210+r*92+c*6; vault+=`<rect x="${x}" y="${y}" width="46" height="70" rx="4" fill="#efe9dd" stroke="#c8a85e" stroke-width="2"/><circle class="${(r*4+c)%5?'':'pulse b'}" cx="${x+23}" cy="${y+35}" r="7" fill="${(r+c)%3?'#bfe6ff':'#f1d58e'}" opacity=".9"/>`;}
  const jar=(dx,c,on)=>`<g transform="translate(${dx} 0)"><rect x="-26" y="-84" width="52" height="74" rx="12" fill="#f3efe6" opacity=".55" stroke="#c8a85e" stroke-width="2"/><rect x="-18" y="-96" width="36" height="12" rx="3" fill="#c8a85e"/>${on?`<path d="M0 -18 C 0 -40 -2 -56 2 -72 M0 -34 q -12 -4 -14 -12 M1 -46 q 12 -4 13 -12 M0 -58 q -9 -3 -10 -9" stroke="${c}" stroke-width="3" fill="none"/>`:''}</g>`;
  const view=state.currentPhase==='voyage'?ART.loc.voyage():LOCATIONS[state.currentLocation].art();
  return corridor({door:'#d6f2d0'})+`<rect width="1600" height="900" fill="${tint}" opacity=".12"/>
  <g transform="skewY(18)">${vault}</g><polygon points="20,170 290,250 290,780 20,860" fill="none" stroke="#c8a85e" stroke-width="5"/>
  <clipPath id="natwin"><ellipse cx="1400" cy="240" rx="70" ry="102"/></clipPath>
  <g clip-path="url(#natwin)"><svg x="1330" y="138" width="140" height="204" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">${ART.defs}${view}</svg></g>
  <ellipse cx="1400" cy="240" rx="70" ry="102" fill="url(#gGlass)" stroke="#c8a85e" stroke-width="7"/><path d="M1352 196 Q 1372 160 1404 150" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>

  bio:'在晨光初現的高山幽谷中，雲霧猶如輕紗般纏繞著古老的巨木。羽貓獸輕巧地穿梭於峭壁邊緣，牠的爪子踩在帶有苔蘚的岩石上幾乎沒有發出一絲聲響。當第一道陽光穿透薄霧，灑在牠那雙泛著虹彩的羽翼上時，整隻生物彷彿與大自然融為一體。牠停下腳步，金黃色的眼眸轉向遠方的山嵐，耳翼微微顫動著，聆聽著風中的細語。對於山區的採藥人而言，偶爾在雲端瞥見羽貓獸的身影，往往被視為晴朗好天氣與旅途平安的象徵。',
  field:{alias:'雲端精靈、晨曦的巡林者、迎風貓頭鷹獸',cls:'半獸類／飛行獸類',danger:'低（除非領地遭受直接侵犯或幼獸受到威脅，否則牠們傾向於直接退避或快速飛離）',rarity:'稀有',
   looks:'羽貓獸擁有貓科動物般靈活而流線的軀幹，四肢覆蓋著細密柔軟的絨毛，末端為銳利的爪子，便於在岩壁與樹幹間攀爬。牠的頸部與前肢漸層過渡至帶有神祕紫調的深色，與背部及尾尖的白毛形成鮮明對比。頭部結合了貓科的輪廓與鳥類的靈巧特徵，長有一對金黃色的大眼睛與覆蓋著羽毛的耳翼。背部則長出一對構造精細、由虹彩羽毛組成的雙翼，能在飛行時折射出淡淡的粉紫與銀光。頸間自然環繞著一圈帶著小花與金屬飾品般的絨毛與斑紋，使其在野性中帶有一絲靈動與優雅。',
   habitat:'多數棲息於高海拔的溫帶山區、雲霧繚繞的高山森林，以及古老遺跡周邊的峭壁。牠們喜歡築巢於視野開闊、陽光充足的高聳崖壁縫隙或巨樹冠層。',
   habits:[['活動時間','日行性，活躍於清晨與黃昏的光影交替之際。'],['飲食','主要以高山上的小型靈巧獵物、花蜜及特定的高山漿果為主，屬於雜食偏肉食。'],['社會結構','多為獨居或以小家庭為單位活動，領域性中等。'],['性格','生性機警、好奇心強，對陌生氣息保持距離，但若長期處於安定環境中，會對特定人類或同行生物表現出溫和的親近感。']],
   abilities:[['御風滑翔','利用背部的羽翼與尾部的平衡，能在強風的山谷間進行長距離的無聲滑翔與高機動性轉向。'],['光影擬態','羽毛結構能在特定角度的陽光下折射出與周遭岩壁和霧氣相似的光澤，達到天然的視覺隱蔽效果。'],['敏銳感知','頭部耳翼的特殊羽毛結構對氣流與微弱聲音極度敏感，能提前預知山嵐的變化與潛在危險。']]},
  stay:2,
  talks:[
   {lines:['（牠停在懸浮棲息環的最高處，金黃色的眼睛一動也不動地看著你，耳翼微微轉向你的方向。）','我住在很高的山上。雲霧會繞著老樹，崖壁上有我的巢。','……這裡的風，是從哪裡吹來的？'],choices:[{t:'是列車航行時帶起的氣流。',r:'列車的風。沒有山的味道，但是很穩。……我可以在這裡停一下嗎？'},{t:'你是從哪裡飛進來的？',r:'我只是跟著一陣橫風滑翔。回過神來，就在這裡了。'}]},
   {lines:['（牠收起雙翼，羽毛在車廂的光下泛出淡淡的粉紫。）','我習慣在清晨和黃昏出來。光影交替的時候，最自在。','你們這裡的光，跟山上的晨光很像。斜斜的，很好藏起來。','……我是說，很好休息。'],choices:[{t:'你在躲什麼嗎？',r:'沒有。只是習慣了。在山上，太容易被看見的東西，常常會被盯上。'},{t:'這裡很安全。',r:'嗯。我的耳朵也這麼說。這裡的風裡，沒有危險的聲音。'}]},
   {lines:['（牠從圓環上無聲地滑下來，停在離你近了一些的地方。）','山上採藥的人說，在雲裡看見我的影子，就會有好天氣。','我不知道是不是真的。不過，你的旅程，應該會很平安。'],choices:[{t:'謝謝你。',r:'（牠的耳翼輕輕抖了一下，像是在笑。）'}]}
  ],
  farewell:['風向變了。我聽得見。','前面有山的味道……很淡，但是我認得。','我要走了。如果哪天你在雲裡看見一道影子，那就是好天氣的意思。']
 },
 /* 淵光巨：去背後的動態立繪。資料來自設定稿。 */
 leviathaurora:{name:'淵光巨',type:'other',species:'Leviathaurora',zone:'spring',spot:{x:56,y:70},spriteH:24,ar:'580/340',color:'radial-gradient(circle,#cfe8ff,#2c5a9e)',
  image:'assets/leviathaurora.webp',still:'assets/leviathaurora-still.webp',studies:['assets/leviathaurora-s1.webp','assets/leviathaurora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'深海海溝・海底峽谷・無光層水域',
  intro:'在航向星河浮島的途中，從靈泉深處浮現的淵光巨。墨藍色的修長身軀上，幽藍的螢光沿著肌肉與脊椎的紋理流動，宛如深海中的星圖。',
  bio:'在無光的海底世界裡，淵光巨是少數優雅而巨大的流浪者。牠們緩慢地穿梭於沉睡的海溝與海底山脈之間，每一次尾鰭的擺動都伴隨著點點藍光在黑暗中劃出優美的軌跡。當牠游過海底荒漠時，體表的幽光常吸引無數微小的深海生物聚攏，遠看就像是一座攜帶星海在深淵中漫步的移動島嶼。傳說水手如果在暴風雨的夜裡看見海面下透出幽藍的光暈，那便是淵光巨正浮上海面換氣的寧靜時刻。',
  field:{alias:'深淵的星河、夜航者的燈塔、蔚藍孤影',cls:'深海巨獸／遠古游魚類',danger:'低（性格溫和，除非遭受嚴重威脅，否則不具攻擊性）',rarity:'稀有',rarityNote:'棲息於極深的海域，人類難以窺其全貌。',
   looks:'<b>身體構造：</b>擁有修長而流線型的巨型身軀，體長可達數十公尺。頭部寬大扁平，下顎延伸出數根細長的觸鬚，宛如古老的編織漁網。<br><b>顏色與紋理：</b>深邃如深海夜空的墨藍色與碳黑色外皮，皮膚表面佈滿天然的有機骨質紋理。體側與背脊處生有巨大的背鰭與流線型胸鰭，邊緣呈半透明的深邃藍色。<br><b>發光機制：</b>牠的全身各處分佈著生物發光器官（Photophores），能沿著軀幹的肌肉紋理與脊椎線條透出幽藍色的螢光，宛如深海中的星圖與神經網絡。',
   habitat:'常年籠罩在永夜與極度高壓中的深海海溝、海底峽谷，或陽光無法觸及的無光層水域。',
   habits:[['活動時間','全天候活動，但在黑暗的深海中，牠們的螢光脈絡在獵食或求偶時會變得格外閃耀。'],['飲食','屬於濾食性巨獸，利用下顎的長鬚與巨大的口腔過濾深海中的浮游生物、微小甲殼類及有機微粒。'],['性格','性情溫和、孤傲且極具包容性，通常獨自游弋，對外界的騷擾多半選擇避開或緩慢潛入更深的海域。']],
   abilities:[['生物冷光共鳴','能透過體表螢光頻率的變化與同類進行長距離的深海通訊，甚至能微幅干擾周遭的水流與光線。'],['深海壓強適應','體內擁有特殊的骨骼與組織結構，能完美承受千米之下的恐怖水壓，並在高速游動時將阻力降到最低。']]},
  stay:2,
  talks:[
   {lines:['（靈泉的水面一圈一圈地暗下去，像是突然變得很深。一道幽藍的光，從水底慢慢浮了上來。）','……這裡的水，很淺。也很亮。','我來的地方沒有光，水重得像山一樣壓下來。','不過，很安靜。我喜歡安靜的地方。'],choices:[{t:'你是從深海來的嗎？',r:'深海……是很遠的地方。那裡沒有光，所以我們自己發光。'},{t:'這裡夠你休息嗎？',r:'夠了。我不需要很大的地方，只需要不被打擾。'}]},
   {lines:['（牠身上的光點沿著脊椎一路亮起，又一顆一顆熄滅，像在數著什麼。）','這是我們說話的方式。用光，而不是聲音。','在深淵裡，聲音傳得太遠，會驚動太多東西。光只會讓想看見的人看見。'],choices:[{t:'那你剛才說了什麼？',r:'我說：這列車的光，很像海面。'},{t:'我看見了。',r:'嗯。那就夠了。'}]},
   {lines:['水手們說，暴風雨的夜裡看見海面下的藍光，就是平靜的時刻。','我只是浮上來換一口氣而已。','……不過，如果那能讓他們安心，也很好。'],choices:[{t:'你一直都是獨自一個嗎？',r:'大多數時候。深海很大，同伴的光要很久才看得見一次。所以每一次看見，都會記得很久。'}]}
  ],
  farewell:['水的味道變了。','前面有很深、很暗的地方，我聽得見它在呼喚。','謝謝這片安靜的水。如果有一天，你在很深的地方看見一片會移動的星光，那就是我。']
 },
 /* 燼風帆獸：去背後的動態立繪。資料來自設定稿。 */
 cinder:{name:'燼風帆獸',type:'other',species:'Cinder-Sail Courser',zone:'crystal',spot:{x:67,y:58},spriteH:34,ar:'1268/697',color:'radial-gradient(circle,#fff1d6,#c79a5e)',
  image:'assets/cinder.webp',still:'assets/cinder-still.webp',studies:['assets/cinder-s1.webp','assets/cinder-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'烈日沙漠（The Blazing Sands）',
  intro:'在列車駛向日界時，乘著熾熱光線登車的燼風帆獸。修長纖細的沙褐色身軀，背上兩片半透明的帆在光下透出琥珀色。',
  bio:'在烈日沙漠的邊緣，商隊正頂著熱浪緩慢前行。突然間，領隊的嚮導停下腳步，指向遠處的沙丘。一隻燼風帆獸正以一種不可思議的姿態出現。牠的四肢幾乎懸空，輕盈地在沙脊上滑行。陽光透過牠的背帆，呈現出琥珀色的光澤。牠似乎察覺到了商隊，轉過頭，那雙巨大的眼睛好奇地看著他們，隨即一個華麗的轉身，尾舵一擺，便消失在熱浪之中。<br>年輕的學徒驚訝地問道：「那是龍嗎？」<br>嚮導笑著搖頭：「不，孩子，那是沙漠的靈魂。牠們不需要火焰，因為牠們本身就擁有了太陽的力量。」',
  field:{nameNote:'這個名稱結合了其棲息地的熾熱意象（燼）、背部如船帆般的特徵（風帆），以及牠優雅且善於奔跑的形態（獸）。',
   alias:'日行舟（Sun-Sailer）：商旅對牠們的稱呼，因為牠們常在烈日下與商隊並行。<br>沙漠舞者（Desert Dancer）：當地遊牧民族對牠們輕盈步伐的讚譽。<br>偽龍（False-Drake）：因其外型與龍相似，但缺乏噴火能力而被賦予的貶稱。',
   cls:'荒漠亞龍類（Desert Archosaurian）<br>屬於一種古老的爬行類亞種，與真正的龍類有遠親關係，但在漫長的演化中適應了乾旱環境，演化出獨特的帆狀構造。',
   danger:'低（Low）',dangerNote:'除非你試圖捕捉一隻健康的成年燼風帆獸（這幾乎是不可能的），否則牠們對人類不構成威脅。牠們的防禦機制主要是逃跑。',
   rarity:'少見（Uncommon）',rarityNote:'雖然牠們適應了嚴酷的環境，但因為天敵較少且繁殖率不高，加上特殊的棲息地，人們並不容易見到牠們。只有經驗豐富的嚮導和遊牧民才知道在哪裡能找到這些優雅的沙漠舞者。',
   looks:'燼風帆獸擁有極為纖細而強韌的四肢，這使牠們在沙地上能進行高速且省力的奔跑。牠們的體態修長，覆蓋著細密、沙褐色的鱗片，鱗片紋理細緻，能完美融入乾旱地貌。<br>最顯眼的特徵是背部中央長出的兩片巨大的、半透明的肉膜狀帆。這些帆由纖細的骨質支架支撐，形狀如風帆般高聳。在圖片中，我們可以看到牠們的頸部、背部直到尾部都有一排棘刺，為背帆提供了額外的穩定性。牠們的頭部呈三角形，有一雙如黑曜石般巨大、深邃的眼睛，顯示其優秀的視覺能力。<br>牠們的尾巴末端有一個如船舵般的尾鰭，能在高速奔跑時幫助平衡和轉向。這種構造，加上背帆，讓牠們在沙漠中的移動方式更像是「航行」而非單純的奔跑。',
   habitat:'<b>烈日沙漠（The Blazing Sands）</b><br>主要棲息於廣闊無垠、終年烈日當空的沙漠深處，特別是那些有巨大岩層和沙丘交錯的區域。牠們的鱗片顏色能隨環境微妙變化，從淺金黃到深赭色，提供絕佳的保護色。',
   habits:[['活動時間','晝行性（Diurnal）。這在沙漠生物中相當罕見。牠們依賴白天的陽光來活化背帆的特殊功能。'],['飲食','食蟲與掘根（Insectivorous and Root-foraging）。牠們利用靈敏的視覺和嗅覺在沙下尋找昆蟲、幼蟲，以及富含水分的塊根植物。牠們的嘴部構造適合啄食。'],['群居或獨居','半群居（Semi-social）。雖然大部分時間單獨行動，但在繁殖季節或遷徙時，會形成小型的家族群落（約 3–5 隻）。'],['攻擊性與性格','溫和而警覺（Gentle and Alert）。牠們天性膽小，面對威脅通常選擇逃跑而非戰鬥。牠們的奔跑速度極快，能輕易甩開大多數捕食者。除非被逼入絕境，否則不會展現攻擊性。']],
   abilities:[['太陽能航行（Solar-Sailing）','這是燼風帆獸最核心的能力。牠們背部的巨大皮帆富含感光細胞與微血管網。在烈日下，這些帆會吸收大量的太陽能，轉化為微弱的生物電能。這種能量不直接用於攻擊，而是用以刺激肌肉，減少長距離奔跑時的能量消耗，並保持體溫。這讓牠們能以驚人的速度持續奔跑數小時而不顯疲憊。這也是為什麼牠們只在白天活動。'],['擬態帆（Mimicry-Sail）','在休息或遇到危險時，牠們能透過肌肉控制收起背帆，或將其張開。張開時，帆的紋理和陰影能模擬出遠處岩石的形狀，讓牠們在靜止時看起來像是一塊被風化的岩石，從而騙過捕食者。']]},
  stay:2,
  talks:[
   {lines:['（牠一出現就退到晶石平台的邊緣，背上的兩片帆半收半張，黑曜石般的大眼睛盯著你。）','……你不是商隊。','我從烈日沙漠來。那裡的沙丘和岩層，一望無際，只有商隊會經過。','商隊會帶著水的味道。你身上，只有光的味道。'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈……沒聽過。不過，你沒有追過來。這樣就好。'},{t:'放心，這裡沒有人會抓你。',r:'每個人都這麼說。……不過你站得很遠。我相信站得遠的人。'}]},
   {lines:['（牠把背帆完全張開，對著晶石平台的光，帆面透出琥珀色。）','這裡的光不是太陽，可是很暖。','我的帆會把陽光存起來，讓腳不會累。','在沙漠裡，太陽下山以後我就不能跑了。在這裡，好像可以一直醒著。'],choices:[{t:'你喜歡奔跑嗎？',r:'不是喜歡或不喜歡。帆張開，風來了，腳就自己動了。就像你們的列車一樣。'},{t:'那你要好好休息。',r:'嗯。……我會把帆收一半。這是我們休息的樣子。'}]},
   {lines:['有人叫我們「偽龍」。因為我們長得像龍，卻不會噴火。','我不在意。火會燒掉東西，太陽不會。','嚮導說，我們是沙漠的靈魂。我比較喜歡這個名字。'],choices:[{t:'我也比較喜歡那個名字。',r:'（牠的尾舵輕輕擺了一下，像是在沙脊上轉了一個漂亮的彎。）'}]}
  ],
  farewell:['光的顏色變了。','前面有很亮、很熱的地方。我的帆在發燙。','我要下車了。如果你在熱浪裡看見一道琥珀色的帆影，不用叫住我。我跑得很快，但我會記得你。']
 },
 /* 艾莉絲（暮光耳廓鴞）：去背後的動態立繪。資料來自設定稿。 */
 aelis:{name:'艾莉絲',type:'other',species:'暮光耳廓鴞（Vespertine Fennec-Owl）',zone:'moss',spot:{x:17,y:56},spriteH:24,ar:'410/280',color:'radial-gradient(circle,#fff0dc,#d27a3c)',
  image:'assets/aelis.webp',still:'assets/aelis-still.webp',studies:['assets/aelis-s1.webp','assets/aelis-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'古老森林與沙漠交界的綠洲・乾旱岩石峽谷',
  intro:'在暮色中跳上列車的暮光耳廓鴞，名叫艾莉絲。一對巨大的狐狸耳朵、琥珀色的大眼睛，脖子上掛著刻有藤蔓與星辰圖案的葉形吊墜。',
  bio:'在古老沙漠的邊緣，流傳著關於「耳語者」的傳說。每當夜幕降臨，乾燥的風開始歌唱，這些精靈便會現身。據說，如果一個迷途的旅人在沙漠中遇見一隻佩戴著葉形吊墜的暮光耳廓鴞，並得到牠的指引，便能找到隱藏的綠洲或躲過致命的流沙。當地遊牧民族視牠們為沙漠的守護神，相信牠們是古老森林意志的延伸，在荒蕪中傳遞著生命的訊息。這隻名為「艾莉絲（Aelis）」的個體，因其特殊的吊墜，被認為是一位強大德魯伊的夥伴，甚至是信使。牠的身影總是在夕陽的最後一抹餘暉中出現，靈動地跳躍在沙丘與岩石之間，琥珀色的眼睛凝視著遠方，彷彿在傾聽大地的呼吸。',
  field:{alias:'沙狐貓頭鷹、耳語者、沙漠精靈',cls:'魔法混種／森林獸類（沙漠適應型）',
   danger:'低（Low）',dangerNote:'除非被逼入絕境，否則不會主動攻擊人類。',
   rarity:'稀有（Rare）',rarityNote:'僅在特定的沙漠與森林交界帶出現，且由於其謹慎的性格與夜行習性，極難被人類觀察到。佩戴吊墜的個體更是傳說中的存在。',
   looks:'<b>身體構造：</b>這種生物完美融合了貓頭鷹與耳廓狐的特徵。牠擁有圓潤、毛茸茸的貓頭鷹軀幹，覆蓋著柔軟、濃密的橙褐色絨毛，具有極佳的保溫與偽裝效果。牠的頭部比例較大，生有一對不成比例的巨大、靈活的狐狸狀耳朵，內側為淺奶油色，邊緣帶有深色毛尖。<br><b>臉部：</b>臉盤圓潤，有著巨大的、琥珀色的大眼睛，顯示其夜行性特徵。喙小而尖銳，隱藏在絨毛中。胸前的羽毛上帶有深褐色的斑點，類似樹皮紋理。<br><b>四肢與尾巴：</b>四肢強健，末端有著靈巧且銳利的爪子，覆蓋著深色毛髮。尾巴極為蓬鬆粗大，如同狐狸尾巴，末端有一撮明顯的白色絨毛，在平衡身體和夜間禦寒時起重要作用。<br><b>特殊飾物：</b>令人驚訝的是，這隻特定的「暮光耳廓鴞」脖子上佩戴著一條精緻的金屬細鏈，中央懸掛著一個刻有複雜藤蔓與星辰圖案的葉狀吊墜。這並非天生，而是象徵著牠與某個古老森林守護者種族的契約或共生關係。',
   habitat:'主要棲息於古老森林邊緣與廣闊沙漠交界處的綠洲地帶，或是乾旱岩石峽谷中的隱秘洞穴。牠們偏好日夜溫差極大、植被稀疏但水源充足的環境，這能同時發揮牠們的沙漠生存能力與夜間狩獵優勢。',
   habits:[['活動時間','嚴格的夜行性動物，黃昏與黎明時分最為活躍。'],['飲食','主要捕食在夜間活動的昆蟲、小型爬蟲類（如沙蜥）、小型夜行性齧齒動物以及果實。'],['群居或獨居','傾向於獨居或以極小的家庭單位（配偶與幼崽）行動。牠們的領域意識強烈，會利用尖銳的叫聲和氣味標記領地。'],['攻擊性及性格','牠們本質上是謹慎而好奇的。對陌生人通常保持距離，但若感到威脅，會發出如同狐狸尖叫與貓頭鷹鳴叫混合的刺耳聲響，並利用驚人的速度與敏捷性逃脫。牠們極為聰明，能輕易解決簡單的謎題或機關，表現出接近高等智慧生物的行為模式。']],
   abilities:[['聲納放大器','那對巨大的狐耳不僅能捕捉微小的聲音，還能透過細微的肌肉調整角度，形成類似生物聲納的系統，精確定位獵物在沙層下或岩石縫隙中的位置。'],['靜音飛行','保留了貓頭鷹羽毛的特殊結構，飛行時幾乎沒有聲音，能進行無聲的突襲。'],['視覺適應','琥珀色的大眼睛能在極低的光線下視物，並能短暫過濾強光，適應沙漠的刺眼陽光與星空。'],['自然共鳴（象徵）','佩戴吊墜的個體似乎能與周圍的自然能量產生微弱共鳴，這可能賦予了牠們預知沙塵暴或探測魔法能量的潛在能力，使牠們在惡劣環境中總能找到安全棲息地。']]},
  stay:2,
  talks:[
   {lines:['（一隻橙褐色的小生物停在自然棲台的邊緣，巨大的耳朵一轉，對準了你。）','……你的腳步聲很輕。','比旅人輕，比沙蜥重。你是誰？'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈。……森林的老人們說過，精靈的腳步是聽不見的。看來他們也會說錯。'},{t:'你的耳朵真大。',r:'大耳朵聽得見沙子底下的心跳。也聽得見你剛才偷偷笑了一下。'}]},
   {lines:['白天我都在睡覺。等太陽落下，才出來找蟲子和沙蜥吃。','（牠用前爪輕輕撥了撥脖子上的葉形吊墜，藤蔓與星辰的紋路閃了一下。）','這是約定的記號，不是裝飾。','我答應過一位很老的朋友，要替他看看沙漠以外的世界，再回去告訴他。'],choices:[{t:'是什麼樣的朋友？',r:'他住在森林最深的地方，說話很慢，一句話要說一整個季節。……我只能說到這裡。'},{t:'那你要看得很仔細。',r:'我一直都看得很仔細。這是我的工作。'}]},
   {lines:['我叫艾莉絲。','我住在森林和沙漠交界的綠洲旁邊。晚上很冷，白天很燙。','沙漠的人叫我們「耳語者」。他們迷路的時候，會跟著我們找到綠洲。','如果有一天你迷路了……不對，你有一整列會自己走的車。你大概不會迷路。'],choices:[{t:'說不定還是會需要你。',r:'（牠尾巴尖那撮白毛輕輕搖了一下。）那我就在暮色裡等你。'}]}
  ],
  farewell:['暮色要來了。我聽得見風開始唱歌。','前面有森林的味道，也有沙的味道。那是我的地方。','我會把這列車的事告訴我的朋友。他會花一整個季節，慢慢聽完。']
 },
 /* 燼角巨獸：去背後的動態立繪。資料來自設定稿。 */
 pyro:{name:'燼角巨獸',type:'other',species:'Pyro-Cerasaurus',zone:'crystal',spot:{x:81,y:82},spriteH:28,ar:'498/280',color:'radial-gradient(circle,#ffd7a8,#7a2a14)',
  image:'assets/pyro.webp',still:'assets/pyro-still.webp',studies:['assets/pyro-s1.webp','assets/pyro-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'活火山帶・地殼裂隙頻繁的荒漠高原・熔岩峽谷',
  intro:'在赤紅天空下登車的燼角巨獸。漆黑的火山岩外皮佈滿裂縫，熔岩光在裂隙間流動；頭上的巨角像燃燒的木炭，仍散發著高溫。',
  bio:'在烈日與火山灰交織的荒原深處，燼角巨獸是當之無愧的霸主。當地人常說，當遠方的大地開始震動、天空被染成赤紅時，便是這位熔岩暴君在巡視牠的疆域。牠沉重的腳步每踏出一步，都會在地表留下冒煙的焦痕。獵人們對牠敬而遠之，因為任何貪婪的靠近，都將伴隨著被灰燼吞噬的命運。',
  field:{alias:'熔岩暴君、大地之傷',cls:'遠古巨獸／元素類巨獸',danger:'極高',rarity:'稀有',
   looks:'擁有如火山岩般堅硬、漆黑且佈滿裂縫的厚重外皮，裂隙間常年流淌著熾熱的熔岩光輝。<br>頭部前端長有一支巨大的角，其質地如同正在燃燒的木炭，頂端散發出猛烈的高溫與微光。<br>背部與尾巴覆蓋著一排銳利的鋸齒狀骨甲，兩側則生有巨大的蝙蝠狀皮革雙翼，翼膜邊緣殘破且帶有燃燒的痕跡。<br>雙眼呈赤紅色，猶如燃燒的火球，散發出威嚴而暴戾的氣息。',
   habitat:'活躍於活火山帶、地殼裂隙頻繁的荒漠高原，以及被熔岩流覆蓋的乾涸峽谷。',
   habits:[['活動時間','日夜皆可活動，但在地表溫度較高的午後顯得特別活躍。'],['飲食','肉食性，主要獵食大型地下岩棲生物，同時亦會吞食富含礦物質的高溫熔岩與金屬礦石以補充能量。'],['性格','極度孤僻且具強烈的領地意識，脾氣暴躁，對於闖入其領地的生物會毫不留情地發動毀滅性攻擊。']],
   abilities:[['熔岩核心','能夠將體內的熱能高度集中於頭部的巨角與背部裂隙中，進行蓄力衝撞或釋放高溫熱浪。'],['重甲護體','堅硬的岩質皮膚能免疫大部分物理攻擊與烈焰灼燒。']]},
  stay:2,
  talks:[
   {lines:['（棲息車廂的溫度一下子升高了。晶石平台前，一頭漆黑的巨獸低伏著，裂隙間的熔岩光一明一暗。）','……退後。','這不是你的地盤，也不是我的。在弄清楚之前，不要靠近。'],choices:[{t:'（停在原地）我不會靠近。',r:'……嗯。至少你聽得懂。'},{t:'這裡是列車，不屬於任何人。',r:'不屬於任何人的地方……我沒待過那種地方。'}]},
   {lines:['（牠的巨角頂端還在發燙，但背上的熔岩光暗了一些。）','我身體裡有熔岩。熱可以集中在角上，撞開任何擋路的東西。','這輛車在搖。很穩地搖。','在火山那裡，大地搖起來的時候，是在發怒。這裡不是。'],choices:[{t:'你可以在這裡休息。',r:'休息。……我很久沒有用過這個詞。'},{t:'晶石平台的光，夠你補充能量嗎？',r:'不夠熱。不過……不難受。'}]},
   {lines:['人們叫我「大地之傷」。','他們說我走過的地方，都會留下焦痕。那是真的。','但這輛車的地板，一道痕跡也沒有。……我走得很小心。'],choices:[{t:'謝謝你這麼小心。',r:'（牠哼出一口帶著火星的熱氣，轉過頭去，像是不想讓你看見牠的表情。）'}]}
  ],
  farewell:['地底的聲音在叫我。很熱，很深。','那裡才是我的地盤。','……這輛車，我記住了。如果哪天大地為你們震動，那不是我在發怒。']
 },
 /* 翡翠晶甲夜行獸：去背後的動態立繪。資料來自設定稿。 */
 vandora:{name:'翡翠晶甲夜行獸',type:'other',species:'Vandora Prism-Anuran',zone:'moss',spot:{x:30,y:57},spriteH:20,ar:'479/280',color:'radial-gradient(circle,#d8ffe9,#1f6a5a)',
  image:'assets/vandora.webp',still:'assets/vandora-still.webp',studies:['assets/vandora-s1.webp','assets/vandora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'熱帶雨林深處・巨型蕨葉之上・幽暗溪流沼澤邊',
  intro:'在夜色裡無聲登車的翡翠晶甲夜行獸。墨藍與深綠的鱗甲泛著寶石般的虹彩，頭側細長的翠綠觸鬚輕輕顫動，金黃色的雙眼在暗處一眨也不眨。',
  bio:'在雨林巨大的姑婆芋葉上，翡翠晶甲夜行獸正低伏著身體，嘴邊細長的觸鬚在微風中輕輕顫動。牠那寶石般閃耀的身軀與周圍的濃密綠意融為一體，是雨林中令人驚艷又敬畏的隱形獵手。',
  field:{alias:'雨林翡翠、苔原幻影',cls:'兩棲獸類／森林變異爬行種',danger:'中',rarity:'少見',
   looks:'外型介於巨貓與神話兩棲類之間，皮膚覆蓋著具有金屬光澤的墨藍與深綠色鱗甲，在光線下會折射出如寶石般的虹彩。頭部兩側長有如空氣鳳梨般細長的翠綠色觸鬚，雙眼呈銳利的金黃色。',
   habitat:'常年潮濕的熱帶雨林深處、巨型蕨類植物的葉片上或幽暗的溪流沼澤邊。',
   habits:[['活動時間','夜行性。'],['性格','性格敏捷、狡黠且具有強烈的領域性。'],['飲食與狩獵','以雨林中的昆蟲、小型爬蟲及樹液為食，擅長利用環境色進行無聲的伏擊。']],
   abilities:[['虹彩折射與觸鬚感應','體表鱗片能隨意折射光線達到光學迷彩的效果；頭部的翠綠觸鬚能極其靈敏地捕捉空氣中微小的濕度與震動變化。']]},
  stay:2,
  talks:[
   {lines:['（自然棲台的苔葉間，有一塊綠色忽然「動」了一下。仔細看，才發現那是一頭低伏的生物，鱗甲的顏色和葉子一模一樣。）','……你看見我了。','很少有東西能先看見我。通常是我先看見它們。'],choices:[{t:'是你的眼睛出賣了你。',r:'（金黃色的眼睛瞇了起來。）……下次我會閉上一隻。'},{t:'我只是剛好往這裡看。',r:'剛好。雨林裡沒有剛好。不過……這裡不是雨林。'}]},
   {lines:['（牠頭側的翠綠觸鬚慢慢舒展開，在空氣裡輕輕擺動，像在聞什麼。）','這裡的空氣太乾了。不過，有水的味道，從那邊的泉水飄過來。','還有震動。很規律、很穩的震動。這輛車一直在跑。'],choices:[{t:'你的觸鬚感覺得到這麼多？',r:'濕度、風、腳步。你走過來的時候，我在你說話之前就知道了。'},{t:'要我把車廂調得濕一點嗎？',r:'……不用。我會待在葉子底下。這樣就夠了。'}]},
   {lines:['（牠的鱗甲在車廂的燈光下泛起一層虹彩，一閃，又和苔綠融在一起。）','雨林的人叫我「苔原幻影」。他們說，看見我的時候，通常已經太晚了。','……我不會在這裡打獵。這裡不是我的領地。我分得清楚。'],choices:[{t:'謝謝你這麼說。',r:'不用謝。我只是不喜歡在別人的地盤上弄髒爪子。（牠的觸鬚輕輕抖了一下，像是在笑。）'}]}
  ],
  farewell:['空氣變濕了。我聞得到樹液和泥土的味道。','天快要黑了。那是我醒來的時間。','我要回葉子上去了。如果哪天你在雨林裡覺得有一片綠色在看你，不用找。那是我在跟你打招呼。']
 },
 /* 霜脊冰原獸：去背後的動態立繪。資料來自設定稿。 */
 frost:{name:'霜脊冰原獸',type:'other',species:'Frost-Ridge Ice-Beast',zone:'crystal',spot:{x:89,y:74},spriteH:22,ar:'570/300',color:'radial-gradient(circle,#f4fbff,#7fb4d8)',
  image:'assets/frost.webp',still:'assets/frost-still.webp',studies:['assets/frost-s1.webp','assets/frost-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'高海拔冰原・極圈冰川裂谷・極寒山脈',
  intro:'在駛向月界的寒氣裡登車的霜脊冰原獸。乳白色的厚重絨毛間，脊背與尾巴上的冰晶硬甲泛著微藍的光暈；一雙冰川般湛藍的眼睛，安靜地打量著車廂。',
  bio:'在極北之境的「萬古冰原」深處，霜脊冰原獸被當地原住民視為冰川之神的守望者。當暴風雪呼嘯而過、天地一片蒼茫之時，獵人往往只能看見一雙在風雪中幽藍髮光的雙眼，以及背脊上如冰刺般掠過的寒芒。牠們輕巧而寂靜地穿梭在數米深的厚雪之上，彷彿與周遭的冰山雪景融為一體，是這片白色禁區中無可動搖的頂級掠食者。',
  field:{alias:'冰原的白色追獵者、凝光雪獅、永凍之魂',cls:'極地巨型獸類／元素獸屬',
   danger:'高',dangerNote:'具備強大的物理破壞力與極度致命的嚴寒氣場',
   rarity:'稀有',rarityNote:'僅在極深處的無人冰原偶爾可見，極難被馴服或捕捉',
   looks:'體格龐大而結實，身形介於大型貓科動物與巨熊之間，覆蓋著一層厚重的乳白色稠密絨毛。其脊椎骨兩側、尾巴以及前肢局部，生長著半透明的冰晶狀硬甲與倒刺，這些冰晶在寒光下會折射出微藍的光暈。牠的頭部具有貓科動物般的輪廓，耳尖帶有銳利的黑色簇毛，雙眼呈現出如深谷冰川般的明亮湛藍色，面部與四肢的細密絨毛間也隱約鑲嵌著天然的晶體結構。',
   habitat:'常年被風雪覆蓋的高海拔冰原、極圈冰川裂谷，以及人跡罕至的極寒山脈。牠們多數時間棲息於避風的冰洞或岩縫中。',
   habits:[['活動時間','日夜皆宜，但在漫長而昏暗的極夜與暴風雪天氣中表現得最為活躍。'],['飲食','肉食性，主要捕獵冰原上的耐寒大型草食獸或冰角鹿。'],['社會結構','多數時間過著獨居生活，僅在嚴冬的繁殖季節短暫聚集。'],['性格與攻擊性','性格沉穩、警惕且極具領地意識。雖然不會無故主動攻擊過路旅人，但若被侵擾或感受到威脅，會展現出極具壓迫性的強大戰意。']],
   abilities:[['冰晶折射與偽裝','能夠將周遭的寒氣凝聚在體表的冰晶上，在暴風雪中形成完美的視覺折射，達到近似隱形的偽裝效果。'],['極寒爪擊','利爪與足底覆蓋著極低溫的寒霜，每一次踏地或揮擊都能瞬間凍結接觸面的水分或獵物的表皮。']]},
  stay:2,
  talks:[
   {lines:['（靈泉邊的空氣忽然冷了下來，水面結出一圈薄薄的霜。一頭乳白色的巨獸站在那裡，背脊上的冰晶泛著微藍的光。）','……你走路的聲音，我在車廂另一頭就聽見了。','不必緊張。我只是在確認，這裡誰是先來的。'],choices:[{t:'我是這列車的值勤精靈。',r:'值勤。……那這裡是你的領地。我會記住界線在哪裡。'},{t:'這裡沒有誰的領地。',r:'冰原上，每一片雪都有主人。沒有主人的地方……我需要一點時間習慣。'}]},
   {lines:['（牠低頭聞了聞靈泉的水，水面立刻凝起細小的冰花，又慢慢化開。）','這裡太暖了。不過，不討厭。','在萬古冰原，連呼吸都會結冰。所以我們很少開口。'],choices:[{t:'那你現在願意說話，我很高興。',r:'……嗯。這裡的空氣不會把話凍住。'},{t:'會不會太熱？',r:'我的爪子底下有霜。站久了，地板會涼一點。……抱歉，這是習慣。'}]},
   {lines:['獵人說，在暴風雪裡只看得見我們的眼睛。','那是因為我們不想被看見。在白色裡，消失是最安全的事。','可是在這輛車上，我好像不必躲。'],choices:[{t:'在這裡，你可以被看見。',r:'（牠背上的冰晶輕輕亮了一下，像是寒夜裡一盞很小的燈。）……那我就站在這裡。'}]}
  ],
  farewell:['風裡有雪的味道了。很遠，但是我認得。','冰原在叫我回去。那裡很冷，很安靜。','如果有一天你在風雪裡看見一雙藍色的眼睛，不用怕。那是我在替你看路。']
 },
 /* 霧羽海葵龍：單張立繪（透明背景），以影像變形做成觸鬚擺動與核心光點呼吸的循環動畫。資料來自設定稿。 */
 sirenora:{name:'霧羽海葵龍',type:'mind',species:'Sirenora',zone:'veil',spot:{x:92,y:40},spriteH:19,ar:'883/328',color:'radial-gradient(circle,#fff6fb,#b9a6d6)',
  image:'assets/sirenora.webp',still:'assets/sirenora-still.webp',studies:['assets/sirenora-s1.webp','assets/sirenora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'濃霧籠罩的無風峽灣・發光苔蘚的地下暗河・迷霧與潮汐的高山海岬',
  intro:'列車穿過濃霧時，悄悄飄進車廂的霧羽海葵龍。如海葵與發光水母交織的扇狀薄翼透著淡紫與乳白的暈光，中心一點柔和的光，像一盞在霧裡指路的燈。',
  bio:'在無盡迷霧籠罩的海岸線與高山交界處，老一輩的航海者總會告誡年輕人：如果在濃霧中看見一抹溫柔的粉白光暈，切記不要追逐，只需靜靜駐足。那是「霧羽海葵龍」在收集世人遺忘的夢境。牠們由那些未能歸家之人的思念所化，如同一盞孤燈，在潮汐與霧氣間無聲擺盪。當牠們舒展那如海葵般透明的羽翼時，整個峽灣的風都會安靜下來，彷彿連時間也在那柔和的光芒中暫停了腳步。',
  field:{alias:'幻海的悼亡者、深淵浮影、晨曦微光獸',
   cls:'意念生命（由群體意念形成的存在 —— 來自失落航海者對故鄉與歸宿的強烈思念、以及對無垠迷霧的敬畏所凝聚而成的意識體）。',
   danger:'低',dangerNote:'幾乎不具傷害性，甚至能安撫人心',
   rarity:'稀有',rarityNote:'僅在特定的濃霧季節與人跡罕至的潮汐峽灣中方得一見',
   looks:'<b>身體構造：</b>擁有流暢而修長的流線型軀體，覆蓋著如珍珠般溫潤的半透明鱗片，尾端延伸出如海草般優雅的靈動尾鰭。背部與頭部交界處綻放著一對巨大、如深海海葵與發光水母交織而成的扇狀薄翼，邊緣透著夢幻的淡紫與乳白色暈光。<br><b>顏色：</b>主體為銀白與珍珠灰，點綴著幽藍與淡粉的生物螢光脈絡；頭頂與觸鬚則帶著半透明的珍珠光澤，能在黑暗中散發指引方向的微光。<br><b>辨識特徵：</b>頭部沒有傳統的獸類雙耳，取而代之的是如珊瑚枝椏般向外延伸的感知觸鬚，能直接捕捉周遭生物的情緒波動與氣壓變化。',
   habitat:'終年被濃霧籠罩的無風峽灣、漂浮著發光苔蘚的地下暗河，或是交織著迷霧與潮汐的高山海岬。牠們不需要實質的物質庇護所，通常隨著微弱的氣流與潮汐磁場緩慢飄浮。',
   habits:[['活動時間','多數時間處於半夢半醒的漂浮狀態，但在晨昏交替或迷霧最濃郁的時刻最為活躍。'],['飲食','不需進食實體食物。牠們以空氣中流動的純粹情緒、夢境殘留的記憶碎片，以及微弱的乙太能量維生。'],['社會性','多數為獨居，但在氣候劇變或特定節令時，會成群在迷霧中交錯起舞，形成如夢似幻的「光之迴游」。'],['性格與攻擊性','性格溫和、羞怯而敏感。天生不具備實體攻擊性，當感受到威脅時，會釋放安撫心神的微光與低頻共鳴，使闖入者陷入平靜的睏意中，隨後悄然遁入霧氣。']],
   abilities:[['迷霧幻象（Mist Mimicry）','能夠將自身的生物螢光與周遭的霧氣融合，製造出海市蜃樓般的視覺干擾，使獵食者或不速之客在迷霧中迷失方向。'],['共鳴安撫（Aura Soothing）','透過背部如海葵般的巨大扇翼拍動，散發出能夠平息焦慮、撫平精神創傷的微弱電磁波與柔和光暈。']]},
  stay:2,
  talks:[
   {lines:['（車廂上方飄著一團柔和的粉白光暈。你一抬頭，那光就往後縮了一點，觸鬚輕輕顫著。）','……不要追。','我住在霧裡。沒有風的峽灣，霧很濃，濃到連潮聲都會變輕。','我只是……被這輛車的燈吸引過來的。它亮得很像港口。'],choices:[{t:'（停在原地，靜靜看著）',r:'……謝謝。你站著不動的樣子，和老航海者教的一樣。'},{t:'你是從霧裡來的嗎？',r:'我就是霧的一部分。很多人在霧裡想家，想著想著，就有了我。'}]},
   {lines:['（牠慢慢舒展扇狀的薄翼。光暈一亮一暗，車廂裡的空氣好像安靜了下來。）','你身上有一點點想念的味道。很淡，但是我聞得到。','別擔心。我不會拿走它。我只收集被遺忘的夢。'],choices:[{t:'被遺忘的夢，會去哪裡？',r:'會留在我的光裡。等到有一天，有人在霧中停下腳步，我就把它還給那片海。'},{t:'我在想念什麼呢？',r:'……這個，要你自己想起來才算數。我只能告訴你，那是溫暖的東西。'}]},
   {lines:['那些沒能回家的人，最後都只剩下一句話：「我想回去。」','我是由很多很多這句話組成的。','可是在這輛會自己前進的列車上……我第一次覺得，自己好像也在回家的路上。'],choices:[{t:'那就在這裡多待一會兒吧。',r:'（牠中心的光柔柔地亮了一下，整節車廂的風都停了，像時間也一起歇了一口氣。）'}]}
  ],
  farewell:['霧變濃了。我聽見峽灣在叫我。','那裡有很多還沒被收好的夢，在潮汐裡擺盪。','謝謝你讓我停在這盞燈下。如果你在霧裡看見一抹粉白的光，不要追……只要停下來就好。']
 },
 titan:{name:'苔淵巨靈',type:'other',species:'Mossbound Titan',zone:'moss',spot:{x:22,y:49},spriteH:34,ar:'340/300',color:'radial-gradient(circle,#e3f0c8,#5d7a45)',
  image:'assets/titan.webp',still:'assets/titan-still.webp',studies:['assets/titan-s1.webp','assets/titan-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'深邃而古老的原始紅木森林・霧氣瀰漫的溫帶雨林深處',
  intro:'列車停靠時，森林邊緣一座長滿苔蘚的小山，緩緩動了起來。牠的肩上長著蕨類，鬍鬚像垂下的枯木鬚根，每一次沉重的呼吸，都帶起一陣帶有草木清香的晨霧。',
  bio:'在古老林海的深處，苔淵巨靈如同一座移動的小山般緩步前行。牠每一次沉重的呼吸，都會帶起陣陣帶有草木清香的晨霧。森林裡的精靈與走獸從不畏懼牠的存在，反而視牠為行走的庇護所——因為在巨靈經過的足跡上，總會滋養出最豐饒的生命與最清澈的泉水。',
  field:{alias:'行走的森林、大地之錨、沉睡古民',
   cls:'遠古巨獸 / 森林巨人類',
   danger:'中',
   rarity:'稀有',
   looks:'擁有如千年古樹般粗壯厚重的軀體，皮膚表面佈滿粗糙的樹皮紋理與深綠色的厚重苔蘚。雙肩與背脊上常年覆蓋著蕨類植物與微型地被灌木。頭部輪廓深邃，面容宛如風化嚴重的岩石，垂下如枯木鬚根般的長鬍鬚，雙手巨大而有力。',
   habitat:'深邃而古老的原始紅木森林、霧氣瀰漫的溫帶雨林深處。',
   habits:[['活動時間','極度緩慢，通常以數十年甚至數百年為一個行動與沉睡的週期。'],['飲食','以吸收土壤養分、地脈靈氣以及雨水為主，偶爾攝取少量的礦物質。'],['性格與群居','個性溫和、孤獨且極度沉穩，通常獨來獨往。對外界事物不理不睬，除非棲息地遭受嚴重破壞，否則不會主動展現攻擊性。']],
   abilities:[['自然偽裝','具備完美的自然偽裝能力，靜止時與周遭環境無異'],['承載生態','其龐大的身軀能承載並調節一片微型生態系，行走時震動地面能促進周遭植物的生長與地脈循環。']]},
  stay:2,
  talks:[
   {lines:['（自然棲台的角落，多了一座長滿苔蘚的小山。你走近了，才發現那座山有一張像岩石一樣的臉。）','……嗯。','……我……睡著了，一下子。','一下子……是從你出生之前，到剛剛。','我住的地方……樹很老，很高。紅木森林的深處，霧不會散。'],choices:[{t:'你睡了多久？',r:'……很久嗎？對我來說，只是翻了一個身。'},{t:'（安靜地等牠說下去）',r:'……你很有耐心。森林裡的小東西，也是這樣等我的。'}]},
   {lines:['（牠肩上的蕨葉輕輕晃了一下。過了很久，你才發現那是牠在呼吸。）','……我不吃東西。根……會替我吃。土裡的養分、地脈的氣、雨水。','偶爾……舔一點石頭。這輛車的石頭……有一點星星的味道。','你剛才站在我旁邊，沒有發現我吧。……我不動的時候，就只是一座長苔蘚的小山。'],choices:[{t:'真的完全沒發現。',r:'……嗯。森林裡的鳥，常常在我的頭上築巢。牠們也沒發現。'},{t:'舔石頭？',r:'……很好吃。礦物……是森林裡，最慢的點心。'}]},
   {lines:['（牠慢慢抬起一隻巨大的手，又慢慢放下。地板輕輕震了一下——苔蘚棲台上，幾株小芽一起冒了出來。）','……我走過的地方，草會長，泉水會變清。','所以森林裡的精靈和走獸……都跟在我後面走。','牠們把我當成……一座會走路的庇護所。我很少說話。可是，我喜歡牠們跟著。'],choices:[{t:'這輛車也跟著你一起長出了新芽。',r:'（牠臉上的岩石紋路，好像鬆開了一點。那也許是一個笑。）……那這輛車，也是我的森林了。'}]}
  ],
  farewell:['……地脈在叫我。很慢，很遠。','我該回去，繼續睡了。下一次醒來……也許是一百年以後。','你那時候不在了也沒關係。我走過的地方，會長出新的森林。……那裡面，會有你的味道。']
 },
 lynx:{name:'霜晶冰原獸',type:'other',species:'Frost-Crested Glimmer-Lynx',zone:'rings',spot:{x:58,y:24},spriteH:17,ar:'510/300',color:'radial-gradient(circle,#f6fbff,#9cc6e6)',
  image:'assets/lynx.webp',still:'assets/lynx-still.webp',studies:['assets/lynx-s1.webp','assets/lynx-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'終年積雪的高山雪嶺・極地冰原・寒冷的魔法冰川地帶',
  intro:'列車穿過結冰的航道時，沿著結霜的車窗疾走而過的銀白影子。牠走過的地方沒有一點聲音，只留下一串細小的晶塵。',
  bio:'在冰封的極北之境，霜晶冰原獸被當地巡山人視為冰雪的化身與冬之精靈。傳說牠們的每一次躍動都能激起微小的晶塵，而牠們守護著古老的冰川祕境，唯有心地純淨的旅人能在風雪中偶遇其優雅如幻影的身影。',
  field:{alias:'冰脊靈貓、冬影',
   cls:'極地奇幻獸類',
   danger:'中',
   rarity:'稀有',
   looks:'<b>頭部與面容：</b>擁有類似大型貓科（如山貓）的輪廓，雙耳尖端帶有深色簇毛，雙眼透出晶瑩的冰藍色光芒，面部線條銳利而優雅。<br><b>毛髮與冰晶：</b>全身覆蓋著密集的銀白與淡灰相間絨毛，背部脊椎線條、尾巴以及四肢上生長著晶瑩剔透的冰晶或水晶狀背棘，在光線下折射出冰藍色澤。<br><b>軀幹與四肢：</b>體態矯健有力，四肢肌肉線條流暢，爪子銳利，正處於動態奔馳或跳躍的張力姿勢中。',
   habitat:'終年積雪的高山雪嶺、極地冰原或寒冷的魔法冰川地帶。',
   habits:[['活動時間','晨昏與夜間活動為主，適應極度嚴寒的氣候。'],['飲食','以捕獵極地小型魔獸、食用高山冰晶植物的根莖為生。'],['社交','多數時間獨來獨往，性格孤傲敏捷，警覺性極高，對陌生領域有強烈的領地意識。']],
   abilities:[['寒冰折射','能透過背部的冰晶吸收並折射月光或日光，在危急時製造短暫的眩光以隱蔽身形。'],['踏雪無痕','移動時幾乎不發出聲響，且能短暫在雪面或垂直冰壁上高速疾走。']]},
  stay:2,
  talks:[
   {lines:['（懸浮棲息環的陰影裡，一雙冰藍色的眼睛盯著你。你往前一步，牠背上的冰晶就豎了起來。）','……別再靠近了。這一段圓環，是我的。','我來的地方，雪從來不化。高山雪嶺，再往北，就是冰原。','那裡沒有人。……沒有人，才好。'],choices:[{t:'（退後一步，表示沒有惡意）',r:'……哼。至少你懂規矩。'},{t:'你是從冰原來的嗎？',r:'冰原的邊上。冰原本身……太大了，誰也佔不完。'}]},

 return [
  ['序・日與月',`<h5>${GLYPH.sun}日界</h5><p>日界是現實世界，唯一包含地球。地球遵循一般的物理規則與時間流動，人類文明存在於此。地球上仍有人類無法觀測的生命、古老遺跡與特殊能量。</p>
   <h5>${GLYPH.moon}月界</h5><p>月界不是一顆星球，而是所有非地球領域的統稱：宇宙與星系、平行宇宙、異世界、五維與高維空間、虛無空間、時空裂隙，以及不受一般時空規則限制的未知領域。</p>
   <p>每個空間都可以有自己的物理規則與生命型態。它們不一定彼此相連，也無法畫在同一張地圖上。</p><p class="aside">日界與月界並非善惡對立，只是不同的領域體系。</p>`],
  ['起源・第一道晨曦',`<p>最初什麼都沒有，只有一片沒有形狀、也沒有時間的「渾沌之海」。</p><p>某一刻，第一道晨曦落進了海裡。光落下的地方，時間開始流動，萬物有了先後——那裡成為日界，也就是地球。</p>
   <p>光的周圍，留下了無數的倒影。每一道倒影都用自己的方式理解「光」：有的讓重力朝上，有的讓時間倒流，有的乾脆沒有形狀。這些倒影各自成為一個領域，合稱月界。</p>
   <p class="aside">古老的說法：日界是光，月界是光的千萬種倒影。沒有光，就沒有倒影；沒有倒影，光也無從被看見。</p>`],
  ['界壁・渡口・星河',`<h5>${GLYPH.ring}界壁</h5><p>每個領域都被一層看不見的薄膜包著，叫作界壁。界壁守住每個世界自己的規則；穿越它的生命，身上會沾上另一個世界的規則——這就是「界染」。積得太深，生命會被那個世界的規則慢慢改寫。</p>
   ${sec(true,`${GLYPH.ring}渡口`,'<p>界壁並不是到處一樣厚。少數變薄的地方叫作渡口，列車只能在渡口停靠。建造列車的人在每個渡口都留下了圓環印記——晨曦森林古樹上的圓環，就是其中之一。</p>','（找到古樹上的圓環之後，這一段才會顯現。）')}
   ${sec(true,`${GLYPH.moon}界壁的呼吸`,'<p>界壁不是靜止的。它會像呼吸一樣一明一暗，變薄的那一瞬間，渡口就打開了。界壁極光，是人們唯一能用眼睛看見的呼吸。</p>','（觀賞過界壁極光之後，這一段才會顯現。）')}
   <h5>${GLYPH.leaf}星河</h5><p>在月界的領域之間，流著一條由光組成的長河。它是所有倒影彼此相連的地方，也是列車航道最早的樣子。星河有潮汐，潮水會把流落的東西帶往新的地方。</p>`],
  ['渡守',`${sec(any('clue_ring','clue_lumi_tale','clue_ferrykeepers'),`${GLYPH.ring}建造列車的人`,'<p>建造列車的古代守護者，自稱「渡守」。他們不屬於日界，也不屬於月界——據說他們誕生在界壁上，是光與倒影交界處長出來的生命。</p>','（讀到更多關於古代守護者的線索後，這一段才會顯現。）')}
   ${sec(any('clue_sola_legend','clue_ash','clue_ferrykeepers'),`${GLYPH.leaf}熄滅之前`,'<p>每一個世界都會走到盡頭，這不是誰的錯。但在熄滅之前，總有來不及離開的生命、還沒說完的故事，和一顆還想發芽的種子。渡守會在那之前趕到，列車就是為了把它們帶走而造的。</p>','（墨跡模糊。只看得出「熄滅」兩個字。）')}
   ${sec(has('clue_dimming'),`${GLYPH.moon}大熄滅`,'<p>很久以前，無數領域在同一個紀元裡相繼熄滅，留下的空白連成一片，成為寂滅虛空。渡守把剩下的力量都用來穩住界壁，讓空白不再擴大。列車在那之後，停在了沉睡之地。</p>','（墨跡模糊。這一頁似乎記著一場很大的災難。）')}
   ${sec(has('clue_wake2'),`${GLYPH.sun}時間的另一端`,'<p>渡守最後去了哪裡，沒有任何紀錄。古樹說他們離開時「看起來不難過」；星空裡留著一座古列車座；存檔水晶裡的訊息還有後半句——他們也許沒有消失，只是去了時間的另一端，在那裡等著。</p>','（最後一段的墨跡還沒有顯現。）')}`],
  ['曦淵與值勤精靈',`${sec(any('clue_dragon'),`${GLYPH.sun}曦淵`,'<p>「曦」是晨光，「淵」是深淵。蒼龍一半出生在日界的黎明，一半出生在月界最深的黑暗。牠是第一個登上列車的生命；渡守離開後，牠獨自守著沉睡的列車。</p>','（航行時多和領頭聊聊，這一段才會顯現。）')}
   ${sec(any('clue_dragon'),`${GLYPH.ring}值勤精靈`,'<p>你醒來的那一刻，有一點光落在你身上。那是渡守離開前，留在列車裡的最後一道晨曦。所以你不知道自己從哪裡來——你是從列車自己的光裡醒來的。</p>','（墨跡模糊。這一頁好像在寫你自己。）')}

function freshState(){ return {
 v:1, introDone:false, journeyCount:0, currentLocation:'origin', currentCarriage:'observation', currentPhase:'docked',
 duty:dutyFresh(), spirit:{contamination:null,contaminationLog:[],taint:6,pur:null,equipment:{tablet:false,compass:false,talisman:false}}, voyage:null,
 passengers:{}, completedEvents:[], pendingEvents:[], unlockedLocations:['dawnForest','starIslands'], visitedLocations:[],
 view:{}, seen:{}, discoveredLifeforms:[], collectibles:['seed_ancient_a','seed_ancient_b','seed_ancient_c'], clues:[], storyFlags:{natureLight:'dawn'},
 culture:null, log:[{j:0,t:'列車在沉睡之地甦醒。精靈接下了列車的值勤職責。'}]
};}
let state = load() || freshState();
function load(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return s&&s.v===1? Object.assign(freshState(),s):null; }catch(e){ return null; } }
function save(){ try{ state.savedAt=Date.now(); localStorage.setItem(SAVE_KEY,JSON.stringify(state)); }catch(e){} }

const aboard = id => !!(state.passengers[id]&&state.passengers[id].aboard);
const done = id => state.completedEvents.includes(id);



/* ================================================================

const TIP_KEY='riyue-tips-v1';
const tipsDone=()=>{ try{ return JSON.parse(localStorage.getItem(TIP_KEY)||'[]'); }catch(e){ return []; } };
const tipDone=k=>tipsDone().includes(k);
function tipMark(k){ const a=tipsDone(); if(a.includes(k)) return; a.push(k); try{ localStorage.setItem(TIP_KEY,JSON.stringify(a)); }catch(e){} }
/* 提示只留在火車頭（值勤準備）；其他車廂不再跳提示 */
function tipOnce(k,text){ if(k!=='t_duty'||tipDone(k)) return; tipMark(k); toast(text); }

 for(const T of TIPS){ if(done.includes(T.k)) continue; let ok=false; try{ ok=T.when(); }catch(e){} if(!ok) continue; const h=list.find(T.m); if(h){ TIPCUR={k:T.k,id:h.id,t:T.t}; return; } } }

const BL={ push(w,t){ if(!RUNNING) return; const x=String(t||'').replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').trim(); if(!x||x==='__self__') return;
  const a=state.backlog=state.backlog||[]; const last=a[a.length-1]; if(last&&last.w===w&&last.t===x) return; const now=Date.now(); if(!last||!this.at||now-this.at>6000) this.g=now; this.at=now;
  a.push({w,t:x,g:this.g,j:state.journeyCount,l:state.currentLocation}); if(a.length>160) a.splice(0,a.length-160); } };
/* 把最近聽見的話，依一段一段的對話分成水晶 */
function heardGroups(){ const a=state.backlog||[], G=[]; let cur=null; a.forEach((x,i)=>{ const g=x.g||('o'+Math.floor(i/6)); if(!cur||cur.g!==g){ cur={g,lines:[],j:x.j,l:x.l}; G.push(cur); } cur.lines.push(x); }); return G.slice(-24); }

 const ov=panel(`<button class="close" aria-label="關閉">✕</button><div class="eyebrow">回憶水晶</div><h2>最近聽見的話</h2>${a.length?`<ol class="bl-list">${a.map(x=>`<li>${x.w?`<b>${esc(x.w)}</b>`:''}<span>${esc(x.t)}</span></li>`).join('')}</ol>`:'<p class="nb-empty">還沒有聽見什麼。</p>'}`,'backlog');
 const l=ov.querySelector('.bl-list'); if(l) setTimeout(()=>{ l.scrollTop=l.scrollHeight; },30); return ov; }

   return `<g class="od-curtain"><path d="${side(x0,1)}" fill="url(#odC)"/><path d="${side(x1,-1)}" fill="url(#odC)"/>

 const F=back?[[30,440,110,700],[1560,1975,110,700]]:[[118,308,160,625],[352,548,286,626],[1468,1640,150,622],[1700,1892,150,622]];
 const door=back?[820,1180,240,905]:[903,1118,372,775];

 const leaf=(x,d)=>{ const a=x, b=x+dw*.42*d, top=dy0+dw*.55; return `<path d="M${a} ${dy1} L${a} ${top} Q${a} ${dy0+dw*.1} ${(a+b)/2} ${dy0+dw*.02} L${b} ${dy0+dw*.25} L${b} ${dy1-6} Z" fill="rgba(210,225,255,.16)" stroke="#e8c983" stroke-width="4" opacity=".95"/>
   <path d="M${(a*.75+b*.25).toFixed(0)} ${top+20} L${(a*.75+b*.25).toFixed(0)} ${dy1-30} M${(a*.25+b*.75).toFixed(0)} ${top+30} L${(a*.25+b*.75).toFixed(0)} ${dy1-30}" stroke="#e8c983" stroke-width="2" opacity=".55"/>
   <circle cx="${(b-6*d).toFixed(0)}" cy="${((dy0+dy1)/2+30).toFixed(0)}" r="6" fill="#ffe9a8"/>`; };
 const [rx,ry,rr,rh]=rug;
 return `<svg class="obs-decor" viewBox="0 0 2000 1126" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>

  <linearGradient id="odS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0820" stop-opacity=".45"/><stop offset=".3" stop-color="#0a0820" stop-opacity="0"/><stop offset=".85" stop-color="#0a0820" stop-opacity="0"/><stop offset="1" stop-color="#0a0820" stop-opacity=".35"/></linearGradient>
  <radialGradient id="odR"><stop offset="0" stop-color="#3b2d78"/><stop offset=".72" stop-color="#2a2060"/><stop offset=".8" stop-color="#c8a85e"/><stop offset=".84" stop-color="#4a3684"/><stop offset=".95" stop-color="#5b45a6"/><stop offset="1" stop-color="#c8a85e"/></radialGradient></defs>
  <ellipse cx="${rx}" cy="${ry+18}" rx="${rr+20}" ry="${rh+14}" fill="#05040f" opacity=".35"/>

  ${[0,1,2,3,4,5,6,7].map(i=>{ const a=i/8*Math.PI*2, x=rx+Math.cos(a)*rr*.7, y=ry+Math.sin(a)*rh*.7; return `<path d="M${x.toFixed(0)} ${(y-8).toFixed(0)} L${(x+4).toFixed(0)} ${y.toFixed(0)} L${x.toFixed(0)} ${(y+8).toFixed(0)} L${(x-4).toFixed(0)} ${y.toFixed(0)}Z" fill="#ffe9a8" opacity=".8"/>`; }).join('')}
  <path d="M${rx-14} ${ry} L${rx} ${ry-10} L${rx+14} ${ry} L${rx} ${ry+10}Z" fill="#ffe9a8"/>
  <g class="od-door">${leaf(dx0+4,1)}${leaf(dx1-4,-1)}</g>
  ${F.map(f=>drape(...f)).join('')}</svg>`; }
function renderOutside(){ const L=LOCATIONS[state.currentLocation]; return svgScene(L.art())+dust(20)+'<div class="vignette"></div>'+hsRender('out:'+state.currentLocation); }

function renderHUD(){

 const cars=TRAIN.map(c=>`<span class="car ${c==='cab'?'loco':''} ${c==='observatory'?'tail':''} ${c===state.currentCarriage&&ph!=='outside'?'on':''}" title="${CARRIAGES[c].name}"></span>`).join('');
 const head = ph==='voyage'&&v ? `<div class="realm">自動航行中</div><div class="name">前往 ${LOCATIONS[v.to].name}</div><div class="meta"><span class="vbar"><i id="vprog" style="width:${(v.progress*100).toFixed(1)}%"></i></span>旅程 <b>${state.journeyCount}</b></div>`

 return v<15?'身體很輕。羽翼的粉色很亮，鱗片在光下一閃一閃。':v<35?'有一點點沉重。羽尖的粉色，好像淡了一些。':v<60?'身上很沉重，鱗片的光澤暗了下來。該去淨界晶環淨化了。':'好重……羽翼幾乎張不開。請盡快到淨界晶環淨化。'; }

 const ov=panel(`<div class="mirror"><div class="mir-glass"><img class="me-fig meimg" src="${ME_IMG}" alt="映在鏡中的你" title="點一下，伸展羽翼"><i class="mir-ring"></i><i class="mir-ring r2"></i><i class="mir-shine"></i></div></div>

 ov.querySelectorAll('[data-mir]').forEach(b=>b.onclick=()=>{ const k=b.dataset.mir; state.mirrorAt=k; save(); SFX.glass(); closeOv(ov);
  toast(k==='carry'?'映心鏡收進懷裡了・右上角可以隨時照':`映心鏡掛在${CARRIAGES[k].name}了`); render(); });

/* ---------- 互動派發 ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const [k,v]=b.dataset.act.split(':'); act(k,v); });
function act(k,v){
 switch(k){
  case 'go': return moveTo(v);
  case 'turn': return turnView();
  case 'exit': if(state.currentPhase!=='docked') return toast('航行中無法離開列車');
   if(state.currentLocation==='origin') return toast('列車停泊在沉睡之地，這裡無法下車');
   return exitChooser(()=>transition(()=>{ state.currentPhase='outside'; if(TAINT.once('out')) TAINT.add(TAINT_GAIN[realmKey(state.currentLocation)].out); logOnce('outside_'+state.currentLocation+'_'+state.journeyCount,'走出列車，踏上'+LOCATIONS[state.currentLocation].name+'。'); },null,true));
  case 'back': return transition(()=>{ state.currentPhase='docked'; state.currentCarriage='habitat'; state.companion=null; },null,true);
  case 'talk': return talk(v);
  case 'event': { const ev=EVENTS[v]; if(ev&&!done(v)){ complete(v); ev.run(); renderHUD(); } return; }
  case 'reunion': return reunion(v);
  case 'zone': return zoneInfo(v);
  case 'notes': return notebookPanel();
  case 'mirror': return spiritPanel();
  case 'sketch': return sketchPicker();
  case 'care': return carePicker();
  case 'me': return spiritPanel();
  case 'sound': PREFS.sound=PREFS.sound===false; savePrefs(); if(PREFS.sound===false){ SFX.stopDrone(); SFX.ambient(null); BGM.stop(500); } else { SFX.init(); if(state.currentPhase==='voyage') SFX.startDrone(); SFX.ambKey=null; SFX.ambient(HS_SCENE()); BGM.start(); } renderHUD(); return toast(PREFS.sound===false?'音樂與音效已關閉':'音樂與音效已開啟');
  default: return (INTERACT[k+':'+v]||(()=>{}))();
 }
}
function logOnce(key,t){ if(!state.storyFlags[key]){ state.storyFlags[key]=1; logJ(t); } }

const CAR_INTRO={
 memory:[['self','這裡是記憶典藏車廂。'],['self','列車走過的地方、遇見的生命，都會變成書和水晶，收在這裡。'],['self','想整理旅程、存檔，或是照照映心鏡的時候，就來這裡吧。']],
 nature:[['self','森羅溫室車廂……到處都是植物的味道。'],['self','種子收在典藏櫃，培育艙可以把它們種出來。'],['self','角落那株守望藤好像會說話。累了的時候，可以來這裡休息。']],
 habitat:[['self','棲息車廂。上車的生命們，都住在這裡。'],['self','每一區的溫度、光線、濕度都可以調。牠們住得舒服，才會願意說說話。']],
 observation:[['self','星月觀測車廂。從這裡，可以看見整片天空。'],['self','導航裝置決定下一站；觀測儀看得見遠方的影子；星座盤，可以把星星連起來。']],
 observatory:[['self','火車尾的展望台。風好大。'],['self','航行的時候，天上偶爾會出現星象。到時候，可以邀乘客一起來看。']]

function checkCarriageEvents(){
 { const c=state.currentCarriage; if(state.introDone&&CAR_INTRO[c]&&state.currentPhase!=='outside'&&!(state.carSeen||[]).includes(c)&&!document.querySelector('#layer .cine,#layer .dlg,#layer .board')){
  state.carSeen=(state.carSeen||[]).concat(c); save(); setTimeout(()=>{ if(state.currentCarriage===c&&!document.querySelector('#layer .cine,#layer .dlg')) dialogueScript(CAR_INTRO[c],()=>checkCarriageEvents()); },600); return; } }
 if(state.currentCarriage==='habitat'&&(state.boardQ||[]).length&&!document.querySelector('#layer .cine,#layer .board,#layer .dlg')) return runBoardQ();
 Object.entries(EVENTS).forEach(([id,ev])=>{ if(ev.trigger==='carriage'&&(ev.who?hereWith(ev.who):ev.car===state.currentCarriage)&&!done(id)&&!state.pendingEvents.includes(id)&&ev.need()){ state.pendingEvents.push(id); toast('新的事件：'+ev.title); } });
 state.pendingEvents=state.pendingEvents.filter(id=>!EVENTS[id]||!EVENTS[id].who||hereWith(EVENTS[id].who));
 renderHUD(); save();
}
/* 停靠時有乘客上車：玩家不在棲息車廂就先提示，到了棲息車廂才播放上車劇情 */
function runBoardQ(){ const q=(state.boardQ||[]).slice(); state.boardQ=[]; save();
 const run=()=>{ const id=q.shift(); if(!id) { render(); return checkCarriageEvents(); } const e=EVENTS[id]; if(!e||done(id)) return run(); e.run(run); }; setTimeout(run,1200); }

  this.parts=[]; for(let i=0;i<150;i++) this.parts.push(this.spawn(true)); this.cl=[0,1,2,3,4].map(()=>this.cloud(true)); if(!this.raf) this.raf=requestAnimationFrame(()=>this.tick()); },

/* 縮圖：把目前畫面的各圖層（環景 WebGL、SVG 場景、圖片、星光畫布）合成到 Canvas */
async function captureThumb(){
 const W=320,H=180, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d'); g.fillStyle='#0b0d22'; g.fillRect(0,0,W,H);

 const layers=[...document.querySelectorAll('#scene canvas, #scene svg.bg, #scene img.bg, #scene img.pano-img')];
 for(const el of layers){ try{
  if(el.classList.contains('pano-img')){ const k=PANO.k||1, sx=panoOff()/k, sy=(PANO.oy||0)/k, sw=PANO.w/k, sh=PANO.h/k, nw=el.naturalWidth||sw;
   if(sx+sw<=nw) g.drawImage(el,sx,sy,sw,sh,0,0,W,H); else { const a=nw-sx; g.drawImage(el,sx,sy,a,sh,0,0,W*a/sw,H); g.drawImage(el,0,sy,sw-a,sh,W*a/sw,0,W*(sw-a)/sw,H); } }
  else if(el.tagName==='CANVAS'){ cover(el,el.width,el.height); }
  else if(el.tagName==='IMG'){ if(!el.complete) await new Promise(r=>{ el.addEventListener('load',r,{once:true}); el.addEventListener('error',r,{once:true}); }); cover(el,el.naturalWidth,el.naturalHeight); }
  else { const c=el.cloneNode(true); c.setAttribute('width','1600'); c.setAttribute('height','900');
   const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c)); await img.decode(); g.drawImage(img,0,0,W,H); }

}

/* 這一站有誰上車：誰、幾位都是隨機的（第一次停靠一定會遇到一位）；來自這個界域的生命比較容易出現 */
function rollBoarders(){ if(state.currentLocation==='origin') return [];
 const waiting=state.boardQ||[], pool=Object.keys(PASSENGERS).filter(id=>EVENTS['board_'+id]&&!done('board_'+id)&&!state.discoveredLifeforms.includes(id)&&!waiting.includes('board_'+id));
 const room=6-Object.keys(PASSENGERS).filter(aboard).length-waiting.length; if(!pool.length||room<=0) return [];
 const seen=state.scopeSeen||[];
 const lure=!!state.storyFlags.lightLure, r=Math.random(), n=Math.min(room,Math.max(voyBless()==='jelly'||(lure&&Math.random()<.6)?1:0,state.visitedLocations.length<=1&&!state.discoveredLifeforms.length?1:r<.3?0:r<.8?1:2)), out=[];
 for(let k=0;k<n&&pool.length;k++){ const w=pool.map(id=>(PASSENGERS[id].home===state.currentLocation?3:1)*(seen.includes(id)?4:1)*(lure&&PASSENGERS[id].type==='lost'?5:1)), tot=w.reduce((a,b)=>a+b,0); let x=Math.random()*tot, at=0;
  while(x>w[at]){ x-=w[at]; at++; } out.push('board_'+pool.splice(Math.min(at,pool.length-1),1)[0]); }

function arrivalChecks(){

 Object.keys(PASSENGERS).forEach(id=>{ const s=state.passengers[id]; if(s&&s.aboard&&state.journeyCount-s.boardedJourney>=PASSENGERS[id].stay&&readyToLeave(id)) q.push(next=>farewell(id,next));   /* 故事、筆記、速寫都完成後才下車 */ });
 zonePlantArrive();
 // 乘客的請求：帶牠到某個地點
 Object.keys(REQ).forEach(id=>{ const r=reqOf(id); if(aboard(id)&&r&&r.st==='on'&&REQ[id].kind==='loc'&&REQ[id].loc===state.currentLocation&&state.journeyCount>r.j) q.push(next=>dialogueScript(REQ[id].done,()=>{ reqDone(id); next(); })); });
 // 停靠事件
 const brd=rollBoarders(); if(state.storyFlags.lightLure&&brd.length) setTimeout(()=>toast('✦ 跟著星光來的生命，正在月台上等著'),3600); state.storyFlags.lightLure=false;
 Object.entries(EVENTS).forEach(([id,e])=>{ if(e.trigger==='arrive'&&!id.startsWith('board_')&&(!e.loc||e.loc===state.currentLocation)&&!done(id)&&(!e.need||e.need())) q.push(next=>e.run(next)); });

  if(state.currentCarriage!=='habitat') q.push(next=>{ toast('棲息車廂那邊好像有動靜……有新的生命上車了！'); next(); }); }

/* ---------- 乘客：登車、對話、離開 ---------- */
function boarding(id,line,next){

  const first=!state.discoveredLifeforms.includes(id);

function autoSettle(){ const moved=[];
 Object.keys(PASSENGERS).filter(id=>aboard(id)&&CARE[id]&&CARE[id].auto&&!careOk(id)).forEach(id=>{
  const z=[PASSENGERS[id].zone].concat(Object.keys(ZONES).filter(k=>k!==PASSENGERS[id].zone)).find(k=>suits(id,k)&&canHost(id,k));
  if(z){ movePassenger(id,z); moved.push(`${PASSENGERS[id].name}自己移到了${ZONES[z].name}`); } });
 return moved; }

 if(state.storyFlags['comfy_'+id]) return false; state.storyFlags['comfy_'+id]=1;
 if(s){ if(s.stage<2){ s.stage=2; s.records.push({j:state.journeyCount,t:'關係：'+STAGE_NAMES[2]}); } s.records.push({j:state.journeyCount,t:`在${ZONES[zoneOf(id)].name}放鬆下來。`}); }
 logJ(`調整棲息結界後，${p.name}在${ZONES[zoneOf(id)].name}放鬆了下來。`); save(); return true; }

/* ================================================================
   展望台的地面刻紋：每到一個地方，地板上會浮現那裡的刻紋。沿著淡淡的刻痕把刻紋描完，拓本會收進記憶典藏車廂。
   ================================================================ */
const ENGR={origin:[6,1,'沉睡之環'],dawnForest:[5,2,'晨光之星'],starIslands:[7,3,'星河之結'],reverseRealm:[8,3,'逆流之輪'],boundlessCorridor:[9,4,'迴廊之門'],silentVoid:[5,1,'寂靜之印'],timeriftSea:[7,2,'時潮之紋']};
const ENGR_OK=loc=>(state.engr||[]).includes(loc);
function engrPts(loc){ const [n]=ENGR[loc]; return Array.from({length:n},(_,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [200+150*Math.cos(a),200+150*Math.sin(a)]; }); }
function engrEdges(loc){ const [n,k]=ENGR[loc]; return Array.from({length:n},(_,i)=>[i,(i+k)%n]); }
function engrSvg(loc,got,cur,cls){ const P=engrPts(loc), E=engrEdges(loc);
 return `<svg class="${cls||''}" viewBox="0 0 400 400" aria-label="${ENGR[loc][2]}"><circle cx="200" cy="200" r="190" fill="#3a2c1c"/><circle cx="200" cy="200" r="182" fill="none" stroke="#c8a85e" stroke-width="2" opacity=".7"/><circle cx="200" cy="200" r="168" fill="none" stroke="#c8a85e" stroke-width=".8" stroke-dasharray="2 6" opacity=".6"/>
  ${E.map(([a,b],i)=>`<line class="eg-l" x1="${P[a][0].toFixed(1)}" y1="${P[a][1].toFixed(1)}" x2="${P[b][0].toFixed(1)}" y2="${P[b][1].toFixed(1)}" stroke="${got&&got.has(i)?'#ffd98a':'#a08860'}" stroke-width="${got&&got.has(i)?5:1.6}" ${got&&got.has(i)?'':'stroke-dasharray="4 7" opacity=".55"'} stroke-linecap="round"/>`).join('')}
  ${P.map(([x,y],i)=>`<g class="eg-n" data-en="${i}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="22" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${cur===i?10:7}" fill="${cur===i?'#fff3c4':'#e8c983'}" stroke="#3a2c1c" stroke-width="2"/></g>`).join('')}</svg>`; }
function engravePanel(){ const loc=state.currentLocation;
 if(state.currentPhase==='voyage') return panel(`<div class="eyebrow">火車尾展望台</div><h2>地面刻紋</h2>${meSay('航行的時候，刻紋很淡，什麼都看不出來。等停靠的時候再來看看。')}`,'small stage');
 if(ENGR_OK(loc)) return panel(`<div class="eyebrow">火車尾展望台・${LOCATIONS[loc].name}</div><h2>${ENGR[loc][2]}</h2>${engrSvg(loc,new Set(engrEdges(loc).map((_,i)=>i)),null,'eg-board done')}${meSay('這裡的刻紋已經拓下來了，收在記憶典藏車廂的刻紋拓本裡。')}`,'stage');
 const ov=panel('','stage engov'), pn=ov.querySelector('.panel'), E=engrEdges(loc), P=engrPts(loc), got=new Set(); let cur=null, down=false, fin=false;
 /* 手指按住一個點，沿著刻痕滑到下一個點：一筆一筆描出來（像星座連線） */
 pn.innerHTML=`<button class="close" aria-label="關閉">✕</button><div class="eyebrow">火車尾展望台・${LOCATIONS[loc].name}</div><h2>地面刻紋</h2><div class="eg-wrap"></div><p class="eg-cnt"></p>${meSay('地板上浮現了淡淡的刻痕……按住一個點，沿著刻痕滑到下一個點。')}`;
 const wrap=pn.querySelector('.eg-wrap'), cnt=pn.querySelector('.eg-cnt');
 const paint=()=>{ wrap.innerHTML=engrSvg(loc,got,cur,'eg-board'+(fin?' done':'')); const sv=wrap.querySelector('svg'); sv.insertAdjacentHTML('beforeend','<line class="eg-rub" x1="0" y1="0" x2="0" y2="0" stroke="#fff3c4" stroke-width="3" stroke-linecap="round" opacity="0"/>'); cnt.textContent=fin?'':`${got.size} / ${E.length}`; };
 const toSvg=e=>{ const sv=wrap.querySelector('svg'), r=sv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*400,(e.clientY-r.top)/r.height*400]; };
 const nodeAt=e=>{ const [x,y]=toSvg(e); let best=-1, bd=28; P.forEach(([px,py],k)=>{ const d=Math.hypot(px-x,py-y); if(d<bd){ bd=d; best=k; } }); return best; };
 const rub=e=>{ const l=wrap.querySelector('.eg-rub'); if(!l) return; if(cur===null||!down){ l.setAttribute('opacity','0'); return; } const [x,y]=toSvg(e); l.setAttribute('x1',P[cur][0]); l.setAttribute('y1',P[cur][1]); l.setAttribute('x2',x); l.setAttribute('y2',y); l.setAttribute('opacity','.8'); };
 const reach=i=>{ if(i<0||i===cur) return; if(cur===null){ cur=i; SFX.tone(660,0,.25,'sine',.02); return paint(); }
  const k=E.findIndex(([a,b])=>(a===cur&&b===i)||(a===i&&b===cur)); if(k<0) return;
  if(!got.has(k)){ got.add(k); SFX.tone(784+got.size*50,0,.35,'sine',.03); } cur=i;
  if(got.size===E.length){ fin=true; down=false; cur=null; state.engr=state.engr||[]; state.engr.push(loc); logJ(`在展望台描完了${LOCATIONS[loc].name}的刻紋「${ENGR[loc][2]}」。`,'find'); save(); SFX.chime(); render();
   paint(); sayReset(ov); pn.insertAdjacentHTML('beforeend',meSay(`描完了！刻紋亮了起來……是「${ENGR[loc][2]}」。<br>拓本收進記憶典藏車廂了。`)); return; }
  paint(); };
 wrap.addEventListener('pointerdown',e=>{ if(fin) return; e.preventDefault(); down=true; const i=nodeAt(e); if(i>=0){ if(cur===null||i===cur||E.some(([a,b])=>(a===cur&&b===i)||(a===i&&b===cur))) reach(i); else { cur=i; paint(); } } });
 const mv=e=>{ if(!down||fin) return; const i=nodeAt(e); if(i>=0) reach(i); rub(e); };
 const up=()=>{ down=false; const l=wrap.querySelector('.eg-rub'); if(l) l.setAttribute('opacity','0'); };
 window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
 const ob=new MutationObserver(()=>{ if(!ov.isConnected){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); ob.disconnect(); } }); ob.observe(document.getElementById('layer'),{childList:true});
 paint(); }
function rubbingPanel(){ const ids=['origin',...LOC_ORDER];

  items:ids.map(id=>({id,have:ENGR_OK(id),cls:'gem rub',inner:engrSvg(id,new Set(engrEdges(id).map((_,i)=>i)),null,''),label:ENGR[id][2]})),
  view:id=>`<h2>${ENGR[id][2]}</h2><div style="width:min(360px,70vw)">${engrSvg(id,new Set(engrEdges(id).map((_,i)=>i)),null,'eg-board done')}</div>${meSay(`在${LOCATIONS[id].name}停靠的時候，展望台的地板上浮現的刻紋。`)}`}); }

const SKY_FANS=['sola','leviathaurora','felinia','sirenora','aelis','frost'];   /* 喜歡天空的乘客：星象出現時會自己去展望台 */

function skyForecast(dest){ const jc=state.journeyCount, moon=realmKey(dest)==='moon', list=moon?['aurora','tide','meteor']:['meteor','eclipse'];
 if(jc<2) return null;   /* 新手的前兩趟航行沒有星象 */
 return {type:list[jc%list.length],at:+(.45+((jc*37)%25)/100).toFixed(2),started:false,ended:false,watched:false}; }
const skyNow=()=>state.currentPhase==='voyage'&&state.voyage&&state.voyage.sky&&state.voyage.sky.started&&!state.voyage.sky.ended?state.voyage.sky:null;
function skyTick(v){ const k=v.sky; if(!k) return false;

  toast(`✦ 星象出現：${SKY[k.type].name}　到火車尾展望台觀賞吧${went.length?`（${went.join('、')}已經跑過去了）`:''}`); SFX.chime();

function skyFansGo(){ const went=[]; SKY_FANS.forEach(id=>{ const s=state.passengers[id]; if(aboard(id)&&!atDeck(id)&&deckList().length<DECK_SLOT.length&&s.stage>=1){ s.place='deck'; went.push(PASSENGERS[id].name); } }); save(); return went; }

function deckWander(){ const msg=[];
 Object.keys(PASSENGERS).filter(aboard).forEach(id=>{ const s=state.passengers[id];
  if(atDeck(id)){ if(Math.random()<.45){ s.place=undefined; msg.push(`${PASSENGERS[id].name}回到了棲息車廂`); } }

function skyFx(type){
 if(type==='meteor'){ let g=''; for(let i=0;i<14;i++){ const x=100+((i*173)%1400), y=((i*97)%260), d=(i%7)*.45; g+=`<line class="mt" x1="${x}" y1="${y}" x2="${x-120}" y2="${y+70}" stroke="url(#gGold)" stroke-width="3" style="animation-delay:${d}s"/><circle class="mt" cx="${x}" cy="${y}" r="3" fill="#fff6d8" style="animation-delay:${d}s"/>`; } return `<g class="skyfx sky-meteor">${g}</g>`; }

 return `<g class="skyfx sky-eclipse"><circle cx="800" cy="200" r="110" fill="url(#gGold)" opacity=".9"/><circle cx="800" cy="200" r="70" fill="#fff3c4"/><circle class="moon" cx="830" cy="196" r="70" fill="#1a1c3a"/><circle cx="800" cy="200" r="78" fill="none" stroke="#ffe9a8" stroke-width="4" opacity=".9"/></g>`; }
function skyWatch(){ const k=skyNow(); if(!k) return toast('現在的天空很平靜。');
 const S=SKY[k.type], here=deckList(), first=!(state.skySeen||[]).includes(k.type), was=k.watched;
 const script=[['self',`${S.name}……${S.desc}`]].concat(here.map(id=>[id,(SKY_LINE[k.type]||{})[id]||`（${PASSENGERS[id].name}抬頭看著天空，看得出神了。）`]));
 if(!was) script.push(['self',`星光落在身上，好輕。${first?'這一幕，會凝結成回憶水晶吧。':''}`]);
 if(!was){ k.watched=true; TAINT.add(voyBless()==='wing'?-10:-5); if(k.type==='aurora') addClue('clue_wall'); state.skySeen=state.skySeen||[]; if(first) state.skySeen.push(k.type);
  state.skyLog=state.skyLog||[]; state.skyLog.push({k:'sky',type:k.type,j:state.journeyCount+1,with:here.slice()});
  logJ(`在展望台觀賞了${S.name}${here.length?`，和${here.map(id=>PASSENGERS[id].name).join('、')}一起`:''}。`,'find');
  here.forEach(id=>state.passengers[id].records.push({j:state.journeyCount+1,t:`在展望台一起看了${S.name}。`})); save(); SFX.chime(); }
 const rq=here.filter(id=>reqOn(id)&&REQ[id].kind==='sky'&&REQ[id].sky===k.type);
 rq.forEach(id=>{ script.push(...REQ[id].done); reqDone(id); });
 dialogueScript(script); }

const skyHere=()=>state.currentPhase==='voyage'?'moon':realmKey(state.currentLocation);

 let face=sky==='sun'?0:1;
 const disc=sk=>{ const L=CONSTS.filter(c=>c.sky===sk); return `<div class="cs-disc ${sk}">${L.map((c,k)=>{ const ok=constDone(c.id), can=c.sky===sky; return `<button class="cs-slot ${ok?'got':''}" data-cs="${c.id}" style="left:${POS[k%4][0]}%;top:${POS[k%4][1]}%" ${!can&&!ok?'disabled':''}>${constRound(c,ok)}<span>${ok||can?c.name:'？？？'}</span>${ok?'':`<small>${can?'可以連線':`要在${sk==='sun'?'日界':'月界'}的天空下`}</small>`}</button>`; }).join('')}

 const list=()=>{ pn.innerHTML=`<button class="close" aria-label="關閉">✕</button><div class="eyebrow">星月觀測車廂</div><h2>星座盤</h2>

  ${meSay(`盤面映著${state.currentPhase==='voyage'?'航道上方':LOCATIONS[state.currentLocation].name+'上方'}的星空。左右轉動盤面，可以看日界和月界的天空。`)}`;
  /* 手指拖曳：星座盤像硬幣一樣翻轉，翻到另一面的天空 */

  const setA=(v,anim)=>{ a=v; flip.classList.toggle('anim',!!anim); flip.style.transform=`rotateY(${a}deg)`; };
  const settle=()=>{ face=((Math.round(a/180)%2)+2)%2; setA(Math.round(a/180)*180,true); pn.querySelectorAll('[data-face]').forEach(b=>b.classList.toggle('on',+b.dataset.face===face)); pn.querySelectorAll('.cs-face').forEach((f,k)=>f.classList.toggle('front',k===face)); };
  st.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; g={x:e.clientX,a,on:false,id:e.pointerId}; });
  st.addEventListener('pointermove',e=>{ if(!g||g.id!==e.pointerId) return; const dx=e.clientX-g.x; if(!g.on){ if(Math.abs(dx)<8) return; g.on=true; try{ st.setPointerCapture(e.pointerId); }catch(_){} } setA(g.a+dx/st.clientWidth*240); });
  const up=e=>{ if(!g||g.id!==e.pointerId) return; const on=g.on, d=a-g.a, a0=g.a; g=null; if(!on) return; st.noClick=performance.now()+300; a=Math.abs(d)>40?a0+Math.sign(d)*180:a0; SFX.glass(); settle(); };

const VOICE={T:[],

 prof(who){ if(this.P[who]) return this.P[who]; let h=0; for(const c of String(who||'x')) h=(h*31+c.charCodeAt(0))%9973; return [220+(h%600),['sine','triangle','square'][h%3],.07+(h%5)*.01,.1+(h%10)/50]; },

  const [f,type,gap,jit]=this.prof(who), n=Math.min(16,Math.ceil(t.length/2)); let h=0; for(const c of t) h=(h*17+c.charCodeAt(0))%997;

/* ================================================================
   360° 環景（圓柱體內側映射，WebGL 直接繪製）
   - 圖片：CARRIAGES[x].pano.image，原圖不裁切、不拉伸
   - 熱點：以柱面座標記錄（yaw 水平角 0–360°、elev 仰角），隨場景旋轉
   - 熱點資料：統一熱點表 HSDEF（scene:'memory'，at 為 yaw／elev），位置固定
   ================================================================ */
const D2R=Math.PI/180;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PANO={gl:undefined,active:null,list:[],

function panoDims(){ const c=PANO.active&&CARRIAGES[PANO.active].pano; return PANO.dims[PANO.active]||{w:c?c.w:2,h:c?c.h:1}; }

   b.style.left=(e.clientX-g.ox)+'px'; b.style.top=(e.clientY-g.oy)+'px'; const t=slot.getBoundingClientRect(); slot.classList.toggle('hot',e.clientX>t.left&&e.clientX<t.right&&e.clientY>t.top&&e.clientY<t.bottom); });

/* ================================================================
   手寫紀錄本：一頁一頁左右翻（滑鼠按住左右拖曳、書籤、左右鍵），像玩家自己記下來的筆記
