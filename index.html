<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2226%22 fill=%22%23f3d9a0%22/%3E%3Ccircle cx=%2242%22 cy=%2226%22 r=%2222%22 fill=%22%231d1a33%22/%3E%3C/svg%3E">
<title>日月更迭</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: a fixed 16:9 first-person stage (pans sideways on portrait phones) under a thin glass HUD; panels float over it. */
:root{
  --void:#070914; --ink:#eef0fb; --mute:#a9add0; --gold:#e8c983; --gold-2:#b8954e;
  --silver:#dfe6ff; --violet:#9a8cff; --mist:rgba(18,20,44,.72); --line:rgba(232,201,131,.38);
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-latin:"Cormorant Garamond","Noto Serif TC",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;display:flex;align-items:center}
#viewport::-webkit-scrollbar{display:none}
#stage{position:relative;flex:none;margin:auto;overflow:hidden;background:#000}
#scene{position:absolute;inset:0;transition:opacity .5s ease,transform .7s ease, filter .5s}
#scene.out{opacity:0;transform:scale(1.06);filter:brightness(2.2) blur(4px)}
#scene svg.bg,#scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(5,6,18,.55) 100%)}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6dc;box-shadow:0 0 8px 2px rgba(255,230,170,.6);opacity:0;animation:drift 9s linear infinite}
@keyframes drift{0%{opacity:0;transform:translateY(20px)}15%{opacity:.9}100%{opacity:0;transform:translateY(-140px) translateX(30px)}}

/* hotspots — one system, four states: normal / important / locked / done */
.hs{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:6px;min-width:44px;min-height:44px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.hs.talking,.mote.talking{z-index:8}
.hs .mk{position:relative;width:clamp(22px,2.4vw,32px);height:clamp(22px,2.4vw,32px);border-radius:50%;border:1.5px solid rgba(255,245,222,.78);background:radial-gradient(circle,rgba(255,244,214,.82) 0 16%,rgba(255,230,180,.16) 42%,transparent 70%);box-shadow:0 0 10px rgba(255,225,170,.45);transition:transform .25s,box-shadow .25s,opacity .25s}
.hs.st-normal .mk{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:.95}}
.hs:hover .mk,.hs:focus-visible .mk{opacity:1;transform:scale(1.12);box-shadow:0 0 22px rgba(255,228,170,.95);animation-play-state:paused}
.hs.st-important .mk{--r:19px;border-color:#ffe3a3;background:radial-gradient(circle,#fff6d8 0 20%,rgba(255,210,130,.34) 48%,transparent 72%);animation:goldglow 3.4s ease-in-out infinite}
@keyframes goldglow{0%,100%{box-shadow:0 0 12px rgba(255,205,120,.7),0 0 26px rgba(255,205,120,.22)}50%{box-shadow:0 0 18px rgba(255,215,140,.95),0 0 38px rgba(255,205,120,.38)}}
.hs.st-important .mk::before,.hs.st-important .mk::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#fff3c8;box-shadow:0 0 6px #ffd98a;animation:orbit 7s linear infinite}
.hs.st-important .mk::after{width:2px;height:2px;margin:-1px;animation-duration:10s;animation-direction:reverse}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--r))}to{transform:rotate(360deg) translateX(var(--r))}}
.hs.st-locked{cursor:help}
.hs.st-locked .mk{border:1.5px dashed rgba(205,210,235,.55);background:rgba(14,16,36,.62);box-shadow:none;opacity:.78}
.hs.st-locked .mk::before{content:"";position:absolute;left:50%;top:50%;width:40%;height:30%;transform:translateX(-50%);border-radius:2px;background:rgba(220,225,245,.85)}
.hs.st-locked .mk::after{content:"";position:absolute;left:50%;top:24%;width:24%;height:28%;transform:translateX(-50%);border:2px solid rgba(220,225,245,.85);border-bottom:0;border-radius:6px 6px 0 0}
.hs.st-done .mk{opacity:.42;box-shadow:none;animation:none}
.hs.st-done .mk::after{content:"";position:absolute;left:50%;top:44%;width:32%;height:16%;border-left:2px solid rgba(255,246,224,.95);border-bottom:2px solid rgba(255,246,224,.95);transform:translate(-50%,-50%) rotate(-45deg)}
.hs.st-done:hover .mk,.hs.st-done:focus-visible .mk{opacity:.95}
.hs .lb{font-family:var(--f-display);font-size:clamp(11px,1.05vw,14px);letter-spacing:.12em;white-space:nowrap;padding:3px 10px;border-radius:999px;background:rgba(10,12,30,.62);border:1px solid var(--line);color:#fff7e6;backdrop-filter:blur(6px);transition:opacity .25s,transform .25s,border-color .25s}
.hs.st-important .lb{border-color:rgba(255,215,140,.75)}
.hs.st-locked .lb{color:#c8cce8;border-style:dashed;border-color:rgba(205,210,235,.4)}
@media (hover:hover){.hs.st-normal .lb,.hs.st-done .lb{opacity:0;transform:translateY(4px)}.hs:hover .lb,.hs:focus-visible .lb,.hs.talking .lb{opacity:1;transform:translateY(-2px);border-color:var(--gold)}}
@media (hover:none){.hs.st-normal .lb{opacity:.82}.hs.st-done .lb{opacity:.5}}
.hs:focus-visible{outline:none}.hs:focus-visible .mk{outline:2px solid var(--gold);outline-offset:4px}
.hs.door .mk{border-radius:10px;width:clamp(26px,2.8vw,40px);height:clamp(34px,3.6vw,52px);background:linear-gradient(rgba(220,230,255,.5),rgba(160,150,255,.12));border-color:#dfe6ff;box-shadow:0 0 16px rgba(180,190,255,.7)}
.hs.door.st-locked .mk{background:rgba(14,16,36,.62);box-shadow:none}
.hs.door .lb,.hs.back .lb,.hs.exit .lb,.hs.save .lb{opacity:.94!important;transform:none!important}
.hs.back{flex-direction:row}
.hs.back .mk{border-radius:50%;background:none;border-color:#dfe6ff;opacity:.9;animation:none}
.hs.back .mk::before{content:"‹";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:#fff;line-height:1}
.hs.exit .mk{border-color:#ffe9a8;background:radial-gradient(circle,#fff3c4 0 22%,rgba(255,200,90,.3) 50%,transparent 72%)}
.hs.exit.st-locked .mk{border-color:rgba(205,210,235,.55);background:rgba(14,16,36,.62)}
.hs.cta .mk::before,.hs.cta .mk::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid rgba(255,230,180,.8);animation:ripple 2.8s ease-out infinite}
.hs.cta .mk::after{animation-delay:1.4s}
@keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.hsb{position:absolute;inset:-3px;border-radius:inherit;border:2px solid #fff3c8;box-shadow:0 0 14px rgba(255,230,170,.9);pointer-events:none;animation:hsburst .65s ease-out forwards}
.orb .hsb{border-radius:50%}
@keyframes hsburst{from{transform:scale(.7);opacity:1}to{transform:scale(2.8);opacity:0}}
.mote{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;animation:bob 4s ease-in-out infinite}
.mote .orb{width:clamp(30px,3.2vw,48px);height:clamp(30px,3.2vw,48px);border-radius:50%;position:relative}
.mote .orb::after{content:"";position:absolute;inset:-60%;border-radius:50%;background:inherit;filter:blur(14px);opacity:.75;z-index:-1}
.mote .lb{font-family:var(--f-display);font-size:clamp(11px,1vw,13px);letter-spacing:.1em;padding:2px 9px;border-radius:999px;background:rgba(10,12,30,.6);border:1px solid rgba(220,230,255,.4)}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 8px))}}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:20;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#hud > *{pointer-events:auto}
.loc{background:linear-gradient(90deg,rgba(8,10,26,.78),rgba(8,10,26,.2));border-left:2px solid var(--gold);padding:7px 14px 8px 12px;min-width:0}
.loc .realm{font-size:11px;letter-spacing:.24em;color:var(--gold)}
.loc .name{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.6vw,22px);letter-spacing:.14em}
.loc .meta{font-size:11px;color:var(--mute);letter-spacing:.08em;margin-top:2px;font-variant-numeric:tabular-nums}
.loc .meta b{font-family:var(--f-latin);font-size:14px;color:var(--ink);font-weight:500}
.train{display:flex;gap:4px;align-items:center;padding:8px 10px;background:rgba(8,10,26,.6);border:1px solid rgba(232,201,131,.22);border-radius:999px;backdrop-filter:blur(6px)}
.train .car{height:8px;width:clamp(22px,4vw,46px);border-radius:3px;background:rgba(220,230,255,.18);position:relative}
.train .car.on{background:linear-gradient(90deg,var(--gold),#fff0c8);box-shadow:0 0 10px rgba(232,201,131,.8)}
.train .car:first-child{border-radius:8px 3px 3px 8px}
.train .cn{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;margin-left:8px;white-space:nowrap}
.right{display:flex;gap:8px;align-items:center}
.evt{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--gold);background:rgba(40,30,10,.55);font-family:var(--f-display);font-size:12px;letter-spacing:.1em;cursor:pointer;animation:glowp 2.4s ease-in-out infinite;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);flex:none}
@keyframes glowp{50%{box-shadow:0 0 14px rgba(232,201,131,.55)}}
.phase{font-size:11px;letter-spacing:.2em;padding:6px 10px;border-radius:999px;background:rgba(8,10,26,.6);border:1px solid rgba(220,230,255,.25);color:var(--silver);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:40;padding:9px 20px;border-radius:999px;background:rgba(10,12,30,.85);border:1px solid var(--line);font-family:var(--f-display);letter-spacing:.12em;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#panhint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:15;font-size:12px;letter-spacing:.2em;color:var(--mute);pointer-events:none;transition:opacity 1s}

/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(4,5,14,.62);backdrop-filter:blur(5px);animation:fin .35s ease;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
@keyframes fin{from{opacity:0}}
.panel{position:relative;width:min(980px,100%);max-height:100%;overflow:auto;background:linear-gradient(160deg,rgba(30,32,64,.94),rgba(12,14,34,.96));border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 60px rgba(154,140,255,.08);padding:26px clamp(18px,3vw,36px) 28px}
.panel::before{content:"";position:absolute;inset:6px;border:1px solid rgba(232,201,131,.14);pointer-events:none;border-radius:2px}
.panel h2{font-family:var(--f-display);font-weight:600;letter-spacing:.2em;font-size:clamp(20px,2.2vw,28px);margin:0 0 4px;text-wrap:balance}
.panel .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.panel p{line-height:1.85;color:#d6d9f2;max-width:62ch;margin:.6em 0}
.panel .close{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(8,10,26,.5);cursor:pointer;font-size:18px;z-index:2}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid var(--gold);background:linear-gradient(rgba(232,201,131,.18),rgba(232,201,131,.05));border-radius:2px;cursor:pointer;font-family:var(--f-display);letter-spacing:.16em;font-size:14px;transition:background .2s}
.btn:hover{background:rgba(232,201,131,.3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:rgba(220,230,255,.35);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{border:1px solid rgba(220,230,255,.18);background:rgba(10,12,30,.5);border-radius:3px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card .art{aspect-ratio:1;max-width:100%;border-radius:2px;background:radial-gradient(circle at 50% 60%,rgba(154,140,255,.25),transparent 70%);display:grid;place-items:center;overflow:hidden}
.card .art svg{width:100%;height:100%}
.card .t{font-family:var(--f-display);letter-spacing:.12em;font-size:15px}
.card .s{font-size:11px;color:var(--mute);letter-spacing:.08em}
.card.locked{cursor:default}.card.locked .art{filter:brightness(0) drop-shadow(0 0 4px rgba(154,140,255,.6))}
.tag{display:inline-block;font-size:11px;letter-spacing:.14em;padding:2px 8px;border:1px solid rgba(232,201,131,.45);border-radius:999px;color:var(--gold)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid rgba(232,201,131,.2)}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-family:var(--f-display);letter-spacing:.14em;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.log{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.log li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;border-bottom:1px solid rgba(220,230,255,.08);padding-bottom:10px}
.log .j{font-family:var(--f-latin);font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.log span{line-height:1.7;color:#d6d9f2}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:center}
.split .portrait{aspect-ratio:2/3;max-width:100%;max-height:70vh;margin:auto;filter:drop-shadow(0 0 30px rgba(180,200,255,.35))}
.split .portrait svg{width:100%;height:100%}
@media (max-width:700px){.split{grid-template-columns:1fr}.split .portrait{max-height:42vh}}
.stages{display:flex;gap:6px;margin:10px 0}
.stages span{flex:1;font-size:11px;text-align:center;padding:4px 0;border-top:2px solid rgba(220,230,255,.18);color:var(--mute);letter-spacing:.1em}
.stages span.on{border-color:var(--gold);color:var(--ink)}

/* dialogue */
.dlg{position:fixed;inset:0;z-index:32;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 30%,rgba(4,5,14,.85));animation:fin .35s}
.dlg .who{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:min(88vh,980px);aspect-ratio:2/3;max-width:100%;pointer-events:none;animation:rise .7s ease}
.dlg .who svg{width:100%;height:100%;filter:drop-shadow(0 0 40px rgba(170,190,255,.45))}
@keyframes rise{from{opacity:0;transform:translate(-50%,40px)}}
.dlg .box{position:relative;width:min(900px,calc(100% - 28px));margin-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(rgba(16,18,42,.92),rgba(10,12,30,.96));border:1px solid var(--line);padding:18px 22px 16px;border-radius:3px;cursor:pointer}
.dlg .nm{position:absolute;top:-15px;left:18px;padding:3px 14px;background:#141634;border:1px solid var(--gold);font-family:var(--f-display);letter-spacing:.2em;font-size:14px}
.dlg .tx{font-family:var(--f-display);font-size:clamp(15px,1.5vw,18px);line-height:1.9;min-height:3.8em;letter-spacing:.04em}
.dlg .tx.self{color:#cfd6ff;font-style:normal}
.dlg .nx{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--gold);animation:glowp 1.6s infinite}
.dlg .chs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dlg .chs button{text-align:left;padding:10px 14px;border:1px solid rgba(220,230,255,.3);background:rgba(154,140,255,.08);cursor:pointer;font-family:var(--f-display);letter-spacing:.06em}
.dlg .chs button:hover{border-color:var(--gold)}

/* cinematic */
.cine{position:fixed;inset:0;z-index:35;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:fin .6s}
.cine img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-out forwards;opacity:.85}
@keyframes kb{from{transform:scale(1.15) translate(2%,1%)}to{transform:scale(1) translate(0,0)}}
.cine .shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.75))}
.cine .txt{position:relative;max-width:min(760px,88vw);text-align:center;font-family:var(--f-display);font-size:clamp(17px,2vw,24px);line-height:2;letter-spacing:.12em;text-shadow:0 2px 20px #000;animation:fin 1s}
.cine .big{font-size:clamp(30px,4.6vw,58px);letter-spacing:.4em;font-weight:600;color:#fff4d6}
.cine .sub{display:block;font-size:13px;letter-spacing:.4em;color:var(--gold);margin-top:10px}
.cine .tap{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:.3em;color:var(--mute)}
.cine .stars{position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#dfe6ff,transparent),radial-gradient(1px 1px at 85% 20%,#fff,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent);opacity:.7}

/* boarding */
.board .burst{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 120px 60px rgba(255,240,200,.9);animation:burst 1.4s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(30)}}
.board .portrait{animation:rise 1s .5s both}
.reveal{animation:fin .8s .9s both}
.nav-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.dest{border:1px solid rgba(220,230,255,.2);background:rgba(10,12,30,.55);text-align:left;padding:0;cursor:pointer;border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.dest .art{aspect-ratio:16/9;max-width:100%}
.dest .art svg{width:100%;height:100%;display:block}
.dest .meta{padding:10px 12px}
.dest .t{font-family:var(--f-display);letter-spacing:.14em;font-size:15px}
.dest .s{font-size:11px;color:var(--mute);margin-top:3px;letter-spacing:.06em}
.dest.cur{border-color:var(--gold)}
.dest:disabled{cursor:default}.dest:disabled .art{filter:grayscale(1) brightness(.35)}
.dest:not(:disabled):hover{border-color:var(--gold)}
.seedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.seed{border:1px solid rgba(220,230,255,.2);padding:12px 8px;text-align:center;background:rgba(10,12,30,.5);border-radius:3px;cursor:pointer}
.seed .dot{width:30px;height:30px;margin:0 auto 6px;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.seed .n{font-family:var(--f-display);font-size:13px;letter-spacing:.08em}
.seed .s{font-size:10px;color:var(--mute);margin-top:2px}
.seed.sealed{opacity:.5}
.clue{border-left:2px solid var(--violet);padding:6px 0 6px 14px;margin:12px 0;font-family:var(--f-display);line-height:1.9;color:#dcd8ff}
.clue.unk{color:var(--mute);border-color:rgba(220,230,255,.2)}
.title-screen .logo{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,8vw,104px);letter-spacing:.35em;margin-right:-.35em;background:linear-gradient(180deg,#fffaf0,#e8c983 60%,#9a8cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(232,201,131,.35))}
.title-screen .en{font-family:var(--f-latin);font-style:italic;font-size:clamp(14px,1.6vw,20px);letter-spacing:.3em;color:var(--silver);margin-top:6px}
/* 360° panorama */
.pano{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden;background:#0b0d22}
.pano.drag{cursor:grabbing}
.pano-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.phs{position:absolute;inset:0;pointer-events:none}
.phs .hs{pointer-events:auto}
.pano-loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);letter-spacing:.3em;color:var(--mute)}
.pano-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;letter-spacing:.24em;padding:6px 14px;border-radius:999px;background:rgba(8,10,26,.55);color:var(--silver);pointer-events:none;transition:opacity .8s;white-space:nowrap}
/* save hotspot: pearl crystal marker, distinct from other hotspots */
.hs.save .mk{border-radius:4px;transform:rotate(45deg);border-color:#fff;background:radial-gradient(circle,#fffaf0 0 22%,rgba(220,230,255,.4) 55%,transparent 75%);box-shadow:0 0 18px rgba(230,235,255,.95)}
.hs.save .mk::before,.hs.save .mk::after{border-radius:4px}
.hs.save .lb{background:rgba(250,247,240,.92);color:#3a3150;border-color:#e8c983}
/* HUD extras */
.train .car.loco{width:clamp(16px,2.6vw,30px);background:rgba(232,201,131,.35)}
.train .car.tail{width:clamp(10px,1.6vw,18px)}
.snd{width:30px;height:30px;border-radius:50%;border:1px solid rgba(220,230,255,.3);background:rgba(8,10,26,.6);cursor:pointer;font-size:14px;color:var(--silver);flex:none}
.snd.off{opacity:.45;text-decoration:line-through}
.vbar{display:inline-block;width:90px;height:4px;border-radius:2px;background:rgba(220,230,255,.18);vertical-align:middle;margin-right:8px;overflow:hidden}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff0c8);transition:width .25s linear}
canvas.streaks{position:absolute;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 35% 35%,rgba(110,80,190,.45),transparent 60%),radial-gradient(ellipse at 70% 55%,rgba(40,120,150,.35),transparent 55%),#090b22}
/* main screen */
.mainscreen{position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2.4vh,24px);background:radial-gradient(ellipse at 50% 35%,#1d1f4c,#06071a 72%);
 padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));animation:fin .8s}
.ms-logo{text-align:center;position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 3.5vh);z-index:3;pointer-events:none}
.ms-logo .logo{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,96px);letter-spacing:.35em;margin-right:-.35em;background:linear-gradient(180deg,#fffaf0,#e8c983 60%,#9a8cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(232,201,131,.35))}
.ms-logo .en{font-family:var(--f-latin);font-style:italic;font-size:clamp(13px,1.5vw,19px);letter-spacing:.3em;color:var(--silver);margin-top:4px}
.mainscreen{overflow:hidden}
/* 滿版：容器維持影片比例並蓋滿整個畫面，位置由 msLayout() 計算（直向時把焦點移到火車頭） */
.ms-train{position:absolute;left:var(--ml,0);top:var(--mt,0);width:var(--mw,100vw);height:var(--mh,100vh)}
.ms-shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(6,7,26,.62),rgba(6,7,26,0) 26%,rgba(6,7,26,0) 80%,rgba(6,7,26,.66))}
.ms-train>.ms-anim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ms-train>.ms-branch,.ms-train>.hs,.ms-train>.ms-opt{z-index:4}
#ms-work{left:25%;top:63%}#ms-new{left:18%;top:34%}#ms-cont{left:61%;top:34%}
.mainscreen.portrait #ms-new{left:19%;top:30%}.mainscreen.portrait #ms-cont{left:34%;top:30%}
.ms-branch .bp,.mainscreen.portrait .ms-branch .bl{display:none}.mainscreen.portrait .ms-branch .bp{display:inline}
.ms-train>svg{position:absolute;inset:0;width:100%;height:100%}
.ms-train>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.ms-branch{pointer-events:none}
.ms-branch .br{fill:none;stroke:#e8c983;stroke-width:5;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;filter:drop-shadow(0 0 6px rgba(232,201,131,.8))}
.ms-branch .tw{fill:none;stroke:#e8c983;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90}
.ms-branch .leaf{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0)}
.ms-train.open .br{animation:grow .9s cubic-bezier(.3,.7,.3,1) forwards}
.ms-train.open .tw{animation:grow .6s .45s ease-out forwards}
.ms-train.open .leaf{animation:leaf .5s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes leaf{to{opacity:.95;transform:scale(1)}}
.ms-opt{position:absolute;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;padding:10px 20px 9px;border-radius:999px;border:1px solid var(--gold);cursor:pointer;
 background:radial-gradient(ellipse at 50% 30%,rgba(255,250,235,.96),rgba(236,228,250,.9));color:#2f2747;font-family:var(--f-display);font-weight:600;letter-spacing:.24em;font-size:clamp(13px,1.5vw,17px);white-space:nowrap;box-shadow:0 0 24px rgba(232,201,131,.55)}
.ms-opt .s{display:block;font-weight:400;font-size:10px;letter-spacing:.12em;color:#7a6f92;margin-top:2px}
.ms-train.open .ms-opt{animation:bloom .5s .8s ease-out forwards;pointer-events:auto}
.ms-opt.off{background:rgba(60,58,90,.88);color:#a9add0;border-color:rgba(220,230,255,.3);box-shadow:none}
.ms-opt.off .s{color:#8d90b5}
@media (max-width:600px){.ms-opt{padding:7px 12px;letter-spacing:.12em;font-size:12px}.ms-opt .s{display:none}}
@media (max-height:500px){.ms-logo .logo{font-size:clamp(26px,9vh,56px)}.ms-opt{padding:6px 12px;letter-spacing:.12em;font-size:12px}.ms-opt .s{display:none}}
.cine .sub{text-wrap:balance}
@keyframes bloom{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ms-note{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh);z-index:5;width:max-content;max-width:min(42ch,calc(100% - 32px));min-height:1.6em;font-size:13px;letter-spacing:.14em;color:#d9d4ee;text-shadow:0 1px 8px rgba(0,0,0,.9);text-align:center;line-height:1.8}
.ms-cf{display:flex;gap:8px;justify-content:center;margin-top:8px}
.ms-cf button{padding:7px 14px;border:1px solid var(--gold);background:rgba(232,201,131,.15);border-radius:2px;cursor:pointer;letter-spacing:.1em}
/* duty panels */
.scan{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:center;margin-top:12px}
.scan-svg{width:100%;max-width:220px}
@media (max-width:600px){.scan{grid-template-columns:1fr}.scan-svg{max-height:34vh;margin:auto;display:block}}
.scan-svg.run .ring{animation:scanmove 2.4s ease-in-out}
@keyframes scanmove{50%{transform:translateY(240px)}}
.scan-svg.ok .ring ellipse{stroke:#9fe8c0}
.rune-res{display:flex;gap:14px;align-items:center;font-family:var(--f-display);line-height:1.8}
.rune-dot{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle,#f2fff6,#9fe8c0 50%,transparent 72%);box-shadow:0 0 22px #9fe8c0}
.card.got{border-color:var(--gold);box-shadow:inset 0 0 30px rgba(232,201,131,.18)}
.tablet{margin-top:14px;padding:12px;border:1px solid rgba(191,230,255,.45);border-radius:14px;background:linear-gradient(160deg,rgba(191,230,255,.16),rgba(154,140,255,.08));display:flex;flex-direction:column;gap:6px}
.tl{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 28px;gap:10px;align-items:center;text-align:left;padding:10px;border:0;border-bottom:1px solid rgba(220,230,255,.1);background:none;cursor:pointer;border-radius:6px}
.tl:hover{background:rgba(191,230,255,.08)}
.tl .k{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.tl .v{font-family:var(--f-display);line-height:1.6}
.tl .rn{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(220,230,255,.45)}
.tl.ok .rn{border-color:#9fe8c0;background:radial-gradient(circle,#f2fff6,#9fe8c0 60%);box-shadow:0 0 12px #9fe8c0}
@media (max-width:520px){.tl{grid-template-columns:minmax(0,1fr) 28px}.tl .k{grid-column:1/-1}}
.bd{color:var(--gold)!important;font-family:var(--f-display)}
.checks{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:center;font-family:var(--f-display);color:var(--mute)}
.checks li::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(220,230,255,.45);flex:none}
.checks li.ok{color:var(--ink)}.checks li.ok::before{background:#9fe8c0;border-color:#9fe8c0;box-shadow:0 0 10px #9fe8c0}
/* pearl memory-crystal panel (save / load) */
.ov.pearl{z-index:40}
.ov.pearl .panel{background:linear-gradient(160deg,rgba(253,250,244,.97),rgba(236,230,246,.95));color:#2f2747;border-color:rgba(200,168,94,.7);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 70px rgba(255,255,255,.7)}
.ov.pearl .panel::before{border-color:rgba(200,168,94,.35)}
.ov.pearl h2{color:#2f2747}.ov.pearl .eyebrow{color:#a07a2e}.ov.pearl p{color:#5a5170}
.ov.pearl .close{background:rgba(255,255,255,.7);color:#5a5170;border-color:rgba(200,168,94,.6)}
.ov.pearl .pmsg{color:#8a6420;font-family:var(--f-display)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.slot{display:flex;flex-direction:column;gap:4px;padding:8px 8px 10px;border-radius:10px;border:1px solid rgba(200,168,94,.4);background:linear-gradient(170deg,rgba(255,255,255,.75),rgba(230,224,244,.6));cursor:pointer;text-align:left;color:#2f2747;transition:transform .2s,box-shadow .2s}
.slot:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(120,100,170,.25)}
.slot .th{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:7px;overflow:hidden;background:linear-gradient(135deg,#d8d2ee,#f4efe4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 0 0 1px rgba(200,168,94,.35);display:grid;place-items:center}

.slot.new .th span{font-size:34px;color:#a07a2e}
.slot .nm{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;margin-top:4px}
.slot .mt{font-size:11px;color:#7a6f92;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:6px;left:6px;font-size:10px;letter-spacing:.14em;padding:2px 8px;border-radius:999px;background:rgba(255,250,235,.92);color:#8a6420;border:1px solid rgba(200,168,94,.6)}
.noth{font-size:12px;color:#8d85a6}
.ov.pearl .empty{grid-column:1/-1}
.sdet{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;margin-top:14px;align-items:start}

.sdet .th{aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(200,168,94,.5),0 10px 30px rgba(120,100,170,.25);background:#ddd6ee;display:grid;place-items:center}
.sdet .nm{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.1em}
.sdet dl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 12px;margin:12px 0;font-size:13px}
.sdet dt{color:#8d85a6;letter-spacing:.08em}.sdet dd{margin:0;color:#2f2747}
.ov.pearl .rn{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8d85a6;letter-spacing:.08em}
.ov.pearl .rn input{font:inherit;font-size:15px;color:#2f2747;padding:7px 10px;border:1px solid rgba(200,168,94,.55);border-radius:6px;background:rgba(255,255,255,.8);min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pbtn{padding:8px 14px;border-radius:999px;border:1px solid rgba(200,168,94,.6);background:rgba(255,255,255,.7);color:#4a3f66;cursor:pointer;font-family:var(--f-display);letter-spacing:.1em;font-size:13px}
.pbtn.pri{background:linear-gradient(#fff6dc,#f1dfa6);color:#5a4210;border-color:#c8a85e}

.plink{margin-top:14px;border:0;background:none;color:#8a6420;cursor:pointer;font-family:var(--f-display);letter-spacing:.1em;padding:4px 0}

/* ---------- interaction layer: whisper, small window, fades, door ---------- */
.hs.save:hover .mk,.hs.save:focus-visible .mk{transform:rotate(45deg) scale(1.12)}
.whisper{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);width:max-content;max-width:min(300px,72vw);padding:9px 13px;border-radius:10px;background:rgba(251,248,241,.96);color:#3a3150;font-family:var(--f-display);font-size:13px;line-height:1.75;letter-spacing:.04em;text-align:left;white-space:normal;border:1px solid rgba(232,201,131,.75);box-shadow:0 8px 26px rgba(0,0,0,.35);pointer-events:none;animation:wIn .28s ease-out;transition:opacity .4s}
.whisper.wl{left:0;transform:none}.whisper.wr{left:auto;right:0;transform:none}.whisper.wb{bottom:auto;top:calc(100% + 2px)}
.whisper.out{opacity:0}
.whisper.lock{background:rgba(22,24,48,.95);color:#dfe3ff;border-color:rgba(205,210,235,.5)}
@keyframes wIn{from{opacity:0}}
.ov .panel{animation:panelIn .34s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(12px) scale(.985)}}
.ov.closing{opacity:0;transition:opacity .26s ease;pointer-events:none}
.ov.small{background:rgba(4,5,14,.3);backdrop-filter:none;align-items:flex-end}

#doorfx{position:fixed;inset:0;z-index:29;display:flex;pointer-events:none}

#doorfx i.r{background:linear-gradient(270deg,#f7f3fb,#e2dbef 70%,#d3c9e6);transform:translateX(102%)}
#doorfx i.l::after{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:linear-gradient(#c8a85e,#fff0c8,#c8a85e)}
#doorfx i::before{content:"";position:absolute;inset:8% 12%;border:1px solid rgba(200,168,94,.45);border-radius:40% 40% 4px 4px/14% 14% 4px 4px}
#doorfx.shut i{transform:none}
#doorfx b{position:absolute;left:50%;top:50%;width:min(26vmin,170px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.8);border-radius:50%;border:2px solid #c8a85e;box-shadow:0 0 40px rgba(232,201,131,.6),inset 0 0 30px rgba(232,201,131,.35);opacity:0;transition:opacity .2s,transform .32s}
#doorfx b::before{content:"";position:absolute;inset:18%;border:1.5px solid #c8a85e;border-radius:50%}
#doorfx b::after{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:1.5px;background:#c8a85e;transform:translateX(-50%)}

.pano-fail{position:absolute;inset:0;z-index:7;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;background:rgba(7,9,20,.88);font-family:var(--f-display);letter-spacing:.12em}
.mote.st-important .orb{box-shadow:0 0 0 2px rgba(255,226,160,.85),0 0 22px rgba(255,214,140,.8)}

@keyframes hop{0%,62%,100%{transform:translate(-50%,-50%)}74%{transform:translate(-50%,calc(-50% - 16px))}84%{transform:translate(-50%,-50%)}90%{transform:translate(-50%,calc(-50% - 5px))}}

.mote:focus-visible{outline:none}.mote:focus-visible .orb{outline:2px solid var(--gold);outline-offset:4px}

/* ---------- scene micro-animations (inline SVG) ---------- */

/* ---------- carriage panels (dark glass) ---------- */
.kv{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:6px 12px;margin:12px 0;font-size:13.5px;line-height:1.7}

.panel h3{font-family:var(--f-display);font-size:18px;letter-spacing:.14em;margin:6px 0 0}

function rnd(seed){ let s=seed; return ()=> (s=(s*9301+49297)%233280)/233280; }
function stars(n,seed,x0=0,y0=0,w=1600,h=900,col='#fff'){ const r=rnd(seed); let o=''; for(let i=0;i<n;i++){const x=x0+r()*w,y=y0+r()*h,s=r()*1.6+.3; o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.toFixed(2)}" fill="${col}" opacity="${(.4+r()*.6).toFixed(2)}"/>`;} return o; }

   {lines:['（牠停在懸浮棲息環的最高處，金黃色的眼睛一動也不動地看著你，耳翼微微轉向你的方向。）','……這裡的風，是從哪裡吹來的？'],choices:[{t:'是列車航行時帶起的氣流。',r:'列車的風。沒有山的味道，但是很穩。……我可以在這裡停一下嗎？'},{t:'你是從哪裡飛進來的？',r:'我只是跟著一陣橫風滑翔。回過神來，就在這裡了。'}]},
   {lines:['（牠收起雙翼，羽毛在車廂的光下泛出淡淡的粉紫。）','你們這裡的光，跟山上的晨光很像。斜斜的，很好藏起來。','……我是說，很好休息。'],choices:[{t:'你在躲什麼嗎？',r:'沒有。只是習慣了。在山上，太容易被看見的東西，常常會被盯上。'},{t:'這裡很安全。',r:'嗯。我的耳朵也這麼說。這裡的風裡，沒有危險的聲音。'}]},
   {lines:['（牠從圓環上無聲地滑下來，停在離你近了一些的地方。）','山上採藥的人說，在雲裡看見我的影子，就會有好天氣。','我不知道是不是真的。不過，你的旅程，應該會很平安。'],choices:[{t:'謝謝你。',r:'（牠的耳翼輕輕抖了一下，像是在笑。）'}]}
  ],
  farewell:['風向變了。我聽得見。','前面有山的味道……很淡，但是我認得。','我要走了。如果哪天你在雲裡看見一道影子，那就是好天氣的意思。']
 },
 /* 淵光巨：去背後的動態立繪。資料來自設定稿。 */
 leviathaurora:{name:'淵光巨',type:'other',species:'Leviathaurora',zone:'spring',spot:{x:41,y:70},spriteH:24,ar:'580/340',color:'radial-gradient(circle,#cfe8ff,#2c5a9e)',
  image:'assets/leviathaurora.webp',still:'assets/leviathaurora-still.webp',studies:['assets/leviathaurora-s1.webp','assets/leviathaurora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'深海海溝・海底峽谷・無光層水域',
  intro:'在航向星河浮島的途中，從靈泉深處浮現的淵光巨。墨藍色的修長身軀上，幽藍的螢光沿著肌肉與脊椎的紋理流動，宛如深海中的星圖。',
  bio:'在無光的海底世界裡，淵光巨是少數優雅而巨大的流浪者。牠們緩慢地穿梭於沉睡的海溝與海底山脈之間，每一次尾鰭的擺動都伴隨著點點藍光在黑暗中劃出優美的軌跡。當牠游過海底荒漠時，體表的幽光常吸引無數微小的深海生物聚攏，遠看就像是一座攜帶星海在深淵中漫步的移動島嶼。傳說水手如果在暴風雨的夜裡看見海面下透出幽藍的光暈，那便是淵光巨正浮上海面換氣的寧靜時刻。',
  field:{alias:'深淵的星河、夜航者的燈塔、蔚藍孤影',cls:'深海巨獸／遠古游魚類',danger:'低（性格溫和，除非遭受嚴重威脅，否則不具攻擊性）',rarity:'稀有',rarityNote:'棲息於極深的海域，人類難以窺其全貌。',
   looks:'<b>身體構造：</b>擁有修長而流線型的巨型身軀，體長可達數十公尺。頭部寬大扁平，下顎延伸出數根細長的觸鬚，宛如古老的編織漁網。<br><b>顏色與紋理：</b>深邃如深海夜空的墨藍色與碳黑色外皮，皮膚表面佈滿天然的有機骨質紋理。體側與背脊處生有巨大的背鰭與流線型胸鰭，邊緣呈半透明的深邃藍色。<br><b>發光機制：</b>牠的全身各處分佈著生物發光器官（Photophores），能沿著軀幹的肌肉紋理與脊椎線條透出幽藍色的螢光，宛如深海中的星圖與神經網絡。',
   habitat:'常年籠罩在永夜與極度高壓中的深海海溝、海底峽谷，或陽光無法觸及的無光層水域。',
   habits:[['活動時間','全天候活動，但在黑暗的深海中，牠們的螢光脈絡在獵食或求偶時會變得格外閃耀。'],['飲食','屬於濾食性巨獸，利用下顎的長鬚與巨大的口腔過濾深海中的浮游生物、微小甲殼類及有機微粒。'],['性格','性情溫和、孤傲且極具包容性，通常獨自游弋，對外界的騷擾多半選擇避開或緩慢潛入更深的海域。']],
   abilities:[['生物冷光共鳴','能透過體表螢光頻率的變化與同類進行長距離的深海通訊，甚至能微幅干擾周遭的水流與光線。'],['深海壓強適應','體內擁有特殊的骨骼與組織結構，能完美承受千米之下的恐怖水壓，並在高速游動時將阻力降到最低。']]},
  stay:2,
  talks:[
   {lines:['（靈泉的水面一圈一圈地暗下去，像是突然變得很深。一道幽藍的光，從水底慢慢浮了上來。）','……這裡的水，很淺。也很亮。','不過，很安靜。我喜歡安靜的地方。'],choices:[{t:'你是從深海來的嗎？',r:'深海……是很遠的地方。那裡沒有光，所以我們自己發光。'},{t:'這裡夠你休息嗎？',r:'夠了。我不需要很大的地方，只需要不被打擾。'}]},
   {lines:['（牠身上的光點沿著脊椎一路亮起，又一顆一顆熄滅，像在數著什麼。）','這是我們說話的方式。用光，而不是聲音。','在深淵裡，聲音傳得太遠，會驚動太多東西。光只會讓想看見的人看見。'],choices:[{t:'那你剛才說了什麼？',r:'我說：這列車的光，很像海面。'},{t:'我看見了。',r:'嗯。那就夠了。'}]},
   {lines:['水手們說，暴風雨的夜裡看見海面下的藍光，就是平靜的時刻。','我只是浮上來換一口氣而已。','……不過，如果那能讓他們安心，也很好。'],choices:[{t:'你一直都是獨自一個嗎？',r:'大多數時候。深海很大，同伴的光要很久才看得見一次。所以每一次看見，都會記得很久。'}]}
  ],
  farewell:['水的味道變了。','前面有很深、很暗的地方，我聽得見它在呼喚。','謝謝這片安靜的水。如果有一天，你在很深的地方看見一片會移動的星光，那就是我。']
 },
 /* 燼風帆獸：去背後的動態立繪。資料來自設定稿。 */
 cinder:{name:'燼風帆獸',type:'other',species:'Cinder-Sail Courser',zone:'crystal',spot:{x:71,y:52},spriteH:34,ar:'1268/697',color:'radial-gradient(circle,#fff1d6,#c79a5e)',
  image:'assets/cinder.webp',still:'assets/cinder-still.webp',studies:['assets/cinder-s1.webp','assets/cinder-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'烈日沙漠（The Blazing Sands）',
  intro:'在列車駛向日界時，乘著熾熱光線登車的燼風帆獸。修長纖細的沙褐色身軀，背上兩片半透明的帆在光下透出琥珀色。',
  bio:'在烈日沙漠的邊緣，商隊正頂著熱浪緩慢前行。突然間，領隊的嚮導停下腳步，指向遠處的沙丘。一隻燼風帆獸正以一種不可思議的姿態出現。牠的四肢幾乎懸空，輕盈地在沙脊上滑行。陽光透過牠的背帆，呈現出琥珀色的光澤。牠似乎察覺到了商隊，轉過頭，那雙巨大的眼睛好奇地看著他們，隨即一個華麗的轉身，尾舵一擺，便消失在熱浪之中。<br>年輕的學徒驚訝地問道：「那是龍嗎？」<br>嚮導笑著搖頭：「不，孩子，那是沙漠的靈魂。牠們不需要火焰，因為牠們本身就擁有了太陽的力量。」',
  field:{nameNote:'這個名稱結合了其棲息地的熾熱意象（燼）、背部如船帆般的特徵（風帆），以及牠優雅且善於奔跑的形態（獸）。',
   alias:'日行舟（Sun-Sailer）：商旅對牠們的稱呼，因為牠們常在烈日下與商隊並行。<br>沙漠舞者（Desert Dancer）：當地遊牧民族對牠們輕盈步伐的讚譽。<br>偽龍（False-Drake）：因其外型與龍相似，但缺乏噴火能力而被賦予的貶稱。',
   cls:'荒漠亞龍類（Desert Archosaurian）<br>屬於一種古老的爬行類亞種，與真正的龍類有遠親關係，但在漫長的演化中適應了乾旱環境，演化出獨特的帆狀構造。',
   danger:'低（Low）',dangerNote:'除非你試圖捕捉一隻健康的成年燼風帆獸（這幾乎是不可能的），否則牠們對人類不構成威脅。牠們的防禦機制主要是逃跑。',
   rarity:'少見（Uncommon）',rarityNote:'雖然牠們適應了嚴酷的環境，但因為天敵較少且繁殖率不高，加上特殊的棲息地，人們並不容易見到牠們。只有經驗豐富的嚮導和遊牧民才知道在哪裡能找到這些優雅的沙漠舞者。',
   looks:'燼風帆獸擁有極為纖細而強韌的四肢，這使牠們在沙地上能進行高速且省力的奔跑。牠們的體態修長，覆蓋著細密、沙褐色的鱗片，鱗片紋理細緻，能完美融入乾旱地貌。<br>最顯眼的特徵是背部中央長出的兩片巨大的、半透明的肉膜狀帆。這些帆由纖細的骨質支架支撐，形狀如風帆般高聳。在圖片中，我們可以看到牠們的頸部、背部直到尾部都有一排棘刺，為背帆提供了額外的穩定性。牠們的頭部呈三角形，有一雙如黑曜石般巨大、深邃的眼睛，顯示其優秀的視覺能力。<br>牠們的尾巴末端有一個如船舵般的尾鰭，能在高速奔跑時幫助平衡和轉向。這種構造，加上背帆，讓牠們在沙漠中的移動方式更像是「航行」而非單純的奔跑。',
   habitat:'<b>烈日沙漠（The Blazing Sands）</b><br>主要棲息於廣闊無垠、終年烈日當空的沙漠深處，特別是那些有巨大岩層和沙丘交錯的區域。牠們的鱗片顏色能隨環境微妙變化，從淺金黃到深赭色，提供絕佳的保護色。',
   habits:[['活動時間','晝行性（Diurnal）。這在沙漠生物中相當罕見。牠們依賴白天的陽光來活化背帆的特殊功能。'],['飲食','食蟲與掘根（Insectivorous and Root-foraging）。牠們利用靈敏的視覺和嗅覺在沙下尋找昆蟲、幼蟲，以及富含水分的塊根植物。牠們的嘴部構造適合啄食。'],['群居或獨居','半群居（Semi-social）。雖然大部分時間單獨行動，但在繁殖季節或遷徙時，會形成小型的家族群落（約 3–5 隻）。'],['攻擊性與性格','溫和而警覺（Gentle and Alert）。牠們天性膽小，面對威脅通常選擇逃跑而非戰鬥。牠們的奔跑速度極快，能輕易甩開大多數捕食者。除非被逼入絕境，否則不會展現攻擊性。']],
   abilities:[['太陽能航行（Solar-Sailing）','這是燼風帆獸最核心的能力。牠們背部的巨大皮帆富含感光細胞與微血管網。在烈日下，這些帆會吸收大量的太陽能，轉化為微弱的生物電能。這種能量不直接用於攻擊，而是用以刺激肌肉，減少長距離奔跑時的能量消耗，並保持體溫。這讓牠們能以驚人的速度持續奔跑數小時而不顯疲憊。這也是為什麼牠們只在白天活動。'],['擬態帆（Mimicry-Sail）','在休息或遇到危險時，牠們能透過肌肉控制收起背帆，或將其張開。張開時，帆的紋理和陰影能模擬出遠處岩石的形狀，讓牠們在靜止時看起來像是一塊被風化的岩石，從而騙過捕食者。']]},
  stay:2,
  talks:[
   {lines:['（牠一出現就退到晶石平台的邊緣，背上的兩片帆半收半張，黑曜石般的大眼睛盯著你。）','……你不是商隊。','商隊會帶著水的味道。你身上，只有光的味道。'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈……沒聽過。不過，你沒有追過來。這樣就好。'},{t:'放心，這裡沒有人會抓你。',r:'每個人都這麼說。……不過你站得很遠。我相信站得遠的人。'}]},
   {lines:['（牠把背帆完全張開，對著晶石平台的光，帆面透出琥珀色。）','這裡的光不是太陽，可是很暖。','在沙漠裡，太陽下山以後我就不能跑了。在這裡，好像可以一直醒著。'],choices:[{t:'你喜歡奔跑嗎？',r:'不是喜歡或不喜歡。帆張開，風來了，腳就自己動了。就像你們的列車一樣。'},{t:'那你要好好休息。',r:'嗯。……我會把帆收一半。這是我們休息的樣子。'}]},
   {lines:['有人叫我們「偽龍」。因為我們長得像龍，卻不會噴火。','我不在意。火會燒掉東西，太陽不會。','嚮導說，我們是沙漠的靈魂。我比較喜歡這個名字。'],choices:[{t:'我也比較喜歡那個名字。',r:'（牠的尾舵輕輕擺了一下，像是在沙脊上轉了一個漂亮的彎。）'}]}
  ],
  farewell:['光的顏色變了。','前面有很亮、很熱的地方。我的帆在發燙。','我要下車了。如果你在熱浪裡看見一道琥珀色的帆影，不用叫住我。我跑得很快，但我會記得你。']
 },
 /* 艾莉絲（暮光耳廓鴞）：去背後的動態立繪。資料來自設定稿。 */
 aelis:{name:'艾莉絲',type:'other',species:'暮光耳廓鴞（Vespertine Fennec-Owl）',zone:'moss',spot:{x:16,y:79},spriteH:24,ar:'410/280',color:'radial-gradient(circle,#fff0dc,#d27a3c)',
  image:'assets/aelis.webp',still:'assets/aelis-still.webp',studies:['assets/aelis-s1.webp','assets/aelis-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'古老森林與沙漠交界的綠洲・乾旱岩石峽谷',
  intro:'在暮色中跳上列車的暮光耳廓鴞，名叫艾莉絲。一對巨大的狐狸耳朵、琥珀色的大眼睛，脖子上掛著刻有藤蔓與星辰圖案的葉形吊墜。',
  bio:'在古老沙漠的邊緣，流傳著關於「耳語者」的傳說。每當夜幕降臨，乾燥的風開始歌唱，這些精靈便會現身。據說，如果一個迷途的旅人在沙漠中遇見一隻佩戴著葉形吊墜的暮光耳廓鴞，並得到牠的指引，便能找到隱藏的綠洲或躲過致命的流沙。當地遊牧民族視牠們為沙漠的守護神，相信牠們是古老森林意志的延伸，在荒蕪中傳遞著生命的訊息。這隻名為「艾莉絲（Aelis）」的個體，因其特殊的吊墜，被認為是一位強大德魯伊的夥伴，甚至是信使。牠的身影總是在夕陽的最後一抹餘暉中出現，靈動地跳躍在沙丘與岩石之間，琥珀色的眼睛凝視著遠方，彷彿在傾聽大地的呼吸。',
  field:{alias:'沙狐貓頭鷹、耳語者、沙漠精靈',cls:'魔法混種／森林獸類（沙漠適應型）',
   danger:'低（Low）',dangerNote:'除非被逼入絕境，否則不會主動攻擊人類。',
   rarity:'稀有（Rare）',rarityNote:'僅在特定的沙漠與森林交界帶出現，且由於其謹慎的性格與夜行習性，極難被人類觀察到。佩戴吊墜的個體更是傳說中的存在。',
   looks:'<b>身體構造：</b>這種生物完美融合了貓頭鷹與耳廓狐的特徵。牠擁有圓潤、毛茸茸的貓頭鷹軀幹，覆蓋著柔軟、濃密的橙褐色絨毛，具有極佳的保溫與偽裝效果。牠的頭部比例較大，生有一對不成比例的巨大、靈活的狐狸狀耳朵，內側為淺奶油色，邊緣帶有深色毛尖。<br><b>臉部：</b>臉盤圓潤，有著巨大的、琥珀色的大眼睛，顯示其夜行性特徵。喙小而尖銳，隱藏在絨毛中。胸前的羽毛上帶有深褐色的斑點，類似樹皮紋理。<br><b>四肢與尾巴：</b>四肢強健，末端有著靈巧且銳利的爪子，覆蓋著深色毛髮。尾巴極為蓬鬆粗大，如同狐狸尾巴，末端有一撮明顯的白色絨毛，在平衡身體和夜間禦寒時起重要作用。<br><b>特殊飾物：</b>令人驚訝的是，這隻特定的「暮光耳廓鴞」脖子上佩戴著一條精緻的金屬細鏈，中央懸掛著一個刻有複雜藤蔓與星辰圖案的葉狀吊墜。這並非天生，而是象徵著牠與某個古老森林守護者種族的契約或共生關係。',
   habitat:'主要棲息於古老森林邊緣與廣闊沙漠交界處的綠洲地帶，或是乾旱岩石峽谷中的隱秘洞穴。牠們偏好日夜溫差極大、植被稀疏但水源充足的環境，這能同時發揮牠們的沙漠生存能力與夜間狩獵優勢。',
   habits:[['活動時間','嚴格的夜行性動物，黃昏與黎明時分最為活躍。'],['飲食','主要捕食在夜間活動的昆蟲、小型爬蟲類（如沙蜥）、小型夜行性齧齒動物以及果實。'],['群居或獨居','傾向於獨居或以極小的家庭單位（配偶與幼崽）行動。牠們的領域意識強烈，會利用尖銳的叫聲和氣味標記領地。'],['攻擊性及性格','牠們本質上是謹慎而好奇的。對陌生人通常保持距離，但若感到威脅，會發出如同狐狸尖叫與貓頭鷹鳴叫混合的刺耳聲響，並利用驚人的速度與敏捷性逃脫。牠們極為聰明，能輕易解決簡單的謎題或機關，表現出接近高等智慧生物的行為模式。']],
   abilities:[['聲納放大器','那對巨大的狐耳不僅能捕捉微小的聲音，還能透過細微的肌肉調整角度，形成類似生物聲納的系統，精確定位獵物在沙層下或岩石縫隙中的位置。'],['靜音飛行','保留了貓頭鷹羽毛的特殊結構，飛行時幾乎沒有聲音，能進行無聲的突襲。'],['視覺適應','琥珀色的大眼睛能在極低的光線下視物，並能短暫過濾強光，適應沙漠的刺眼陽光與星空。'],['自然共鳴（象徵）','佩戴吊墜的個體似乎能與周圍的自然能量產生微弱共鳴，這可能賦予了牠們預知沙塵暴或探測魔法能量的潛在能力，使牠們在惡劣環境中總能找到安全棲息地。']]},
  stay:2,
  talks:[
   {lines:['（一隻橙褐色的小生物停在自然棲台的邊緣，巨大的耳朵一轉，對準了你。）','……你的腳步聲很輕。','比旅人輕，比沙蜥重。你是誰？'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈。……森林的老人們說過，精靈的腳步是聽不見的。看來他們也會說錯。'},{t:'你的耳朵真大。',r:'大耳朵聽得見沙子底下的心跳。也聽得見你剛才偷偷笑了一下。'}]},
   {lines:['（牠用前爪輕輕撥了撥脖子上的葉形吊墜，藤蔓與星辰的紋路閃了一下。）','這是約定的記號，不是裝飾。','我答應過一位很老的朋友，要替他看看沙漠以外的世界，再回去告訴他。'],choices:[{t:'是什麼樣的朋友？',r:'他住在森林最深的地方，說話很慢，一句話要說一整個季節。……我只能說到這裡。'},{t:'那你要看得很仔細。',r:'我一直都看得很仔細。這是我的工作。'}]},
   {lines:['我叫艾莉絲。','沙漠的人叫我們「耳語者」。他們迷路的時候，會跟著我們找到綠洲。','如果有一天你迷路了……不對，你有一整列會自己走的車。你大概不會迷路。'],choices:[{t:'說不定還是會需要你。',r:'（牠尾巴尖那撮白毛輕輕搖了一下。）那我就在暮色裡等你。'}]}
  ],
  farewell:['暮色要來了。我聽得見風開始唱歌。','前面有森林的味道，也有沙的味道。那是我的地方。','我會把這列車的事告訴我的朋友。他會花一整個季節，慢慢聽完。']
 },
 /* 燼角巨獸：去背後的動態立繪。資料來自設定稿。 */
 pyro:{name:'燼角巨獸',type:'other',species:'Pyro-Cerasaurus',zone:'crystal',spot:{x:78,y:84},spriteH:28,ar:'498/280',color:'radial-gradient(circle,#ffd7a8,#7a2a14)',
  image:'assets/pyro.webp',still:'assets/pyro-still.webp',studies:['assets/pyro-s1.webp','assets/pyro-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'活火山帶・地殼裂隙頻繁的荒漠高原・熔岩峽谷',
  intro:'在赤紅天空下登車的燼角巨獸。漆黑的火山岩外皮佈滿裂縫，熔岩光在裂隙間流動；頭上的巨角像燃燒的木炭，仍散發著高溫。',
  bio:'在烈日與火山灰交織的荒原深處，燼角巨獸是當之無愧的霸主。當地人常說，當遠方的大地開始震動、天空被染成赤紅時，便是這位熔岩暴君在巡視牠的疆域。牠沉重的腳步每踏出一步，都會在地表留下冒煙的焦痕。獵人們對牠敬而遠之，因為任何貪婪的靠近，都將伴隨著被灰燼吞噬的命運。',
  field:{alias:'熔岩暴君、大地之傷',cls:'遠古巨獸／元素類巨獸',danger:'極高',rarity:'稀有',
   looks:'擁有如火山岩般堅硬、漆黑且佈滿裂縫的厚重外皮，裂隙間常年流淌著熾熱的熔岩光輝。<br>頭部前端長有一支巨大的角，其質地如同正在燃燒的木炭，頂端散發出猛烈的高溫與微光。<br>背部與尾巴覆蓋著一排銳利的鋸齒狀骨甲，兩側則生有巨大的蝙蝠狀皮革雙翼，翼膜邊緣殘破且帶有燃燒的痕跡。<br>雙眼呈赤紅色，猶如燃燒的火球，散發出威嚴而暴戾的氣息。',
   habitat:'活躍於活火山帶、地殼裂隙頻繁的荒漠高原，以及被熔岩流覆蓋的乾涸峽谷。',
   habits:[['活動時間','日夜皆可活動，但在地表溫度較高的午後顯得特別活躍。'],['飲食','肉食性，主要獵食大型地下岩棲生物，同時亦會吞食富含礦物質的高溫熔岩與金屬礦石以補充能量。'],['性格','極度孤僻且具強烈的領地意識，脾氣暴躁，對於闖入其領地的生物會毫不留情地發動毀滅性攻擊。']],
   abilities:[['熔岩核心','能夠將體內的熱能高度集中於頭部的巨角與背部裂隙中，進行蓄力衝撞或釋放高溫熱浪。'],['重甲護體','堅硬的岩質皮膚能免疫大部分物理攻擊與烈焰灼燒。']]},
  stay:2,
  talks:[
   {lines:['（棲息車廂的溫度一下子升高了。晶石平台前，一頭漆黑的巨獸低伏著，裂隙間的熔岩光一明一暗。）','……退後。','這不是你的地盤，也不是我的。在弄清楚之前，不要靠近。'],choices:[{t:'（停在原地）我不會靠近。',r:'……嗯。至少你聽得懂。'},{t:'這裡是列車，不屬於任何人。',r:'不屬於任何人的地方……我沒待過那種地方。'}]},
   {lines:['（牠的巨角頂端還在發燙，但背上的熔岩光暗了一些。）','這輛車在搖。很穩地搖。','在火山那裡，大地搖起來的時候，是在發怒。這裡不是。'],choices:[{t:'你可以在這裡休息。',r:'休息。……我很久沒有用過這個詞。'},{t:'晶石平台的光，夠你補充能量嗎？',r:'不夠熱。不過……不難受。'}]},
   {lines:['人們叫我「大地之傷」。','他們說我走過的地方，都會留下焦痕。那是真的。','但這輛車的地板，一道痕跡也沒有。……我走得很小心。'],choices:[{t:'謝謝你這麼小心。',r:'（牠哼出一口帶著火星的熱氣，轉過頭去，像是不想讓你看見牠的表情。）'}]}
  ],
  farewell:['地底的聲音在叫我。很熱，很深。','那裡才是我的地盤。','……這輛車，我記住了。如果哪天大地為你們震動，那不是我在發怒。']
 },
 /* 翡翠晶甲夜行獸：去背後的動態立繪。資料來自設定稿。 */
 vandora:{name:'翡翠晶甲夜行獸',type:'other',species:'Vandora Prism-Anuran',zone:'moss',spot:{x:24,y:61},spriteH:20,ar:'479/280',color:'radial-gradient(circle,#d8ffe9,#1f6a5a)',
  image:'assets/vandora.webp',still:'assets/vandora-still.webp',studies:['assets/vandora-s1.webp','assets/vandora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'熱帶雨林深處・巨型蕨葉之上・幽暗溪流沼澤邊',
  intro:'在夜色裡無聲登車的翡翠晶甲夜行獸。墨藍與深綠的鱗甲泛著寶石般的虹彩，頭側細長的翠綠觸鬚輕輕顫動，金黃色的雙眼在暗處一眨也不眨。',
  bio:'在雨林巨大的姑婆芋葉上，翡翠晶甲夜行獸正低伏著身體，嘴邊細長的觸鬚在微風中輕輕顫動。牠那寶石般閃耀的身軀與周圍的濃密綠意融為一體，是雨林中令人驚艷又敬畏的隱形獵手。',
  field:{alias:'雨林翡翠、苔原幻影',cls:'兩棲獸類／森林變異爬行種',danger:'中',rarity:'少見',
   looks:'外型介於巨貓與神話兩棲類之間，皮膚覆蓋著具有金屬光澤的墨藍與深綠色鱗甲，在光線下會折射出如寶石般的虹彩。頭部兩側長有如空氣鳳梨般細長的翠綠色觸鬚，雙眼呈銳利的金黃色。',
   habitat:'常年潮濕的熱帶雨林深處、巨型蕨類植物的葉片上或幽暗的溪流沼澤邊。',
   habits:[['活動時間','夜行性。'],['性格','性格敏捷、狡黠且具有強烈的領域性。'],['飲食與狩獵','以雨林中的昆蟲、小型爬蟲及樹液為食，擅長利用環境色進行無聲的伏擊。']],
   abilities:[['虹彩折射與觸鬚感應','體表鱗片能隨意折射光線達到光學迷彩的效果；頭部的翠綠觸鬚能極其靈敏地捕捉空氣中微小的濕度與震動變化。']]},
  stay:2,
  talks:[
   {lines:['（自然棲台的苔葉間，有一塊綠色忽然「動」了一下。仔細看，才發現那是一頭低伏的生物，鱗甲的顏色和葉子一模一樣。）','……你看見我了。','很少有東西能先看見我。通常是我先看見它們。'],choices:[{t:'是你的眼睛出賣了你。',r:'（金黃色的眼睛瞇了起來。）……下次我會閉上一隻。'},{t:'我只是剛好往這裡看。',r:'剛好。雨林裡沒有剛好。不過……這裡不是雨林。'}]},
   {lines:['（牠頭側的翠綠觸鬚慢慢舒展開，在空氣裡輕輕擺動，像在聞什麼。）','這裡的空氣太乾了。不過，有水的味道，從那邊的泉水飄過來。','還有震動。很規律、很穩的震動。這輛車一直在跑。'],choices:[{t:'你的觸鬚感覺得到這麼多？',r:'濕度、風、腳步。你走過來的時候，我在你說話之前就知道了。'},{t:'要我把車廂調得濕一點嗎？',r:'……不用。我會待在葉子底下。這樣就夠了。'}]},
   {lines:['（牠的鱗甲在車廂的燈光下泛起一層虹彩，一閃，又和苔綠融在一起。）','雨林的人叫我「苔原幻影」。他們說，看見我的時候，通常已經太晚了。','……我不會在這裡打獵。這裡不是我的領地。我分得清楚。'],choices:[{t:'謝謝你這麼說。',r:'不用謝。我只是不喜歡在別人的地盤上弄髒爪子。（牠的觸鬚輕輕抖了一下，像是在笑。）'}]}
  ],
  farewell:['空氣變濕了。我聞得到樹液和泥土的味道。','天快要黑了。那是我醒來的時間。','我要回葉子上去了。如果哪天你在雨林裡覺得有一片綠色在看你，不用找。那是我在跟你打招呼。']
 },
 /* 霜脊冰原獸：去背後的動態立繪。資料來自設定稿。 */
 frost:{name:'霜脊冰原獸',type:'other',species:'Frost-Ridge Ice-Beast',zone:'crystal',spot:{x:50,y:88},spriteH:22,ar:'570/300',color:'radial-gradient(circle,#f4fbff,#7fb4d8)',
  image:'assets/frost.webp',still:'assets/frost-still.webp',studies:['assets/frost-s1.webp','assets/frost-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'高海拔冰原・極圈冰川裂谷・極寒山脈',
  intro:'在駛向月界的寒氣裡登車的霜脊冰原獸。乳白色的厚重絨毛間，脊背與尾巴上的冰晶硬甲泛著微藍的光暈；一雙冰川般湛藍的眼睛，安靜地打量著車廂。',
  bio:'在極北之境的「萬古冰原」深處，霜脊冰原獸被當地原住民視為冰川之神的守望者。當暴風雪呼嘯而過、天地一片蒼茫之時，獵人往往只能看見一雙在風雪中幽藍髮光的雙眼，以及背脊上如冰刺般掠過的寒芒。牠們輕巧而寂靜地穿梭在數米深的厚雪之上，彷彿與周遭的冰山雪景融為一體，是這片白色禁區中無可動搖的頂級掠食者。',
  field:{alias:'冰原的白色追獵者、凝光雪獅、永凍之魂',cls:'極地巨型獸類／元素獸屬',
   danger:'高',dangerNote:'具備強大的物理破壞力與極度致命的嚴寒氣場',
   rarity:'稀有',rarityNote:'僅在極深處的無人冰原偶爾可見，極難被馴服或捕捉',
   looks:'體格龐大而結實，身形介於大型貓科動物與巨熊之間，覆蓋著一層厚重的乳白色稠密絨毛。其脊椎骨兩側、尾巴以及前肢局部，生長著半透明的冰晶狀硬甲與倒刺，這些冰晶在寒光下會折射出微藍的光暈。牠的頭部具有貓科動物般的輪廓，耳尖帶有銳利的黑色簇毛，雙眼呈現出如深谷冰川般的明亮湛藍色，面部與四肢的細密絨毛間也隱約鑲嵌著天然的晶體結構。',
   habitat:'常年被風雪覆蓋的高海拔冰原、極圈冰川裂谷，以及人跡罕至的極寒山脈。牠們多數時間棲息於避風的冰洞或岩縫中。',
   habits:[['活動時間','日夜皆宜，但在漫長而昏暗的極夜與暴風雪天氣中表現得最為活躍。'],['飲食','肉食性，主要捕獵冰原上的耐寒大型草食獸或冰角鹿。'],['社會結構','多數時間過著獨居生活，僅在嚴冬的繁殖季節短暫聚集。'],['性格與攻擊性','性格沉穩、警惕且極具領地意識。雖然不會無故主動攻擊過路旅人，但若被侵擾或感受到威脅，會展現出極具壓迫性的強大戰意。']],
   abilities:[['冰晶折射與偽裝','能夠將周遭的寒氣凝聚在體表的冰晶上，在暴風雪中形成完美的視覺折射，達到近似隱形的偽裝效果。'],['極寒爪擊','利爪與足底覆蓋著極低溫的寒霜，每一次踏地或揮擊都能瞬間凍結接觸面的水分或獵物的表皮。']]},
  stay:2,
  talks:[

/* ---------- 狀態 ---------- */
function freshState(){ return {
 v:1, introDone:false, journeyCount:0, currentLocation:'origin', currentCarriage:'observation', currentPhase:'docked',
 duty:dutyFresh(), spirit:{contamination:null,contaminationLog:[],equipment:{tablet:false,compass:false,talisman:false}}, voyage:null,
 passengers:{}, completedEvents:[], pendingEvents:[], unlockedLocations:['dawnForest','starIslands'], visitedLocations:[],
 view:{}, seen:{}, discoveredLifeforms:[], collectibles:['seed_ancient_a','seed_ancient_b','seed_ancient_c'], clues:[], storyFlags:{natureLight:'dawn'},
 culture:null, log:[{j:0,t:'列車在沉睡之地甦醒。精靈接下了列車的值勤職責。'}]
};}
let state = load() || freshState();
function load(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return s&&s.v===1? Object.assign(freshState(),s):null; }catch(e){ return null; } }
function save(){ try{ state.savedAt=Date.now(); localStorage.setItem(SAVE_KEY,JSON.stringify(state)); }catch(e){} }

const aboard = id => !!(state.passengers[id]&&state.passengers[id].aboard);
const done = id => state.completedEvents.includes(id);
function complete(id){ if(!done(id)) state.completedEvents.push(id); state.pendingEvents=state.pendingEvents.filter(e=>e!==id); save(); }
function logJ(t){ state.log.push({j:state.journeyCount,t}); save(); }
function addItem(id,quiet){ if(!state.collectibles.includes(id)){ state.collectibles.push(id); save(); if(!quiet) toast('收藏：'+COLLECTIBLES[id].name); return true;} return false; }
function addClue(id){ if(!state.clues.includes(id)){ state.clues.push(id); save(); setTimeout(()=>toast('守護者線索 +1'),300); } }
const STAGE_NAMES=['陌生','認識','熟悉','留下重要回憶'];

/* ---------- 版面與舞台 ---------- */
function layout(){
 const W=innerWidth,H=innerHeight, st=$('#stage'); let w,h;
 const pv=isPanoView();
 if(W/H>=16/9){ h=H; w=H*16/9; } else if(W/H>1.15){ w=W; h=W*9/16; } else if(pv){ w=W; h=H; } else { h=Math.min(H*.78,W*1.25); w=h*16/9; }
 st.style.width=w+'px'; st.style.height=h+'px';
 const vp=$('#viewport'); const pan=w>W+2; $('#panhint').hidden=!pan;
 if(pan && !layout.centered){ vp.scrollLeft=(w-W)/2; layout.centered=true; }
 if(!pan) layout.centered=false;
 if(PANO.active) panoResize();
}
addEventListener('resize',layout);
$('#viewport').addEventListener('scroll',()=>{ $('#panhint').style.opacity=0; },{passive:true});

function svgScene(inner){ return `<svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${ART.defs}${inner}</svg>`; }
function hs(x,y,label,act,cls=''){ return `<button class="hs ${cls}" style="left:${x}%;top:${y}%" data-act="${act}"><span class="mk"></span><span class="lb">${label}</span></button>`; }
function dust(n=14){ let o='<div class="dust">'; const r=rnd(n*7); for(let i=0;i<n;i++) o+=`<i style="left:${r()*100}%;top:${40+r()*55}%;animation-delay:${(r()*9).toFixed(1)}s"></i>`; return o+'</div>'; }

function neighbors(car){ const i=TRAIN.indexOf(car); return {fwd:TRAIN[i-1],back:TRAIN[i+1]}; }

function render(){
 layout();
 const sc=$('#scene'); let h='', panoView=null;
 if(state.currentPhase==='outside'){ h=renderOutside(); }
 else {
  const c=state.currentCarriage, C=CARRIAGES[c], nb=neighbors(c);
  if(isPanoView()){
   panoView=c;
   h+=`<div id="pano" class="pano"><div class="pano-loading">環景載入中</div>${dust()}<div class="vignette"></div><div id="phs" class="phs"></div>${state.storyFlags.panoHintDone?'':'<div class="pano-hint">‹ 拖曳環顧 360° ›</div>'}</div>`;
  } else {
  if(c==='cab') CAB.begin();
  if(c==='observatory'&&state.currentPhase==='voyage') h+='<canvas class="streaks" id="streaks"></canvas>';
  h += C.image? `<img class="bg" src="${C.image}" alt="${C.name}">` : svgScene(ART.car[c](state));
  h += dust();
  h += '<div class="vignette"></div>';
  h += hsRender(c);  // 統一熱點：物件＋相鄰車廂入口
  }
 }
 sc.innerHTML=h; if(panoView) panoMount(panoView); else PANO.active=null; if($('#streaks')) STREAK.start(); renderHUD(); save(); if(RUNNING){ scheduleAutoThumb(); SFX.ambient(HS_SCENE()); }
}

function renderOutside(){ const L=LOCATIONS[state.currentLocation]; return svgScene(L.art())+dust(20)+'<div class="vignette"></div>'+hsRender('out:'+state.currentLocation); }

function renderHUD(){
 const L=LOCATIONS[state.currentLocation], ph=state.currentPhase, v=state.voyage;
 const cars=TRAIN.map(c=>`<span class="car ${c==='cab'?'loco':''} ${c==='observatory'?'tail':''} ${c===state.currentCarriage&&ph!=='outside'?'on':''}" title="${CARRIAGES[c].name}"></span>`).join('');
 const head = ph==='voyage'&&v ? `<div class="realm">自動航行中</div><div class="name">前往 ${LOCATIONS[v.to].name}</div><div class="meta"><span class="vbar"><i id="vprog" style="width:${(v.progress*100).toFixed(1)}%"></i></span>旅程 <b>${state.journeyCount}</b></div>`
  : `<div class="realm">${L.realm}・${L.domain}</div><div class="name">${L.name}</div><div class="meta">旅程 <b>${state.journeyCount}</b>　乘客 ${Object.keys(PASSENGERS).filter(aboard).length}</div>`;
 const where = ph==='outside' ? '列車外' : CARRIAGES[state.currentCarriage].short;
 const pend = state.pendingEvents.filter(id=>EVENTS[id]).slice(0,2).map(id=>`<button class="evt" data-act="event:${id}">${EVENTS[id].title}</button>`).join('');
 $('#hud').innerHTML=`<div class="loc">${head}</div>
 <div class="train" aria-label="車廂位置">${cars}<span class="cn">${where}</span></div>
 <div class="right">${pend}<span class="phase">${ph==='docked'?'停靠中':ph==='outside'?'外部探索':'航行中'}</span><button class="snd ${PREFS.sound===false?'off':''}" data-act="sound:toggle" aria-label="音效開關">♪</button></div>`;
}

/* ---------- 互動派發 ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const [k,v]=b.dataset.act.split(':'); act(k,v); });
function act(k,v){
 switch(k){
  case 'go': return moveTo(v);
  case 'exit': if(state.currentPhase!=='docked') return toast('航行中無法離開列車');
   if(state.currentLocation==='origin') return toast('列車停泊在沉睡之地，這裡無法下車');
   return transition(()=>{ state.currentPhase='outside'; logOnce('outside_'+state.currentLocation+'_'+state.journeyCount,'走出列車，踏上'+LOCATIONS[state.currentLocation].name+'。'); },null,true);
  case 'back': return transition(()=>{ state.currentPhase='docked'; state.currentCarriage='habitat'; },null,true);
  case 'talk': return talk(v);
  case 'event': { const ev=EVENTS[v]; if(ev&&!done(v)){ complete(v); ev.run(); renderHUD(); } return; }
  case 'reunion': return reunion(v);
  case 'zone': return zoneInfo(v);
  case 'sound': PREFS.sound=PREFS.sound===false; savePrefs(); if(PREFS.sound===false){ SFX.stopDrone(); SFX.ambient(null); } else { SFX.init(); if(state.currentPhase==='voyage') SFX.startDrone(); SFX.ambKey=null; SFX.ambient(HS_SCENE()); } renderHUD(); return toast(PREFS.sound===false?'音效已關閉':'音效已開啟');
  default: return (INTERACT[k+':'+v]||(()=>{}))();
 }
}
function logOnce(key,t){ if(!state.storyFlags[key]){ state.storyFlags[key]=1; logJ(t); } }

function checkCarriageEvents(){
 Object.entries(EVENTS).forEach(([id,ev])=>{ if(ev.trigger==='carriage'&&ev.car===state.currentCarriage&&!done(id)&&!state.pendingEvents.includes(id)&&ev.need()){ state.pendingEvents.push(id); toast('新的事件：'+ev.title); } });
 renderHUD(); save();
}

 'nat:special'(){ const seen=state.clues.includes('clue_ring'); panel(`<div class="eyebrow">特殊植物</div><h2>守望藤</h2><p>列車甦醒時，它是唯一一株還活著的植物。藤蔓會朝向列車前進的方向。</p>${seen?'<p>當你靠近時，它的葉子排列成一個圓環，和晨曦森林古樹上的刻痕一樣。</p>':'<p style="color:var(--mute)">葉片似乎在排列成某種圖形，但你還認不出來。</p>'}`); },
 /* 典藏車廂 */
 'mem:log'(){ panel(`<div class="eyebrow">旅程之書</div><h2>旅程紀錄</h2><ul class="log">${state.log.slice().reverse().map(l=>`<li><span class="j">No.${l.j}</span><span>${l.t}</span></li>`).join('')}</ul>`); },
 'mem:items'(){ itemsPanel(); },
 'mem:clues'(){ panel(`<div class="eyebrow">古代資料保存裝置</div><h2>守護者線索</h2><p style="color:var(--mute)">${state.clues.length} / ${CLUE_ORDER.length} 片段已讀取</p>${CLUE_ORDER.map(id=>state.clues.includes(id)?`<div class="clue"><b>${CLUES[id].title}</b><br>${CLUES[id].text}</div>`:`<div class="clue unk">— 尚未讀取的片段 —</div>`).join('')}`); },
 'mem:save'(){ savePanel('game'); },
 /* 火車頭：整備前廊與駕駛室 */
 'prep:scan'(){ scanPanel(); },
 'prep:equip'(){ equipPanel(); },
 'prep:brief'(){ briefPanel(); },
 'cab:signal'(){ cabSignal(); },
 'cab:doors'(){ cabDoors(); },
 'cab:dragon'(){ dragonTalk(); },
 'cab:core'(){ const voy=state.currentPhase==='voyage'; panel(`<div class="eyebrow">火車頭駕駛室</div><h2>列車狀態晶核</h2><p>晶核以光色回報每一節車廂的狀態。目前全部呈現穩定的淡藍色。</p><ul class="checks">${TRAIN.map(c=>`<li class="ok">${CARRIAGES[c].name}・正常</li>`).join('')}</ul><p style="color:var(--mute)">${voy?`自動航行中・前往${LOCATIONS[state.voyage.to].name}`:`停靠中・下一站 ${LOCATIONS[nextStop()].name}`}　乘車中的生命 ${Object.keys(PASSENGERS).filter(aboard).length}</p>`); },
 'cab:runes'(){ const voy=state.currentPhase==='voyage', to=voy?state.voyage.to:nextStop(); panel(`<div class="eyebrow">星軌羅盤座</div><h2>航向：${LOCATIONS[to].name}</h2><p>這裡沒有方向盤，也沒有操作桿。列車依航程自動行駛，羅盤座只負責感應前方航道與空間異常。</p><p>${state.spirit.equipment.compass?'你隨身的星軌羅盤與座台同步，指向同一個方向。':'你還沒有領取隨身的星軌羅盤。'}</p><p style="color:var(--mute)">空間異常：未偵測到</p>`); },
 /* 火車尾展望台 */
 'obs2:view'(){ const voy=state.currentPhase==='voyage'; panel(voy?`<div class="eyebrow">火車尾展望台</div><h2>遠去的星光</h2><p>經過的星點從身邊掠過，越縮越小，退回列車後方的黑暗裡。從這裡看，航道像一條慢慢收起來的光帶。</p><p style="color:var(--mute)">剛剛離開：${LOCATIONS[state.voyage.from].name}</p>`:`<div class="eyebrow">火車尾展望台</div><h2>${LOCATIONS[state.currentLocation].name}</h2><p>${LOCATIONS[state.currentLocation].desc}</p><p style="color:var(--mute)">從列車最後端看出去，停靠站像一幅還沒畫完的風景。</p>`); },
 'obs2:rail'(){ panel(`<div class="eyebrow">火車尾展望台</div><h2>雕花扶手</h2><p>扶手被磨得很光滑，雕花藤蔓在末端收成一個小小的圓環。站在這裡的人，大概都習慣把手放在同一個位置。</p>`); },
 'obs2:lamp'(){ panel(`<div class="eyebrow">火車尾展望台</div><h2>尾燈</h2><p>列車最後一盞燈。不論停靠或航行，它都一直亮著，好讓後面的什麼東西知道列車往哪裡去了。</p>`); },
 /* 外景 */
 'out:tree'(){ panel(`<div class="eyebrow">晨曦森林</div><h2>古樹</h2><p>樹幹寬得要花上一段時間才能走完一圈。樹皮上有被撫摸過很多次的痕跡，但這片森林沒有人類來過。</p><p>樹冠裡傳來很輕的、像是在數數的聲音。</p>`); },
 'out:ring'(){ const first=!state.collectibles.includes('relic_ring'); addItem('relic_ring',true); addClue('clue_ring'); if(first) logJ('在古樹上發現與列車相同的圓環刻痕，留下拓印。');
  panel(`<div class="eyebrow">遺跡</div><h2>古樹上的圓環</h2><p>一個刻進樹心的圓環，內有十字。你回頭看了一眼列車，車門上方的紋樣和它完全相同。</p><p>${first?'你小心地拓下了這個圖案。':'拓印已收進記憶典藏車廂。'}</p>`); },
 'out:moss'(){ panel(`<div class="eyebrow">晨曦森林</div><h2>林間光苔</h2><p>只在晨光最斜的時候發亮的苔蘚。人類經過時，它們會在同一瞬間熄滅，所以從來沒有被記錄過。</p>`); },
 'out:crystal'(){ const f=addItem('crystal_echo',true); if(f) logJ('在星河浮島取得一塊會傳出潮汐聲的晶體碎片。'); panel(`<div class="eyebrow">星河浮島</div><h2>漂浮晶體</h2><p>晶體在吸收星光，表面的光一層一層往內沉。${f?'一塊碎片自己剝落，落進你手裡。':'碎片已經收藏在典藏車廂。'}</p>`); },
 'out:spore'(){ const f=addItem('seed_starspore',true); if(f){ logJ('在晶體縫隙找到星塵孢子。'); toast('取得種子：星塵孢子'); } panel(`<div class="eyebrow">星河浮島</div><h2>晶體縫隙</h2><p>縫隙裡卡著幾顆發著微光的孢子，隨著星河的節奏一脹一縮。${f?'你收集了一顆，放進種子保存櫃也許能種出什麼。':''}</p>`); },
 'out:river'(){ panel(`<div class="eyebrow">星河浮島</div><h2>星河</h2><p>不是水，是大量緩慢移動的光。浮島在上面漂流，偶爾有一座島被潮汐帶離河道，再也看不見。</p>`); }
};

/* ================================================================
   值勤系統：整備前廊（量測・裝備・星途符牒）→ 駕駛室（號誌・車門聯鎖）→ 向領頭報備 → 自動出發
   ================================================================ */
const NPCS = { dragon:{name:'曦淵・領頭', art:()=>ART.portrait.dragon()} };
const ROUTE = ['dawnForest','starIslands'];   /* 既定航程：依序循環停靠已開放的站點 */
const ROUTE_INFO = {
 dawnForest:{speed:'星潮七節（界壁區間限三節）',order:'晨霧帶延伸至月台外緣，進站前鳴鈴兩聲。',warn:'日界時間流動穩定；車外光苔怕驚擾，停靠時請熄去車頭燈。'},
 starIslands:{speed:'星潮九節（浮島航道限五節）',order:'星河潮汐偏高，車廂連接處保持關閉。',warn:'穿越日月界壁時，車廂內可能出現不明光紋。'}
};
const EQUIP = {
 tablet:{name:'星途符牒',desc:'一片能懸浮在空中的薄型光晶，以符文與星圖記錄本次車次與停靠路線。'},
 compass:{name:'星軌羅盤',desc:'感應列車前方的星際航道，顯示目前航向與空間異常。'},
 talisman:{name:'界域護符',desc:'保護小精靈免受異界環境影響，會依照航程浮現不同的防護紋。'}
};
function dutyFresh(){ return {scan:false,briefing:false,signal:false,doors:false,reported:false}; }
function equipAll(){ const e=state.spirit.equipment; return !!(e.tablet&&e.compass&&e.talisman); }
function prepDone(){ const d=state.duty; return !!(d.scan&&equipAll()&&d.briefing); }
function nextStop(){ const cur=state.currentLocation; const i=ROUTE.indexOf(cur); return i<0?ROUTE[0]:ROUTE[(i+1)%ROUTE.length]; }
function trainNo(){ return `日月 ${String(state.journeyCount+1).padStart(3,'0')} 次`; }
function talismanEffect(dest){ return LOCATIONS[dest].realm==='日界'?'晨曦紋：抵禦日界時間流的沖刷':'月輝紋：穩定異界的重力與意念干擾'; }

/* 整備前廊：符文鎖提示 */
function prepGate(){ const d=state.duty;
 panel(`<div class="eyebrow">駕駛室門・符文鎖</div><h2>尚未完成值勤準備</h2><p>符文鎖只為準備完成的值勤者開啟。</p>
 <ul class="checks">${[['身體污染值量測',d.scan],['領取航程裝備',equipAll()],['核對星途符牒',d.briefing]].map(([t,o])=>`<li class="${o?'ok':''}">${t}</li>`).join('')}</ul>`); }

/* 3-1 身體污染值量測 */
function scanResult(r){ return `<div class="rune-res"><span class="rune-dot"></span><div><b>界染度 ${r.value} / 100</b><br>判定：${r.level}・可以值勤</div></div><p style="color:var(--mute);font-size:13px">低於 20 為純淨；20–50 為微染，需要淨化；高於 50 不得值勤。</p>`; }
function scanPanel(){ const c=state.spirit.contamination, did=state.duty.scan;
 const ov=panel(`<div class="eyebrow">整備前廊・淨界晶環</div><h2>身體污染值量測</h2>
 <div class="scan"><svg viewBox="0 0 300 360" class="scan-svg ${did?'ok':''}" aria-hidden="true">
  <ellipse cx="150" cy="335" rx="80" ry="12" fill="#9a8cff" opacity=".35"/>
  <ellipse cx="108" cy="170" rx="40" ry="72" transform="rotate(-25 108 170)" fill="#e7e2ff" opacity=".35"/><ellipse cx="192" cy="170" rx="40" ry="72" transform="rotate(25 192 170)" fill="#e7e2ff" opacity=".35"/>
  <circle cx="150" cy="92" r="30" fill="#fbf8ff"/><path d="M150 122 C 120 142 115 232 125 302 H 175 C 185 232 180 142 150 122 Z" fill="#fbf8ff"/>
  <g class="ring"><ellipse cx="150" cy="58" rx="84" ry="16" fill="none" stroke="#e8c983" stroke-width="4"/><ellipse cx="150" cy="58" rx="100" ry="24" fill="none" stroke="#e8c983" stroke-width="1" opacity=".5" stroke-dasharray="3 6"/></g>
 </svg><div id="so">${did&&c?scanResult(c):'<p>懸浮的晶環會從頭到腳掃過一次，以光色顯示界染程度。</p>'}</div></div>
 <div class="row"><button class="btn" id="sb">${did?'重新量測':'啟動晶環'}</button></div>`);
 ov.querySelector('#sb').onclick=e=>{ const svg=ov.querySelector('.scan-svg'), b=e.currentTarget; svg.classList.remove('run','ok'); void svg.getBoundingClientRect(); svg.classList.add('run'); b.disabled=true;
  ov.querySelector('#so').innerHTML='<p>晶環掃描中……</p>'; SFX.tone(660,0,2,'sine',.03);
  setTimeout(()=>{ const v=3+Math.floor(Math.random()*10), res={value:v,level:'純淨',journey:state.journeyCount,at:Date.now()};
   state.spirit.contamination=res; state.spirit.contaminationLog.push(res); state.duty.scan=true;
   logJ(`值勤量測：界染度 ${v}/100，判定「純淨」。`); save();
   const so=ov.querySelector('#so'); if(so) so.innerHTML=scanResult(res); svg.classList.add('ok'); b.disabled=false; b.textContent='重新量測'; SFX.tone(1318,0,.8,'sine',.04); render(); },2500); };
}
/* 3-2 裝備領取 */
function equipPanel(){ const e=state.spirit.equipment, dest=nextStop();
 const icon={tablet:`<polygon points="50,14 82,32 82,68 50,86 18,68 18,32" fill="#dff4ff" stroke="#fff" stroke-width="2"/><path d="M32 44 H68 M32 54 H60 M32 64 H64" stroke="#5a6bb0" stroke-width="3"/>`,
  compass:`<circle cx="50" cy="50" r="32" fill="none" stroke="#e8c983" stroke-width="5"/><path d="M50 22 L 58 50 L 50 78 L 42 50 Z" fill="#fff6d8"/>`,
  talisman:`<path d="M50 18 A 32 32 0 1 0 50 82 A 22 22 0 1 1 50 18 Z" fill="#e2d6ff"/><circle cx="60" cy="50" r="8" fill="#fff6d8"/>`};
 const ov=panel(`<div class="eyebrow">整備前廊・裝備台</div><h2>領取航程裝備</h2><p>三件裝備懸浮在台座上方，輕觸即可領取。</p>
  <div class="grid">${Object.entries(EQUIP).map(([k,q])=>`<button class="card ${e[k]?'got':''}" data-eq="${k}"><div class="art"><svg viewBox="0 0 100 100">${icon[k]}</svg></div><div class="t">${q.name}</div><div class="s">${e[k]?'已領取':'輕觸領取'}</div></button>`).join('')}</div><div id="eqd"></div>`);
 const show=k=>{ const extra = k==='compass'?`目前航向：${LOCATIONS[dest].name}（${LOCATIONS[dest].realm}）。航道上沒有偵測到異常。`:k==='talisman'?`本次航程的防護：${talismanEffect(dest)}。`:`已記錄車次 ${trainNo()}，預定停靠 ${LOCATIONS[dest].name}。`;
  ov.querySelector('#eqd').innerHTML=`<p><b>${EQUIP[k].name}</b>　${EQUIP[k].desc}</p><p style="color:var(--gold)">${extra}</p>`; };
 ov.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{ const k=b.dataset.eq;
  if(!e[k]){ e[k]=true; b.classList.add('got'); b.querySelector('.s').textContent='已領取'; SFX.tone(1046,0,.9,'sine',.04); logJ(`領取了${EQUIP[k].name}。`); save(); render(); if(equipAll()) toast('航程裝備已全部領取'); }
  show(k); });
}
/* 任務資訊核對（星途符牒） */
function briefPanel(){ if(!state.spirit.equipment.tablet) return toast('請先在裝備台領取星途符牒');
 const dest=nextStop(), L=LOCATIONS[dest], ri=ROUTE_INFO[dest]||{};
 const items=[['今日駕駛車次',trainNo()],['預定停靠站',`${L.name}（${L.realm}・${L.domain}）`],['航行速限',ri.speed||'—'],['臨時航行注意命令',ri.order||'無'],['特殊界域警告',ri.warn||'無']];
 const chk=items.map(()=>state.duty.briefing);
 const ov=panel(`<div class="eyebrow">星途符牒</div><h2>核對值勤資訊</h2><p>符牒上的光點逐行亮起。核對無誤後，輕觸每一行的符文確認。</p>
  <div class="tablet">${items.map(([k,v],i)=>`<button class="tl ${chk[i]?'ok':''}" data-i="${i}"><span class="k">${k}</span><span class="v">${v}</span><span class="rn"></span></button>`).join('')}</div>
  <p class="bd" id="bd">${state.duty.briefing?'全部核對完成。':''}</p>`);
 ov.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(chk[i]) return; chk[i]=true; b.classList.add('ok'); SFX.tone(880+i*90,0,.5,'sine',.03);
  if(chk.every(Boolean)&&!state.duty.briefing){ state.duty.briefing=true; logJ(`核對值勤資訊：${trainNo()}，預定停靠${L.name}。`); save(); render();
   ov.querySelector('#bd').textContent='全部核對完成。現在可以進入火車頭駕駛室。'; toast('值勤資訊核對完成'); } });
}

/* 駕駛室：號誌與車門聯鎖（等待後才會轉綠／亮起） */
const CAB={leg:null,signal:'red',doors:'open',timers:[],
 begin(){ if(state.currentPhase!=='docked') return; const k=state.journeyCount+'@'+state.currentLocation; if(this.leg===k) return; this.leg=k;
  this.timers.forEach(clearTimeout); this.timers=[];
  this.signal=state.duty.signal?'green':'red'; this.doors=state.duty.doors?'lit':'open';
  const re=()=>{ if(RUNNING&&state.currentCarriage==='cab'&&state.currentPhase==='docked'){ const bg=document.querySelector('#scene svg.bg'); if(bg) bg.outerHTML=svgScene(ART.car.cab(state)); hsRefresh(); } };  // 只更新畫面與熱點狀態，不重建場景
  if(this.signal!=='green') this.timers.push(setTimeout(()=>{ this.signal='amber'; re(); },1400),setTimeout(()=>{ this.signal='green'; SFX.tone(988,0,.8,'sine',.03); re(); },4200));
  if(this.doors!=='lit') this.timers.push(setTimeout(()=>{ this.doors='closing'; re(); },900),setTimeout(()=>{ this.doors='lit'; re(); },3000)); },
 reset(){ this.leg=null; this.timers.forEach(clearTimeout); this.timers=[]; },
 signalView(){ return state.currentPhase==='voyage'?'green':this.signal; },
 doorView(){ return state.currentPhase==='voyage'?'lit':this.doors; }
};
function cabSignal(){
 if(state.currentPhase==='voyage') return panel(`<div class="eyebrow">星光號誌</div><h2>綠光・航行中</h2><p>列車正在航道上自動行駛，號誌保持綠光。</p>`);
 const s=CAB.signal;
 if(s!=='green') return panel(`<div class="eyebrow">星光號誌</div><h2>${s==='red'?'紅光・停止':'琥珀光・確認中'}</h2><p>前方航道仍在確認中。號誌轉為綠光之前，不能向領頭取得出發許可，請稍候再確認。</p>`);
 if(!state.duty.signal){ state.duty.signal=true; logJ('確認前方星光號誌：綠光，平安號誌。'); save(); render(); SFX.tone(1175,0,.7,'sine',.04); }
 panel(`<div class="eyebrow">星光號誌</div><h2>綠光・平安號誌</h2><p>前方航道已確認安全。確認結果已記錄。</p>`);
}
function cabDoors(){
 if(state.currentPhase==='voyage') return panel(`<div class="eyebrow">車門聯鎖符文燈</div><h2>安全符文亮起</h2><p>航行中，所有車門保持聯鎖。</p>`);
 const s=doorsLit()?'lit':CAB.doors==='lit'?'closing':CAB.doors;
 if(s!=='lit') return panel(`<div class="eyebrow">車門聯鎖符文燈</div><h2>${s==='open'?'尚未關妥':'聯鎖中'}</h2><p>安全符文還沒有亮起，代表仍有車門未全數關妥。請等待符文亮起後再確認。</p>`);
 if(!state.duty.doors){ state.duty.doors=true; logJ('確認車門聯鎖安全燈：已亮起，車門全數關妥。'); save(); render(); SFX.tone(1175,0,.7,'sine',.04); }
 panel(`<div class="eyebrow">車門聯鎖符文燈</div><h2>安全符文已亮起</h2><p>全部車門已關妥並聯鎖。確認結果已記錄。</p>`);
}
/* 向領頭報備 */
function dragonTalk(){
 const first=!state.storyFlags.metDragon;
 const intro=first?[['dragon','……你醒了。'],['dragon','我是這列車的領頭，曦淵。列車由我引領，但能不能出發，要等值勤者把一切確認清楚。'],['dragon','從今天起，你就是這列車的值勤精靈。每次出發前，來向我報備。'],['self','是，領頭。']]:[];
 if(first){ state.storyFlags.metDragon=1; save(); }
 if(state.currentPhase==='voyage') return dialogueScript(intro.concat([['dragon','航道很穩。去車廂裡走走吧，到站時我會讓你知道。']]));
 const d=state.duty, miss=[];
 if(!d.scan) miss.push('身體污染值量測'); if(!equipAll()) miss.push('航程裝備'); if(!d.briefing) miss.push('星途符牒的資訊核對');
 if(!d.signal) miss.push('前方星光號誌'); if(!d.doors) miss.push('車門聯鎖安全燈');

/* 自動出發與自動行駛（玩家不操控列車） */
const VOYAGE_MS=40000; let RUNNING=false;
function startDeparture(){
 const dest=nextStop(), from=state.currentLocation, fromName=LOCATIONS[from].name;
 state.currentPhase='voyage'; state.voyage={from,to:dest,progress:0,evt:false}; CAB.reset(); save(); SFX.depart();
 cine(['領頭曦淵展開雙翼，前方的星光號誌化作一道長長的光軌。列車自行啟動了。',`列車離開${fromName}。`,'車輪下的軌道一節一節亮起，延伸進沒有地面的地方。','日與月的界線，在窗外緩緩翻轉。'],
  ()=>{ SFX.startDrone(); render(); toast('列車自動航行中・可在車廂間自由走動'); },'assets/voyage.jpg');
}
setInterval(()=>{
 if(!RUNNING||state.currentPhase!=='voyage'||!state.voyage) return;
 if(document.hidden||document.querySelector('#layer .cine,#layer .board,#layer .dlg')) return;  /* 過場演出時暫停，避免事件重疊 */
 const v=state.voyage; v.progress=Math.min(1,v.progress+250/VOYAGE_MS);
 const bar=$('#vprog'); if(bar) bar.style.width=(v.progress*100).toFixed(1)+'%';
 if(v.progress>=.45&&!v.evt){ v.evt=true; const ev=Object.entries(EVENTS).find(([id,e])=>e.trigger==='voyage'&&!e.at&&!done(id)); if(ev){ complete(ev[0]); ev[1].run(()=>{}); } save(); }
 /* 指定進度的航行事件（例如航行途中登車的乘客），每趟最多觸發一次 */
 const timed=Object.entries(EVENTS).find(([id,e])=>e.trigger==='voyage'&&e.at&&v.progress>=e.at&&!done(id)&&(!e.need||e.need()));
 if(timed){ complete(timed[0]); timed[1].run(()=>{ render(); }); save(); return; }
 if(v.progress>=1) return voyageArrive();
 if(Math.round(v.progress*160)%8===0) save();
},250);
function voyageArrive(){
 const v=state.voyage, dest=v.to, from=LOCATIONS[v.from].name;
 state.voyage=null; state.journeyCount++; state.currentLocation=dest; state.currentPhase='docked';
 if(!state.visitedLocations.includes(dest)) state.visitedLocations.push(dest);
 if(state.culture && !state.culture.bloomed){ state.culture.bloomed=true; }   // 培植箱：經過一次航行即開花
 state.duty=dutyFresh();
 logJ(`列車自${from}出發，抵達${LOCATIONS[dest].name}。`);
 SFX.stopDrone(); SFX.arrive(); render();
 cine([`<span class="big">${LOCATIONS[dest].name}</span><span class="sub">${LOCATIONS[dest].realm}・${LOCATIONS[dest].domain}・旅程 ${state.journeyCount}</span>`],()=>arrivalChecks(),null,true);
}
/* ---------- 音效（WebAudio 合成，不需音檔） ---------- */
const PREFS=(()=>{ try{ return JSON.parse(localStorage.getItem('riyue-prefs'))||{}; }catch(e){ return {}; } })();
function savePrefs(){ try{ localStorage.setItem('riyue-prefs',JSON.stringify(PREFS)); }catch(e){} }
const SFX={ctx:null,drone:null,
 on(){ return PREFS.sound!==false; },
 init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); return this.ctx; },
 tone(f,delay,dur,type,vol){ if(!this.on()) return; const c=this.init(); if(!c) return; const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.05,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); },
 noise(dur,f0,f1,vol){ if(!this.on()) return; const c=this.init(); if(!c) return; const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8; const t=c.currentTime; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.45); g.gain.linearRampToValueAtTime(0,t+dur); s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); },
 chime(){ [784,1175,1568].forEach((f,i)=>this.tone(f,i*.14,1.8,'sine',.045)); },
 depart(){ this.chime(); this.tone(55,.3,3.4,'triangle',.08); this.noise(3.4,180,2400,.05); },
 arrive(){ [1175,988,784].forEach((f,i)=>this.tone(f,i*.18,1.6,'sine',.045)); },
 startDrone(){ if(!this.on()||this.drone) return; const c=this.init(); if(!c) return; const g=c.createGain(); g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(.035,c.currentTime+2);
  const o1=c.createOscillator(), o2=c.createOscillator(), lfo=c.createOscillator(), lg=c.createGain(); o1.frequency.value=55; o2.frequency.value=82.6; lfo.frequency.value=.18; lg.gain.value=.012;
  lfo.connect(lg); lg.connect(g.gain); o1.connect(g); o2.connect(g); g.connect(c.destination); [o1,o2,lfo].forEach(o=>o.start()); this.drone={g,os:[o1,o2,lfo]}; },
 stopDrone(){ const c=this.ctx, d=this.drone; if(!c||!d) return; const t=c.currentTime; d.g.gain.cancelScheduledValues(t); d.g.gain.setValueAtTime(d.g.gain.value,t); d.g.gain.linearRampToValueAtTime(0,t+1.2); d.os.forEach(o=>o.stop(t+1.3)); this.drone=null; }
};

/* ---------- 展望台：航行中逐漸遠去的星光 ---------- */
const STREAK={raf:0,parts:[],
 spawn(any){ return {a:Math.random()*Math.PI*2,d:any?.1+Math.random()*.9:1,sp:.0018+Math.random()*.003,warm:Math.random()<.2}; },
 cloud(any){ return {a:Math.random()*Math.PI*2,d:any?.25+Math.random()*.75:1,sp:.0007+Math.random()*.0006,h:[262,200,298,186][Math.floor(Math.random()*4)]}; },
 start(){ const cv=$('#streaks'); if(!cv) return; const r=cv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2); cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr);
  this.parts=[]; for(let i=0;i<150;i++) this.parts.push(this.spawn(true)); this.cl=[0,1,2,3,4].map(()=>this.cloud(true)); if(!this.raf) this.raf=requestAnimationFrame(()=>this.tick()); },
 tick(){ this.raf=0; const cv=$('#streaks'); if(!cv) return; const g=cv.getContext('2d'), W=cv.width, H=cv.height, cx=W*.5, cy=H*.42, R=Math.hypot(W,H)*.7;
  g.clearRect(0,0,W,H);
  for(const c of this.cl){ c.d-=c.sp*(.3+c.d); if(c.d<=.04){ Object.assign(c,this.cloud(false)); continue; } const x=cx+Math.cos(c.a)*R*.5*c.d, y=cy+Math.sin(c.a)*R*.35*c.d, rr=R*.32*c.d, gr=g.createRadialGradient(x,y,0,x,y,rr);
   gr.addColorStop(0,`hsla(${c.h},60%,62%,${(.22*c.d).toFixed(3)})`); gr.addColorStop(1,'hsla(0,0%,0%,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,rr,0,Math.PI*2); g.fill(); }
  for(const p of this.parts){ const d0=p.d; p.d-=p.sp*(.4+p.d); if(p.d<=.02){ Object.assign(p,this.spawn(false)); continue; } const d1=p.d;
   const x0=cx+Math.cos(p.a)*R*d0*d0, y0=cy+Math.sin(p.a)*R*d0*d0*.7, x1=cx+Math.cos(p.a)*R*(d1+.04)*(d1+.04), y1=cy+Math.sin(p.a)*R*(d1+.04)*(d1+.04)*.7;
   g.strokeStyle=(p.warm?'rgba(255,230,170,':'rgba(225,220,255,')+Math.min(1,d0*1.2).toFixed(2)+')'; g.lineWidth=Math.max(.6,3.2*d0); g.lineCap='round';
   g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); }
  this.raf=requestAnimationFrame(()=>this.tick()); } };

/* ================================================================
   記憶晶石：存檔／讀檔（多欄位、縮圖、重新命名、覆蓋、二次確認刪除）
   ================================================================ */
const SLOT_KEY='riyue-slots-v1', AUTO_THUMB_KEY='riyue-autothumb', SLOT_MAX=12;
function slotsGet(){ try{ const a=JSON.parse(localStorage.getItem(SLOT_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function slotsSet(a){ try{ localStorage.setItem(SLOT_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function fmtTime(t){ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function stateSummary(s){ const L=LOCATIONS[s.currentLocation]||LOCATIONS.origin, voy=s.currentPhase==='voyage'&&s.voyage;
 const ab=Object.keys(s.passengers||{}).filter(id=>s.passengers[id].aboard&&PASSENGERS[id]).map(id=>PASSENGERS[id].name);
 const d=s.duty||{}, eq=(s.spirit&&s.spirit.equipment)||{};
 const n=[d.scan,eq.tablet&&eq.compass&&eq.talisman,d.briefing,d.signal,d.doors].filter(Boolean).length;
 return {loc:voy?`前往 ${LOCATIONS[s.voyage.to].name}`:L.name, realm:voy?LOCATIONS[s.voyage.to].realm:L.realm, journey:s.journeyCount,
  where:s.currentPhase==='outside'?'列車外・'+L.name:((CARRIAGES[s.currentCarriage]||{}).name||''),
  run:voy?`自動航行中（${Math.round(s.voyage.progress*100)}%）`:s.currentPhase==='outside'?'停靠中・外部探索':'停靠中',
  pass:ab.length?ab.join('、'):'無', life:(s.discoveredLifeforms||[]).length, clues:(s.clues||[]).length,
  duty:voy?'已取得出發許可':`${n} / 5 項完成`, cont:s.spirit&&s.spirit.contamination?`界染度 ${s.spirit.contamination.value}（${s.spirit.contamination.level}）`:'尚未量測'}; }

/* 縮圖：把目前畫面的各圖層（環景 WebGL、SVG 場景、圖片、星光畫布）合成到 Canvas */
async function captureThumb(){
 const W=320,H=180, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d'); g.fillStyle='#0b0d22'; g.fillRect(0,0,W,H);
 const cover=(src,sw,sh)=>{ if(!sw||!sh) return; const k=Math.max(W/sw,H/sh), dw=sw*k, dh=sh*k; g.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh); };
 const layers=[...document.querySelectorAll('#scene canvas, #scene svg.bg, #scene img.bg')];
 for(const el of layers){ try{
  if(el.tagName==='CANVAS'){ if(el===PANO.canvas&&PANO.active) panoDraw(); cover(el,el.width,el.height); }
  else if(el.tagName==='IMG'){ if(!el.complete) await new Promise(r=>{ el.addEventListener('load',r,{once:true}); el.addEventListener('error',r,{once:true}); }); cover(el,el.naturalWidth,el.naturalHeight); }
  else { const c=el.cloneNode(true); c.setAttribute('width','1600'); c.setAttribute('height','900');
   const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c)); await img.decode(); g.drawImage(img,0,0,W,H); }
 }catch(e){} }
 try{ return cv.toDataURL('image/jpeg',.72); }catch(e){ return null; }
}
let thumbT=0, thumbLast=0;
function scheduleAutoThumb(){ clearTimeout(thumbT); thumbT=setTimeout(async()=>{ if(!RUNNING) return; const now=Date.now(); if(now-thumbLast<8000) return; thumbLast=now;
 const t=await captureThumb(); if(t) try{ localStorage.setItem(AUTO_THUMB_KEY,t); }catch(e){} },1500); }

function savePanel(mode){   /* mode: 'game' 可封存與喚回；'title' 只能喚回 */
 const ov=panel('','pearl'), pn=ov.querySelector('.panel'); let sel=null, msg='';
