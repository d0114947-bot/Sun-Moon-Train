 nature(state){
  const mode=state.storyFlags.natureLight||'dawn', tint={dawn:'#ffe7a8',moon:'#bcd2ff',star:'#cdb8ff'}[mode], glow={dawn:'url(#gGold)',moon:'url(#gCyan)',star:'url(#gViolet)'}[mode], gem={dawn:'#fff1c8',moon:'#dfeaff',star:'#ebe2ff'}[mode];
  const cul=(state.pods||[])[0], podA=!cul?'empty':cul.st>=2?'bloom':'sprout', colA=cul?PLANTS[cul.p].color:'#a6e39a';
  const grown=state.grown||[], podB=grown.length?'bloom':'dormant', colB=grown.length?PLANTS[grown[0]].color:'#7ccf86';
  const tube=(x,y,s,m,col,cls)=>{ const w=110*s,h=330*s,base=y+h/2-20,top=y-h/2+40;
   let plant='';
   if(m!=='empty'){ const k=m==='sprout'?.45:1, ty=base-(base-top)*k, stem=m==='dormant'?'#6f9a78':'#5fae6e', lf=m==='dormant'?'#88b394':'#7ccf86';
    plant=`<g class="sway ${cls}"><path d="M${x} ${base} C ${x-30*k} ${(base+ty)/2} ${x+30*k} ${ty+40*k} ${x} ${ty}" stroke="${stem}" stroke-width="${6*s}" fill="none"/>
     ${[0,1,2,3].slice(0,m==='sprout'?2:4).map(i=>{ const lx=x+(i%2?18:-18)*s, ly=base-60*s*k-i*55*s*k; return `<ellipse cx="${lx}" cy="${ly}" rx="${22*s*k+4}" ry="${9*s*k+2}" fill="${lf}" transform="rotate(${i%2?-25:25} ${lx} ${ly})"/>`; }).join('')}
     ${m==='bloom'||m==='grown'?`<circle cx="${x}" cy="${ty}" r="${16*s}" fill="${m==='bloom'?col:'#fff4c8'}"/><circle class="pulse ${cls}" cx="${x}" cy="${ty}" r="${60*s}" fill="url(#gGold)"/>`:''}</g>`; }
   const bub=[0,1,2].map(i=>`<circle class="bub" style="--t:-${(h-70).toFixed(0)}px;animation-delay:${(-i*1.8-x/400).toFixed(1)}s" cx="${(x-14*s+i*14*s).toFixed(1)}" cy="${(y+h/2-30).toFixed(1)}" r="${(3*s).toFixed(1)}" fill="#fff" opacity=".7"/>`).join('');
   return `<g><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${w/2}" fill="${tint}" opacity="${m==='empty'?.1:.2}"/>${plant}${bub}
    <rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${w/2}" fill="url(#gGlass)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
    <rect x="${x-w/2-8}" y="${y+h/2-6}" width="${w+16}" height="22" fill="#c8a85e"/><rect x="${x-w/2-8}" y="${y-h/2-14}" width="${w+16}" height="16" fill="#c8a85e"/></g>`; };
  let vault=''; for(let r=0;r<5;r++)for(let c=0;c<4;c++){ const x=40+c*58, y=210+r*92+c*6; vault+=`<rect x="${x}" y="${y}" width="46" height="70" rx="4" fill="#efe9dd" stroke="#c8a85e" stroke-width="2"/><circle class="${(r*4+c)%5?'':'pulse b'}" cx="${x+23}" cy="${y+35}" r="7" fill="${(r+c)%3?'#bfe6ff':'#f1d58e'}" opacity=".9"/>`;}
  const jar=(dx,c,on)=>`<g transform="translate(${dx} 0)"><rect x="-26" y="-84" width="52" height="74" rx="12" fill="#f3efe6" opacity=".55" stroke="#c8a85e" stroke-width="2"/><rect x="-18" y="-96" width="36" height="12" rx="3" fill="#c8a85e"/>${on?`<path d="M0 -18 C 0 -40 -2 -56 2 -72 M0 -34 q -12 -4 -14 -12 M1 -46 q 12 -4 13 -12 M0 -58 q -9 -3 -10 -9" stroke="${c}" stroke-width="3" fill="none"/>`:''}</g>`;
  const view=state.currentPhase==='voyage'?ART.loc.voyage():LOCATIONS[state.currentLocation].art();
  return corridor({door:'#d6f2d0'})+`<rect width="1600" height="900" fill="${tint}" opacity=".12"/>
  <g transform="skewY(18)">${vault}</g><polygon points="20,170 290,250 290,780 20,860" fill="none" stroke="#c8a85e" stroke-width="5"/>
  <clipPath id="natwin"><ellipse cx="1400" cy="240" rx="70" ry="102"/></clipPath>
  <g clip-path="url(#natwin)"><svg x="1330" y="138" width="140" height="204" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">${ART.defs}${view}</svg></g>
  <ellipse cx="1400" cy="240" rx="70" ry="102" fill="url(#gGlass)" stroke="#c8a85e" stroke-width="7"/><path d="M1352 196 Q 1372 160 1404 150" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>
  ${tube(430,470,.9,podA,colA,'a')}${tube(520,430,.7,'grown',null,'b')}${tube(1170,470,.9,podB,colB,'c')}${tube(1080,430,.7,'grown',null,'d')}
  <g transform="translate(800 250)"><g class="spin"><circle r="60" fill="none" stroke="#c8a85e" stroke-width="2" stroke-dasharray="3 9"/></g><polygon points="0,-60 30,0 0,60 -30,0" fill="${gem}" opacity=".95"/><polygon points="0,-60 30,0 0,0" fill="#fff" opacity=".7"/><circle r="40" fill="none" stroke="#c8a85e" stroke-width="3"/><circle class="pulse" r="96" fill="${glow}"/></g>
  <g transform="translate(1440 720)"><rect x="-70" y="-30" width="140" height="160" fill="url(#gStone)"/><ellipse cx="0" cy="-30" rx="70" ry="16" fill="#c8a85e"/><g class="sway d"><path d="M0 -40 C -30 -120 -60 -150 -40 -210 M0 -40 C 20 -110 50 -140 40 -200 M0 -40 C 0 -120 -10 -170 6 -230" stroke="#8fd6c4" stroke-width="5" fill="none"/><circle cx="-40" cy="-210" r="10" fill="#e0fff6"/><circle cx="40" cy="-200" r="9" fill="#e0fff6"/><circle cx="6" cy="-230" r="12" fill="#fff"/></g><circle class="pulse c" cx="0" cy="-200" r="110" fill="url(#gCyan)" opacity=".8"/></g>
  <g transform="translate(330 812)"><rect x="-120" y="-8" width="240" height="16" fill="#c8a85e"/><rect x="-112" y="8" width="10" height="40" fill="#b8954e"/><rect x="102" y="8" width="10" height="40" fill="#b8954e"/>${jar(-72,'#9c8466',true)}${jar(0,'#7cc98a',state.collectibles.includes('plant_dewmoss'))}${jar(72,'#8f84e8',state.collectibles.includes('plant_starspore'))}</g>`; },

 /* 羽貓獸：使用去背後的動態立繪（image）與靜態立繪（still）。資料來自設定稿。 */
 felinia:{name:'羽貓獸',type:'other',species:'Felinia alata',zone:'rings',spot:{x:42,y:30},color:'radial-gradient(circle,#f6eefc,#b9a3c9)',
  image:'assets/felinia.webp',still:'assets/felinia-still.webp',studies:['assets/felinia-s1.webp','assets/felinia-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'高海拔溫帶山區・雲霧高山森林',
  intro:'被航道上的橫風帶進列車的羽貓獸。貓科般的軀幹、貓頭鷹般的頭部，背上一對虹彩羽翼在光下泛出淡淡的粉紫與銀光。',
  bio:'在晨光初現的高山幽谷中，雲霧猶如輕紗般纏繞著古老的巨木。羽貓獸輕巧地穿梭於峭壁邊緣，牠的爪子踩在帶有苔蘚的岩石上幾乎沒有發出一絲聲響。當第一道陽光穿透薄霧，灑在牠那雙泛著虹彩的羽翼上時，整隻生物彷彿與大自然融為一體。牠停下腳步，金黃色的眼眸轉向遠方的山嵐，耳翼微微顫動著，聆聽著風中的細語。對於山區的採藥人而言，偶爾在雲端瞥見羽貓獸的身影，往往被視為晴朗好天氣與旅途平安的象徵。',
  field:{alias:'雲端精靈、晨曦的巡林者、迎風貓頭鷹獸',cls:'半獸類／飛行獸類',danger:'低（除非領地遭受直接侵犯或幼獸受到威脅，否則牠們傾向於直接退避或快速飛離）',rarity:'稀有',
   looks:'羽貓獸擁有貓科動物般靈活而流線的軀幹，四肢覆蓋著細密柔軟的絨毛，末端為銳利的爪子，便於在岩壁與樹幹間攀爬。牠的頸部與前肢漸層過渡至帶有神祕紫調的深色，與背部及尾尖的白毛形成鮮明對比。頭部結合了貓科的輪廓與鳥類的靈巧特徵，長有一對金黃色的大眼睛與覆蓋著羽毛的耳翼。背部則長出一對構造精細、由虹彩羽毛組成的雙翼，能在飛行時折射出淡淡的粉紫與銀光。頸間自然環繞著一圈帶著小花與金屬飾品般的絨毛與斑紋，使其在野性中帶有一絲靈動與優雅。',
   habitat:'多數棲息於高海拔的溫帶山區、雲霧繚繞的高山森林，以及古老遺跡周邊的峭壁。牠們喜歡築巢於視野開闊、陽光充足的高聳崖壁縫隙或巨樹冠層。',
   habits:[['活動時間','日行性，活躍於清晨與黃昏的光影交替之際。'],['飲食','主要以高山上的小型靈巧獵物、花蜜及特定的高山漿果為主，屬於雜食偏肉食。'],['社會結構','多為獨居或以小家庭為單位活動，領域性中等。'],['性格','生性機警、好奇心強，對陌生氣息保持距離，但若長期處於安定環境中，會對特定人類或同行生物表現出溫和的親近感。']],
   abilities:[['御風滑翔','利用背部的羽翼與尾部的平衡，能在強風的山谷間進行長距離的無聲滑翔與高機動性轉向。'],['光影擬態','羽毛結構能在特定角度的陽光下折射出與周遭岩壁和霧氣相似的光澤，達到天然的視覺隱蔽效果。'],['敏銳感知','頭部耳翼的特殊羽毛結構對氣流與微弱聲音極度敏感，能提前預知山嵐的變化與潛在危險。']]},
  stay:2,
  talks:[
   {lines:['（牠停在懸浮棲息環的最高處，金黃色的眼睛一動也不動地看著你，耳翼微微轉向你的方向。）','我住在很高的山上。雲霧會繞著老樹，崖壁上有我的巢。','……這裡的風，是從哪裡吹來的？'],choices:[{t:'是列車航行時帶起的氣流。',r:'列車的風。沒有山的味道，但是很穩。……我可以在這裡停一下嗎？'},{t:'你是從哪裡飛進來的？',r:'我只是跟著一陣橫風滑翔。回過神來，就在這裡了。'}]},
   {lines:['（牠收起雙翼，羽毛在車廂的光下泛出淡淡的粉紫。）','我習慣在清晨和黃昏出來。光影交替的時候，最自在。','你們這裡的光，跟山上的晨光很像。斜斜的，很好藏起來。','……我是說，很好休息。'],choices:[{t:'你在躲什麼嗎？',r:'沒有。只是習慣了。在山上，太容易被看見的東西，常常會被盯上。'},{t:'這裡很安全。',r:'嗯。我的耳朵也這麼說。這裡的風裡，沒有危險的聲音。'}]},
   {lines:['（牠從圓環上無聲地滑下來，停在離你近了一些的地方。）','山上採藥的人說，在雲裡看見我的影子，就會有好天氣。','我不知道是不是真的。不過，你的旅程，應該會很平安。'],choices:[{t:'謝謝你。',r:'（牠的耳翼輕輕抖了一下，像是在笑。）'}]}
  ],
  farewell:['風向變了。我聽得見。','前面有山的味道……很淡，但是我認得。','我要走了。如果哪天你在雲裡看見一道影子，那就是好天氣的意思。']
 },

  homeText:'深海海溝・海底峽谷・無光層水域',
  intro:'在航向星河浮島的途中，從靈泉深處浮現的淵光巨。墨藍色的修長身軀上，幽藍的螢光沿著肌肉與脊椎的紋理流動，宛如深海中的星圖。',
  bio:'在無光的海底世界裡，淵光巨是少數優雅而巨大的流浪者。牠們緩慢地穿梭於沉睡的海溝與海底山脈之間，每一次尾鰭的擺動都伴隨著點點藍光在黑暗中劃出優美的軌跡。當牠游過海底荒漠時，體表的幽光常吸引無數微小的深海生物聚攏，遠看就像是一座攜帶星海在深淵中漫步的移動島嶼。傳說水手如果在暴風雨的夜裡看見海面下透出幽藍的光暈，那便是淵光巨正浮上海面換氣的寧靜時刻。',
  field:{alias:'深淵的星河、夜航者的燈塔、蔚藍孤影',cls:'深海巨獸／遠古游魚類',danger:'低（性格溫和，除非遭受嚴重威脅，否則不具攻擊性）',rarity:'稀有',rarityNote:'棲息於極深的海域，人類難以窺其全貌。',
   looks:'<b>身體構造：</b>擁有修長而流線型的巨型身軀，體長可達數十公尺。頭部寬大扁平，下顎延伸出數根細長的觸鬚，宛如古老的編織漁網。<br><b>顏色與紋理：</b>深邃如深海夜空的墨藍色與碳黑色外皮，皮膚表面佈滿天然的有機骨質紋理。體側與背脊處生有巨大的背鰭與流線型胸鰭，邊緣呈半透明的深邃藍色。<br><b>發光機制：</b>牠的全身各處分佈著生物發光器官（Photophores），能沿著軀幹的肌肉紋理與脊椎線條透出幽藍色的螢光，宛如深海中的星圖與神經網絡。',
   habitat:'常年籠罩在永夜與極度高壓中的深海海溝、海底峽谷，或陽光無法觸及的無光層水域。',
   habits:[['活動時間','全天候活動，但在黑暗的深海中，牠們的螢光脈絡在獵食或求偶時會變得格外閃耀。'],['飲食','屬於濾食性巨獸，利用下顎的長鬚與巨大的口腔過濾深海中的浮游生物、微小甲殼類及有機微粒。'],['性格','性情溫和、孤傲且極具包容性，通常獨自游弋，對外界的騷擾多半選擇避開或緩慢潛入更深的海域。']],
   abilities:[['生物冷光共鳴','能透過體表螢光頻率的變化與同類進行長距離的深海通訊，甚至能微幅干擾周遭的水流與光線。'],['深海壓強適應','體內擁有特殊的骨骼與組織結構，能完美承受千米之下的恐怖水壓，並在高速游動時將阻力降到最低。']]},
  stay:2,
  talks:[
   {lines:['（靈泉的水面一圈一圈地暗下去，像是突然變得很深。一道幽藍的光，從水底慢慢浮了上來。）','……這裡的水，很淺。也很亮。','我來的地方沒有光，水重得像山一樣壓下來。','不過，很安靜。我喜歡安靜的地方。'],choices:[{t:'你是從深海來的嗎？',r:'深海……是很遠的地方。那裡沒有光，所以我們自己發光。'},{t:'這裡夠你休息嗎？',r:'夠了。我不需要很大的地方，只需要不被打擾。'}]},
   {lines:['（牠身上的光點沿著脊椎一路亮起，又一顆一顆熄滅，像在數著什麼。）','這是我們說話的方式。用光，而不是聲音。','在深淵裡，聲音傳得太遠，會驚動太多東西。光只會讓想看見的人看見。'],choices:[{t:'那你剛才說了什麼？',r:'我說：這列車的光，很像海面。'},{t:'我看見了。',r:'嗯。那就夠了。'}]},
   {lines:['水手們說，暴風雨的夜裡看見海面下的藍光，就是平靜的時刻。','我只是浮上來換一口氣而已。','……不過，如果那能讓他們安心，也很好。'],choices:[{t:'你一直都是獨自一個嗎？',r:'大多數時候。深海很大，同伴的光要很久才看得見一次。所以每一次看見，都會記得很久。'}]}
  ],
  farewell:['水的味道變了。','前面有很深、很暗的地方，我聽得見它在呼喚。','謝謝這片安靜的水。如果有一天，你在很深的地方看見一片會移動的星光，那就是我。']

 /* 燼風帆獸：去背後的動態立繪。資料來自設定稿。 */
 cinder:{name:'燼風帆獸',type:'other',species:'Cinder-Sail Courser',zone:'crystal',spot:{x:67,y:58},spriteH:34,ar:'1268/697',color:'radial-gradient(circle,#fff1d6,#c79a5e)',
  image:'assets/cinder.webp',still:'assets/cinder-still.webp',studies:['assets/cinder-s1.webp','assets/cinder-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'烈日沙漠（The Blazing Sands）',
  intro:'在列車駛向日界時，乘著熾熱光線登車的燼風帆獸。修長纖細的沙褐色身軀，背上兩片半透明的帆在光下透出琥珀色。',
  bio:'在烈日沙漠的邊緣，商隊正頂著熱浪緩慢前行。突然間，領隊的嚮導停下腳步，指向遠處的沙丘。一隻燼風帆獸正以一種不可思議的姿態出現。牠的四肢幾乎懸空，輕盈地在沙脊上滑行。陽光透過牠的背帆，呈現出琥珀色的光澤。牠似乎察覺到了商隊，轉過頭，那雙巨大的眼睛好奇地看著他們，隨即一個華麗的轉身，尾舵一擺，便消失在熱浪之中。<br>年輕的學徒驚訝地問道：「那是龍嗎？」<br>嚮導笑著搖頭：「不，孩子，那是沙漠的靈魂。牠們不需要火焰，因為牠們本身就擁有了太陽的力量。」',
  field:{nameNote:'這個名稱結合了其棲息地的熾熱意象（燼）、背部如船帆般的特徵（風帆），以及牠優雅且善於奔跑的形態（獸）。',
   alias:'日行舟（Sun-Sailer）：商旅對牠們的稱呼，因為牠們常在烈日下與商隊並行。<br>沙漠舞者（Desert Dancer）：當地遊牧民族對牠們輕盈步伐的讚譽。<br>偽龍（False-Drake）：因其外型與龍相似，但缺乏噴火能力而被賦予的貶稱。',
   cls:'荒漠亞龍類（Desert Archosaurian）<br>屬於一種古老的爬行類亞種，與真正的龍類有遠親關係，但在漫長的演化中適應了乾旱環境，演化出獨特的帆狀構造。',
   danger:'低（Low）',dangerNote:'除非你試圖捕捉一隻健康的成年燼風帆獸（這幾乎是不可能的），否則牠們對人類不構成威脅。牠們的防禦機制主要是逃跑。',
   rarity:'少見（Uncommon）',rarityNote:'雖然牠們適應了嚴酷的環境，但因為天敵較少且繁殖率不高，加上特殊的棲息地，人們並不容易見到牠們。只有經驗豐富的嚮導和遊牧民才知道在哪裡能找到這些優雅的沙漠舞者。',
   looks:'燼風帆獸擁有極為纖細而強韌的四肢，這使牠們在沙地上能進行高速且省力的奔跑。牠們的體態修長，覆蓋著細密、沙褐色的鱗片，鱗片紋理細緻，能完美融入乾旱地貌。<br>最顯眼的特徵是背部中央長出的兩片巨大的、半透明的肉膜狀帆。這些帆由纖細的骨質支架支撐，形狀如風帆般高聳。在圖片中，我們可以看到牠們的頸部、背部直到尾部都有一排棘刺，為背帆提供了額外的穩定性。牠們的頭部呈三角形，有一雙如黑曜石般巨大、深邃的眼睛，顯示其優秀的視覺能力。<br>牠們的尾巴末端有一個如船舵般的尾鰭，能在高速奔跑時幫助平衡和轉向。這種構造，加上背帆，讓牠們在沙漠中的移動方式更像是「航行」而非單純的奔跑。',
   habitat:'<b>烈日沙漠（The Blazing Sands）</b><br>主要棲息於廣闊無垠、終年烈日當空的沙漠深處，特別是那些有巨大岩層和沙丘交錯的區域。牠們的鱗片顏色能隨環境微妙變化，從淺金黃到深赭色，提供絕佳的保護色。',
   habits:[['活動時間','晝行性（Diurnal）。這在沙漠生物中相當罕見。牠們依賴白天的陽光來活化背帆的特殊功能。'],['飲食','食蟲與掘根（Insectivorous and Root-foraging）。牠們利用靈敏的視覺和嗅覺在沙下尋找昆蟲、幼蟲，以及富含水分的塊根植物。牠們的嘴部構造適合啄食。'],['群居或獨居','半群居（Semi-social）。雖然大部分時間單獨行動，但在繁殖季節或遷徙時，會形成小型的家族群落（約 3–5 隻）。'],['攻擊性與性格','溫和而警覺（Gentle and Alert）。牠們天性膽小，面對威脅通常選擇逃跑而非戰鬥。牠們的奔跑速度極快，能輕易甩開大多數捕食者。除非被逼入絕境，否則不會展現攻擊性。']],
   abilities:[['太陽能航行（Solar-Sailing）','這是燼風帆獸最核心的能力。牠們背部的巨大皮帆富含感光細胞與微血管網。在烈日下，這些帆會吸收大量的太陽能，轉化為微弱的生物電能。這種能量不直接用於攻擊，而是用以刺激肌肉，減少長距離奔跑時的能量消耗，並保持體溫。這讓牠們能以驚人的速度持續奔跑數小時而不顯疲憊。這也是為什麼牠們只在白天活動。'],['擬態帆（Mimicry-Sail）','在休息或遇到危險時，牠們能透過肌肉控制收起背帆，或將其張開。張開時，帆的紋理和陰影能模擬出遠處岩石的形狀，讓牠們在靜止時看起來像是一塊被風化的岩石，從而騙過捕食者。']]},
  stay:2,
  talks:[
   {lines:['（牠一出現就退到晶石平台的邊緣，背上的兩片帆半收半張，黑曜石般的大眼睛盯著你。）','……你不是商隊。','我從烈日沙漠來。那裡的沙丘和岩層，一望無際，只有商隊會經過。','商隊會帶著水的味道。你身上，只有光的味道。'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈……沒聽過。不過，你沒有追過來。這樣就好。'},{t:'放心，這裡沒有人會抓你。',r:'每個人都這麼說。……不過你站得很遠。我相信站得遠的人。'}]},
   {lines:['（牠把背帆完全張開，對著晶石平台的光，帆面透出琥珀色。）','這裡的光不是太陽，可是很暖。','我的帆會把陽光存起來，讓腳不會累。','在沙漠裡，太陽下山以後我就不能跑了。在這裡，好像可以一直醒著。'],choices:[{t:'你喜歡奔跑嗎？',r:'不是喜歡或不喜歡。帆張開，風來了，腳就自己動了。就像你們的列車一樣。'},{t:'那你要好好休息。',r:'嗯。……我會把帆收一半。這是我們休息的樣子。'}]},
   {lines:['有人叫我們「偽龍」。因為我們長得像龍，卻不會噴火。','我不在意。火會燒掉東西，太陽不會。','嚮導說，我們是沙漠的靈魂。我比較喜歡這個名字。'],choices:[{t:'我也比較喜歡那個名字。',r:'（牠的尾舵輕輕擺了一下，像是在沙脊上轉了一個漂亮的彎。）'}]}
  ],
  farewell:['光的顏色變了。','前面有很亮、很熱的地方。我的帆在發燙。','我要下車了。如果你在熱浪裡看見一道琥珀色的帆影，不用叫住我。我跑得很快，但我會記得你。']
 },
 /* 艾莉絲（暮光耳廓鴞）：去背後的動態立繪。資料來自設定稿。 */
 aelis:{name:'艾莉絲',type:'other',species:'暮光耳廓鴞（Vespertine Fennec-Owl）',zone:'moss',spot:{x:17,y:56},spriteH:24,ar:'410/280',color:'radial-gradient(circle,#fff0dc,#d27a3c)',
  image:'assets/aelis.webp',still:'assets/aelis-still.webp',studies:['assets/aelis-s1.webp','assets/aelis-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'古老森林與沙漠交界的綠洲・乾旱岩石峽谷',
  intro:'在暮色中跳上列車的暮光耳廓鴞，名叫艾莉絲。一對巨大的狐狸耳朵、琥珀色的大眼睛，脖子上掛著刻有藤蔓與星辰圖案的葉形吊墜。',
  bio:'在古老沙漠的邊緣，流傳著關於「耳語者」的傳說。每當夜幕降臨，乾燥的風開始歌唱，這些精靈便會現身。據說，如果一個迷途的旅人在沙漠中遇見一隻佩戴著葉形吊墜的暮光耳廓鴞，並得到牠的指引，便能找到隱藏的綠洲或躲過致命的流沙。當地遊牧民族視牠們為沙漠的守護神，相信牠們是古老森林意志的延伸，在荒蕪中傳遞著生命的訊息。這隻名為「艾莉絲（Aelis）」的個體，因其特殊的吊墜，被認為是一位強大德魯伊的夥伴，甚至是信使。牠的身影總是在夕陽的最後一抹餘暉中出現，靈動地跳躍在沙丘與岩石之間，琥珀色的眼睛凝視著遠方，彷彿在傾聽大地的呼吸。',
  field:{alias:'沙狐貓頭鷹、耳語者、沙漠精靈',cls:'魔法混種／森林獸類（沙漠適應型）',
   danger:'低（Low）',dangerNote:'除非被逼入絕境，否則不會主動攻擊人類。',
   rarity:'稀有（Rare）',rarityNote:'僅在特定的沙漠與森林交界帶出現，且由於其謹慎的性格與夜行習性，極難被人類觀察到。佩戴吊墜的個體更是傳說中的存在。',
   looks:'<b>身體構造：</b>這種生物完美融合了貓頭鷹與耳廓狐的特徵。牠擁有圓潤、毛茸茸的貓頭鷹軀幹，覆蓋著柔軟、濃密的橙褐色絨毛，具有極佳的保溫與偽裝效果。牠的頭部比例較大，生有一對不成比例的巨大、靈活的狐狸狀耳朵，內側為淺奶油色，邊緣帶有深色毛尖。<br><b>臉部：</b>臉盤圓潤，有著巨大的、琥珀色的大眼睛，顯示其夜行性特徵。喙小而尖銳，隱藏在絨毛中。胸前的羽毛上帶有深褐色的斑點，類似樹皮紋理。<br><b>四肢與尾巴：</b>四肢強健，末端有著靈巧且銳利的爪子，覆蓋著深色毛髮。尾巴極為蓬鬆粗大，如同狐狸尾巴，末端有一撮明顯的白色絨毛，在平衡身體和夜間禦寒時起重要作用。<br><b>特殊飾物：</b>令人驚訝的是，這隻特定的「暮光耳廓鴞」脖子上佩戴著一條精緻的金屬細鏈，中央懸掛著一個刻有複雜藤蔓與星辰圖案的葉狀吊墜。這並非天生，而是象徵著牠與某個古老森林守護者種族的契約或共生關係。',
   habitat:'主要棲息於古老森林邊緣與廣闊沙漠交界處的綠洲地帶，或是乾旱岩石峽谷中的隱秘洞穴。牠們偏好日夜溫差極大、植被稀疏但水源充足的環境，這能同時發揮牠們的沙漠生存能力與夜間狩獵優勢。',
   habits:[['活動時間','嚴格的夜行性動物，黃昏與黎明時分最為活躍。'],['飲食','主要捕食在夜間活動的昆蟲、小型爬蟲類（如沙蜥）、小型夜行性齧齒動物以及果實。'],['群居或獨居','傾向於獨居或以極小的家庭單位（配偶與幼崽）行動。牠們的領域意識強烈，會利用尖銳的叫聲和氣味標記領地。'],['攻擊性及性格','牠們本質上是謹慎而好奇的。對陌生人通常保持距離，但若感到威脅，會發出如同狐狸尖叫與貓頭鷹鳴叫混合的刺耳聲響，並利用驚人的速度與敏捷性逃脫。牠們極為聰明，能輕易解決簡單的謎題或機關，表現出接近高等智慧生物的行為模式。']],
   abilities:[['聲納放大器','那對巨大的狐耳不僅能捕捉微小的聲音，還能透過細微的肌肉調整角度，形成類似生物聲納的系統，精確定位獵物在沙層下或岩石縫隙中的位置。'],['靜音飛行','保留了貓頭鷹羽毛的特殊結構，飛行時幾乎沒有聲音，能進行無聲的突襲。'],['視覺適應','琥珀色的大眼睛能在極低的光線下視物，並能短暫過濾強光，適應沙漠的刺眼陽光與星空。'],['自然共鳴（象徵）','佩戴吊墜的個體似乎能與周圍的自然能量產生微弱共鳴，這可能賦予了牠們預知沙塵暴或探測魔法能量的潛在能力，使牠們在惡劣環境中總能找到安全棲息地。']]},
  stay:2,
  talks:[
   {lines:['（一隻橙褐色的小生物停在自然棲台的邊緣，巨大的耳朵一轉，對準了你。）','……你的腳步聲很輕。','比旅人輕，比沙蜥重。你是誰？'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈。……森林的老人們說過，精靈的腳步是聽不見的。看來他們也會說錯。'},{t:'你的耳朵真大。',r:'大耳朵聽得見沙子底下的心跳。也聽得見你剛才偷偷笑了一下。'}]},
   {lines:['白天我都在睡覺。等太陽落下，才出來找蟲子和沙蜥吃。','（牠用前爪輕輕撥了撥脖子上的葉形吊墜，藤蔓與星辰的紋路閃了一下。）','這是約定的記號，不是裝飾。','我答應過一位很老的朋友，要替他看看沙漠以外的世界，再回去告訴他。'],choices:[{t:'是什麼樣的朋友？',r:'他住在森林最深的地方，說話很慢，一句話要說一整個季節。……我只能說到這裡。'},{t:'那你要看得很仔細。',r:'我一直都看得很仔細。這是我的工作。'}]},
   {lines:['我叫艾莉絲。','我住在森林和沙漠交界的綠洲旁邊。晚上很冷，白天很燙。','沙漠的人叫我們「耳語者」。他們迷路的時候，會跟著我們找到綠洲。','如果有一天你迷路了……不對，你有一整列會自己走的車。你大概不會迷路。'],choices:[{t:'說不定還是會需要你。',r:'（牠尾巴尖那撮白毛輕輕搖了一下。）那我就在暮色裡等你。'}]}
  ],
  farewell:['暮色要來了。我聽得見風開始唱歌。','前面有森林的味道，也有沙的味道。那是我的地方。','我會把這列車的事告訴我的朋友。他會花一整個季節，慢慢聽完。']
 },
 /* 燼角巨獸：去背後的動態立繪。資料來自設定稿。 */
 pyro:{name:'燼角巨獸',type:'other',species:'Pyro-Cerasaurus',zone:'crystal',spot:{x:81,y:82},spriteH:28,ar:'498/280',color:'radial-gradient(circle,#ffd7a8,#7a2a14)',
  image:'assets/pyro.webp',still:'assets/pyro-still.webp',studies:['assets/pyro-s1.webp','assets/pyro-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'活火山帶・地殼裂隙頻繁的荒漠高原・熔岩峽谷',
  intro:'在赤紅天空下登車的燼角巨獸。漆黑的火山岩外皮佈滿裂縫，熔岩光在裂隙間流動；頭上的巨角像燃燒的木炭，仍散發著高溫。',
  bio:'在烈日與火山灰交織的荒原深處，燼角巨獸是當之無愧的霸主。當地人常說，當遠方的大地開始震動、天空被染成赤紅時，便是這位熔岩暴君在巡視牠的疆域。牠沉重的腳步每踏出一步，都會在地表留下冒煙的焦痕。獵人們對牠敬而遠之，因為任何貪婪的靠近，都將伴隨著被灰燼吞噬的命運。',
  field:{alias:'熔岩暴君、大地之傷',cls:'遠古巨獸／元素類巨獸',danger:'極高',rarity:'稀有',
   looks:'擁有如火山岩般堅硬、漆黑且佈滿裂縫的厚重外皮，裂隙間常年流淌著熾熱的熔岩光輝。<br>頭部前端長有一支巨大的角，其質地如同正在燃燒的木炭，頂端散發出猛烈的高溫與微光。<br>背部與尾巴覆蓋著一排銳利的鋸齒狀骨甲，兩側則生有巨大的蝙蝠狀皮革雙翼，翼膜邊緣殘破且帶有燃燒的痕跡。<br>雙眼呈赤紅色，猶如燃燒的火球，散發出威嚴而暴戾的氣息。',
   habitat:'活躍於活火山帶、地殼裂隙頻繁的荒漠高原，以及被熔岩流覆蓋的乾涸峽谷。',
   habits:[['活動時間','日夜皆可活動，但在地表溫度較高的午後顯得特別活躍。'],['飲食','肉食性，主要獵食大型地下岩棲生物，同時亦會吞食富含礦物質的高溫熔岩與金屬礦石以補充能量。'],['性格','極度孤僻且具強烈的領地意識，脾氣暴躁，對於闖入其領地的生物會毫不留情地發動毀滅性攻擊。']],
   abilities:[['熔岩核心','能夠將體內的熱能高度集中於頭部的巨角與背部裂隙中，進行蓄力衝撞或釋放高溫熱浪。'],['重甲護體','堅硬的岩質皮膚能免疫大部分物理攻擊與烈焰灼燒。']]},
  stay:2,
  talks:[
   {lines:['（棲息車廂的溫度一下子升高了。晶石平台前，一頭漆黑的巨獸低伏著，裂隙間的熔岩光一明一暗。）','……退後。','這不是你的地盤，也不是我的。在弄清楚之前，不要靠近。'],choices:[{t:'（停在原地）我不會靠近。',r:'……嗯。至少你聽得懂。'},{t:'這裡是列車，不屬於任何人。',r:'不屬於任何人的地方……我沒待過那種地方。'}]},
   {lines:['（牠的巨角頂端還在發燙，但背上的熔岩光暗了一些。）','我身體裡有熔岩。熱可以集中在角上，撞開任何擋路的東西。','這輛車在搖。很穩地搖。','在火山那裡，大地搖起來的時候，是在發怒。這裡不是。'],choices:[{t:'你可以在這裡休息。',r:'休息。……我很久沒有用過這個詞。'},{t:'晶石平台的光，夠你補充能量嗎？',r:'不夠熱。不過……不難受。'}]},
   {lines:['人們叫我「大地之傷」。','他們說我走過的地方，都會留下焦痕。那是真的。','但這輛車的地板，一道痕跡也沒有。……我走得很小心。'],choices:[{t:'謝謝你這麼小心。',r:'（牠哼出一口帶著火星的熱氣，轉過頭去，像是不想讓你看見牠的表情。）'}]}
  ],
  farewell:['地底的聲音在叫我。很熱，很深。','那裡才是我的地盤。','……這輛車，我記住了。如果哪天大地為你們震動，那不是我在發怒。']
 },
 /* 翡翠晶甲夜行獸：去背後的動態立繪。資料來自設定稿。 */
 vandora:{name:'翡翠晶甲夜行獸',type:'other',species:'Vandora Prism-Anuran',zone:'moss',spot:{x:30,y:57},spriteH:20,ar:'479/280',color:'radial-gradient(circle,#d8ffe9,#1f6a5a)',
  image:'assets/vandora.webp',still:'assets/vandora-still.webp',studies:['assets/vandora-s1.webp','assets/vandora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'熱帶雨林深處・巨型蕨葉之上・幽暗溪流沼澤邊',
  intro:'在夜色裡無聲登車的翡翠晶甲夜行獸。墨藍與深綠的鱗甲泛著寶石般的虹彩，頭側細長的翠綠觸鬚輕輕顫動，金黃色的雙眼在暗處一眨也不眨。',
  bio:'在雨林巨大的姑婆芋葉上，翡翠晶甲夜行獸正低伏著身體，嘴邊細長的觸鬚在微風中輕輕顫動。牠那寶石般閃耀的身軀與周圍的濃密綠意融為一體，是雨林中令人驚艷又敬畏的隱形獵手。',
  field:{alias:'雨林翡翠、苔原幻影',cls:'兩棲獸類／森林變異爬行種',danger:'中',rarity:'少見',
   looks:'外型介於巨貓與神話兩棲類之間，皮膚覆蓋著具有金屬光澤的墨藍與深綠色鱗甲，在光線下會折射出如寶石般的虹彩。頭部兩側長有如空氣鳳梨般細長的翠綠色觸鬚，雙眼呈銳利的金黃色。',
   habitat:'常年潮濕的熱帶雨林深處、巨型蕨類植物的葉片上或幽暗的溪流沼澤邊。',
   habits:[['活動時間','夜行性。'],['性格','性格敏捷、狡黠且具有強烈的領域性。'],['飲食與狩獵','以雨林中的昆蟲、小型爬蟲及樹液為食，擅長利用環境色進行無聲的伏擊。']],
   abilities:[['虹彩折射與觸鬚感應','體表鱗片能隨意折射光線達到光學迷彩的效果；頭部的翠綠觸鬚能極其靈敏地捕捉空氣中微小的濕度與震動變化。']]},
  stay:2,
  talks:[
   {lines:['（自然棲台的苔葉間，有一塊綠色忽然「動」了一下。仔細看，才發現那是一頭低伏的生物，鱗甲的顏色和葉子一模一樣。）','……你看見我了。','很少有東西能先看見我。通常是我先看見它們。'],choices:[{t:'是你的眼睛出賣了你。',r:'（金黃色的眼睛瞇了起來。）……下次我會閉上一隻。'},{t:'我只是剛好往這裡看。',r:'剛好。雨林裡沒有剛好。不過……這裡不是雨林。'}]},
   {lines:['（牠頭側的翠綠觸鬚慢慢舒展開，在空氣裡輕輕擺動，像在聞什麼。）','這裡的空氣太乾了。不過，有水的味道，從那邊的泉水飄過來。','還有震動。很規律、很穩的震動。這輛車一直在跑。'],choices:[{t:'你的觸鬚感覺得到這麼多？',r:'濕度、風、腳步。你走過來的時候，我在你說話之前就知道了。'},{t:'要我把車廂調得濕一點嗎？',r:'……不用。我會待在葉子底下。這樣就夠了。'}]},
   {lines:['（牠的鱗甲在車廂的燈光下泛起一層虹彩，一閃，又和苔綠融在一起。）','雨林的人叫我「苔原幻影」。他們說，看見我的時候，通常已經太晚了。','……我不會在這裡打獵。這裡不是我的領地。我分得清楚。'],choices:[{t:'謝謝你這麼說。',r:'不用謝。我只是不喜歡在別人的地盤上弄髒爪子。（牠的觸鬚輕輕抖了一下，像是在笑。）'}]}
  ],
  farewell:['空氣變濕了。我聞得到樹液和泥土的味道。','天快要黑了。那是我醒來的時間。','我要回葉子上去了。如果哪天你在雨林裡覺得有一片綠色在看你，不用找。那是我在跟你打招呼。']
 },
 /* 霜脊冰原獸：去背後的動態立繪。資料來自設定稿。 */
 frost:{name:'霜脊冰原獸',type:'other',species:'Frost-Ridge Ice-Beast',zone:'crystal',spot:{x:89,y:74},spriteH:22,ar:'570/300',color:'radial-gradient(circle,#f4fbff,#7fb4d8)',
  image:'assets/frost.webp',still:'assets/frost-still.webp',studies:['assets/frost-s1.webp','assets/frost-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'高海拔冰原・極圈冰川裂谷・極寒山脈',
  intro:'在駛向月界的寒氣裡登車的霜脊冰原獸。乳白色的厚重絨毛間，脊背與尾巴上的冰晶硬甲泛著微藍的光暈；一雙冰川般湛藍的眼睛，安靜地打量著車廂。',
  bio:'在極北之境的「萬古冰原」深處，霜脊冰原獸被當地原住民視為冰川之神的守望者。當暴風雪呼嘯而過、天地一片蒼茫之時，獵人往往只能看見一雙在風雪中幽藍髮光的雙眼，以及背脊上如冰刺般掠過的寒芒。牠們輕巧而寂靜地穿梭在數米深的厚雪之上，彷彿與周遭的冰山雪景融為一體，是這片白色禁區中無可動搖的頂級掠食者。',
  field:{alias:'冰原的白色追獵者、凝光雪獅、永凍之魂',cls:'極地巨型獸類／元素獸屬',
   danger:'高',dangerNote:'具備強大的物理破壞力與極度致命的嚴寒氣場',
   rarity:'稀有',rarityNote:'僅在極深處的無人冰原偶爾可見，極難被馴服或捕捉',
   looks:'體格龐大而結實，身形介於大型貓科動物與巨熊之間，覆蓋著一層厚重的乳白色稠密絨毛。其脊椎骨兩側、尾巴以及前肢局部，生長著半透明的冰晶狀硬甲與倒刺，這些冰晶在寒光下會折射出微藍的光暈。牠的頭部具有貓科動物般的輪廓，耳尖帶有銳利的黑色簇毛，雙眼呈現出如深谷冰川般的明亮湛藍色，面部與四肢的細密絨毛間也隱約鑲嵌著天然的晶體結構。',
   habitat:'常年被風雪覆蓋的高海拔冰原、極圈冰川裂谷，以及人跡罕至的極寒山脈。牠們多數時間棲息於避風的冰洞或岩縫中。',
   habits:[['活動時間','日夜皆宜，但在漫長而昏暗的極夜與暴風雪天氣中表現得最為活躍。'],['飲食','肉食性，主要捕獵冰原上的耐寒大型草食獸或冰角鹿。'],['社會結構','多數時間過著獨居生活，僅在嚴冬的繁殖季節短暫聚集。'],['性格與攻擊性','性格沉穩、警惕且極具領地意識。雖然不會無故主動攻擊過路旅人，但若被侵擾或感受到威脅，會展現出極具壓迫性的強大戰意。']],
   abilities:[['冰晶折射與偽裝','能夠將周遭的寒氣凝聚在體表的冰晶上，在暴風雪中形成完美的視覺折射，達到近似隱形的偽裝效果。'],['極寒爪擊','利爪與足底覆蓋著極低溫的寒霜，每一次踏地或揮擊都能瞬間凍結接觸面的水分或獵物的表皮。']]},
  stay:2,
  talks:[
   {lines:['（靈泉邊的空氣忽然冷了下來，水面結出一圈薄薄的霜。一頭乳白色的巨獸站在那裡，背脊上的冰晶泛著微藍的光。）','……你走路的聲音，我在車廂另一頭就聽見了。','不必緊張。我只是在確認，這裡誰是先來的。'],choices:[{t:'我是這列車的值勤精靈。',r:'值勤。……那這裡是你的領地。我會記住界線在哪裡。'},{t:'這裡沒有誰的領地。',r:'冰原上，每一片雪都有主人。沒有主人的地方……我需要一點時間習慣。'}]},
   {lines:['（牠低頭聞了聞靈泉的水，水面立刻凝起細小的冰花，又慢慢化開。）','這裡太暖了。不過，不討厭。','在萬古冰原，連呼吸都會結冰。所以我們很少開口。'],choices:[{t:'那你現在願意說話，我很高興。',r:'……嗯。這裡的空氣不會把話凍住。'},{t:'會不會太熱？',r:'我的爪子底下有霜。站久了，地板會涼一點。……抱歉，這是習慣。'}]},
   {lines:['獵人說，在暴風雪裡只看得見我們的眼睛。','那是因為我們不想被看見。在白色裡，消失是最安全的事。','可是在這輛車上，我好像不必躲。'],choices:[{t:'在這裡，你可以被看見。',r:'（牠背上的冰晶輕輕亮了一下，像是寒夜裡一盞很小的燈。）……那我就站在這裡。'}]}
  ],
  farewell:['風裡有雪的味道了。很遠，但是我認得。','冰原在叫我回去。那裡很冷，很安靜。','如果有一天你在風雪裡看見一雙藍色的眼睛，不用怕。那是我在替你看路。']
 },
 /* 霧羽海葵龍：單張立繪（透明背景），以影像變形做成觸鬚擺動與核心光點呼吸的循環動畫。資料來自設定稿。 */
 sirenora:{name:'霧羽海葵龍',type:'mind',species:'Sirenora',zone:'veil',spot:{x:92,y:40},spriteH:19,ar:'883/328',color:'radial-gradient(circle,#fff6fb,#b9a6d6)',
  image:'assets/sirenora.webp',still:'assets/sirenora-still.webp',studies:['assets/sirenora-s1.webp','assets/sirenora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'濃霧籠罩的無風峽灣・發光苔蘚的地下暗河・迷霧與潮汐的高山海岬',
  intro:'列車穿過濃霧時，悄悄飄進車廂的霧羽海葵龍。如海葵與發光水母交織的扇狀薄翼透著淡紫與乳白的暈光，中心一點柔和的光，像一盞在霧裡指路的燈。',
  bio:'在無盡迷霧籠罩的海岸線與高山交界處，老一輩的航海者總會告誡年輕人：如果在濃霧中看見一抹溫柔的粉白光暈，切記不要追逐，只需靜靜駐足。那是「霧羽海葵龍」在收集世人遺忘的夢境。牠們由那些未能歸家之人的思念所化，如同一盞孤燈，在潮汐與霧氣間無聲擺盪。當牠們舒展那如海葵般透明的羽翼時，整個峽灣的風都會安靜下來，彷彿連時間也在那柔和的光芒中暫停了腳步。',
  field:{alias:'幻海的悼亡者、深淵浮影、晨曦微光獸',
   cls:'意念生命（由群體意念形成的存在 —— 來自失落航海者對故鄉與歸宿的強烈思念、以及對無垠迷霧的敬畏所凝聚而成的意識體）。',
   danger:'低',dangerNote:'幾乎不具傷害性，甚至能安撫人心',
   rarity:'稀有',rarityNote:'僅在特定的濃霧季節與人跡罕至的潮汐峽灣中方得一見',
   looks:'<b>身體構造：</b>擁有流暢而修長的流線型軀體，覆蓋著如珍珠般溫潤的半透明鱗片，尾端延伸出如海草般優雅的靈動尾鰭。背部與頭部交界處綻放著一對巨大、如深海海葵與發光水母交織而成的扇狀薄翼，邊緣透著夢幻的淡紫與乳白色暈光。<br><b>顏色：</b>主體為銀白與珍珠灰，點綴著幽藍與淡粉的生物螢光脈絡；頭頂與觸鬚則帶著半透明的珍珠光澤，能在黑暗中散發指引方向的微光。<br><b>辨識特徵：</b>頭部沒有傳統的獸類雙耳，取而代之的是如珊瑚枝椏般向外延伸的感知觸鬚，能直接捕捉周遭生物的情緒波動與氣壓變化。',
   habitat:'終年被濃霧籠罩的無風峽灣、漂浮著發光苔蘚的地下暗河，或是交織著迷霧與潮汐的高山海岬。牠們不需要實質的物質庇護所，通常隨著微弱的氣流與潮汐磁場緩慢飄浮。',
   habits:[['活動時間','多數時間處於半夢半醒的漂浮狀態，但在晨昏交替或迷霧最濃郁的時刻最為活躍。'],['飲食','不需進食實體食物。牠們以空氣中流動的純粹情緒、夢境殘留的記憶碎片，以及微弱的乙太能量維生。'],['社會性','多數為獨居，但在氣候劇變或特定節令時，會成群在迷霧中交錯起舞，形成如夢似幻的「光之迴游」。'],['性格與攻擊性','性格溫和、羞怯而敏感。天生不具備實體攻擊性，當感受到威脅時，會釋放安撫心神的微光與低頻共鳴，使闖入者陷入平靜的睏意中，隨後悄然遁入霧氣。']],
   abilities:[['迷霧幻象（Mist Mimicry）','能夠將自身的生物螢光與周遭的霧氣融合，製造出海市蜃樓般的視覺干擾，使獵食者或不速之客在迷霧中迷失方向。'],['共鳴安撫（Aura Soothing）','透過背部如海葵般的巨大扇翼拍動，散發出能夠平息焦慮、撫平精神創傷的微弱電磁波與柔和光暈。']]},
  stay:2,
  talks:[
   {lines:['（車廂上方飄著一團柔和的粉白光暈。你一抬頭，那光就往後縮了一點，觸鬚輕輕顫著。）','……不要追。','我住在霧裡。沒有風的峽灣，霧很濃，濃到連潮聲都會變輕。','我只是……被這輛車的燈吸引過來的。它亮得很像港口。'],choices:[{t:'（停在原地，靜靜看著）',r:'……謝謝。你站著不動的樣子，和老航海者教的一樣。'},{t:'你是從霧裡來的嗎？',r:'我就是霧的一部分。很多人在霧裡想家，想著想著，就有了我。'}]},
   {lines:['（牠慢慢舒展扇狀的薄翼。光暈一亮一暗，車廂裡的空氣好像安靜了下來。）','你身上有一點點想念的味道。很淡，但是我聞得到。','別擔心。我不會拿走它。我只收集被遺忘的夢。'],choices:[{t:'被遺忘的夢，會去哪裡？',r:'會留在我的光裡。等到有一天，有人在霧中停下腳步，我就把它還給那片海。'},{t:'我在想念什麼呢？',r:'……這個，要你自己想起來才算數。我只能告訴你，那是溫暖的東西。'}]},
   {lines:['那些沒能回家的人，最後都只剩下一句話：「我想回去。」','我是由很多很多這句話組成的。','可是在這輛會自己前進的列車上……我第一次覺得，自己好像也在回家的路上。'],choices:[{t:'那就在這裡多待一會兒吧。',r:'（牠中心的光柔柔地亮了一下，整節車廂的風都停了，像時間也一起歇了一口氣。）'}]}
  ],
  farewell:['霧變濃了。我聽見峽灣在叫我。','那裡有很多還沒被收好的夢，在潮汐裡擺盪。','謝謝你讓我停在這盞燈下。如果你在霧裡看見一抹粉白的光，不要追……只要停下來就好。']
 },
 titan:{name:'苔淵巨靈',type:'other',species:'Mossbound Titan',zone:'moss',spot:{x:22,y:49},spriteH:34,ar:'340/300',color:'radial-gradient(circle,#e3f0c8,#5d7a45)',
  image:'assets/titan.webp',still:'assets/titan-still.webp',studies:['assets/titan-s1.webp','assets/titan-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'深邃而古老的原始紅木森林・霧氣瀰漫的溫帶雨林深處',
  intro:'列車停靠時，森林邊緣一座長滿苔蘚的小山，緩緩動了起來。牠的肩上長著蕨類，鬍鬚像垂下的枯木鬚根，每一次沉重的呼吸，都帶起一陣帶有草木清香的晨霧。',
  bio:'在古老林海的深處，苔淵巨靈如同一座移動的小山般緩步前行。牠每一次沉重的呼吸，都會帶起陣陣帶有草木清香的晨霧。森林裡的精靈與走獸從不畏懼牠的存在，反而視牠為行走的庇護所——因為在巨靈經過的足跡上，總會滋養出最豐饒的生命與最清澈的泉水。',
  field:{alias:'行走的森林、大地之錨、沉睡古民',
   cls:'遠古巨獸 / 森林巨人類',
   danger:'中',
   rarity:'稀有',
   looks:'擁有如千年古樹般粗壯厚重的軀體，皮膚表面佈滿粗糙的樹皮紋理與深綠色的厚重苔蘚。雙肩與背脊上常年覆蓋著蕨類植物與微型地被灌木。頭部輪廓深邃，面容宛如風化嚴重的岩石，垂下如枯木鬚根般的長鬍鬚，雙手巨大而有力。',
   habitat:'深邃而古老的原始紅木森林、霧氣瀰漫的溫帶雨林深處。',
   habits:[['活動時間','極度緩慢，通常以數十年甚至數百年為一個行動與沉睡的週期。'],['飲食','以吸收土壤養分、地脈靈氣以及雨水為主，偶爾攝取少量的礦物質。'],['性格與群居','個性溫和、孤獨且極度沉穩，通常獨來獨往。對外界事物不理不睬，除非棲息地遭受嚴重破壞，否則不會主動展現攻擊性。']],
   abilities:[['自然偽裝','具備完美的自然偽裝能力，靜止時與周遭環境無異'],['承載生態','其龐大的身軀能承載並調節一片微型生態系，行走時震動地面能促進周遭植物的生長與地脈循環。']]},
  stay:2,
  talks:[
   {lines:['（自然棲台的角落，多了一座長滿苔蘚的小山。你走近了，才發現那座山有一張像岩石一樣的臉。）','……嗯。','……我……睡著了，一下子。','一下子……是從你出生之前，到剛剛。','我住的地方……樹很老，很高。紅木森林的深處，霧不會散。'],choices:[{t:'你睡了多久？',r:'……很久嗎？對我來說，只是翻了一個身。'},{t:'（安靜地等牠說下去）',r:'……你很有耐心。森林裡的小東西，也是這樣等我的。'}]},
   {lines:['（牠肩上的蕨葉輕輕晃了一下。過了很久，你才發現那是牠在呼吸。）','……我不吃東西。根……會替我吃。土裡的養分、地脈的氣、雨水。','偶爾……舔一點石頭。這輛車的石頭……有一點星星的味道。','你剛才站在我旁邊，沒有發現我吧。……我不動的時候，就只是一座長苔蘚的小山。'],choices:[{t:'真的完全沒發現。',r:'……嗯。森林裡的鳥，常常在我的頭上築巢。牠們也沒發現。'},{t:'舔石頭？',r:'……很好吃。礦物……是森林裡，最慢的點心。'}]},
   {lines:['（牠慢慢抬起一隻巨大的手，又慢慢放下。地板輕輕震了一下——苔蘚棲台上，幾株小芽一起冒了出來。）','……我走過的地方，草會長，泉水會變清。','所以森林裡的精靈和走獸……都跟在我後面走。','牠們把我當成……一座會走路的庇護所。我很少說話。可是，我喜歡牠們跟著。'],choices:[{t:'這輛車也跟著你一起長出了新芽。',r:'（牠臉上的岩石紋路，好像鬆開了一點。那也許是一個笑。）……那這輛車，也是我的森林了。'}]}
  ],
  farewell:['……地脈在叫我。很慢，很遠。','我該回去，繼續睡了。下一次醒來……也許是一百年以後。','你那時候不在了也沒關係。我走過的地方，會長出新的森林。……那裡面，會有你的味道。']
 },
 lynx:{name:'霜晶冰原獸',type:'other',species:'Frost-Crested Glimmer-Lynx',zone:'rings',spot:{x:58,y:24},spriteH:17,ar:'510/300',color:'radial-gradient(circle,#f6fbff,#9cc6e6)',
  image:'assets/lynx.webp',still:'assets/lynx-still.webp',studies:['assets/lynx-s1.webp','assets/lynx-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'終年積雪的高山雪嶺・極地冰原・寒冷的魔法冰川地帶',
  intro:'列車穿過結冰的航道時，沿著結霜的車窗疾走而過的銀白影子。牠走過的地方沒有一點聲音，只留下一串細小的晶塵。',
  bio:'在冰封的極北之境，霜晶冰原獸被當地巡山人視為冰雪的化身與冬之精靈。傳說牠們的每一次躍動都能激起微小的晶塵，而牠們守護著古老的冰川祕境，唯有心地純淨的旅人能在風雪中偶遇其優雅如幻影的身影。',
  field:{alias:'冰脊靈貓、冬影',
   cls:'極地奇幻獸類',
   danger:'中',
   rarity:'稀有',
   looks:'<b>頭部與面容：</b>擁有類似大型貓科（如山貓）的輪廓，雙耳尖端帶有深色簇毛，雙眼透出晶瑩的冰藍色光芒，面部線條銳利而優雅。<br><b>毛髮與冰晶：</b>全身覆蓋著密集的銀白與淡灰相間絨毛，背部脊椎線條、尾巴以及四肢上生長著晶瑩剔透的冰晶或水晶狀背棘，在光線下折射出冰藍色澤。<br><b>軀幹與四肢：</b>體態矯健有力，四肢肌肉線條流暢，爪子銳利，正處於動態奔馳或跳躍的張力姿勢中。',
   habitat:'終年積雪的高山雪嶺、極地冰原或寒冷的魔法冰川地帶。',
   habits:[['活動時間','晨昏與夜間活動為主，適應極度嚴寒的氣候。'],['飲食','以捕獵極地小型魔獸、食用高山冰晶植物的根莖為生。'],['社交','多數時間獨來獨往，性格孤傲敏捷，警覺性極高，對陌生領域有強烈的領地意識。']],
   abilities:[['寒冰折射','能透過背部的冰晶吸收並折射月光或日光，在危急時製造短暫的眩光以隱蔽身形。'],['踏雪無痕','移動時幾乎不發出聲響，且能短暫在雪面或垂直冰壁上高速疾走。']]},
  stay:2,
  talks:[
   {lines:['（懸浮棲息環的陰影裡，一雙冰藍色的眼睛盯著你。你往前一步，牠背上的冰晶就豎了起來。）','……別再靠近了。這一段圓環，是我的。','我來的地方，雪從來不化。高山雪嶺，再往北，就是冰原。','那裡沒有人。……沒有人，才好。'],choices:[{t:'（退後一步，表示沒有惡意）',r:'……哼。至少你懂規矩。'},{t:'你是從冰原來的嗎？',r:'冰原的邊上。冰原本身……太大了，誰也佔不完。'}]},
   {lines:['（天色暗下來，牠的眼睛反而更亮了。牠在圓環上來回走了一圈，一點聲音也沒有。）','天快黑的時候，才是我的時間。白天太亮，雪會刺眼。','我吃雪地裡的小魔獸，還有冰晶草的根。脆的。','我走路沒有聲音。雪地上不會留下腳印，冰壁上也一樣。……所以獵物從來不知道我來過。','昨天晚上，我在車頂跑了一圈。這輛車的車頂，很適合奔跑。'],choices:[{t:'你剛剛走過去，我真的什麼都沒聽到。',r:'……當然。'},{t:'冰晶草的根好吃嗎？',r:'……冷冷的，有一點甜。你不會喜歡的。'}]},
   {lines:['（你一走近，牠背上的冰晶忽然一亮——刺眼的白光閃過，等你再睜開眼，牠已經站在另一個圓環上了。）','……習慣了。有東西靠近，我就會這樣。','巡山人說，我們是冬天的精靈。說我們守著古老的冰川。','……我只是守著一個地方。冰川的深處，有一個很安靜的祕境。只有心地乾淨的旅人，才走得到那裡。','你……大概走得到。'],choices:[{t:'謝謝你這麼說。',r:'（牠別過頭，尾巴上的冰晶輕輕碰出一串細小的晶塵。）……不要說出去。'}]}
  ],
  farewell:['風雪的味道變了。冰川在叫我回去。','祕境不能沒有人守著太久。','……下次在風雪裡看到一閃一閃的光，別追。那是我在跟你說，我看見你了。']
 },
 strider:{name:'灰角靈犬',type:'other',species:'Apex-Horned Strider',zone:'rest',spot:{x:25,y:80},spriteH:26,ar:'329/300',color:'radial-gradient(circle,#efe9e2,#7d7468)',
  image:'assets/strider.webp',still:'assets/strider-still.webp',studies:['assets/strider-s1.webp','assets/strider-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'開闊的乾旱平原・多岩石的丘陵地帶・微風吹拂的半荒漠邊緣',
  intro:'列車駛過乾燥的風帶時，昂首站在棲息車廂裡的灰褐色身影。牠把刀刃般修長的角冠迎向車廂裡流動的風，像在聽著遠方的什麼。',
  bio:'在廣袤無垠的風息荒原中，灰角靈犬被遊牧民族視為風之方向的引導者。每當牠們昂首佇立於風中、將長角迎向微風時，便是在聆聽遠方的氣息。牠們優雅而孤傲的身影，是荒原大地上最靈動的風景。',
  field:{alias:'風角獸、荒原敏靈',
   cls:'奇幻荒原獸類',
   danger:'低',
   rarity:'少見',
   looks:'<b>頭部與角冠：</b>擁有流線型的頭部，兩側頭角向後延伸出對稱的長角冠，狀如刀刃般修長；雙眼深邃溫和，神情機警。<br><b>皮膚與紋理：</b>全身覆蓋著富有質感且帶著自然紋理的深灰褐色皮革狀外皮，身體表面具有精細的肌肉線條與骨骼起伏。<br><b>軀幹與四肢：</b>體態修長矯健，四肢纖細但充滿爆發力，爪步結構利於快速奔跑與穩固站立。<br><b>尾部：</b>尾端自然下垂並帶有流暢的收尾，與整體的體態完美呼應。',
   habitat:'開闊的乾旱平原、多岩石的丘陵地帶或微風吹拂的半荒漠邊緣。',
   habits:[['活動時間','晨昏活動為主，善於利用環境色進行隱蔽。'],['飲食','以荒原特有的地下多汁根莖與小型昆蟲為食。'],['社交','多數時間小群活動或獨行，性格機警敏銳，遇見危險時會以極高的速度迅速撤離，少有主動攻擊性。']],
   abilities:[['敏銳感應','頭部長角能偵測大氣中微小的震動與風向變化，提前預知風暴或掠食者的接近。'],['疾風步態','奔跑時極具速度感與輕盈感，能在崎嶇地形中如履平地。']]},
  stay:2,
  talks:[
   {lines:['（休憩區的角落，一隻灰褐色的生物昂著頭，長角微微轉動，像在聽什麼。）','……噓。風在轉向。','我來的地方很開闊。乾旱的平原，多岩石的丘陵，風一直吹，從來不停。','所以我習慣先聽風，再說話。'],choices:[{t:'你在聽什麼？',r:'車廂外面，有一陣很遠的風。……還好，不是風暴。'},{t:'（安靜地陪牠聽）',r:'……你也聽到了嗎？聽不到也沒關係。'}]},
   {lines:['（牠低頭在地上嗅了嗅，用前爪輕輕刨了兩下。）','這裡的地板底下，沒有根。……在荒原上，我會挖地下多汁的根莖來吃，渴的時候也靠它。有時候，也吃一點小蟲子。','天剛亮和快天黑的時候，我最有精神。那時候的荒原是灰色的，我站著不動，誰也看不見我。','（牠甩了甩尾巴。）你們的車廂，顏色太亮了。我躲不起來。'],choices:[{t:'要不要幫你把燈調暗一點？',r:'……不用。在這裡，我不需要躲。'},{t:'地下的根莖好吃嗎？',r:'多汁，有一點苦。在荒原上，那就是水。'}]},
   {lines:['（牠忽然抬起頭，雙角對準車窗。過了一會兒，列車外才傳來一陣低沉的風聲。）','……我的角，聽得見很遠的震動。風暴要來，掠食者要來，我都會比它們先知道。','知道了，就跑。我跑得很快，石頭再多，也跟平地一樣。','遊牧的人說，跟著我們，就找得到風的方向。','……其實我只是在聽。可是，被當成引路的，好像也不錯。'],choices:[{t:'那你願意幫這輛車聽聽前面的風嗎？',r:'（牠把長角迎向車窗，耳朵輕輕一動。）……前面的風很乾淨。可以走。'}]}
  ],
  farewell:['風變了。荒原那邊，有一陣很熟悉的風在叫我。','我該回去了。同伴們會在丘陵上等我。','以後，如果你在風裡聽見一點點蹄聲，那就是我在跟你說：前面的路，是好的。']
 },
 windkoi:{name:'金羽御風鯉',type:'domain',species:'Aureo-Pinnate Windfish',zone:'rings',spot:{x:72,y:20},spriteH:20,ar:'400/235',color:'radial-gradient(circle,#fff8e8,#e8b25a)',
  image:'assets/windkoi.webp',still:'assets/windkoi-still.webp',studies:['assets/windkoi-s1.webp','assets/windkoi-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'高山之巔與浮空島嶼周邊的強烈對流氣流層・高海拔的純淨冰川湖泊',
  intro:'列車停靠在星河浮島時，順著上升的氣流游進車廂的金色身影。牠在懸浮棲息環之間迴旋了一圈，羽狀的鰭在燈光下閃著琥珀色的光。',
  bio:'在古老的山居民族傳說中，金羽御風鯉被視為天空與清風的信使。相傳牠們是天空神明掉落的淚珠所化，當氣流異常、暴風雨即將來臨前夕，往往能看見牠們逆風而上的優美身影。許多雲端上的貿易商隊若能在旅途中遇見金羽御風鯉伴飛，皆會認為這是趟平安順遂的吉兆。',
  field:{alias:'雲端流光、天際金梭',
   cls:'天空半水棲幻獸・氣流游魚',
   danger:'低',
   rarity:'稀有',
   looks:'<b>身形與鱗片：</b>身形流暢優雅，軀幹覆蓋著層次分明、散發珍珠般溫潤光澤的細密鱗片。<br><b>羽狀鰭：</b>胸鰭與尾鰭演化為極具質感的羽狀結構，呈半透明的琥珀金與乳白色漸層，邊緣如絲羽般細緻，能在氣流中如同飛鳥般展翅滑翔。<br><b>頭部：</b>頭部線條流線，口部細緻，雙眼呈琥珀金色，透出一種靈動而高傲的氣質。',
   habitat:'常年環繞高山之巔、浮空島嶼周邊的強烈對流氣流層，偶爾會降落至高海拔的純淨冰川湖泊中產卵。',
   habits:[['活動時間','日行性，喜愛在晨光與落日時分順著上升氣流群體或獨自迴旋翱翔。'],['飲食','以懸浮在空中的微小光靈元素與高空浮塵為食。'],['社交','個性溫和但極具靈性，對外界干擾保持高度警覺，一旦感受到威脅便會化作一道金色流光迅速遁入雲海。']],
   abilities:[['御風巡航','能夠透過羽狀的魚鰭捕捉並操縱微弱的氣流，在幾近真空的高空或平流層中自由推進，不受重力束縛。'],['金鱗折光','鱗片能折射陽光，形成短暫的視覺盲區。']]},
  stay:2,
  talks:[
   {lines:['（懸浮棲息環之間，一道金色的影子轉了個圈，停在你頭頂上。羽狀的鰭輕輕扇著，像在踩著看不見的風。）','……你看得見我？','我住在很高的地方。高山的山頂，浮島的旁邊，那裡的風一直往上走，從來不停。','我就在那些風裡游。','……冰川湖泊是生蛋的時候才去的。那裡的水，好冷好冷。'],choices:[{t:'在風裡游？不是在水裡？',r:'水也可以。可是風比較寬。……冰川湖泊是生蛋的時候才去的。'},{t:'（抬頭看著牠轉圈）',r:'（牠又轉了一圈，鱗片閃過一道金光。）……喜歡嗎？'}]},
   {lines:['（牠張開嘴，在空中輕輕咬了幾下，像在吃什麼看不見的東西。）','這裡的空氣裡有光。很小很小的光，還有一點點浮塵。','我吃那些。早上和傍晚最多，所以那時候我最喜歡出來。','（牠甩了甩尾鰭。）……你們的車廂裡，光比山頂少。不過，也夠了。'],choices:[{t:'光好吃嗎？',r:'暖暖的。早上的光比較甜，傍晚的光比較……捨不得。'},{t:'要不要開燈給你？',r:'不用。我不貪心。'}]},
   {lines:['（你伸手想碰牠，牠忽然一閃——一道金光劃過，你眼前什麼都看不見了。等你回過神，牠已經在另一個圓環上了。）','……對不起。習慣了。','有東西突然靠近，我就會變成光，躲進雲裡。','山上的人說，我們是天空掉下來的眼淚。暴風雨要來之前，我們會逆著風往上游。','商隊看到我們，就說這趟路會平安。……其實我們只是在游。可是能讓他們安心，好像也不錯。'],choices:[{t:'那你願意陪這輛車游一段嗎？',r:'（牠繞著你轉了一圈，在你肩膀旁邊停下來。）……前面的風很順。我陪你。'}]}
  ],
  farewell:['山頂的風，換了方向。……是同伴在叫我。','冰川湖的水也變暖了，該回去了。','以後在晨光裡，看到一道金色的流光往上游，那就是我。……代表你的路，會很平安。']
 },
 mnemo:{name:'霜憶晶絡',type:'mind',species:'Mnemocryst Lattice',zone:'veil',spot:{x:84,y:46},spriteH:34,ar:'308/857',color:'radial-gradient(circle,#f2f8ff,#7fa8e8)',
  image:'assets/mnemo.webp',still:'assets/mnemo-still.webp',studies:['assets/mnemo-s1.webp','assets/mnemo-s2.webp'],sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'寂滅虛空邊緣的冰霧帶・熄滅世界留下的殘骸附近・沒有光也沒有熱的地方',
  intro:'列車停靠在星河浮島時，一團冰霧貼上了車窗。霧散開之後，靜謐結界裡多了一座直立的冰晶，正中央的幾顆藍色光泡，一明一暗地亮著。',
  bio:'渡守時代流傳著一個說法：每當一個世界熄滅，那片虛空的邊緣就會凝結出一株霜憶晶絡，把那個世界最後的記憶收進牠的憶泡裡。渡守們稱牠為「世界的守靈者」，從不打擾牠。也有人說，列車的記憶典藏車廂，就是仿照牠的構造建成的。',
  field:{alias:'守靈者、冰中的記憶',
   cls:'心象結晶生命・意識凝結體',
   danger:'低（長時間凝視憶泡，可能短暫迷失在別人的記憶裡）',
   rarity:'極稀有',
   looks:'<b>整體：</b>上下對稱的直立冰晶網絡，像一座用冰絲編成的小小聖龕，通體泛著淡藍的冷光。<br><b>冰絲與冰羽：</b>外層是向上、向下延伸的細長冰絲，像凍住的光線；中段是一層層交錯的冰羽與脈絡，往內收攏、包覆核心。<br><b>憶泡：</b>核心裡懸浮著數顆湛藍的光泡，每一顆都封存著一段記憶。記憶越溫暖，光泡越亮。',
   habitat:'月界寂滅虛空邊緣的冰霧帶，熄滅世界留下的殘骸附近；遠離光與熱，只在極冷、極靜的地方凝結。',
   habits:[['活動','幾乎不移動，在冷霧裡靜靜漂浮；航行或夜裡會發出淡藍的微光。'],['飲食','以世界崩毀時散逸的「被遺忘的記憶」為食，把它們凝成新的憶泡。'],['性情','溫和、極度安靜。怕熱，靠近溫暖的地方，冰絲的末端會微微融化。']],
   abilities:[['封憶','能把接觸到的記憶凝結成憶泡保存下來，千年不散。'],['憶泡共鳴','憶泡被輕輕觸碰時，觸碰的人能短暫看見裡面封存的景象。']]},
  stay:3,
  talks:[
   {lines:['（靜謐結界的冷霧裡，冰晶輕輕響了一聲，像風鈴。你靠近時，核心裡的一顆藍色光泡亮了起來。）','……你，是活著的記憶。','我住在很冷、很安靜的地方。寂滅虛空的邊緣。那裡沒有光，沒有熱，只有漂過來的記憶碎片。','我把它們收起來。'],choices:[{t:'收起來……收在哪裡？',r:'（核心裡的光泡一顆一顆亮了一下。）這裡。每一顆，都是一個人、一個地方，或是一個下午。'},{t:'（安靜地看著那些光泡）',r:'……你看得很仔細。謝謝。很少有人願意看。'}]},
   {lines:['（冰絲的末端掛著一滴水，慢慢地落下來。）','這裡……有一點暖。我的冰絲會化掉一點點。','沒關係。我不吃熱的東西。我吃的，是被忘記的事。','世界熄滅的時候，記憶會散開，像灰。沒有人接住的，我就接住。','所以我不移動。我只要等，它們會自己漂過來。'],choices:[{t:'要不要把結界調冷一點？',r:'……好。可是不要太冷。這裡的暖，我也想記住。'},{t:'被忘記的事，是什麼味道？',r:'冰冰的。……但是裡面，常常是暖的。'}]},
   {lines:['（你不小心碰到了一顆光泡——眼前忽然出現一片陌生的草原，有人在笑，風很大。下一秒，你又站在車廂裡了。）','……對不起。那是一個已經沒有的世界，最後一個晴天。','渡守們叫我「守靈者」。他們說，我是替熄滅的世界守夜的。','你們的記憶典藏車廂，跟我長得很像。……也許建造它的人，見過我們。','如果有一天我也化掉了，那些光泡會留下來。……你願意幫我記得嗎？','……這裡的暖，我也想記住。'],choices:[{t:'我會記得。',r:'（核心裡最大的那顆光泡，亮得像一顆小小的月亮。）……嗯。那我就不怕了。'}]}
  ],
  farewell:['冷霧在叫我。虛空的邊緣，又有一個世界要熄滅了。','我得去接住它最後的記憶。','……我收了一顆新的光泡，是這輛車。是你。以後在很冷的地方，它會替我記得溫暖。']
 },
 yixi:{name:'遺曦',type:'lost',species:'Lumen Relictum',zone:'rest',spot:{x:14,y:60},spriteH:34,ar:'631/900',stay:9999,color:'radial-gradient(circle,#e9e2ee,#5a4a66)',
  image:'assets/yixi.webp',still:'assets/yixi-still.webp',studies:['assets/yixi-s1.webp','assets/yixi-s2.webp'],sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'一個在大熄滅中熄滅的世界・之後，寂滅虛空的正中央',
  intro:'寂滅虛空的正中央，一個由層層深色羽翼圍成的生命。羽翼中央那隻翠綠的大眼睛，認出了你身上的光。',
  bio:'遺曦是大熄滅時，一個世界留下的最後一點光。它的世界熄滅那天，渡守趕到時列車已經滿了。最後一位渡守對它說「列車會回來」，它就在虛空裡一直等，一直等。它把漂過身邊的記憶碎片收進羽翼，每收一片，羽翼上就多睜開一隻小小的眼睛。',
  field:{alias:'最後的晨光、等待的眼',
   cls:'失落生命・遺光體',
   danger:'無',
   rarity:'唯一',
   looks:'<b>羽翼：</b>六片深紫灰的羽翼上下張開，層層疊疊，羽尖帶著墨色，像被夜色浸過。羽翼之間纏著細細的光絲，散著一點一點藍綠色的微光。<br><b>主眼：</b>羽翼中央是一隻巨大的翠綠眼睛——那是它的世界最後一片森林的顏色。它多半時候閉著，只有認出熟悉的光時才睜開。<br><b>小眼：</b>羽翼上排列著許多小小的眼睛。每一隻，都映著一段它收下的記憶碎片。',
   habitat:'原本的世界已經熄滅。之後一直待在寂滅虛空的正中央，守著那一點微光。',
   habits:[['等待','不移動，不睡。在虛空裡等了很久很久，等一列說好會回來的列車。'],['收集','把漂過身邊的記憶碎片收進羽翼裡取暖。'],['語言','不說話。用羽翼上的眼睛一明一暗、一睜一閉來回應。']],
   abilities:[['認光','能分辨每一道光的來歷。它一眼就認出，精靈身上的光是渡守留下的那一道晨曦。'],['引路','在什麼都沒有的空白裡，它看得見路。']]},
  talks:[
   {lines:['（休憩區的角落，那對深色的羽翼輕輕收攏。你走近時，羽翼上的小眼睛一隻一隻睜開，全都看著你。）','（中央那隻翠綠的大眼睛，慢慢眨了一下。）','（……像是在說：你來了。）'],choices:[{t:'嗯，我來了。',r:'（羽翼上的光，一明一暗，亮了很久。）'},{t:'（靜靜地坐在它旁邊）',r:'（一片羽翼輕輕蓋過來，像一條很輕的毯子。）'}]},
   {lines:['（你問它，等了多久。）','（羽翼上的小眼睛一隻接一隻地閉上，又一隻接一隻地睜開。很多、很多次。）','（……你數不完。它好像也數不完了。）','（可是最後，大眼睛看著車廂的燈，彎了一下。）'],choices:[{t:'現在不用再等了。',r:'（大眼睛閉上了。這一次，它好像睡著了。）'}]},
   {lines:['（羽翼裡漂出一片記憶碎片：一片翠綠的森林，在晨光裡沙沙作響。）','（那就是它的世界。最後一天的早晨。）','（它把碎片推到你面前，又收了回去。）','（……它在告訴你：現在，這裡也是它的家了。）'],choices:[{t:'歡迎回家。',r:'（所有的眼睛同時亮了一下。）'}]}
  ],
  farewell:['（遺曦沒有要下車。它已經等到了。）']
 },
 cabbfrog:{name:'翠苞蛙',type:'domain',species:'Brassica Bufo',zone:'moss',spot:{x:34,y:70},spriteH:15,ar:'648/700',color:'radial-gradient(circle,#eef8dc,#6fa64a)',
  image:'assets/cabbfrog.webp',still:'assets/cabbfrog-still.webp',studies:['assets/cabbfrog-s1.webp','assets/cabbfrog-s2.webp'],sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'晨曦森林邊緣的老菜園・濕潤的林間空地・清晨露水最多的地方',
  intro:'列車停靠在晨曦森林時，自然棲台上多了一顆圓滾滾的「甘藍」。你正想湊近看看，葉子底下忽然睜開了一雙圓圓的大眼睛。',
  bio:'晨曦森林邊緣的老農之間流傳著一個說法：每年菜園裡第一顆長得特別圓的甘藍，很可能是一隻正在睡覺的翠苞蛙。把牠摘回家的人，會被牠瞪上一整晚——可是第二年，那片菜園一定豐收。所以老農們總會在菜園角落留一顆「不摘的菜」，給翠苞蛙睡。',
  field:{alias:'葉包子、菜園的守門員',
   cls:'植物共生兩棲類・葉殼蛙',
   danger:'無',
   rarity:'少見',
   looks:'<b>葉殼：</b>圓滾滾的身體裹著一層層甘藍般的葉片，葉脈清晰，表面總是掛著小小的露珠。葉片是牠身體的一部分，會跟著呼吸微微起伏。<br><b>眼睛：</b>一雙又圓又大的眼睛從葉縫裡探出來，虹膜是淡淡的苔綠色。<br><b>花苞：</b>頭頂長著一顆小小的花苞，會隨心情開合；據說只有遇到真心喜歡的人，才會完全開花。<br><b>四肢：</b>短短的四肢帶著細密的顆粒狀皮膚，末端是圓圓的吸盤指。',
   habitat:'日界晨曦森林邊緣的老菜園、濕潤的林間空地，以及清晨露水最多的地方。',
   habits:[['作息','白天把葉片捲緊，像一顆甘藍一樣睡覺；傍晚才鬆開葉子出來活動。'],['飲食','清晨喝葉面上的露水，晚上吃葉間的小蟲。'],['性情','很害羞。被嚇到會把葉子一收，縮成一顆完美的球，骨碌碌滾走。']],
   abilities:[['擬菜','捲起葉片時和真正的甘藍幾乎分不出來，連鳥都騙得過。'],['葉露滋養','葉片上的露水落到泥土裡，周圍的植物會長得特別好。']]},
  stay:2,
  talks:[
   {lines:['（自然棲台上那顆圓圓的「甘藍」動了一下。葉縫裡，一雙大眼睛眨了眨。）','……呱。','你、你剛剛是不是想摘我？','我不是菜。我只是長得像菜。……很像而已。'],choices:[{t:'對不起，你真的很像。',r:'……呱。大家都這麼說。（頭頂的花苞，悄悄合起來了一點。）'},{t:'你看起來很好睡。',r:'是很好睡。葉子捲起來，就像蓋了好幾層被子。'}]},
   {lines:['（牠伸出舌頭，舔掉葉尖上的一顆露珠。）','早上的露水最好喝。涼涼的，有一點甜。','我住在森林邊緣的老菜園。那裡的老爺爺，每年都會在角落留一顆不摘的菜。','……那是留給我睡的。我知道。','白天我都在睡覺。葉子捲起來，就像蓋了好幾層被子。','所以，我每年都讓他的菜園長得很好。……這是我們的約定。'],choices:[{t:'老爺爺人真好。',r:'嗯。所以我每年都讓他的菜園長得很好。……那是我的謝禮。'},{t:'你會想他嗎？',r:'……會。（花苞輕輕抖了一下。）不過，我還會回去的。'}]},
   {lines:['（你一靠近，牠忽然「啪」地把葉子全部捲起來，縮成一顆完美的圓球，往旁邊滾了兩圈。）','……','（過了一會兒，葉縫裡才慢慢探出一隻眼睛。）','……是你啊。嚇我一跳。','（頭頂的花苞，慢慢地、慢慢地開了一半。）'],choices:[{t:'你的花開了。',r:'……呱！不、不要看。（可是花苞沒有再合起來。）'}]}
  ],
  farewell:['菜園的味道，從窗外飄進來了。','老爺爺應該又留了一顆菜給我。我該回去睡了。','……明年你經過的時候，如果看到菜園角落有一顆特別圓的甘藍，不要摘。那是我。']
 },
 skywhale:{name:'雲海巨鯨龍',type:'other',species:'Sky-Drift Leviathan',zone:'rings',spot:{x:33,y:12},spriteH:19,ar:'380/218',color:'radial-gradient(circle,#f2f4f6,#9aa4ae)',
  image:'assets/skywhale.webp',still:'assets/skywhale-still.webp',studies:['assets/skywhale-s1.webp','assets/skywhale-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'濃厚雲層籠罩的高空平流層・雲海上方',
  intro:'列車停靠在星河浮島時，整片天空忽然暗了一下。一道巨大的灰色身影從雲海裡浮上來，慢慢地游過車頂——然後，懸浮棲息環的上方多了一位很大、很安靜的乘客。',
  bio:'在天空島嶼居民的眼中，雲海巨鯨龍是和平與穩定的象徵。每當牠們成群緩緩掠過天際時，往往會帶來豐沛的雨水與溫和的季節更迭。古老的空中航海家們甚至會利用牠們的行進路線來避開高空暴風圈，被尊奉為天空中的守護巨獸。',
  field:{alias:'天際巨無霸、浮空巨獸',
   cls:'遠古天空巨獸・巨型飛行類',
   danger:'中（性格溫和，但體型過於龐大，周遭的強烈氣流漩渦對小型飛行器或生物具有一定威脅）',
   rarity:'稀有',
   looks:'<b>身形與外皮：</b>身形極度龐大，擁有類似深海鯨類的流線型軀體，全身覆蓋著堅韌且帶有天然紋理的淺灰色厚皮。<br><b>頭部：</b>頭部前端延伸出修長的吻部，下方帶有一排細密的觸鬚與須狀構造。<br><b>鰭肢與尾部：</b>身體兩側長有寬大而厚實的鰭狀肢，尾部延伸出大量飄逸且互相纏繞的觸手與長尾，展現出磅礡的遠古氣勢。',
   habitat:'常年籠罩在濃厚雲層與高空大氣中的高空平流層，通常成群結隊地在雲海上方緩慢巡遊。',
   habits:[['性情','性格沉穩溫和，屬於群居性生物，極少主動攻擊其他生物。'],['飲食','以高空中的微小浮游生物、氣流有機微粒及水氣為食。'],['移動','多數時間都在空中緩慢漂浮，利用巨大的身體滑翔。']],
   abilities:[['御空浮游','能夠完美適應高空低壓環境，透過體內特殊的氣囊結構與鰭肢操控大氣浮力，在雲海中如履平地般懸浮與前行。']]},
  stay:3,
  talks:[
   {lines:['（懸浮棲息環的上方，一道巨大的影子慢慢翻了個身。長長的觸鬚垂下來，在你頭頂輕輕晃著。）','…………小小的。','……你是，這艘船的，船長？','我住在，雲的上面。很高，很高的地方。','那裡，風很大。……可是我，很重。風吹不動我。'],choices:[{t:'你好大……',r:'……嗯。我還在長。（觸鬚輕輕碰了碰你的頭頂。）'},{t:'歡迎上車。',r:'……謝謝。這艘船，很穩。我喜歡。'}]},
   {lines:['（牠張開長長的吻部，慢慢吸了一口車廂裡的空氣。）','……這裡的空氣，有一點點水。','我吃，雲裡的小東西。很小，很小的。還有水氣。','一口，很多很多。……所以我，不用常常吃。','（牠的尾觸手慢慢捲起來，又慢慢放開。）我的家人，現在應該，在雲海上，慢慢游。','我們，一起游，才不會迷路。'],choices:[{t:'你們都一起游嗎？',r:'……嗯。一起游，才不會迷路。也比較暖。'},{t:'你想家人嗎？',r:'……想。可是，牠們會等我。雲海，很大，可是我們，找得到彼此。'}]},
   {lines:['（列車輕輕晃了一下。牠的鰭肢一張，整個車廂的空氣都跟著轉了一圈。）','……對不起。我一動，風就會亂。','小小的鳥，小小的船……靠我太近，會被吹走。','所以我，游得很慢。很慢很慢。','島上的人說，看到我們，就會下雨，季節就會變溫和。航海的人，跟著我們，就能避開暴風。','……我只是，在游。可是，如果能讓大家平安……我就，再游慢一點。','……這艘船，很穩。我喜歡。'],choices:[{t:'那你願意陪這輛車游一段嗎？',r:'（巨大的影子慢慢點了點頭。）……好。我在上面，替你們，擋風。'}]}
  ],
  farewell:['……雲海，在叫我。','季節要換了。家人們，要往南邊游了。我得，跟上。','以後，如果天空忽然暗一下，又下起溫柔的雨……那是我，經過了。']
 },
 treeling:{name:'護樹靈精',type:'domain',species:'Grovewarden Sprite',zone:'moss',spot:{x:16,y:47},spriteH:34,ar:'342/760',color:'radial-gradient(circle,#c9d6a0,#6f6a44)',
  image:'assets/treeling.webp',still:'assets/treeling-still.webp',studies:['assets/treeling-s1.webp','assets/treeling-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'古老神祕的原始森林・大型魔法樹木的冠層與樹洞深處',
  intro:'列車停靠在晨曦森林時，月台邊一棵長滿苔蘚的「老樹」忽然邁開了腳步。它彎下腰鑽進車門，在自然棲台上把根一樣的腳扎進土裡，瞇著眼睛笑了。',
  bio:'在森林守護者的傳說中，護樹靈精被視為樹木健康的指標。傳說只要有牠們棲息的樹林，樹木往往能長得無比繁茂且免於病蟲害。森林中的精靈族與德魯伊對牠們極為敬重，常將其視為大自然純粹生命力的象徵。',
  field:{alias:'綠指木精、藤蔓使者',cls:'森林木靈類・植生幻獸',danger:'低',rarity:'少見',
   looks:'<b>身軀：</b>由一根根糾結交纏的老樹幹構成，木紋像肌肉一樣層層盤繞，身上斑駁點綴著苔蘚與白色地衣。<br><b>頭部：</b>頭頂長著一叢像樹冠般蓬鬆的黃綠枝葉；臉孔慈祥，總是瞇著眼微笑，下巴垂著樹根般的鬍鬚。<br><b>四肢：</b>手臂細長，手指修長分開，便於攀爬或緊抓樹幹；雙腳末端像樹根一樣向四周展開，能扎進土裡站著休息。',
   habitat:'古老神祕的原始森林、大型魔法樹木的冠層或樹洞深處。',
   habits:[['作息','日行性，個性溫和、害羞但充滿好奇心。'],['飲食','主要吸收樹木汁液、露水以及森林中的微量光能維生。'],['社交','通常獨居或小群體生活，極少主動攻擊；遇到危險時會偽裝成一棵樹，靜靜地站著不動。']],
   abilities:[['木靈共生','能與周遭的植物群落建立微妙的感知連結，輕易解開藤蔓纏繞，並促進幼苗快速生長；修長的手指也能輕巧地撬開樹皮尋找養分。']]},
  stay:3,
  talks:[
   {lines:['（自然棲台上那棵「老樹」動了動，頭頂的枝葉沙沙作響。它慢慢轉過頭，瞇著眼睛看你。）','……呵呵。被你發現了。','我是看著森林長大的。……也許，森林也是看著我長大的。','坐吧，孩子。這裡的土，很好。'],choices:[{t:'你是樹嗎？',r:'……半個是。另外半個，是會走路的那一半。呵呵。'},{t:'（在它腳邊坐下）',r:'（它把一片葉子輕輕放在你頭上。）……這樣，就涼快了。'}]},
   {lines:['（它把手指輕輕貼在培育艙送來的盆栽上，盆栽的葉子慢慢張開了。）','植物都會說話。只是說得很慢，很慢。','我聽得見。它們渴了，冷了，我就告訴風，告訴雨。','我喝一點樹汁，一點露水，一點陽光。……不用很多。森林夠大，大家分著喝。'],choices:[{t:'它們現在在說什麼？',r:'……它說，謝謝你常常來看它。呵呵，它很喜歡你。'},{t:'可以教我聽嗎？',r:'可以。先學會等。等得夠久，就聽得見了。'}]},
   {lines:['（你一轉身，它就不見了。仔細一看，棲台邊多了一棵安安靜靜的小樹。）','……呵呵，嚇到你了？','有危險的時候，我就這樣站著。誰也找不到我。','精靈和德魯伊說，有我在的森林，樹就不會生病。……其實我只是，常常摸摸它們。','你們的車上，有很多會長大的東西。……我會幫你看著它們。'],choices:[{t:'謝謝你。',r:'（頭頂的枝葉輕輕晃了一下，掉下一顆小小的嫩芽。）……送你。'}]}
  ],
  farewell:['森林在叫我了。……春天要來了，有很多小樹要照顧。','我會把根扎回去，慢慢地，再長一圈。','如果有一天，你在森林裡看到一棵在微笑的樹……那就是我。坐下來，休息一下吧。']
 },
 sandwyrm:{name:'砂海鳴蠕',type:'other',species:'Sandsea Chorus Wyrm',zone:'crystal',spot:{x:84,y:58},spriteH:34,ar:'495/760',color:'radial-gradient(circle,#e2b48a,#8a4a2a)',
  image:'assets/sandwyrm.webp',still:'assets/sandwyrm-still.webp',studies:['assets/sandwyrm-s1.webp','assets/sandwyrm-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'月界某處永不停風的赤砂海・沙丘深處',
  intro:'列車停靠在星河浮島時，月台邊的星砂忽然往下陷。一條赤褐色的巨大長身從砂裡鑽了出來，張開三瓣的大口——然後，很有禮貌地，把頭低了下來。',
  bio:'赤砂海的遊牧商隊之間流傳著一句話：「聽見沙在唱歌，就照著歌走。」砂海鳴蠕在沙下的低鳴，會把流沙壓實成一條硬路，商隊沿著那條路走，就不會陷下去。據說砂海上最古老的商路，都是鳴蠕唱出來的。',
  field:{alias:'沙下的雷聲、砂海之喉',cls:'沙棲巨蠕類・地底巨獸',danger:'中（巨口看起來很可怕，但牠只吃沙裡的礦物；被驚擾時翻起的流沙很危險）',rarity:'稀有',
   looks:'<b>身軀：</b>赤褐色的分節長身，表面有一圈圈的環紋與深色的氣孔，背脊上一排骨刺像山脊一樣延伸到尾端。<br><b>巨口：</b>頭端張開時會裂成三瓣，內壁是深紫色，佈滿細密的倒刺；口中央伸出一條帶鉤的長舌，兩側還有一對小小的抓肢。<br><b>移動：</b>鑽出沙面時會帶起大片的沙塵，像一陣赤色的風。',
   habitat:'月界某處永不停風的赤砂海。大半時間潛伏在沙丘深處，只有夜晚才浮上沙面。',
   habits:[['移動','大半時間潛在沙下，靠感應地面的震動辨別方向。'],['飲食','不吃其他生物，以沙中的礦物、鹽晶和砂海植物的根為食。'],['性情','外表嚇人，其實非常溫和而且有禮貌；夜裡會在沙下低鳴，整片沙丘都跟著共振。']],
   abilities:[['沙鳴','發出低頻的鳴聲，讓流沙變硬或變軟，沙丘也會因此慢慢移動。'],['掘道','鑽過的隧道會留下光滑的岩壁，旅人常把它們當作地下通道。']]},
  stay:2,
  talks:[
   {lines:['（晶石平台旁的沙堆裡，一條赤褐色的長身慢慢鑽了出來。三瓣的大口張開——你往後退了一步。）','……啊。對不起。嚇到你了。','（大口慢慢合起來，牠把頭低到你面前。）……我的嘴，只是比較大。','我不吃會動的東西。……真的。','我吃的是，沙裡的石頭。鹽。還有植物的根。'],choices:[{t:'那你吃什麼？',r:'沙裡的石頭。鹽。還有植物的根。……脆脆的，很好吃。'},{t:'（摸摸牠的頭）',r:'……（牠的身體輕輕震了一下，發出很低很低的嗡聲。）謝謝。'}]},
   {lines:['（牠把身體埋回沙裡，只露出一點點頭。地板傳來一陣很輕的震動。）','……你聽到了嗎？那是我在唱歌。','在砂海，風一直吹，沙一直動。我唱歌，沙就會停下來，變成硬硬的路。','商隊的人，會跟著我的歌走。……他們說，最老的路，都是我們唱出來的。'],choices:[{t:'好厲害。',r:'……不厲害。只是，唱久了，就會了。'},{t:'可以唱給我聽嗎？',r:'（整節車廂輕輕地共振起來，像很遠很遠的雷聲。）……這樣，可以嗎？'}]},
   {lines:['（牠把頭擱在沙堆上，看著車窗外。）','……這裡的地板，很硬。我鑽不下去。','可是，我不討厭。在砂海，我只能看見沙。在這裡，看得見好多東西。','我挖過的洞，會變成光滑的牆。……以後如果你們迷路了，可以走我的洞。'],choices:[{t:'我會記得的。',r:'……嗯。洞口有一圈刺的，就是我挖的。'}]}
  ],
  farewell:['……沙在叫我。砂海的風，換方向了。','我得回去唱歌了。不唱，路就會不見。','以後如果你聽見地底下有很低的雷聲……那是我在唱。照著歌走，就不會陷下去。']
 },
 moonwyrm:{name:'月珀白龍',type:'other',species:'Moonpearl Wyrm',zone:'veil',spot:{x:85,y:34},spriteH:24,ar:'760/532',color:'radial-gradient(circle,#f4f0f6,#a8a0c4)',
  image:'assets/moonwyrm.webp',still:'assets/moonwyrm-still.webp',studies:['assets/moonwyrm-s1.webp','assets/moonwyrm-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'月界高寒的雪峰之巔・月光最亮的山口',
  intro:'列車停靠在星河浮島時，車窗外落下一片月光般的白。一頭珍珠白的巨龍收起薄薄的膜翼，低頭看了看車廂，然後——很優雅地，走了進來。',
  bio:'傳說在大熄滅之前，月界的龍族與日界的龍一起守著界壁，月界的龍守夜，日界的龍守晝。大熄滅之後，月界的龍族一隻接一隻沉睡，月珀白龍是那時留下來的最後一位長老。雪山的旅人說，迷路的夜裡只要抬頭找月光最亮的地方，就會看見牠的鱗片把月光反射成一道柔和的光幕，替人照出下山的路。',
  field:{alias:'雪之長老、守夜的龍',cls:'古龍類・月界龍族',danger:'高（從不主動攻擊，但被激怒時的凍息能冰封一整座山谷）',rarity:'極稀有',
   looks:'<b>鱗片：</b>全身覆蓋珍珠白的細鱗，光線下泛著淡藍與淡金的虹彩，像把月光一片一片鋪在身上。<br><b>頭部：</b>頭後延伸出數根向後彎的長角，頸邊豎著一圈鬃刺。<br><b>翅膀與尾：</b>一對巨大的膜翼薄得透光，邊緣帶著淡淡的藍；長尾末端捲成一個圈。',
   habitat:'月界高寒的雪峰之巔、月光最亮的山口。一年之中大半時間都在沉睡。',
   habits:[['作息','夜行，一年只醒來幾次；滿月時會展開翅膀，安靜地吸收月光。'],['飲食','以月光與高山的冰晶為食。'],['性情','高傲而沉靜，說話很慢；會記得每一個對牠說過謊的人，也記得每一個對牠好的人。']],
   abilities:[['月鱗鏡','鱗片能把月光反射成柔和的光幕，替雪山的旅人照亮夜路。'],['凍息','呼出的氣息能讓空氣中的水氣瞬間結成冰，在山谷之間架起冰橋。']]},
  stay:3,
  talks:[
   {lines:['（靜謐結界的冷霧裡，一頭珍珠白的巨龍緩緩睜開眼睛。牠看了你很久。）','……你身上，有晨曦的味道。','我很久沒有聞過了。上一次，是大熄滅之前。','坐吧，值勤的孩子。……我不會吃你。'],choices:[{t:'您認識曦淵嗎？',r:'……那個日界的孩子。當年牠還很小，總是跟在我們後面飛。……牠現在，長大了吧。'},{t:'（安靜地坐下）',r:'……很好。懂得安靜的人，不多了。'}]},
   {lines:['（牠張開一邊的翅膀，車廂的燈光透過薄薄的翼膜，在地上灑下一片淡藍。）','以前，月界的龍守夜，日界的龍守晝。我們一起，守著界壁。','……駕駛室前面那隻蒼龍，曦淵。牠和我，是同一族的。','……蒼龍。那個日界的孩子，現在也長大了吧。','大熄滅之後，夥伴們一隻接一隻睡著了。……只剩下我。','所以我睡得很久，醒得很少。醒著的時候，就看看月亮，吃一點冰。'],choices:[{t:'您一個人，不寂寞嗎？',r:'……寂寞。可是月亮每個晚上都會來。……現在，還有這輛車。'},{t:'以後您可以常常醒來。',r:'（牠的眼睛彎了一下。）……也許吧。如果這裡一直這麼吵的話。'}]},
   {lines:['（牠低頭聞了聞你，呼出的氣息在你肩上結成一層細細的霜花。）','……你沒有對我說謊。我記得每一個說過謊的人。','雪山的旅人迷路時，會抬頭找月光最亮的地方。那裡，通常是我。','我用鱗片把月光折下來，鋪成一條路。……他們就回家了。','你這輛車，也在替很多生命找回家的路。……很好。我陪你走一段。'],choices:[{t:'謝謝您。',r:'（牠把長尾輕輕捲在你身邊，像一圈月光。）……不用謝。這是龍的工作。'}]}
  ],
  farewell:['……滿月要來了。雪峰在叫我。','我得回去睡一陣子。……這次，我會睡得比較好。','告訴那個日界的孩子：月界的龍，還有一個醒著。……讓牠，別一個人扛著。']
 },
 skyfox:{name:'藍羽雲狐',type:'domain',species:'Azure-plumed Skyfox',zone:'rings',spot:{x:64,y:8},spriteH:17,ar:'760/617',color:'radial-gradient(circle,#f6fbff,#5ab8f0)',
  image:'assets/skyfox.webp',still:'assets/skyfox-still.webp',studies:['assets/skyfox-s1.webp','assets/skyfox-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'雲層之上晴朗的高空・雲海中的浮島林間',
  intro:'列車停靠在晨曦森林時，一道雪白的影子從雲裡衝了下來，在車頂上繞了三圈，然後鑽進車窗——藍色的尾巴尖，還在空中留下一道光。',
  bio:'雲上國度的孩子們相信，看見藍色尾巴劃過天空的那天，一定會放晴。老人們會把撿到的藍羽毛縫進孩子的枕頭裡，說這樣就不會做惡夢。也有人說，藍羽雲狐其實就是晴天本身——牠開心的時候，雲就散開了。',
  field:{alias:'晴空的使者、藍尾仙',cls:'天狐類・羽翼幻獸',danger:'低',rarity:'稀有',
   looks:'<b>毛髮：</b>全身覆蓋著蓬鬆的雪白長毛，翅膀尖、胸前的鬃毛、四爪和大尾巴的末端，都漸層成會發光的天藍色。<br><b>頭部：</b>頭上一對向後彎的深灰色小角，眼睛是冰藍色。<br><b>翅膀：</b>一對潔白的大羽翼，羽尖的藍光在飛行時會拖出長長的光痕。',
   habitat:'雲層之上晴朗的高空，以及雲海中浮島上的樹林。',
   habits:[['作息','晨昏最活躍，喜歡追著陽光飛。'],['飲食','以朝露和雲裡的光塵為食。'],['性情','好奇、愛乾淨、喜歡惡作劇——常常把旅人的帽子叼走，藏進雲裡。']],
   abilities:[['晴空羽','拍動翅膀時能吹散烏雲，讓天空放晴。'],['藍焰尾','尾巴末端的藍光是冰涼的火焰，能照亮夜路，卻不會燙傷任何東西。']]},
  stay:2,
  talks:[
   {lines:['（懸浮棲息環上，一團雪白的毛球忽然抬起頭。藍色的尾巴尖晃了晃。）','嘿！你就是開車的那個？','我剛剛在你們車頂上繞了三圈！你有沒有看到？','……沒看到？那我再繞一次！'],choices:[{t:'下次一定看。',r:'說好囉！藍色的光那條，就是我！'},{t:'車頂很危險耶。',r:'才不危險！我有翅膀！……好啦，我小心一點。'}]},
   {lines:['（牠舔了舔爪子上的露水，尾巴尖的藍光一閃一閃。）','早上的露水最好喝了。還有雲裡亮亮的東西，吃起來像糖。','我最喜歡追太陽！太陽跑到哪，我就飛到哪。','……啊，對了。你的帽子呢？我想藏一下。'],choices:[{t:'我沒有帽子。',r:'……可惜。那我藏你的筆記本？……開玩笑的啦！'},{t:'不、不可以藏！',r:'嘻嘻。我只會藏一下下，然後就還你。'}]},
   {lines:['（牠拍了拍翅膀，車廂裡吹起一陣涼風，窗外的雲好像散開了一點。）','你看！晴天了！','天上有一條藍色的光，你看過嗎？藍色的光那條，就是我！','雲上的小孩說，看到我的尾巴，那天就會放晴。','……其實我只是開心而已。我開心，雲就散開了。','所以，跟你在一起的時候，天氣應該都會很好吧。'],choices:[{t:'那就一直開心吧。',r:'（牠繞著你轉了一圈，藍色的光把你圍起來。）嗯！說好了！'}]}
  ],
  farewell:['雲上在叫我了！好像有一片烏雲要我去吹散。','我得走了。……不過，我會常常飛過你們車頂的！','以後如果哪天突然放晴，天上有一道藍光——那就是我在跟你打招呼！']
 },
 grinfox:{name:'夜笑影狐',type:'mind',species:'Grinning Shadefox',zone:'rest',spot:{x:7,y:62},spriteH:22,ar:'760/704',color:'radial-gradient(circle,#5a5866,#14141c)',
  image:'assets/grinfox.webp',still:'assets/grinfox-still.webp',studies:['assets/grinfox-s1.webp','assets/grinfox-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'世界與世界之間的岔路口・夜晚的十字路口・沒有路燈的月台',
  intro:'列車停靠在晨曦森林的夜裡，月台上沒有燈。一道黑影一直跟在你身後三步遠的地方。你回頭——一張咧著白牙的笑臉，安安靜靜地看著你。',
  bio:'古老的旅人歌謠這樣唱：「夜裡若有笑臉跟著你，別回頭，別跑——牠是在送你回家。」夜笑影狐以人們的恐懼為食，吃掉一點點，旅人就不那麼怕黑了。牠脖子上的星形墜飾，據說是很久以前一個迷路的孩子，被牠送到家門口之後送給牠的謝禮。牠從來沒有拿下來過。',
  field:{alias:'笑臉的影子、路口的守望者',cls:'暗影獸類・夜行幻獸',danger:'低（看起來非常危險，其實很膽小）',rarity:'稀有',

 scythe:{name:'白晷鐮使',type:'domain',species:'Dial-Scythe Seraph',zone:'crystal',spot:{x:57,y:50},spriteH:27,ar:'682/760',color:'radial-gradient(circle,#faf8fa,#b8b0c0)',

  homeText:'時隙之海的上空・時間裂縫最多的地方',
  intro:'列車停靠在星河浮島時，車廂裡所有的時鐘同時停了一秒。一道瓷白的身影收起鐮刃般的羽翼，從那一秒的縫隙裡走了出來，頭頂的三隻白鳥一起歪了歪頭。',
  bio:'時隙之海的漁人說，有些浪會一直重複同一刻，永遠拍不到岸。直到某一天，一道白影掠過海面，鐮刀一揮——那道浪終於落了下來。人們叫它「白晷鐮使」：它收割的不是生命，是被困住的時間。渡守的紀錄裡寫著，大熄滅的時候，許多世界的最後一刻卡在時間的裂縫裡出不去，是它一刀一刀，把那些時刻送回了該去的地方。',

  stay:2,
  talks:[
   {lines:['（晶石平台旁，那道瓷白的身影一動也不動。你靠近時，頭頂的三隻白鳥同時轉過頭來。）','（左邊的鳥）……你以前沒有見過我。','（中間的鳥）你現在，正在看著我。','（右邊的鳥）你以後，會習慣我的。','……我們是同一個。只是，看著不同的時間。','三隻鳥，一隻說過去，一隻說現在，一隻說未來。'],choices:[{t:'三個都是你？',r:'（中間的鳥）是。（左邊的鳥）一直都是。（右邊的鳥）以後也是。'},{t:'那把鐮刀好可怕……',r:'（雙鐮輕輕交叉，發出「喀」的一聲。）……不用怕。它們只切時間。'}]},

 }

/* ================================================================
   世界觀：日與月的起源、界壁與渡口、渡守（古代守護者）、大熄滅、曦淵
   世界觀頁會隨著讀到的線索一段一段顯現；界域地誌在抵達或解讀座標後記下每個地方的淵源。
   ================================================================ */
const LOC_LORE={

 board_leviathaurora:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('leviathaurora'),run:n=>boarding('leviathaurora','列車停靠的時候，棲息車廂的靈泉忽然暗了下去。一道幽藍的光，從看不見底的水中慢慢浮了上來。',n)},
 board_cinder:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('cinder')&&state.journeyCount>=3,run:n=>boarding('cinder','列車停靠的時候，月台上的陽光變得熾熱。一道琥珀色的帆影沿著車廂外壁掠過，輕巧地落進了棲息車廂。',n)},
 board_aelis:{trigger:'arrive',loc:'dawnForest',auto:true,need:()=>state.journeyCount>=3,run:n=>boarding('aelis','列車停靠的時候，月台邊正好沉進暮色。一雙琥珀色的大眼睛從暗處亮起，一隻戴著葉形吊墜的小生物，輕巧地跳上了車門。',n)},
 board_pyro:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('pyro')&&state.journeyCount>=4,run:n=>boarding('pyro','列車停靠的時候，天空被染成赤紅，車身微微一震。棲息車廂的溫度驟然升高，晶石平台前，多了一道漆黑而沉重的身影。',n)},
 board_vandora:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('vandora')&&state.journeyCount>=5,run:n=>boarding('vandora','列車停靠在一片夜色裡，車窗上凝了一層薄薄的水氣。棲息車廂的自然棲台上，一片苔葉輕輕動了一下——那不是葉子。',n)},
 board_frost:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('frost')&&state.journeyCount>=6,run:n=>boarding('frost','列車停靠的時候，月台吹來一陣冰冷的風，車窗上爬滿了細白的霜花。棲息車廂的靈泉邊，水面結起一圈薄冰——一雙冰川般湛藍的眼睛，正安靜地看著你。',n)},
 board_sirenora:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('sirenora')&&state.journeyCount>=7,run:n=>boarding('sirenora','列車停靠的時候，月台起了一片濃得化不開的霧。車窗外什麼都看不見，只有一抹溫柔的粉白光暈，隨著霧氣輕輕擺盪，穿過車壁，飄進了棲息車廂。',n)},
 board_titan:{trigger:'arrive',loc:'dawnForest',auto:true,need:()=>state.journeyCount>=7&&!state.discoveredLifeforms.includes('titan'),run:n=>boarding('titan','列車停靠的時候，月台輕輕震了一下，又一下。月台盡頭，一座長滿苔蘚與蕨葉的小山緩緩站起，帶著一陣草木清香的晨霧，一步一步走上了車門。',n)},
 board_lynx:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('lynx')&&state.journeyCount>=9,run:n=>boarding('lynx','列車停靠的時候，車頂傳來幾下輕得幾乎聽不見的腳步。一道銀白的影子沿著結霜的車窗疾走而過，沒有留下任何聲音，只留下一串細小的晶塵——然後鑽進了棲息車廂的懸浮棲息環。',n)},
 board_strider:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('strider')&&state.journeyCount>=10,run:n=>boarding('strider','列車停靠的時候，月台上的風忽然轉了向。棲息車廂的休憩區裡，一道灰褐色的身影昂首站著，把刀刃般的長角迎向車廂裡流動的風。',n)},
 board_windkoi:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('windkoi')&&state.journeyCount>=8,run:n=>boarding('windkoi','列車停靠的時候，浮島邊緣湧起一陣溫暖的上升氣流。一道金色的流光順著風游進車窗，在棲息車廂的懸浮棲息環之間，輕輕轉了一圈。',n)},
 board_mnemo:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('mnemo')&&state.journeyCount>=11,run:n=>boarding('mnemo','列車停靠的時候，車窗上忽然結了一層霜。一團冰霧從星河上漂過來，貼著車身滑進了棲息車廂。霧散開之後，靜謐結界裡亮起幾顆藍色的光泡。',n)},
 board_cabbfrog:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('cabbfrog')&&state.journeyCount>=6,run:n=>boarding('cabbfrog','列車停靠的時候，月台邊滾來一顆圓圓的甘藍，骨碌碌地，一路滾進了棲息車廂。它在自然棲台上停下來——葉縫裡，睜開了一雙大眼睛。',n)},
 board_skywhale:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('skywhale')&&state.journeyCount>=10,run:n=>boarding('skywhale','列車停靠的時候，整片天空忽然暗了一下。一道巨大的灰色身影從星河下方的雲海裡浮上來，慢慢游過車頂，長長的觸手從車窗外垂過——牠輕輕地，滑進了棲息車廂的上方。',n)},
 board_treeling:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('treeling')&&state.journeyCount>=9,run:n=>boarding('treeling','列車停靠的時候，月台邊一棵長滿苔蘚的老樹，忽然邁開了根一樣的腳。它彎下腰鑽進車門，在棲息車廂的自然棲台上站定，頭頂的枝葉沙沙作響。',n)},
 board_sandwyrm:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('sandwyrm')&&state.journeyCount>=12,run:n=>boarding('sandwyrm','列車停靠的時候，月台邊的星砂忽然往下陷。一條赤褐色的巨大長身從砂裡鑽出來，張開三瓣的大口——然後很有禮貌地低下頭，慢慢鑽進了棲息車廂。',n)},
 board_moonwyrm:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('moonwyrm')&&state.journeyCount>=13,run:n=>boarding('moonwyrm','列車停靠的時候，車窗外落下一片月光般的白。一頭珍珠白的巨龍收起薄薄的膜翼，低頭看了看車廂——然後很優雅地，走進了棲息車廂的靜謐結界。',n)},
 board_skyfox:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('skyfox')&&state.journeyCount>=11,run:n=>boarding('skyfox','列車停靠的時候，一道雪白的影子從雲裡衝下來，在車頂上繞了三圈。藍色的尾巴尖在空中拖出一道光，咻地一聲，鑽進了棲息車廂。',n)},
 board_grinfox:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('grinfox')&&state.journeyCount>=12,run:n=>boarding('grinfox','列車停靠在一片沒有燈的夜裡。一道黑影一直跟在你身後三步遠的地方，你回頭——一張咧著白牙的笑臉，安安靜靜地看著你。然後牠跟著你，走進了棲息車廂。',n)},
 board_dawnsail:{trigger:'arrive',loc:'dawnForest',need:()=>!state.discoveredLifeforms.includes('dawnsail')&&state.journeyCount>=13,run:n=>boarding('dawnsail','列車停靠在日出的時候。天邊的粉色霞光裡，一頭半透明的翼龍乘著光滑翔下來。牠繞著列車飛了一圈，像在確認什麼——然後收起透光的翅膀，降落在棲息車廂的晶石平台上。',n)},
 board_scythe:{trigger:'arrive',loc:'starIslands',need:()=>!state.discoveredLifeforms.includes('scythe')&&state.journeyCount>=14,run:n=>boarding('scythe','列車停靠的時候，車廂裡所有的時鐘同時停了一秒。一道瓷白的身影收起鐮刃般的羽翼，從那一秒的縫隙裡走出來，頭頂的三隻白鳥一起歪了歪頭——然後，它走進了棲息車廂。',n)},
 board_sola:{trigger:'arrive',loc:'starIslands',auto:true,run:n=>boarding('sola','列車停靠的時候，一陣潮水般的星光拍上車窗。一團會發光的生命順著光，輕輕滑進了車廂。',n)},
 voyage_symbol:{trigger:'voyage',auto:true,run:done=>{addClue('clue_voyage');cine(['列車穿越界壁的那一刻，','車廂連接處浮現一列從未見過的符號。','它亮了七次心跳的時間，然後熄滅。'],done,'assets/voyage-symbol.jpg');}},
 
 /* ---------- 乘客之間的互動：兩位乘客同時在車上（有些還要特定條件）時，進入棲息車廂就會出現 ---------- */
 
 int_sola_levi:{trigger:'carriage',car:'habitat',who:['sola','leviathaurora'],need:()=>aboard('sola')&&aboard('leviathaurora'),title:'索拉與淵光巨',run:()=>interScene('sola','leviathaurora',[
   ['sola','哇，好大的光！你也是從海裡來的嗎？我是從星河來的，那也算一種海吧！'],['leviathaurora','……（牠身上的光點沿著脊椎亮了一下。）'],['sola','你剛剛是不是在說話？用光說話？好厲害！那我講一個笑話，你用光笑給我看。'],
   ['sola','為什麼深海的魚都不怕黑？……因為牠們都很「深」思熟慮！'],['leviathaurora','（光點停了一拍，然後從頭到尾，一路亮到了尾鰭。）'],['sola','牠笑了！整條都亮了！這是我聽過最大的笑聲！'],['self','靈泉的水面映著一大一小兩團光，一閃一閃，像在說只有它們聽得懂的話。']
  ],'索拉對淵光巨講了冷笑話，淵光巨用光笑了。','光的笑聲','索拉講了一個冷笑話。淵光巨從頭到尾鰭，一路亮了起來——那是用光發出的笑聲。')},
 int_cinder_pyro:{trigger:'carriage',car:'habitat',who:['cinder','pyro'],need:()=>aboard('cinder')&&aboard('pyro')&&zoneOf('cinder')===zoneOf('pyro'),title:'燼風帆獸與燼角巨獸',run:()=>interScene('cinder','pyro',[
   ['pyro','……你也有帆，也有尾巴，看起來像龍。可是你身上沒有火。'],['cinder','嗯。有人叫我們「偽龍」。'],['pyro','偽龍。（熔岩光在裂隙裡閃了一下。）他們也叫我暴君。名字都是別人取的。'],
   ['cinder','太陽給我力氣，大地給你力氣。我們都不是真的會噴火的龍。'],['pyro','……哼。至少你知道自己的力氣從哪裡來。'],['self','兩道影子並排待在晶石平台上，一道琥珀色，一道熔岩色。晶石的光因此變得很溫暖。']
  ],'燼風帆獸和燼角巨獸在同一座晶石平台上，聊起了別人取的名字。','偽龍與暴君','「名字都是別人取的。」兩道影子並排待在晶石平台上，一道琥珀色，一道熔岩色。')},
 int_pyro_frost:{trigger:'carriage',car:'habitat',who:['pyro','frost'],need:()=>aboard('pyro')&&aboard('frost'),title:'燼角巨獸與霜脊冰原獸',run:()=>interScene('pyro','frost',[
   ['frost','……你經過的地方，地板在冒煙。'],['pyro','你經過的地方，地板在結霜。'],['frost','我的地盤，要冷。'],['pyro','我的地盤，要熱。'],
   ['self','（兩頭巨獸隔著靈泉對望。泉水的一邊結起薄冰，另一邊冒出白色的蒸氣。）'],['frost','……不過，你沒有越過泉水。'],['pyro','你也沒有。（牠哼出一口帶火星的熱氣。）這輛車的地盤，不是我們的。我分得清楚。'],
   ['frost','嗯。那就各自待著。'],['self','靈泉中間，冰和蒸氣交會的地方，起了一層薄薄的霧。誰也沒有再往前一步。']
  ],'燼角巨獸和霜脊冰原獸隔著靈泉，劃清了各自的地盤。','冰與火的界線','一邊結冰，一邊冒煙。兩頭巨獸誰也沒有越過靈泉——這輛車的地盤，不屬於牠們任何一個。')},
 int_felinia_aelis:{trigger:'carriage',car:'habitat',who:['felinia','aelis'],need:()=>aboard('felinia')&&aboard('aelis'),title:'羽貓獸與艾莉絲',run:()=>interScene('aelis','felinia',[
   ['aelis','（艾莉絲盯著羽貓獸的臉看了很久。）……你的臉，跟我好像。'],['felinia','你的耳朵，比我大很多。'],['aelis','大耳朵聽得見沙子底下的心跳。你的耳翼呢？'],['felinia','聽得見風要轉向的聲音。在山上，那比心跳更重要。'],
   ['aelis','那我們一個聽地下，一個聽天上。'],['felinia','（牠的耳翼和艾莉絲的大耳朵，同時轉向了車窗。）……你也聽到了嗎？'],['aelis','嗯。前面的風，在唱歌。'],['self','一雙耳翼，一對大耳朵，同時對著窗外。牠們聽見的，是你聽不見的東西。']
  ],'羽貓獸和艾莉絲比較了彼此的耳朵，一起聽見了窗外的風。','兩種耳朵','一個聽地下的心跳，一個聽天上的風。牠們同時轉向窗外，聽見了你聽不見的聲音。')},
 int_vandora_aelis:{trigger:'carriage',car:'habitat',who:['vandora','aelis'],need:()=>aboard('vandora')&&aboard('aelis')&&state.currentPhase==='voyage',title:'夜行者的捉迷藏',run:()=>interScene('vandora','aelis',[
   ['self','（航行中，車廂的燈調暗了一些。自然棲台的苔葉間，一塊綠色消失了。）'],['aelis','……我知道你在那裡。'],['vandora','你看不見我。'],['aelis','看不見。可是我聽得見你的觸鬚在動。左邊，第三片葉子底下。'],
   ['vandora','（苔葉一晃，金黃色的眼睛亮了起來。）……很少有東西能先找到我。'],['aelis','換你。（艾莉絲一躍，躲進了圓環的陰影裡。）'],['vandora','（觸鬚在空氣中輕輕擺了兩下。）濕度變了。妳在圓環後面，喘氣的那一邊。'],['aelis','……不公平。'],
   ['self','航行的夜裡，兩個夜行者玩了一整段的捉迷藏。誰也沒有贏，誰也不想停。']
  ],'航行的夜裡，翡翠晶甲夜行獸和艾莉絲玩起了捉迷藏。','夜裡的捉迷藏','一個用耳朵找，一個用觸鬚找。航行的夜裡，兩個夜行者誰也沒有贏，誰也不想停。')},
 int_sirenora_pyro:{trigger:'carriage',car:'habitat',who:['sirenora','pyro'],need:()=>aboard('sirenora')&&aboard('pyro'),title:'霧羽海葵龍與燼角巨獸',run:()=>interScene('sirenora','pyro',[
   ['pyro','……別靠近。我身上很燙，會把你的霧燒乾。'],['sirenora','不會的。……我只是聽見，你心裡一直有一個聲音，在說「退後」。'],['pyro','那是在說給別人聽的。'],['sirenora','也是說給你自己聽的吧。說了很久，很累了。'],
   ['self','（霧羽海葵龍慢慢舒展扇翼。柔和的光暈與低頻的共鳴，一圈一圈地漫過晶石平台。）'],['pyro','……（裂隙裡的熔岩光，第一次暗得這麼慢、這麼穩。）'],['pyro','……這是什麼。'],['sirenora','是安靜。你可以先不用守著了，這裡有人在看著。'],
   ['self','燼角巨獸閉上了赤紅的眼睛。那是牠登車以來，第一次真正地睡著。']
  ],'霧羽海葵龍的共鳴安撫，讓燼角巨獸第一次真正地睡著。','第一次的安睡','「你可以先不用守著了，這裡有人在看著。」燼角巨獸閉上赤紅的眼睛，第一次真正地睡著。',()=>{ const s=state.passengers.pyro; if(s&&s.stage<3){ s.stage=Math.max(s.stage,2); } })},
 
 int_felinia_windkoi:{trigger:'carriage',car:'habitat',who:['felinia','windkoi'],need:()=>aboard('felinia')&&aboard('windkoi'),title:'羽貓獸與金羽御風鯉',run:()=>interScene('windkoi','felinia',[
   ['felinia','（羽貓獸的耳朵一豎，盯著頭頂那道金光。）……那是魚？還是鳥？'],['windkoi','都不是。我是在風裡游的。'],['felinia','你的鰭……跟我的翅膀好像。'],
   ['windkoi','（牠繞著羽貓獸轉了一圈。）你的羽毛是虹彩的。我的，是金色的。'],['felinia','要一起飛一圈嗎？圓環之間的風很好。'],['windkoi','……好。你別抓我。'],['felinia','（尾巴一甩）……我盡量。'],
   ['self','一道虹彩、一道金光，在懸浮棲息環之間追著繞圈，誰也沒有追上誰。']
  ],'羽貓獸和金羽御風鯉，在圓環之間追著繞了好幾圈。','羽與鰭','一道虹彩、一道金光，在圓環之間追著繞圈，誰也沒有追上誰。')},
 int_sola_mnemo:{trigger:'carriage',car:'habitat',who:['sola','mnemo'],need:()=>aboard('sola')&&aboard('mnemo'),title:'索拉與霜憶晶絡',run:()=>interScene('mnemo','sola',[
   ['sola','（索拉漂到冰晶旁邊，盯著那些藍色光泡。）……裡面，有沒有一座浮島？'],['mnemo','……有很多島。你在找哪一座？'],['sola','我的。很久以前漂走的那一座。'],
   ['mnemo','（光泡一顆一顆亮過去，最後停在一顆小小的光上。）……這一顆。島上有一隻水母，在講冷笑話。'],['sola','（索拉的光暗了一下，又亮起來。）……那是我。我那時候的笑話，比現在還冷。'],
   ['mnemo','我會一直收著它。'],['sola','……嗯。那我就放心，繼續往前漂了。'],
   ['self','冰晶的冷光和水母的暖光，靠在一起，亮了很久。']
  ],'霜憶晶絡的光泡裡，收著索拉失落的那座浮島。','收著的島','冰晶的冷光和水母的暖光，靠在一起，亮了很久。')},
 int_titan_cabbfrog:{trigger:'carriage',car:'habitat',who:['titan','cabbfrog'],need:()=>aboard('titan')&&aboard('cabbfrog'),title:'苔淵巨靈與翠苞蛙',run:()=>interScene('cabbfrog','titan',[
   ['cabbfrog','（翠苞蛙縮在苔淵巨靈的腳邊，一動也不動。）……呱。這裡好暗，好涼。是樹蔭嗎？'],['titan','……不是樹蔭。……是我。'],['cabbfrog','呱！（啪地捲成一顆球。）'],
   ['titan','……沒關係。……你可以待著。……我的肩膀上，也有很多葉子。'],['cabbfrog','（葉縫裡探出一隻眼睛。）……那，我可以睡在你肩膀上嗎？'],['titan','……可以。……我不會動。'],
   ['self','那天之後，苔淵巨靈的肩膀上多了一顆圓圓的「甘藍」。巨靈一整天都沒有動。']

/* ---------- 狀態 ---------- */
function freshState(){ return {
 v:1, introDone:false, journeyCount:0, currentLocation:'origin', currentCarriage:'observation', currentPhase:'docked',
 duty:dutyFresh(), spirit:{contamination:null,contaminationLog:[],taint:6,pur:null,equipment:{tablet:false,compass:false,talisman:false}}, voyage:null,
 passengers:{}, completedEvents:[], pendingEvents:[], unlockedLocations:['dawnForest','starIslands'], visitedLocations:[],
 view:{}, seen:{}, discoveredLifeforms:[], collectibles:['seed_ancient_a','seed_ancient_b','seed_ancient_c'], clues:[], storyFlags:{natureLight:'dawn'},
 culture:null, log:[{j:0,t:'列車在沉睡之地甦醒。精靈接下了列車的值勤職責。'}]
};}
let state = load() || freshState();
function load(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return s&&s.v===1? Object.assign(freshState(),s):null; }catch(e){ return null; } }
function save(){ try{ state.savedAt=Date.now(); localStorage.setItem(SAVE_KEY,JSON.stringify(state)); }catch(e){} }

const aboard = id => !!(state.passengers[id]&&state.passengers[id].aboard);
const done = id => state.completedEvents.includes(id);



/* ================================================================
   新手提示：第一次遇到某個功能時，在熱點上方出現和值勤準備一樣的跳動標記；用過一次就不再出現
   （記在瀏覽器裡，重新開始或二周目也不會再出現）
   ================================================================ */
const TIP_KEY='riyue-tips-v1';
const tipsDone=()=>{ try{ return JSON.parse(localStorage.getItem(TIP_KEY)||'[]'); }catch(e){ return []; } };
const tipDone=k=>tipsDone().includes(k);
function tipMark(k){ const a=tipsDone(); if(a.includes(k)) return; a.push(k); try{ localStorage.setItem(TIP_KEY,JSON.stringify(a)); }catch(e){} }
/* 提示只留在火車頭（值勤準備）；其他車廂不再跳提示 */
function tipOnce(k,text){ if(k!=='t_duty'||tipDone(k)) return; tipMark(k); toast(text); }
const careZone=()=>{ const id=Object.keys(PASSENGERS).find(id=>aboard(id)&&!atDeck(id)&&CARE[id]&&!careOk(id)); return id?'hab-'+zoneOf(id):null; };
const TIPS=[
 {k:'talk',t:'說說話',m:h=>/^hab-p-/.test(h.id),when:()=>true},
 {k:'care',t:'調整結界',m:h=>h.id===careZone(),when:()=>!!careZone()},
 {k:'out',t:'下車看看',m:h=>h.id==='hab-exit',when:()=>state.currentPhase==='docked'&&state.currentLocation!=='origin'},
 {k:'scope',t:'找影子',m:h=>h.id==='obs-scope',when:()=>true},
 {k:'obsrep',t:'觀測界壁',m:h=>h.id==='obs-nav',when:()=>state.currentPhase==='docked'&&state.journeyCount>=1&&!state.duty.reported&&!obsOk(nextStop())},
 {k:'nav',t:'選航線',m:h=>h.id==='obs-nav',when:()=>state.currentPhase==='docked'&&state.journeyCount>=1},
 {k:'const',t:'連星座',m:h=>h.id==='obs-const',when:()=>!!skyHere()},
 {k:'skylight',t:'打開天窗',m:h=>h.id==='nat-skylight',when:()=>!!skyNow()},
 {k:'dust',t:'接住星塵',m:h=>h.id==='ot-dust',when:()=>true},
 {k:'sky',t:'觀賞天象',m:h=>h.id==='ot-sky',when:()=>!!skyNow()},
 {k:'invite',t:'邀請乘客',m:h=>h.id==='ot-invite',when:()=>true},
 {k:'engr',t:'拓下刻紋',m:h=>h.id==='ot-floor',when:()=>state.currentPhase==='docked'&&!ENGR_OK(state.currentLocation)},
 {k:'vine',t:'休息淨化',m:h=>h.id==='nat-special',when:()=>TAINT.val()>=20},
 {k:'book',t:'整理筆記',m:h=>h.id==='mem-book',when:()=>Object.keys(state.notes||{}).some(id=>notesOf(id).length)},
 {k:'mirror',t:'照照鏡子',m:h=>h.id==='mem-mirror',when:()=>state.journeyCount>=1},
 {k:'save',t:'存檔',m:h=>h.id==='mem-save',when:()=>state.introDone}
];
let TIPCUR=null;
function tipPick(list){ TIPCUR=null; return; if(!RUNNING||(state.currentCarriage==='cab'&&dutyOn())||(state.currentCarriage==='nature'&&growStep())) return; const done=tipsDone();
 for(const T of TIPS){ if(done.includes(T.k)) continue; let ok=false; try{ ok=T.when(); }catch(e){} if(!ok) continue; const h=list.find(T.m); if(h){ TIPCUR={k:T.k,id:h.id,t:T.t}; return; } } }
const tipBadge=h=>TIPCUR&&TIPCUR.id===h.id?`<span class="step cur tip"><b>✦</b><i>${TIPCUR.t}</i></span>`:'';
function tipHit(id){ TIPS.forEach(T=>{ if(!tipDone(T.k)&&T.m({id})) tipMark(T.k); }); }
/* 轉身按鈕的提示 */
function tipTurn(){ return; const b=document.querySelector('#scene .pano-turn.r'); if(!b||tipDone('turn')||b.querySelector('.step')) return; b.insertAdjacentHTML('afterbegin','<span class="step cur tip"><b>✦</b><i>轉身</i></span>'); }
document.addEventListener('click',e=>{ if(e.target.closest('.pano-turn')) tipMark('turn'); },true);

/* ================================================================
   對話回看：最近聽見的話（對話、過場、廣播）
   ================================================================ */
const BL={ push(w,t){ if(!RUNNING) return; const x=String(t||'').replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').trim(); if(!x||x==='__self__') return;
  const a=state.backlog=state.backlog||[]; const last=a[a.length-1]; if(last&&last.w===w&&last.t===x) return; const now=Date.now(); if(!last||!this.at||now-this.at>6000) this.g=now; this.at=now;
  a.push({w,t:x,g:this.g,j:state.journeyCount,l:state.currentLocation}); if(a.length>160) a.splice(0,a.length-160); } };
/* 把最近聽見的話，依一段一段的對話分成水晶 */
function heardGroups(){ const a=state.backlog||[], G=[]; let cur=null; a.forEach((x,i)=>{ const g=x.g||('o'+Math.floor(i/6)); if(!cur||cur.g!==g){ cur={g,lines:[],j:x.j,l:x.l}; G.push(cur); } cur.lines.push(x); }); return G.slice(-24); }
function addLogBtn(el){ const box=el.querySelector('.box'); if(!box||box.querySelector('.bl-btn')) return;
 const b=document.createElement('button'); b.className='bl-btn'; b.type='button'; b.title='回看對話'; b.setAttribute('aria-label','回看對話'); b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M17 14l3 3-3 3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 b.onclick=e=>{ e.stopPropagation(); backlogPanel(); }; box.appendChild(b); }
function backlogPanel(){ const a=(state.backlog||[]).slice(-80);
 const ov=panel(`<button class="close" aria-label="關閉">✕</button><div class="eyebrow">回憶水晶</div><h2>最近聽見的話</h2>${a.length?`<ol class="bl-list">${a.map(x=>`<li>${x.w?`<b>${esc(x.w)}</b>`:''}<span>${esc(x.t)}</span></li>`).join('')}</ol>`:'<p class="nb-empty">還沒有聽見什麼。</p>'}`,'backlog');
 const l=ov.querySelector('.bl-list'); if(l) setTimeout(()=>{ l.scrollTop=l.scrollHeight; },30); return ov; }

/* ================================================================
   展望台的風景：上下滿版，左右用滑鼠或手指拖曳，看完整的全景
   ================================================================ */
const OSKY_LOC={origin:'assets/sky-origin.jpg',dawnForest:'assets/sky-dawn.jpg',starIslands:'assets/sky-stars.jpg',reverseRealm:'assets/sky-reverse.jpg',boundlessCorridor:'assets/sky-corridor.jpg',silentVoid:'assets/sky-void.jpg',timeriftSea:'assets/sky-tide.jpg'};
const OSKY_VOY=['assets/sky-voy1.jpg','assets/sky-voy2.jpg','assets/sky-voy3.jpg'];
const OSKY={f:.5,drag:null};
function obsSky(){ if(state.currentPhase==='voyage'&&state.voyage){ const p=state.voyage.progress||0; return OSKY_VOY[p<.34?0:p<.67?1:2]; } return OSKY_LOC[state.currentLocation]||'assets/sky-origin.jpg'; }
function oskyPut(){ const el=document.getElementById('osky'), sc=$('#scene'); if(!sc) return; sc.classList.toggle('obs-pan',!!el); if(!el) return; const W=el.offsetWidth, V=sc.clientWidth, max=Math.max(0,W-V); OSKY.f=Math.max(0,Math.min(1,OSKY.f)); el.style.transform=`translateX(${(-max*OSKY.f).toFixed(1)}px)`;
 /* 展望台固定在長條風景的正中間：拖曳時欄杆、甲板和上面的東西跟著風景一起移動 */
 sc.style.setProperty('--ox',(max*(.5-OSKY.f)).toFixed(1)+'px'); }
setInterval(()=>{ const el=document.getElementById('osky'); if(!el||!RUNNING) return; const u=obsSky(); if(el.dataset.src!==u){ el.dataset.src=u; const n=el.cloneNode(); n.style.backgroundImage=`url('${u}')`; n.style.opacity=0; n.removeAttribute('id'); el.after(n); requestAnimationFrame(()=>{ n.style.transition='opacity 1.6s'; n.style.opacity=1; }); setTimeout(()=>{ el.style.backgroundImage=`url('${u}')`; n.remove(); },1700); } oskyPut(); },700);
document.addEventListener('pointerdown',e=>{ const el=document.getElementById('osky'); if(!el||!e.target.closest('#scene')||e.target.closest('[data-hs],.pano-turn,button')) return; e.preventDefault(); OSKY.drag={x:e.clientX,f:OSKY.f,w:Math.max(1,el.offsetWidth-$('#scene').clientWidth),moved:0}; el.classList.add('grab'); });
document.addEventListener('pointermove',e=>{ const d=OSKY.drag; if(!d) return; const dx=e.clientX-d.x; d.moved=Math.max(d.moved,Math.abs(dx)); OSKY.f=d.f-dx/d.w; oskyPut(); });
const oskyUp=()=>{ const d=OSKY.drag; if(!d) return; OSKY.drag=null; const el=document.getElementById('osky'); if(el) el.classList.remove('grab'); if(d.moved>6) HSC.until=performance.now()+250; };
document.addEventListener('pointerup',oskyUp); document.addEventListener('pointercancel',oskyUp);
addEventListener('resize',oskyPut);
function renderOutside(){ const L=LOCATIONS[state.currentLocation]; return svgScene(L.art())+dust(20)+'<div class="vignette"></div>'+hsRender('out:'+state.currentLocation); }

function renderHUD(){
 const L=LOCATIONS[state.currentLocation], ph=state.currentPhase, v=state.voyage;
 const cars=TRAIN.map(c=>`<span class="car ${c==='cab'?'loco':''} ${c==='observatory'?'tail':''} ${c===state.currentCarriage&&ph!=='outside'?'on':''}" title="${CARRIAGES[c].name}"></span>`).join('');
 const head = ph==='voyage'&&v ? `<div class="realm">自動航行中</div><div class="name">前往 ${LOCATIONS[v.to].name}</div><div class="meta"><span class="vbar"><i id="vprog" style="width:${(v.progress*100).toFixed(1)}%"></i></span>旅程 <b>${state.journeyCount}</b></div>`
  : `<div class="realm">${L.realm}・${L.domain}</div><div class="name">${L.name}</div><div class="meta">旅程 <b>${state.journeyCount}</b>　乘客 ${Object.keys(PASSENGERS).filter(aboard).length}</div>`;
 const where = ph==='outside' ? '列車外' : CARRIAGES[state.currentCarriage].short;
 const pend = state.pendingEvents.filter(id=>EVENTS[id]).slice(0,2).map(id=>{ const E=EVENTS[id], pl=E.who&&pairPlace(E.who); return pl?`<button class="evt where" data-act="where:${id}">去${PLACE_NAME[pl]}看看</button>`:`<button class="evt" data-act="event:${id}">${E.title}</button>`; }).join('')+(state.socPend&&aboard(state.socPend.a)&&aboard(state.socPend.b)&&!state.pendingEvents.length?`<button class="evt where" data-act="soc:go">去${PLACE_NAME[placeOf(state.socPend.a)]}看看</button>`:'');
 const q=questText(); announce(q);
 $('#hud').innerHTML=`<div class="hl"><div class="loc">${head}</div></div>
 <div class="train" aria-label="車廂位置">${cars}<span class="cn">${where}</span></div>
 <div class="right">${pend}${state.mirrorAt==='carry'?'<button class="snd nbk mirb" data-act="mirror:open" aria-label="映心鏡"><span class="mir-ic"></span>映心鏡</button>':''}${state.currentPhase==='voyage'&&state.voyage&&state.voyage.fin!=null?'<button class="evt where" data-act="arrprep:open">到站準備</button>':''}${Object.keys(PASSENGERS).some(aboard)?'<button class="snd nbk" data-act="who:open" aria-label="乘客在哪裡"><span>✦</span>乘客</button>':''}<button class="snd nbk" data-act="notes:open" aria-label="筆記本"><span>🗒️</span>筆記本</button><button class="snd ${PREFS.sound===false?'off':''}" data-act="sound:toggle" aria-label="音效開關">♪</button></div>`;
}

 return v<15?'身體很輕。羽翼的粉色很亮，鱗片在光下一閃一閃。':v<35?'有一點點沉重。羽尖的粉色，好像淡了一些。':v<60?'身上很沉重，鱗片的光澤暗了下來。該去淨界晶環淨化了。':'好重……羽翼幾乎張不開。請盡快到淨界晶環淨化。'; }
function spiritPanel(){ const v=TAINT.val(), lv=taintLevel(v); state.storyFlags.mirrorSeen=lv; save();
 const ov=panel(`<div class="mirror"><div class="mir-wrap"><div class="mir-glass"><img class="me-fig meimg" src="${ME_IMG}" alt="映在鏡中的你" title="點一下，伸展羽翼"><i class="mir-ring"></i><i class="mir-ring r2"></i><i class="mir-shine"></i></div>${MIR_FRAME}</div></div>
  <div class="mir-v">界染度<b>${v}</b>${lv}</div><p class="mir-feel">${spiritFeel()}</p><p class="mir-res"><b>${RES[resStage(v)][1]}</b>${RES[resStage(v)][2]}</p>${trainStage('guard')===2?'<p class="mir-res">……鏡子的深處，閃過一個陌生的身影。牠穿著和我很像的衣服，站在一扇門前。</p>':''}
  <div class="mir-place">${[['carry','取下來，帶在身上'],[state.currentCarriage,`掛在${CARRIAGES[state.currentCarriage].name}`]].filter(([k])=>k!==(state.mirrorAt||'memory')&&(k==='carry'||state.currentPhase!=='outside')).map(([k,t])=>`<button data-mir="${k}">${t}</button>`).join('')}</div>`,'stage mirrorov');
 ov.querySelectorAll('[data-mir]').forEach(b=>b.onclick=()=>{ const k=b.dataset.mir; state.mirrorAt=k; save(); SFX.glass(); closeOv(ov);
  toast(k==='carry'?'映心鏡收進懷裡了・右上角可以隨時照':`映心鏡掛在${CARRIAGES[k].name}了`); render(); });
 const fig=ov.querySelector('.me-fig'); let open=false;
 fig.onclick=()=>{ open=!open; fig.src=open?ME_WINGS:ME_IMG; SFX.tone(open?1318:988,0,.45,'sine',.025); }; hsRefresh(); }
/* ---------- 互動派發 ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const [k,v]=b.dataset.act.split(':'); act(k,v); });
function act(k,v){
 switch(k){
  case 'go': return moveTo(v);
  case 'turn': return turnView();
  case 'exit': if(state.currentPhase!=='docked') return toast('航行中無法離開列車');
   if(state.currentLocation==='origin') return toast('列車停泊在沉睡之地，這裡無法下車');
   if(resStage()>=5) return dialogueScript([['self','……身體太重了。現在下車，可能會回不來。'],['self','先去淨化吧。']]);
   return exitChooser(()=>transition(()=>{ state.exitFrom=state.currentCarriage; state.currentPhase='outside'; if(TAINT.once('out')) TAINT.add(TAINT_GAIN[realmKey(state.currentLocation)].out); logOnce('outside_'+state.currentLocation+'_'+state.journeyCount,'走出列車，踏上'+LOCATIONS[state.currentLocation].name+'。'); },null,true));
  case 'back': return transition(()=>{ state.currentPhase='docked'; state.currentCarriage=state.exitFrom==='cab'?'cab':'habitat'; state.companion=null; },()=>{ if(state.duty.signal) boardCheck(); },true);
  case 'talk': return talk(v);
  case 'where': return whereTell(v);
  case 'soc': return socWhere();
  case 'event': { const ev=EVENTS[v]; if(ev&&!done(v)){ complete(v); ev.run(); renderHUD(); } return; }
  case 'reunion': return reunion(v);
  case 'zone': return zoneInfo(v);
  case 'notes': return notebookPanel();
  case 'arrprep': return prepPanel();
  case 'who': return whoPanel();
  case 'mirror': return spiritPanel();
  case 'sketch': return sketchPicker();
  case 'care': return carePicker();
  case 'me': return spiritPanel();
  case 'sound': PREFS.sound=PREFS.sound===false; savePrefs(); if(PREFS.sound===false){ SFX.stopDrone(); SFX.ambient(null); BGM.stop(500); } else { SFX.init(); if(state.currentPhase==='voyage') SFX.startDrone(); SFX.ambKey=null; SFX.ambient(HS_SCENE()); BGM.start(); } renderHUD(); return toast(PREFS.sound===false?'音樂與音效已關閉':'音樂與音效已開啟');
  default: return (INTERACT[k+':'+v]||(()=>{}))();
 }
}
function logOnce(key,t){ if(!state.storyFlags[key]){ state.storyFlags[key]=1; logJ(t); } }

/* 乘客互動只在兩位乘客都在玩家眼前時發生：都在棲息車廂，或都在展望台 */
function hereWith(ids){ const c=state.currentCarriage; return ids.every(id=>aboard(id)&&(c==='observatory'?atDeck(id):c==='habitat'&&!atDeck(id))); }
/* 第一次開這輛列車：走進每一節車廂時，精靈會簡單說明這節車廂是做什麼的 */
const CAR_INTRO={
 memory:[['self','這裡是記憶典藏車廂。'],['self','列車走過的地方、遇見的生命，都會變成書和水晶，收在這裡。'],['self','想整理旅程、存檔，或是照照映心鏡的時候，就來這裡吧。']],
 nature:[['self','森羅溫室車廂……到處都是植物的味道。'],['self','種子收在典藏櫃，培育艙可以把它們種出來。'],['self','角落那株守望藤好像會說話。累了的時候，可以來這裡休息。']],

 observation:[['self','星月觀測車廂。從這裡，可以看見整片天空。'],['self','導航裝置決定下一站；觀測儀看得見遠方的影子；星座盤，可以把星星連起來。']],
 observatory:[['self','火車尾的展望台。風好大。'],['self','航行的時候，天上偶爾會出現星象。到時候，可以邀乘客一起來看。']]
};

 { const c=state.currentCarriage; if(state.introDone&&CAR_INTRO[c]&&state.currentPhase!=='outside'&&!(state.carSeen||[]).includes(c)&&!document.querySelector('#layer .cine,#layer .dlg,#layer .board')){
  state.carSeen=(state.carSeen||[]).concat(c); save(); setTimeout(()=>{ if(state.currentCarriage===c&&!document.querySelector('#layer .cine,#layer .dlg')) dialogueScript(CAR_INTRO[c],()=>checkCarriageEvents()); },600); return; } }
 if(RUNNING&&!(navigator.webdriver&&!window.STORY_TEST)&&meetHere()) return;
 if(state.currentCarriage==='cab'&&state.currentPhase!=='outside'&&state.storyFlags.newConst&&!state.storyFlags.newConstTold&&!document.querySelector('#layer .cine,#layer .dlg,#layer .board')){ const C=CONSTS.find(x=>x.id===state.storyFlags.newConst);

 if(state.currentCarriage==='habitat'&&(state.boardQ||[]).length&&!document.querySelector('#layer .cine,#layer .board,#layer .dlg')) return runBoardQ();

 Object.entries(EVENTS).forEach(([id,ev])=>{ if(ev.trigger==='carriage'&&!ev.who&&ev.car===state.currentCarriage&&!done(id)&&!state.pendingEvents.includes(id)&&ev.need()){ state.pendingEvents.push(id); toast('新的事件：'+ev.title); } });

/* ================================================================
   植物的特性與被動效果
   晨光系：緩慢降低界染度　月輝系：望遠鏡裡的影子更清楚　星輝系：航行中的事更容易多發現一點線索
   安神系：乘客休息更舒適　共鳴系：乘客之間更容易湊在一起聊天
   「作用中」＝培育艙裡開花的植物，加上擺在棲息車廂休息區的盆栽
   ================================================================ */
const TRAIT={dawn:['晨光系','緩慢降低界染度'],moon:['月輝系','月界的觀測更清楚'],star:['星輝系','航行中更容易發現特殊線索'],calm:['安神系','乘客休息更舒適'],reso:['共鳴系','乘客之間更常湊在一起']};
const TRAIT_OF={sunfern:'dawn',dewmoss:'dawn',goldfern:'dawn',dewbell:'dawn',emberkern:'dawn',duskchest:'dawn',hearthnut:'dawn',goldreed:'dawn',bell:'dawn',
 tidebloom:'moon',tidelotus:'moon',shellbloom:'moon',veilseed:'moon',nightcap:'moon',inkseed:'moon',memnut:'moon',
 starspore:'star',stardaisy:'star',dustdaisy:'star',starbell:'star',trilight:'star',urchin:'star',starbean:'star',lantern:'star',
 mossgrass:'calm',fuzzhusk:'calm',pearlgrain:'calm',owlbur:'calm',deeproot:'calm',spirepod:'calm',
 glowcap:'reso',glowmoss:'reso',mothwing:'reso',twinbloom:'reso'};
const traitOf=p=>TRAIT_OF[p]||({dawn:'dawn',moon:'moon',star:'star'}[(PLANTS[p]||{}).light]||'calm');
const traitTag=p=>{ const t=traitOf(p); return `<span class="trait ${t}">${TRAIT[t][0]}・${TRAIT[t][1]}</span>`; };
const activePlants=()=>(state.pods||[]).filter(c=>c&&c.st>=2).map(c=>c.p).concat(Object.values(state.zonePlant||{}));
const traitN=t=>activePlants().filter(p=>traitOf(p)===t).length;
const likes=(id,p)=>{ const r=PREF[id]; return !!(r&&(r.love.includes(p)||r.like.includes(p))); };
/* 安神系：休息區擺著安神系植物，或是擺著牠喜歡的植物，牠就睡得很舒服 */
function plantComfort(id){ const z=zoneOf&&zoneOf(id), zp=(state.zonePlant||{})[z]; return !!(zp&&(traitOf(zp)==='calm'||likes(id,zp))); }
/* 喜歡的植物正在溫室開花 */

 if(state.annSeen===plain) return; state.annSeen=plain; BL.push('列車廣播',plain); save(); ANN.q=plain; clearTimeout(ANN.t); ANN.t=setTimeout(annTry,700); }
function announceNow(t){ ANN.q=t; clearTimeout(ANN.t); ANN.t=setTimeout(annTry,300); }
function annTry(){ if(!ANN.q) return; if(document.querySelector('#layer .cine,#mainscreen')){ ANN.t=setTimeout(annTry,700); return; }
 const t=ANN.q; ANN.q=null; let el=$('#announce'); if(!el){ el=document.createElement('div'); el.id='announce'; el.setAttribute('aria-live','polite'); document.body.appendChild(el); }
 el.className='on'; el.innerHTML='<span class="an-c">♪ 列車廣播</span><div class="an-t"></div>';
 const box=el.querySelector('.an-t'); let k=0; clearInterval(ANN.iv); ANN.ready=performance.now()+500; SFX.tone(784,0,.5,'sine',.025); SFX.tone(1046,.18,.6,'sine',.025);
 ANN.iv=setInterval(()=>{ if(k>=t.length){ clearInterval(ANN.iv); el.classList.add('done'); clearTimeout(ANN.h); ANN.h=setTimeout(annHide,4500); return; } box.textContent+=t[k++]; },65); }
function annHide(){ const el=$('#announce'); if(el){ el.classList.remove('on','done'); } clearInterval(ANN.iv); }
/* 廣播在背景播放：不會因為點擊而消失，也不擋住點擊；播完幾秒後自己淡掉 */
/* 列車廣播：像真的車掌在廣播，只在幾個時刻說一句，不解釋操作 */
function questText(){ if(!state.introDone) return ''; const ph=state.currentPhase, L=LOCATIONS[state.currentLocation];
 if((state.boardQ||[]).length&&state.currentCarriage!=='habitat'&&ph!=='outside'){ const key=state.boardQ.join(','); if(state.boardSensed!==key){ state.boardSensed=key; setTimeout(()=>sense('（……棲息車廂那邊，好像有誰上車了。）'),900); } return ''; }
 if(ph==='outside') return '';
 if(ph==='docked'){ const c=state.spirit.contamination;
  if(c&&c.value>=50&&state.duty.scan) return '值勤精靈請注意。你身上的界染有些重了，溫室的守望藤，正在等你。';
  if(state.currentLocation==='origin'||state.currentCarriage==='cab') return '';
  return `本列車現在停靠在${L.name}。發車前，請值勤精靈回到駕駛室。`; }
 if(ph==='voyage'&&state.voyage){ const v=state.voyage, k=skyNow();
  if(k&&!k.watched) return `各位旅客，現在車尾的天空出現了${SKY[k.type].name}。想看的旅客，請到火車尾展望台。`;
  if(!v.checked) return `列車已經出發，下一站，${LOCATIONS[v.to].name}。各位旅客，請坐穩。`;
  return ''; }
 return ''; }
function equipAll(){ const e=state.spirit.equipment; return !!(e.tablet&&e.compass&&e.talisman); }
function prepDone(){ const d=state.duty; return !!(d.scan&&equipAll()&&d.briefing); }
function routeOk(id){ return !!id&&id!=='origin'&&id!==state.currentLocation&&!!LOCATIONS[id]&&!!LOCATIONS[id].ready&&state.unlockedLocations.includes(id); }
function nextStop(){ if(state.currentPhase!=='voyage'&&routeOk(state.routeNext)) return state.routeNext; const cur=state.currentLocation; const i=ROUTE.indexOf(cur); return i<0?ROUTE[0]:ROUTE[(i+1)%ROUTE.length]; }
function trainNo(){ return `日月 ${String(state.journeyCount+1).padStart(3,'0')} 次`; }
function talismanEffect(dest){ return LOCATIONS[dest].realm==='日界'?'晨曦紋：抵禦日界時間流的沖刷':'月輝紋：穩定異界的重力與意念干擾'; }

 ${did&&!(c&&c.value>=50)?'':`<button class="btn" id="sb">${did?'淨化之後，再量一次':'啟動晶環'}</button>`}</div></div>`,'stage scanov'); if(!ov.querySelector('#sb')) return;
 ov.querySelector('#sb').onclick=e=>{ const svg=ov.querySelector('.scan-svg'), b=e.currentTarget; svg.classList.remove('run','ok'); void svg.getBoundingClientRect(); svg.classList.add('run'); b.disabled=true;

   state.spirit.contamination=res; state.spirit.contaminationLog.push(res); state.duty.scan=true;

/* 任務資訊核對（星途符牒） */
function briefPanel(){ if(!state.spirit.equipment.tablet) return toast('請先在裝備台領取星途符牒');
 const dest=nextStop(), L=LOCATIONS[dest], ri=ROUTE_INFO[dest]||{};
 const items=[['今日駕駛車次',trainNo()],['預定停靠站',`${L.name}（${L.realm}・${L.domain}）`],['航行速限',ri.speed||'—'],['臨時航行注意命令',ri.order||'無'],['特殊界域警告',ri.warn||'無']];

 ov.querySelectorAll('.tl').forEach((b,k)=>setTimeout(()=>{ if(!b.isConnected) return; reveal(b); if(auto) setTimeout(()=>{ if(b.isConnected) tick(b,k); },500+decodeURIComponent(b.querySelector('.v').dataset.v).length*45); },350+k*700));
