<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2226%22 fill=%22%23f3d9a0%22/%3E%3Ccircle cx=%2242%22 cy=%2226%22 r=%2222%22 fill=%22%231d1a33%22/%3E%3C/svg%3E">
<title>日月更迭</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: a fixed 16:9 first-person stage (pans sideways on portrait phones) under a thin glass HUD; panels float over it. */
:root{
  --void:#070914; --ink:#eef0fb; --mute:#a9add0; --gold:#e8c983; --gold-2:#b8954e;
  --silver:#dfe6ff; --violet:#9a8cff; --mist:rgba(18,20,44,.72); --line:rgba(232,201,131,.38);
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-latin:"Cormorant Garamond","Noto Serif TC",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;display:flex;align-items:center}
#viewport::-webkit-scrollbar{display:none}
#stage{position:relative;flex:none;margin:auto;overflow:hidden;background:#000}
#scene{position:absolute;inset:0;transition:opacity .5s ease,transform .7s ease, filter .5s}
#scene.out{opacity:0;transform:scale(1.06);filter:brightness(2.2) blur(4px)}
#scene svg.bg,#scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(5,6,18,.55) 100%)}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6dc;box-shadow:0 0 8px 2px rgba(255,230,170,.6);opacity:0;animation:drift 9s linear infinite}
@keyframes drift{0%{opacity:0;transform:translateY(20px)}15%{opacity:.9}100%{opacity:0;transform:translateY(-140px) translateX(30px)}}

/* hotspots — one system, four states: normal / important / locked / done */
.hs{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:6px;min-width:44px;min-height:44px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.hs.talking,.mote.talking{z-index:8}
.hs .mk{position:relative;width:clamp(22px,2.4vw,32px);height:clamp(22px,2.4vw,32px);border-radius:50%;border:1.5px solid rgba(255,245,222,.78);background:radial-gradient(circle,rgba(255,244,214,.82) 0 16%,rgba(255,230,180,.16) 42%,transparent 70%);box-shadow:0 0 10px rgba(255,225,170,.45);transition:transform .25s,box-shadow .25s,opacity .25s}
.hs.st-normal .mk{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:.95}}
.hs:hover .mk,.hs:focus-visible .mk{opacity:1;transform:scale(1.12);box-shadow:0 0 22px rgba(255,228,170,.95);animation-play-state:paused}
.hs.st-important .mk{--r:19px;border-color:#ffe3a3;background:radial-gradient(circle,#fff6d8 0 20%,rgba(255,210,130,.34) 48%,transparent 72%);animation:goldglow 3.4s ease-in-out infinite}
@keyframes goldglow{0%,100%{box-shadow:0 0 12px rgba(255,205,120,.7),0 0 26px rgba(255,205,120,.22)}50%{box-shadow:0 0 18px rgba(255,215,140,.95),0 0 38px rgba(255,205,120,.38)}}
.hs.st-important .mk::before,.hs.st-important .mk::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#fff3c8;box-shadow:0 0 6px #ffd98a;animation:orbit 7s linear infinite}
.hs.st-important .mk::after{width:2px;height:2px;margin:-1px;animation-duration:10s;animation-direction:reverse}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--r))}to{transform:rotate(360deg) translateX(var(--r))}}
.hs.st-locked{cursor:help}
.hs.st-locked .mk{border:1.5px dashed rgba(205,210,235,.55);background:rgba(14,16,36,.62);box-shadow:none;opacity:.78}
.hs.st-locked .mk::before{content:"";position:absolute;left:50%;top:50%;width:40%;height:30%;transform:translateX(-50%);border-radius:2px;background:rgba(220,225,245,.85)}
.hs.st-locked .mk::after{content:"";position:absolute;left:50%;top:24%;width:24%;height:28%;transform:translateX(-50%);border:2px solid rgba(220,225,245,.85);border-bottom:0;border-radius:6px 6px 0 0}
.hs.st-done .mk{opacity:.42;box-shadow:none;animation:none}
.hs.st-done .mk::after{content:"";position:absolute;left:50%;top:44%;width:32%;height:16%;border-left:2px solid rgba(255,246,224,.95);border-bottom:2px solid rgba(255,246,224,.95);transform:translate(-50%,-50%) rotate(-45deg)}
.hs.st-done:hover .mk,.hs.st-done:focus-visible .mk{opacity:.95}
.hs .lb{font-family:var(--f-display);font-size:clamp(11px,1.05vw,14px);letter-spacing:.12em;white-space:nowrap;padding:3px 10px;border-radius:999px;background:rgba(10,12,30,.62);border:1px solid var(--line);color:#fff7e6;backdrop-filter:blur(6px);transition:opacity .25s,transform .25s,border-color .25s}
.hs.st-important .lb{border-color:rgba(255,215,140,.75)}
.hs.st-locked .lb{color:#c8cce8;border-style:dashed;border-color:rgba(205,210,235,.4)}
@media (hover:hover){.hs.st-normal .lb,.hs.st-done .lb{opacity:0;transform:translateY(4px)}.hs:hover .lb,.hs:focus-visible .lb,.hs.talking .lb{opacity:1;transform:translateY(-2px);border-color:var(--gold)}}
@media (hover:none){.hs.st-normal .lb{opacity:.82}.hs.st-done .lb{opacity:.5}}
.hs:focus-visible{outline:none}.hs:focus-visible .mk{outline:2px solid var(--gold);outline-offset:4px}
.hs.door .mk{border-radius:10px;width:clamp(26px,2.8vw,40px);height:clamp(34px,3.6vw,52px);background:linear-gradient(rgba(220,230,255,.5),rgba(160,150,255,.12));border-color:#dfe6ff;box-shadow:0 0 16px rgba(180,190,255,.7)}
.hs.door.st-locked .mk{background:rgba(14,16,36,.62);box-shadow:none}
.hs.door .lb,.hs.back .lb,.hs.exit .lb,.hs.save .lb{opacity:.94!important;transform:none!important}
.hs.back{flex-direction:row}
.hs.back .mk{border-radius:50%;background:none;border-color:#dfe6ff;opacity:.9;animation:none}
.hs.back .mk::before{content:"‹";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:#fff;line-height:1}
.hs.exit .mk{border-color:#ffe9a8;background:radial-gradient(circle,#fff3c4 0 22%,rgba(255,200,90,.3) 50%,transparent 72%)}
.hs.exit.st-locked .mk{border-color:rgba(205,210,235,.55);background:rgba(14,16,36,.62)}
.hs.cta .mk::before,.hs.cta .mk::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid rgba(255,230,180,.8);animation:ripple 2.8s ease-out infinite}
.hs.cta .mk::after{animation-delay:1.4s}
@keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.hsb{position:absolute;inset:-3px;border-radius:inherit;border:2px solid #fff3c8;box-shadow:0 0 14px rgba(255,230,170,.9);pointer-events:none;animation:hsburst .65s ease-out forwards}
.orb .hsb{border-radius:50%}
@keyframes hsburst{from{transform:scale(.7);opacity:1}to{transform:scale(2.8);opacity:0}}
.mote{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;animation:bob 4s ease-in-out infinite}
.mote .orb{width:clamp(30px,3.2vw,48px);height:clamp(30px,3.2vw,48px);border-radius:50%;position:relative}
.mote .orb::after{content:"";position:absolute;inset:-60%;border-radius:50%;background:inherit;filter:blur(14px);opacity:.75;z-index:-1}
.mote .lb{font-family:var(--f-display);font-size:clamp(11px,1vw,13px);letter-spacing:.1em;padding:2px 9px;border-radius:999px;background:rgba(10,12,30,.6);border:1px solid rgba(220,230,255,.4)}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 8px))}}

/* HUD */
/* 界染度：微染時畫面邊緣出現淡淡的灰紫霧，重染時更濃並緩慢脈動 */
body.taint-mild::after,body.taint-heavy::after{content:"";position:fixed;inset:0;z-index:19;pointer-events:none;box-shadow:inset 0 0 160px 30px rgba(96,84,128,.32)}
body.taint-heavy::after{box-shadow:inset 0 0 220px 60px rgba(82,62,112,.5);animation:taintp 4.5s ease-in-out infinite}
@keyframes taintp{50%{opacity:.6}}
.rune-res.lv-mild .rune-dot{background:#ffd27a;box-shadow:0 0 12px #ffd27a}.rune-res.lv-heavy .rune-dot{background:#ff8a8a;box-shadow:0 0 12px #ff8a8a}
.pur-done{color:#d9c8ff;font-size:13px}
/* 乘客互動：沒說話的那位稍微淡出 */
.dlg .who.dim{opacity:.4;filter:saturate(.5) brightness(.85);transition:opacity .3s}
/* 觀星 */
.skyfx .mt{animation:mfall 2.6s linear infinite;opacity:0}@keyframes mfall{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(-260px,150px)}}
.sky-aurora path{animation:aur 6s ease-in-out infinite}@keyframes aur{50%{opacity:.6;transform:translateY(18px)}}
.sky-tide ellipse{transform-origin:800px 260px;animation:tide 3.6s ease-out infinite}@keyframes tide{0%{opacity:0;transform:scale(.6)}40%{opacity:.6}100%{opacity:0;transform:scale(1.15)}}
.sky-eclipse .moon{animation:ecl 8s ease-in-out infinite}@keyframes ecl{0%,100%{transform:translateX(-40px)}50%{transform:translateX(-30px)}}
.sky-view{border-radius:8px;overflow:hidden;margin:6px 0 10px;aspect-ratio:16/5}.sky-view svg{width:100%;height:100%;display:block}
.cs-board{max-width:520px;margin:8px auto;border-radius:10px;overflow:hidden}.cs-board svg{width:100%;display:block}.cs-board.done{box-shadow:0 0 24px rgba(255,220,140,.45)}
.cs-star{cursor:pointer}.cs-star.on circle:last-child{filter:drop-shadow(0 0 6px #ffe9a8)}
.card[disabled]{opacity:.45;cursor:default}
/* 觀星紀錄本 */
.ov.skybook .panel{max-width:860px}.sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sb-card{border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(232,201,131,.25);padding:10px 12px 12px}.sb-card h3{margin:8px 0 4px;font-size:16px}.sb-card p{font-size:13px;line-height:1.7;margin:4px 0}
.sb-card.unk{opacity:.7}.sb-card.unk .sb-art{background:rgba(10,12,40,.6)}.sb-art{border-radius:6px;overflow:hidden;aspect-ratio:16/10;background:#0e1030}.sb-art svg{width:100%;height:100%;display:block}
.sb-hint{color:#d9c8ff}.sb-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.sb-log li{display:flex;gap:10px;font-size:14px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.05)}.sb-log .no{color:var(--gold);font-family:var(--f-latin);flex:none}
/* 世界觀 */
.tome .hist{font-size:14px;line-height:1.85}.tome .hist b{color:#7a5c30}
/* 照顧需求 */
.ov.care .panel{max-width:720px}
.ztabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.ztabs button{padding:5px 11px;border-radius:999px;border:1px solid rgba(232,201,131,.35);background:none;color:var(--silver);font:inherit;font-size:12px;cursor:pointer;position:relative}
.ztabs button.on{background:rgba(232,201,131,.85);color:#2a1d0a;font-weight:600}.ztabs button.warn::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:#ffb27a}
.zh{font-size:14px;margin:14px 0 6px;letter-spacing:.1em;color:var(--gold)}.zlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.zlist li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.05);font-size:14px}.zlist li.ok{box-shadow:inset 3px 0 0 rgba(232,201,131,.85)}.zlist small{color:var(--mute)}
.zp{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}.zp>*{max-width:100%;max-height:100%}
.zask{display:flex;flex-wrap:wrap;gap:6px}.zask .btn{font-size:13px;padding:6px 12px}
.ask-bubble{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:8px;background:#fff6d8;color:#3d2e18;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:fin .25s}.care-wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;align-items:center;margin:8px 0}
.care-who{aspect-ratio:4/3;border-radius:8px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),rgba(205,200,230,.75));display:flex;align-items:center;justify-content:center;overflow:hidden;transition:box-shadow .6s}
.care-who.ok{box-shadow:0 0 0 2px rgba(232,201,131,.8),0 0 28px rgba(255,220,140,.55)}.care-who>img,.care-who>svg{max-width:92%;max-height:92%;object-fit:contain}
.care-dials{display:flex;flex-direction:column;gap:12px}.dial .dn{display:block;font-size:12px;letter-spacing:.14em;color:var(--mute);margin-bottom:5px}
.seg{display:flex;border:1px solid rgba(232,201,131,.4);border-radius:999px;overflow:hidden}.seg button{flex:1;padding:7px 4px;background:none;border:0;color:var(--silver);cursor:pointer;font:inherit;font-size:13px}
.seg button+button{border-left:1px solid rgba(232,201,131,.25)}.seg button.on{background:rgba(232,201,131,.85);color:#2a1d0a;font-weight:600}
.care-react{font-size:15px;min-height:1.6em}.care-react.ok{color:#fff3c4}.care-st{font-size:13px;color:var(--mute)}
@media (max-width:600px){.care-wrap{grid-template-columns:1fr}.seg button{font-size:12px;padding:7px 2px}}
.card.got .s{color:#cfe9c8}
/* 聆聽筆記・觀察速寫 */
.dlg .hl-tip{position:absolute;bottom:calc(100% + 10px);width:260px;padding:8px 12px;border-radius:8px;background:#fff6d8;color:#3d2e18;font-size:13px;line-height:1.5;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:fin .25s}
.dlg .hl-tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff6d8}
.snd.dim{opacity:.45}
.ov.sketch .panel{max-width:720px}.sk-wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:center;margin:8px 0 6px}
.sk-live{aspect-ratio:4/3;border-radius:8px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95),rgba(225,220,240,.85));display:flex;align-items:center;justify-content:center;overflow:hidden}
.sk-live>img,.sk-live>svg{max-width:92%;max-height:92%;object-fit:contain}
.sk-sheets{display:flex;flex-direction:column;gap:10px}.sk-sheet{aspect-ratio:4/3;border-radius:4px;background:#f3ead4;display:flex;align-items:center;justify-content:center;color:#9a8664;font-size:12px;text-align:center;line-height:1.6;box-shadow:inset 0 0 0 1px rgba(122,92,48,.3)}
.sk-sheet>img,.sk-sheet>svg{width:88%;height:88%;object-fit:contain;filter:sepia(.55) saturate(.6) contrast(1.05);mix-blend-mode:multiply}
.sk-sheet.fresh>img,.sk-sheet.fresh>svg{animation:skdraw 1.2s ease-out}@keyframes skdraw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.sk-bar{position:relative;height:16px;margin:12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(232,201,131,.35)}
.sk-bar .zone{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,rgba(232,201,131,.35),rgba(255,226,150,.85),rgba(232,201,131,.35))}
.sk-bar .ptr{position:absolute;top:-5px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 8px #fff}
.sk-msg{font-size:14px}.studies .sk.blank{display:flex;align-items:center;justify-content:center;width:118px;height:84px;border:1.5px dashed rgba(122,92,48,.5);border-radius:4px;opacity:.8;filter:none;mix-blend-mode:normal;color:#7a5c30;font-size:12px;text-align:center;line-height:1.5}
@media (max-width:600px){.sk-wrap{grid-template-columns:1fr}.sk-sheets{flex-direction:row}.sk-sheet{flex:1}}
/* 聆聽筆記 */
.dlg .tx mark.hl{background:none;color:#fff3c4;cursor:pointer;border-bottom:1px dashed rgba(255,230,160,.8);text-shadow:0 0 10px rgba(255,214,120,.95);animation:hlg 2.2s ease-in-out infinite;padding:0 1px}
.dlg .tx mark.hl.got{animation:none;color:#cfe9c8;text-shadow:none;border-bottom:1px solid rgba(190,230,180,.7)}
.dlg .tx mark.hl.got::after{content:" 🗒️";font-size:.8em}
@keyframes hlg{50%{text-shadow:0 0 3px rgba(255,214,120,.6)}}
.ov.notebook .panel{max-width:620px}.nb-who{border-top:1px solid rgba(232,201,131,.25);padding-top:10px;margin-top:12px}
.nb-who h3{margin:0 0 6px;font-size:16px}.nb-who h3 small{display:block;font-size:12px;color:var(--mute);font-weight:400;letter-spacing:.06em;margin-top:2px}
.nb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.nb-list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:6px;background:rgba(255,255,255,.05)}
.nb-list li.filed{opacity:.7}.nb-list em{font-style:normal;font-size:12px;color:#cfe9c8;white-space:nowrap}.nb-x{flex:none;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid rgba(220,230,255,.3);background:none;color:var(--silver);cursor:pointer}
.nb-empty{color:var(--mute);font-size:13px}
.tome .cmp{font-size:13px;color:#7a6440;margin:4px 0 8px}.tome .cmp.done{color:#8a5a12;font-weight:600}
.tome .file-slot{margin:4px 0 10px;padding:10px 12px;border:1.5px dashed rgba(122,92,48,.55);border-radius:6px;background:rgba(255,248,230,.35)}
.tome .slot-btn{background:none;border:0;color:#7a5c30;cursor:pointer;font:inherit;font-size:14px;letter-spacing:.06em;padding:0}
.tome .pick-h{margin:0 0 8px;font-size:13px;color:#6b5434}
.tome .pick{display:block;width:100%;text-align:left;margin:0 0 6px;padding:7px 10px;border-radius:5px;border:1px solid rgba(122,92,48,.45);background:rgba(255,252,240,.8);color:#3d2e18;cursor:pointer;font:inherit;font-size:14px}
.tome .pick.ghost{width:auto;display:inline-block;background:none}.tome .pick:hover{background:#fff8e2}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#hud{position:fixed;left:0;right:0;top:0;z-index:20;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#hud > *{pointer-events:auto}
.loc{background:linear-gradient(90deg,rgba(8,10,26,.78),rgba(8,10,26,.2));border-left:2px solid var(--gold);padding:7px 14px 8px 12px;min-width:0}
.loc .realm{font-size:11px;letter-spacing:.24em;color:var(--gold)}
.loc .name{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.6vw,22px);letter-spacing:.14em}
.loc .meta{font-size:11px;color:var(--mute);letter-spacing:.08em;margin-top:2px;font-variant-numeric:tabular-nums}
.loc .meta b{font-family:var(--f-latin);font-size:14px;color:var(--ink);font-weight:500}
.train{display:flex;gap:4px;align-items:center;padding:8px 10px;background:rgba(8,10,26,.6);border:1px solid rgba(232,201,131,.22);border-radius:999px;backdrop-filter:blur(6px)}
.train .car{height:8px;width:clamp(22px,4vw,46px);border-radius:3px;background:rgba(220,230,255,.18);position:relative}
.train .car.on{background:linear-gradient(90deg,var(--gold),#fff0c8);box-shadow:0 0 10px rgba(232,201,131,.8)}
.train .car:first-child{border-radius:8px 3px 3px 8px}
.train .cn{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;margin-left:8px;white-space:nowrap}
.right{display:flex;gap:8px;align-items:center}
.evt{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--gold);background:rgba(40,30,10,.55);font-family:var(--f-display);font-size:12px;letter-spacing:.1em;cursor:pointer;animation:glowp 2.4s ease-in-out infinite;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);flex:none}
@keyframes glowp{50%{box-shadow:0 0 14px rgba(232,201,131,.55)}}
.phase{font-size:11px;letter-spacing:.2em;padding:6px 10px;border-radius:999px;background:rgba(8,10,26,.6);border:1px solid rgba(220,230,255,.25);color:var(--silver);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:40;padding:9px 20px;border-radius:999px;background:rgba(10,12,30,.85);border:1px solid var(--line);font-family:var(--f-display);letter-spacing:.12em;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#panhint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:15;font-size:12px;letter-spacing:.2em;color:var(--mute);pointer-events:none;transition:opacity 1s}

/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(4,5,14,.62);backdrop-filter:blur(5px);animation:fin .35s ease;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
@keyframes fin{from{opacity:0}}
.panel{position:relative;width:min(980px,100%);max-height:100%;overflow:auto;background:linear-gradient(160deg,rgba(30,32,64,.94),rgba(12,14,34,.96));border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 60px rgba(154,140,255,.08);padding:26px clamp(18px,3vw,36px) 28px}
.panel::before{content:"";position:absolute;inset:6px;border:1px solid rgba(232,201,131,.14);pointer-events:none;border-radius:2px}
.panel h2{font-family:var(--f-display);font-weight:600;letter-spacing:.2em;font-size:clamp(20px,2.2vw,28px);margin:0 0 4px;text-wrap:balance}
.panel .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.panel p{line-height:1.85;color:#d6d9f2;max-width:62ch;margin:.6em 0}
.panel .close{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(8,10,26,.5);cursor:pointer;font-size:18px;z-index:2}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid var(--gold);background:linear-gradient(rgba(232,201,131,.18),rgba(232,201,131,.05));border-radius:2px;cursor:pointer;font-family:var(--f-display);letter-spacing:.16em;font-size:14px;transition:background .2s}
.btn:hover{background:rgba(232,201,131,.3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:rgba(220,230,255,.35);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{border:1px solid rgba(220,230,255,.18);background:rgba(10,12,30,.5);border-radius:3px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card .art{aspect-ratio:1;max-width:100%;border-radius:2px;background:radial-gradient(circle at 50% 60%,rgba(154,140,255,.25),transparent 70%);display:grid;place-items:center;overflow:hidden}
.card .art svg{width:100%;height:100%}
.card .t{font-family:var(--f-display);letter-spacing:.12em;font-size:15px}
.card .s{font-size:11px;color:var(--mute);letter-spacing:.08em}
.card.locked{cursor:default}.card.locked .art{filter:brightness(0) drop-shadow(0 0 4px rgba(154,140,255,.6))}
.tag{display:inline-block;font-size:11px;letter-spacing:.14em;padding:2px 8px;border:1px solid rgba(232,201,131,.45);border-radius:999px;color:var(--gold)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid rgba(232,201,131,.2)}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-family:var(--f-display);letter-spacing:.14em;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.log{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.log li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;border-bottom:1px solid rgba(220,230,255,.08);padding-bottom:10px}
.log .j{font-family:var(--f-latin);font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.log span{line-height:1.7;color:#d6d9f2}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:center}
.split .portrait{aspect-ratio:2/3;max-width:100%;max-height:70vh;margin:auto;filter:drop-shadow(0 0 30px rgba(180,200,255,.35))}
.split .portrait svg{width:100%;height:100%}
@media (max-width:700px){.split{grid-template-columns:1fr}.split .portrait{max-height:42vh}}
.stages{display:flex;gap:6px;margin:10px 0}
.stages span{flex:1;font-size:11px;text-align:center;padding:4px 0;border-top:2px solid rgba(220,230,255,.18);color:var(--mute);letter-spacing:.1em}
.stages span.on{border-color:var(--gold);color:var(--ink)}

/* dialogue */
.dlg{position:fixed;inset:0;z-index:32;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 30%,rgba(4,5,14,.85));animation:fin .35s}
.dlg .who{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:min(88vh,980px);aspect-ratio:2/3;max-width:100%;pointer-events:none;animation:rise .7s ease}
.dlg .who svg{width:100%;height:100%;filter:drop-shadow(0 0 40px rgba(170,190,255,.45))}
@keyframes rise{from{opacity:0;transform:translate(-50%,40px)}}
.dlg .box{position:relative;width:min(900px,calc(100% - 28px));margin-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(rgba(16,18,42,.92),rgba(10,12,30,.96));border:1px solid var(--line);padding:18px 22px 16px;border-radius:3px;cursor:pointer}
.dlg .nm{position:absolute;top:-15px;left:18px;padding:3px 14px;background:#141634;border:1px solid var(--gold);font-family:var(--f-display);letter-spacing:.2em;font-size:14px}
.dlg .tx{font-family:var(--f-display);font-size:clamp(15px,1.5vw,18px);line-height:1.9;min-height:3.8em;letter-spacing:.04em}
.dlg .tx.self{color:#cfd6ff;font-style:normal}
.dlg .nx{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--gold);animation:glowp 1.6s infinite}
.dlg .chs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dlg .chs button{text-align:left;padding:10px 14px;border:1px solid rgba(220,230,255,.3);background:rgba(154,140,255,.08);cursor:pointer;font-family:var(--f-display);letter-spacing:.06em}
.dlg .chs button:hover{border-color:var(--gold)}

/* cinematic */
.cine{position:fixed;inset:0;z-index:35;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:fin .6s}
.cine img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-out forwards;opacity:.85}
@keyframes kb{from{transform:scale(1.15) translate(2%,1%)}to{transform:scale(1) translate(0,0)}}
.cine .shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.75))}
.cine .txt{position:relative;max-width:min(760px,88vw);text-align:center;font-family:var(--f-display);font-size:clamp(17px,2vw,24px);line-height:2;letter-spacing:.12em;text-shadow:0 2px 20px #000;animation:fin 1s}
.cine .big{font-size:clamp(30px,4.6vw,58px);letter-spacing:.4em;font-weight:600;color:#fff4d6}
.cine .sub{display:block;font-size:13px;letter-spacing:.4em;color:var(--gold);margin-top:10px}
.cine .tap{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:.3em;color:var(--mute)}
.cine .stars{position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#dfe6ff,transparent),radial-gradient(1px 1px at 85% 20%,#fff,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent);opacity:.7}

/* boarding */
.board .burst{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 120px 60px rgba(255,240,200,.9);animation:burst 1.4s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(30)}}
.board .portrait{animation:rise 1s .5s both}
.reveal{animation:fin .8s .9s both}
.nav-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.dest{border:1px solid rgba(220,230,255,.2);background:rgba(10,12,30,.55);text-align:left;padding:0;cursor:pointer;border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.dest .art{aspect-ratio:16/9;max-width:100%}
.dest .art svg{width:100%;height:100%;display:block}
.dest .meta{padding:10px 12px}
.dest .t{font-family:var(--f-display);letter-spacing:.14em;font-size:15px}
.dest .s{font-size:11px;color:var(--mute);margin-top:3px;letter-spacing:.06em}
.dest.cur{border-color:var(--gold)}
.dest:disabled{cursor:default}.dest:disabled .art{filter:grayscale(1) brightness(.35)}
.dest:not(:disabled):hover{border-color:var(--gold)}
.seedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.seed{border:1px solid rgba(220,230,255,.2);padding:12px 8px;text-align:center;background:rgba(10,12,30,.5);border-radius:3px;cursor:pointer}
.seed .dot{width:30px;height:30px;margin:0 auto 6px;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.seed .n{font-family:var(--f-display);font-size:13px;letter-spacing:.08em}
.seed .s{font-size:10px;color:var(--mute);margin-top:2px}
.seed.sealed{opacity:.5}
.clue{border-left:2px solid var(--violet);padding:6px 0 6px 14px;margin:12px 0;font-family:var(--f-display);line-height:1.9;color:#dcd8ff}
.clue.unk{color:var(--mute);border-color:rgba(220,230,255,.2)}
.title-screen .logo{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,8vw,104px);letter-spacing:.35em;margin-right:-.35em;background:linear-gradient(180deg,#fffaf0,#e8c983 60%,#9a8cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(232,201,131,.35))}
.title-screen .en{font-family:var(--f-latin);font-style:italic;font-size:clamp(14px,1.6vw,20px);letter-spacing:.3em;color:var(--silver);margin-top:6px}
/* 360° panorama */
.pano{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden;background:#0b0d22}
.pano.drag{cursor:grabbing}
.pano-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.phs{position:absolute;inset:0;pointer-events:none}
.phs .hs{pointer-events:auto}
.pano-loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);letter-spacing:.3em;color:var(--mute)}
.pano-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;letter-spacing:.24em;padding:6px 14px;border-radius:999px;background:rgba(8,10,26,.55);color:var(--silver);pointer-events:none;transition:opacity .8s;white-space:nowrap}
/* save hotspot: pearl crystal marker, distinct from other hotspots */
.hs.save .mk{border-radius:4px;transform:rotate(45deg);border-color:#fff;background:radial-gradient(circle,#fffaf0 0 22%,rgba(220,230,255,.4) 55%,transparent 75%);box-shadow:0 0 18px rgba(230,235,255,.95)}
.hs.save .mk::before,.hs.save .mk::after{border-radius:4px}
.hs.save .lb{background:rgba(250,247,240,.92);color:#3a3150;border-color:#e8c983}
/* HUD extras */
.train .car.loco{width:clamp(16px,2.6vw,30px);background:rgba(232,201,131,.35)}
.train .car.tail{width:clamp(10px,1.6vw,18px)}
.snd{width:30px;height:30px;border-radius:50%;border:1px solid rgba(220,230,255,.3);background:rgba(8,10,26,.6);cursor:pointer;font-size:14px;color:var(--silver);flex:none}
.snd.off{opacity:.45;text-decoration:line-through}
.ms-snd{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px))}
.vbar{display:inline-block;width:90px;height:4px;border-radius:2px;background:rgba(220,230,255,.18);vertical-align:middle;margin-right:8px;overflow:hidden}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff0c8);transition:width .25s linear}
canvas.streaks{position:absolute;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 35% 35%,rgba(110,80,190,.45),transparent 60%),radial-gradient(ellipse at 70% 55%,rgba(40,120,150,.35),transparent 55%),#090b22}
/* main screen */
.mainscreen{position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2.4vh,24px);background:radial-gradient(ellipse at 50% 35%,#1d1f4c,#06071a 72%);
 padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));animation:fin .8s}
.ms-logo{text-align:center;position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 3.5vh);z-index:3;pointer-events:none}
.ms-logo .logo{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,96px);letter-spacing:.35em;margin-right:-.35em;background:linear-gradient(180deg,#fffaf0,#e8c983 60%,#9a8cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(232,201,131,.35))}
.ms-logo .en{font-family:var(--f-latin);font-style:italic;font-size:clamp(13px,1.5vw,19px);letter-spacing:.3em;color:var(--silver);margin-top:4px}
.mainscreen{overflow:hidden}
/* 滿版：容器維持影片比例並蓋滿整個畫面，位置由 msLayout() 計算（直向時把焦點移到火車頭） */
.ms-train{position:absolute;left:var(--ml,0);top:var(--mt,0);width:var(--mw,100vw);height:var(--mh,100vh)}
.ms-shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(6,7,26,.62),rgba(6,7,26,0) 26%,rgba(6,7,26,0) 80%,rgba(6,7,26,.66))}
.ms-train>.ms-anim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ms-train>.ms-branch,.ms-train>.hs,.ms-train>.ms-opt{z-index:4}
#ms-work{left:25%;top:63%}#ms-new{left:18%;top:34%}#ms-cont{left:61%;top:34%}
.mainscreen.portrait #ms-new{left:19%;top:30%}.mainscreen.portrait #ms-cont{left:34%;top:30%}
.ms-branch .bp,.mainscreen.portrait .ms-branch .bl{display:none}.mainscreen.portrait .ms-branch .bp{display:inline}
.ms-train>svg{position:absolute;inset:0;width:100%;height:100%}
.ms-train>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.ms-branch{pointer-events:none}
.ms-branch .br{fill:none;stroke:#e8c983;stroke-width:5;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;filter:drop-shadow(0 0 6px rgba(232,201,131,.8))}
.ms-branch .tw{fill:none;stroke:#e8c983;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90}
.ms-branch .leaf{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0)}
.ms-train.open .br{animation:grow .9s cubic-bezier(.3,.7,.3,1) forwards}
.ms-train.open .tw{animation:grow .6s .45s ease-out forwards}
.ms-train.open .leaf{animation:leaf .5s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes leaf{to{opacity:.95;transform:scale(1)}}
.ms-opt{position:absolute;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;padding:10px 20px 9px;border-radius:999px;border:1px solid var(--gold);cursor:pointer;
 background:radial-gradient(ellipse at 50% 30%,rgba(255,250,235,.96),rgba(236,228,250,.9));color:#2f2747;font-family:var(--f-display);font-weight:600;letter-spacing:.24em;font-size:clamp(13px,1.5vw,17px);white-space:nowrap;box-shadow:0 0 24px rgba(232,201,131,.55)}
.ms-opt .s{display:block;font-weight:400;font-size:10px;letter-spacing:.12em;color:#7a6f92;margin-top:2px}
.ms-train.open .ms-opt{animation:bloom .5s .8s ease-out forwards;pointer-events:auto}
.ms-opt.off{background:rgba(60,58,90,.88);color:#a9add0;border-color:rgba(220,230,255,.3);box-shadow:none}
.ms-opt.off .s{color:#8d90b5}
@media (max-width:600px){.ms-opt{padding:7px 12px;letter-spacing:.12em;font-size:12px}.ms-opt .s{display:none}}
@media (max-height:500px){.ms-logo .logo{font-size:clamp(26px,9vh,56px)}.ms-opt{padding:6px 12px;letter-spacing:.12em;font-size:12px}.ms-opt .s{display:none}}
.cine .sub{text-wrap:balance}
@keyframes bloom{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ms-note{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh);z-index:5;width:max-content;max-width:min(42ch,calc(100% - 32px));min-height:1.6em;font-size:13px;letter-spacing:.14em;color:#d9d4ee;text-shadow:0 1px 8px rgba(0,0,0,.9);text-align:center;line-height:1.8}
.ms-cf{display:flex;gap:8px;justify-content:center;margin-top:8px}
.ms-cf button{padding:7px 14px;border:1px solid var(--gold);background:rgba(232,201,131,.15);border-radius:2px;cursor:pointer;letter-spacing:.1em}
/* duty panels */
.scan{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:center;margin-top:12px}
.scan-svg{width:100%;max-width:220px}
@media (max-width:600px){.scan{grid-template-columns:1fr}.scan-svg{max-height:34vh;margin:auto;display:block}}
.scan-svg.run .ring{animation:scanmove 2.4s ease-in-out}
@keyframes scanmove{50%{transform:translateY(240px)}}
.scan-svg.ok .ring ellipse{stroke:#9fe8c0}
.rune-res{display:flex;gap:14px;align-items:center;font-family:var(--f-display);line-height:1.8}
.rune-dot{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle,#f2fff6,#9fe8c0 50%,transparent 72%);box-shadow:0 0 22px #9fe8c0}
.card.got{border-color:var(--gold);box-shadow:inset 0 0 30px rgba(232,201,131,.18)}
.tablet{margin-top:14px;padding:12px;border:1px solid rgba(191,230,255,.45);border-radius:14px;background:linear-gradient(160deg,rgba(191,230,255,.16),rgba(154,140,255,.08));display:flex;flex-direction:column;gap:6px}
.tl{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 28px;gap:10px;align-items:center;text-align:left;padding:10px;border:0;border-bottom:1px solid rgba(220,230,255,.1);background:none;cursor:pointer;border-radius:6px}
.tl:hover{background:rgba(191,230,255,.08)}
.tl .k{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.tl .v{font-family:var(--f-display);line-height:1.6}
.tl .rn{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(220,230,255,.45)}
.tl.ok .rn{border-color:#9fe8c0;background:radial-gradient(circle,#f2fff6,#9fe8c0 60%);box-shadow:0 0 12px #9fe8c0}
@media (max-width:520px){.tl{grid-template-columns:minmax(0,1fr) 28px}.tl .k{grid-column:1/-1}}
.bd{color:var(--gold)!important;font-family:var(--f-display)}
.checks{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:center;font-family:var(--f-display);color:var(--mute)}
.checks li::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(220,230,255,.45);flex:none}
.checks li.ok{color:var(--ink)}.checks li.ok::before{background:#9fe8c0;border-color:#9fe8c0;box-shadow:0 0 10px #9fe8c0}
/* pearl memory-crystal panel (save / load) */
.ov.pearl{z-index:40}
.ov.pearl .panel{background:linear-gradient(160deg,rgba(253,250,244,.97),rgba(236,230,246,.95));color:#2f2747;border-color:rgba(200,168,94,.7);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 70px rgba(255,255,255,.7)}
.ov.pearl .panel::before{border-color:rgba(200,168,94,.35)}
.ov.pearl h2{color:#2f2747}.ov.pearl .eyebrow{color:#a07a2e}.ov.pearl p{color:#5a5170}
.ov.pearl .close{background:rgba(255,255,255,.7);color:#5a5170;border-color:rgba(200,168,94,.6)}
.ov.pearl .pmsg{color:#8a6420;font-family:var(--f-display)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.slot{display:flex;flex-direction:column;gap:4px;padding:8px 8px 10px;border-radius:10px;border:1px solid rgba(200,168,94,.4);background:linear-gradient(170deg,rgba(255,255,255,.75),rgba(230,224,244,.6));cursor:pointer;text-align:left;color:#2f2747;transition:transform .2s,box-shadow .2s}
.slot:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(120,100,170,.25)}
.slot .th{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:7px;overflow:hidden;background:linear-gradient(135deg,#d8d2ee,#f4efe4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 0 0 1px rgba(200,168,94,.35);display:grid;place-items:center}
.slot .th img,.sdet .th img{width:100%;height:100%;object-fit:cover;display:block}
.slot.new .th span{font-size:34px;color:#a07a2e}
.slot .nm{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;margin-top:4px}
.slot .mt{font-size:11px;color:#7a6f92;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:6px;left:6px;font-size:10px;letter-spacing:.14em;padding:2px 8px;border-radius:999px;background:rgba(255,250,235,.92);color:#8a6420;border:1px solid rgba(200,168,94,.6)}
.noth{font-size:12px;color:#8d85a6}
.ov.pearl .empty{grid-column:1/-1}
.sdet{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;margin-top:14px;align-items:start}
@media (max-width:700px){.sdet{grid-template-columns:1fr}}
.sdet .th{aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(200,168,94,.5),0 10px 30px rgba(120,100,170,.25);background:#ddd6ee;display:grid;place-items:center}
.sdet .nm{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.1em}
.sdet dl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 12px;margin:12px 0;font-size:13px}
.sdet dt{color:#8d85a6;letter-spacing:.08em}.sdet dd{margin:0;color:#2f2747}
.ov.pearl .rn{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8d85a6;letter-spacing:.08em}
.ov.pearl .rn input{font:inherit;font-size:15px;color:#2f2747;padding:7px 10px;border:1px solid rgba(200,168,94,.55);border-radius:6px;background:rgba(255,255,255,.8);min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pbtn{padding:8px 14px;border-radius:999px;border:1px solid rgba(200,168,94,.6);background:rgba(255,255,255,.7);color:#4a3f66;cursor:pointer;font-family:var(--f-display);letter-spacing:.1em;font-size:13px}
.pbtn.pri{background:linear-gradient(#fff6dc,#f1dfa6);color:#5a4210;border-color:#c8a85e}
.pbtn.warn{border-color:#d9928a;color:#9a3d33}
.pbtn:disabled{opacity:.5}
.plink{margin-top:14px;border:0;background:none;color:#8a6420;cursor:pointer;font-family:var(--f-display);letter-spacing:.1em;padding:4px 0}

/* ---------- interaction layer: whisper, small window, fades, door ---------- */
.hs.save:hover .mk,.hs.save:focus-visible .mk{transform:rotate(45deg) scale(1.12)}
.whisper{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);width:max-content;max-width:min(300px,72vw);padding:9px 13px;border-radius:10px;background:rgba(251,248,241,.96);color:#3a3150;font-family:var(--f-display);font-size:13px;line-height:1.75;letter-spacing:.04em;text-align:left;white-space:normal;border:1px solid rgba(232,201,131,.75);box-shadow:0 8px 26px rgba(0,0,0,.35);pointer-events:none;animation:wIn .28s ease-out;transition:opacity .4s}
.whisper.wl{left:0;transform:none}.whisper.wr{left:auto;right:0;transform:none}.whisper.wb{bottom:auto;top:calc(100% + 2px)}
.whisper.out{opacity:0}
.whisper.lock{background:rgba(22,24,48,.95);color:#dfe3ff;border-color:rgba(205,210,235,.5)}
@keyframes wIn{from{opacity:0}}
.ov .panel{animation:panelIn .34s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(12px) scale(.985)}}
.ov.closing{opacity:0;transition:opacity .26s ease;pointer-events:none}
.ov.small{background:rgba(4,5,14,.3);backdrop-filter:none;align-items:flex-end}
.ov.small .panel{width:min(500px,100%);padding:22px 24px;margin-bottom:2vh}
.ov.small .panel h2{font-size:clamp(18px,1.9vw,22px)}
#doorfx{position:fixed;inset:0;z-index:29;display:flex;pointer-events:none}
#doorfx.shut{pointer-events:auto}
#doorfx i{flex:1;position:relative;background:linear-gradient(90deg,#f7f3fb,#e2dbef 70%,#d3c9e6);transform:translateX(-102%);transition:transform .32s cubic-bezier(.65,0,.35,1)}
#doorfx i.r{background:linear-gradient(270deg,#f7f3fb,#e2dbef 70%,#d3c9e6);transform:translateX(102%)}
#doorfx i.l::after{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:linear-gradient(#c8a85e,#fff0c8,#c8a85e)}
#doorfx i::before{content:"";position:absolute;inset:8% 12%;border:1px solid rgba(200,168,94,.45);border-radius:40% 40% 4px 4px/14% 14% 4px 4px}
#doorfx.shut i{transform:none}
#doorfx b{position:absolute;left:50%;top:50%;width:min(26vmin,170px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.8);border-radius:50%;border:2px solid #c8a85e;box-shadow:0 0 40px rgba(232,201,131,.6),inset 0 0 30px rgba(232,201,131,.35);opacity:0;transition:opacity .2s,transform .32s}
#doorfx b::before{content:"";position:absolute;inset:18%;border:1.5px solid #c8a85e;border-radius:50%}
#doorfx b::after{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:1.5px;background:#c8a85e;transform:translateX(-50%)}
#doorfx.shut b{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pano-fail{position:absolute;inset:0;z-index:7;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;background:rgba(7,9,20,.88);font-family:var(--f-display);letter-spacing:.12em}
.mote.st-important .orb{box-shadow:0 0 0 2px rgba(255,226,160,.85),0 0 22px rgba(255,214,140,.8)}
.mote.idle-hop{animation:hop 3.8s ease-in-out infinite}
.mote.idle-drift{animation:drift2 8s ease-in-out infinite}
@keyframes hop{0%,62%,100%{transform:translate(-50%,-50%)}74%{transform:translate(-50%,calc(-50% - 16px))}84%{transform:translate(-50%,-50%)}90%{transform:translate(-50%,calc(-50% - 5px))}}
@keyframes drift2{0%,100%{transform:translate(-50%,-50%)}33%{transform:translate(calc(-50% + 12px),calc(-50% - 9px))}66%{transform:translate(calc(-50% - 9px),calc(-50% + 5px))}}
.mote:hover .orb,.mote:focus-visible .orb{filter:brightness(1.18)}
.mote:focus-visible{outline:none}.mote:focus-visible .orb{outline:2px solid var(--gold);outline-offset:4px}

/* ---------- scene micro-animations (inline SVG) ---------- */
#scene svg .spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
#scene svg .spin.r{animation-direction:reverse;animation-duration:38s}
#scene svg .spin.fast{animation-duration:8s}
@keyframes spin{to{transform:rotate(360deg)}}
#scene svg .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6.2s ease-in-out infinite}
#scene svg .sway.b{animation-duration:7.9s;animation-delay:-2.1s}
#scene svg .sway.c{animation-duration:9.3s;animation-delay:-4.4s}
#scene svg .sway.d{animation-duration:5.4s;animation-delay:-1.2s}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(2.2deg)}}
#scene svg .pulse{animation:pulse 4.8s ease-in-out infinite}
#scene svg .pulse.b{animation-duration:6.6s;animation-delay:-2s}
#scene svg .pulse.c{animation-duration:3.9s;animation-delay:-1s}
@keyframes pulse{50%{opacity:.42}}
#scene svg .bub{animation:bub 5.5s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(var(--t,-200px));opacity:0}}
#scene svg .rp{transform-box:fill-box;transform-origin:center;animation:rp 4.5s ease-out infinite}
@keyframes rp{from{transform:scale(.25);opacity:.9}to{transform:scale(1.1);opacity:0}}
#scene svg .float,#scene svg .drgfloat{animation:float 7s ease-in-out infinite}
#scene svg .drgfloat{animation-duration:6.2s}
@keyframes float{50%{transform:translateY(-12px)}}
#scene svg .flow{animation:flow 12s linear infinite}
@keyframes flow{to{stroke-dashoffset:-300}}
#scene svg .shine{animation:shine 7s ease-in-out infinite}
@keyframes shine{0%{stroke-dashoffset:1660}70%,100%{stroke-dashoffset:-300}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.8s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.gaze{animation:gaze 11s ease-in-out infinite}
@keyframes gaze{0%,35%,100%{transform:translate(0,0)}45%,70%{transform:translate(-3px,1px)}}
.dlg .who svg,.dlg .who img{animation:idle 6s ease-in-out infinite;transform-origin:50% 100%}
.dlg .who img,.split .portrait img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 30px rgba(170,190,255,.4))}
@keyframes idle{50%{transform:translateY(-4px) scale(1.01)}}

/* ---------- carriage panels (dark glass) ---------- */
.kv{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:6px 12px;margin:12px 0;font-size:13.5px;line-height:1.7}
.kv dt{color:var(--mute);letter-spacing:.08em}.kv dd{margin:0}
.panel h3{font-family:var(--f-display);font-size:18px;letter-spacing:.14em;margin:6px 0 0}
.seed-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:12px}
@media (max-width:700px){.seed-wrap{grid-template-columns:1fr}}
.seed-wrap .seedgrid{margin-top:0}
.seed.on{border-color:var(--gold);box-shadow:inset 0 0 20px rgba(232,201,131,.15)}
.seed.unk{cursor:default;opacity:.55}.seed.unk .dot{background:#1d1f3a;box-shadow:inset 0 0 0 1px rgba(220,230,255,.25)}
.seed-view{display:flex;flex-direction:column;align-items:center;text-align:left;padding:16px;border:1px solid rgba(220,230,255,.15);border-radius:6px;background:radial-gradient(circle at 50% 22%,rgba(154,140,255,.2),transparent 62%)}
.seed-view .kv,.seed-view p{align-self:stretch}
.seed3d{position:relative;width:150px;height:150px;perspective:600px}
.seed3d .core{position:absolute;left:50%;top:50%;width:62px;height:86px;margin:-43px -31px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:radial-gradient(circle at 34% 30%,#fff 0 8%,var(--c) 46%,#2a2448 120%);box-shadow:0 0 30px var(--c);transform-style:preserve-3d;animation:seedspin 7s linear infinite}
.seed3d .core::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;transform:rotateY(90deg);opacity:.85}
@keyframes seedspin{from{transform:rotateZ(-12deg) rotateY(0)}to{transform:rotateZ(-12deg) rotateY(360deg)}}
.seed3d .orbit{position:absolute;inset:6px;border:1px solid rgba(232,201,131,.6);border-radius:50%;animation:orbitspin 9s linear infinite}
@keyframes orbitspin{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
.seed3d .seal{position:absolute;inset:26px;border:2px dashed rgba(232,201,131,.9);border-radius:50%;animation:spin 16s linear infinite}
.pod-head{display:flex;gap:18px;align-items:center}
.pod-head h2{margin-bottom:2px}
.podviz{width:76px;flex:none}
.podviz .pv-sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.scopeviz{width:96px;flex:none}
.env{display:flex;gap:22px;align-items:center;margin-top:8px}
.envgem{width:64px;height:92px;flex:none;position:relative;margin:10px}
.envgem i{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(135deg,#fff,var(--c));filter:drop-shadow(0 0 12px var(--c));animation:envp 3.5s ease-in-out infinite}
.envgem::before{content:"";position:absolute;inset:-14px -22px;border-radius:50%;border:1px dashed rgba(232,201,131,.7);animation:spin 18s linear infinite}
@keyframes envp{50%{filter:drop-shadow(0 0 22px var(--c)) brightness(1.15)}}
.modes .btn{padding:8px 16px}
.mini-view{aspect-ratio:16/9;max-width:100%;border-radius:4px;overflow:hidden;margin-top:12px;border:1px solid rgba(220,230,255,.18)}
.mini-view svg{width:100%;height:100%;display:block}
.showcase{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:20px;align-items:center;margin-top:16px;padding:14px;border:1px solid rgba(232,201,131,.3);border-radius:6px;background:radial-gradient(circle at 20% 50%,rgba(232,201,131,.13),transparent 60%)}
@media (max-width:600px){.showcase{grid-template-columns:1fr}}
.gem3d{width:140px;height:140px;margin:auto;perspective:500px}
.gem3d svg{width:100%;height:100%;animation:gemspin 8s linear infinite}
.gem3d.leaf svg{animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes gemspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.starmap svg{width:100%;height:auto;display:block;max-height:56vh;border-radius:4px}
.starmap .st{cursor:pointer;outline:none}
.starmap .st.sel .ring,.starmap .st:focus-visible .ring{stroke:#e8c983}
.starmap .st.fog.sel circle:first-child,.starmap .st.fog:focus-visible circle:first-child{opacity:.6}
.sm-info{min-height:4.6em;margin-top:10px;padding:10px 14px;border-left:2px solid var(--gold);background:rgba(10,12,30,.45);line-height:1.8}
.sm-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px;letter-spacing:.06em}
.anoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.anom{border:1px solid rgba(220,230,255,.18);border-radius:6px;padding:14px;background:rgba(10,12,30,.5);display:flex;flex-direction:column;gap:6px}
.anom.new{border-color:var(--gold);box-shadow:inset 0 0 26px rgba(232,201,131,.16)}
.anom .ic{width:38px;height:38px}
.anom h4{margin:0;font-family:var(--f-display);letter-spacing:.1em}
.anom small{color:var(--mute)}
.anom p{margin:0;font-size:14px;line-height:1.8}
.anom.unk{opacity:.6}
.blur{filter:blur(4px);user-select:none}
.tagnew{font-size:10px;letter-spacing:.2em;color:#2f2747;background:var(--gold);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;margin:14px 0 4px;padding:14px;border:1px solid rgba(232,201,131,.3);border-radius:6px;background:rgba(10,12,30,.5)}
.route .nd{font-family:var(--f-display);letter-spacing:.12em;min-width:0}.route .nd small{display:block;color:var(--mute);font-size:11px;letter-spacing:.1em}
.route .ln{width:min(220px,26vw);height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 14px);position:relative}
.route .ln i{position:absolute;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#7fe6f0;box-shadow:0 0 10px #7fe6f0}
.disc{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:22px;align-items:center;margin-top:10px}
.disc svg{width:100%}
@media (max-width:640px){.disc{grid-template-columns:1fr}.disc svg{max-width:220px;margin:auto}}
.jlog{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.jlog section{border-left:1px solid rgba(232,201,131,.4);padding-left:18px;position:relative}
.jlog section::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.jlog h3{margin:0 0 4px;font-size:15px}
.jlog h3 small{font-size:12px;color:var(--mute);font-weight:400;letter-spacing:.08em}
.jlog li i{display:inline-block;font-style:normal;font-size:11px;letter-spacing:.1em;padding:0 7px;margin-right:8px;border-radius:999px;border:1px solid rgba(232,201,131,.5);color:var(--gold);vertical-align:1px}
.jlog li.lk-purify i{color:#d9c8ff;border-color:rgba(217,200,255,.5)}
.jlog li.lk-life i{color:#b9d7ff;border-color:rgba(185,215,255,.5)}.jlog li.lk-find i{color:#c9f2c4;border-color:rgba(201,242,196,.5)}.jlog li.lk-duty{color:var(--mute)}
.jlog h3 span{font-family:var(--f-latin);color:var(--gold);margin-right:10px;font-size:17px}
.jlog ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;color:#d6d9f2;line-height:1.75;font-size:14px}
.ov.mems .panel{background:linear-gradient(160deg,rgba(28,26,62,.96),rgba(10,10,28,.97))}
.shards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;margin-top:16px}
.shard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.shard:focus-visible .cr{outline:2px solid var(--gold)}
.shard .cr{display:block;width:100%;aspect-ratio:4/5;max-width:100%;position:relative;clip-path:polygon(50% 0,92% 16%,100% 60%,76% 100%,24% 100%,0 60%,8% 16%);background:linear-gradient(160deg,rgba(220,230,255,.35),rgba(154,140,255,.18));overflow:hidden}
.shard .cr>svg{position:absolute;inset:0;width:100%;height:100%}
.shard .cr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);transform:translateX(-120%);transition:transform .9s}
.shard:hover .cr::after,.shard:focus-visible .cr::after{transform:translateX(120%)}
.shard .t{font-family:var(--f-display);letter-spacing:.12em;font-size:14px}
.shard.lock{cursor:default}
.shard.lock .cr{background:linear-gradient(160deg,rgba(220,230,255,.13),rgba(154,140,255,.05))}
.shard.lock .cr::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px)}
.shard.lock .t{color:var(--mute);font-size:12px}
.portrait-wash{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 60%,rgba(154,140,255,.38),rgba(10,10,30,.92))}
.portrait-wash>svg,.portrait-wash>img{height:96%;width:auto;max-width:62%;object-fit:contain}
.memview{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;align-items:center;margin-top:12px;animation:memIn .7s ease-out}
@media (max-width:700px){.memview{grid-template-columns:1fr}}
@keyframes memIn{from{opacity:.4;filter:blur(6px) brightness(1.6);transform:scale(.95)}}
.memview .cr{position:relative;aspect-ratio:4/3;max-width:100%;clip-path:polygon(7% 0,93% 0,100% 13%,100% 87%,93% 100%,7% 100%,0 87%,0 13%);overflow:hidden;background:#14163a}
.memview .cr>svg{position:absolute;inset:0;width:100%;height:100%}
.memview .cr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 48%,transparent 60%);animation:sweep 2.4s .4s ease-out both}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.memview blockquote{margin:0;font-family:var(--f-display);font-size:clamp(15px,1.5vw,18px);line-height:2;letter-spacing:.06em;color:#eef0fb;border-left:2px solid var(--gold);padding-left:16px}
.plink.mb{color:var(--gold)}

/* ---------- 浮空典藏書：naturalist field-guide parchment ---------- */
.ov.book{z-index:34;background:radial-gradient(ellipse at 50% 42%,rgba(58,38,22,.88),rgba(10,7,4,.96));backdrop-filter:blur(3px);padding-top:calc(env(safe-area-inset-top,0px) + 66px)}
.tome{--paper:#efe3c5;--paper-2:#e2cfa5;--ink:#3a2817;--ink-2:#5f472c;--ink-3:#93744c;--hand:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
 position:relative;width:min(1200px,100%);height:min(780px,100%);display:flex;background:#2a1a0f;border-radius:8px;padding:12px;
 box-shadow:0 40px 100px rgba(0,0,0,.75),inset 0 0 0 2px #4b311f,inset 0 0 0 6px #22150b;animation:tomeIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes tomeIn{from{opacity:0;transform:translateY(22px) scale(.97)}}
.spread{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:3px;overflow:hidden;background:var(--paper)}

<script>
/* ================================================================

   換正式美術：替換 ART.scene 中的函式，或在 CARRIAGES[x].image / LOCATIONS[x].image 填入圖片路徑。
   ================================================================ */
const $ = s => document.querySelector(s);
const SAVE_KEY = 'riyue-save-v1';

/* ---------- 美術：SVG 場景與立繪（可替換成圖片） ---------- */
const ART = {};
ART.defs = `<defs>
 <radialGradient id="gGold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d8"/><stop offset=".5" stop-color="#f1d58e" stop-opacity=".5"/><stop offset="1" stop-color="#f1d58e" stop-opacity="0"/></radialGradient>
 <radialGradient id="gViolet" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e7e2ff"/><stop offset=".5" stop-color="#9a8cff" stop-opacity=".45"/><stop offset="1" stop-color="#6a5cff" stop-opacity="0"/></radialGradient>
 <radialGradient id="gCyan" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eaffff"/><stop offset=".5" stop-color="#7fe6f0" stop-opacity=".45"/><stop offset="1" stop-color="#7fe6f0" stop-opacity="0"/></radialGradient>
 <radialGradient id="gGreen" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f2ffe0"/><stop offset=".5" stop-color="#a6e39a" stop-opacity=".45"/><stop offset="1" stop-color="#7cc98a" stop-opacity="0"/></radialGradient>
 <linearGradient id="gStone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f4ef"/><stop offset="1" stop-color="#c9c6d6"/></linearGradient>
 <linearGradient id="gStoneD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9894b4"/><stop offset="1" stop-color="#e9e6f2"/></linearGradient>
 <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d6e6"/><stop offset="1" stop-color="#f6f3fb"/></linearGradient>
 <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dff4ff" stop-opacity=".35"/><stop offset=".3" stop-color="#ffffff" stop-opacity=".12"/><stop offset=".7" stop-color="#cfe9ff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".4"/></linearGradient>
 <linearGradient id="gSpace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f2e"/><stop offset=".6" stop-color="#25205a"/><stop offset="1" stop-color="#4a3a86"/></linearGradient>
 <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
 <linearGradient id="gDragonS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#d8dcff"/><stop offset="1" stop-color="#9a8cff" stop-opacity=".35"/></linearGradient>
 <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d5536"/><stop offset="1" stop-color="#c99c6c"/></linearGradient>
 <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>`;
function rnd(seed){ let s=seed; return ()=> (s=(s*9301+49297)%233280)/233280; }
function stars(n,seed,x0=0,y0=0,w=1600,h=900,col='#fff'){ const r=rnd(seed); let o=''; for(let i=0;i<n;i++){const x=x0+r()*w,y=y0+r()*h,s=r()*1.6+.3; o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.toFixed(2)}" fill="${col}" opacity="${(.4+r()*.6).toFixed(2)}"/>`;} return o; }

/* 地點外景（也用於觀測窗與圖鑑縮圖） */
ART.loc = {
 dawnForest(){ const r=rnd(7); let trees='';
  for(let i=0;i<14;i++){const x=r()*1600,w=40+r()*70,h=500+r()*300; trees+=`<rect x="${x}" y="${900-h}" width="${w}" height="${h}" fill="#3a4a3e" opacity="${.25+r()*.25}"/>`;}
  let rays=''; for(let i=0;i<7;i++){const x=600+i*90; rays+=`<polygon points="${x},0 ${x+40},0 ${x-180+i*30},900 ${x-260+i*30},900" fill="#fff4c8" opacity=".07"/>`;}
  let motes=''; for(let i=0;i<40;i++){motes+=`<circle cx="${r()*1600}" cy="${300+r()*560}" r="${2+r()*4}" fill="url(#gGreen)"/>`;}
  return `<rect width="1600" height="900" fill="#c9d8b8"/><rect width="1600" height="900" fill="url(#dawnSky)"/>
  <defs><linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe7c4"/><stop offset=".45" stop-color="#d7e3c0"/><stop offset="1" stop-color="#4e6a52"/></linearGradient></defs>
  <ellipse cx="800" cy="260" rx="420" ry="260" fill="url(#gGold)" opacity=".9"/>${rays}${trees}
  <path d="M640 900 C 690 700 660 560 700 420 C 640 380 520 330 470 250 C 560 290 640 320 720 360 C 700 260 640 160 650 60 C 700 160 760 260 790 340 C 820 230 900 140 990 90 C 930 200 860 290 850 370 C 940 320 1060 300 1150 240 C 1060 330 960 390 900 430 C 930 560 910 720 970 900 Z" fill="#2c3a30"/>
  <path d="M700 420 C 760 400 840 400 900 430" stroke="#e8c983" stroke-width="3" fill="none" opacity=".7"/>
  <circle cx="800" cy="560" r="34" fill="none" stroke="#f3dc9a" stroke-width="3" opacity=".85"/><circle cx="800" cy="560" r="20" fill="none" stroke="#f3dc9a" stroke-width="2" opacity=".85"/><path d="M800 526 V594 M766 560 H834" stroke="#f3dc9a" stroke-width="2" opacity=".8"/>
  <circle cx="800" cy="560" r="70" fill="url(#gGold)" opacity=".5"/>
  <ellipse cx="800" cy="900" rx="1100" ry="120" fill="#2f4532"/>${motes}
  <g opacity=".9">${[[260,820],[330,840],[1240,830],[1330,850],[1180,860]].map(([x,y])=>`<path d="M${x-22} ${y} Q${x} ${y-40} ${x+22} ${y} Z" fill="#e9f5d9" opacity=".75"/><rect x="${x-4}" y="${y}" width="8" height="18" fill="#e9f5d9" opacity=".6"/><circle cx="${x}" cy="${y-10}" r="20" fill="url(#gGreen)"/>`).join('')}</g>`; },
 starIslands(){ const r=rnd(21); let isl='';
  [[300,520,150],[820,420,230],[1320,560,140],[560,740,90],[1100,780,80]].forEach(([x,y,s],i)=>{
   isl+=`<g><ellipse cx="${x}" cy="${y}" rx="${s}" ry="${s*.22}" fill="#cfd3f5"/><path d="M${x-s} ${y} Q ${x} ${y+s*1.1} ${x+s} ${y} Z" fill="#5d5aa0"/><path d="M${x-s*.7} ${y+5} Q ${x} ${y+s*.8} ${x+s*.7} ${y+5}" fill="#3c3b7a"/>
   <polygon points="${x-s*.25},${y} ${x-s*.15},${y-s*.75} ${x-s*.05},${y}" fill="#bfe6ff" opacity=".9"/><polygon points="${x+s*.05},${y} ${x+s*.2},${y-s*.5} ${x+s*.32},${y}" fill="#d9c8ff" opacity=".85"/>
   <circle cx="${x-s*.15}" cy="${y-s*.5}" r="${s*.35}" fill="url(#gCyan)"/></g>`; });
  return `<rect width="1600" height="900" fill="url(#gSpace)"/>${stars(260,3)}
  <path d="M-100 700 C 300 520 600 520 900 380 S 1400 160 1750 120" stroke="#cdbcff" stroke-width="160" fill="none" opacity=".13" filter="url(#fSoft)"/>
  <path d="M-100 700 C 300 520 600 520 900 380 S 1400 160 1750 120" stroke="#fff" stroke-width="40" fill="none" opacity=".12" filter="url(#fSoft)"/>
  ${stars(160,9,0,0,1600,700,'#e9e2ff')}<circle cx="1260" cy="180" r="70" fill="#f0e6ff" opacity=".85"/><circle cx="1260" cy="180" r="170" fill="url(#gViolet)"/>${isl}`; },
 locked(seed,hue){ return `<rect width="1600" height="900" fill="#0b0c1c"/>${stars(120,seed)}<circle cx="800" cy="450" r="300" fill="hsl(${hue} 70% 60%)" opacity=".18" filter="url(#fSoft)"/><text x="800" y="480" text-anchor="middle" font-size="110" fill="#fff" opacity=".25" font-family="serif">？</text>`; }
};

function corridor(o={}){ const wall=o.wall||'url(#gStone)';
 return `<rect width="1600" height="900" fill="#e8e5f0"/>

 <polygon points="0,0 580,330 580,600 0,900" fill="${wall}"/><polygon points="1600,0 1020,330 1020,600 1600,900" fill="${wall}"/>

 ${[0,1,2,3,4,5].map(i=>{const t=i/6; return `<path d="M${580*t} ${330*t} Q 800 ${-120+400*t} ${1600-580*t} ${330*t}" stroke="#d6b66a" stroke-width="${4-i*.5}" fill="none" opacity=".75"/>`}).join('')}
 <ellipse cx="800" cy="760" rx="360" ry="70" fill="none" stroke="#c8a85e" stroke-width="3" opacity=".55"/><ellipse cx="800" cy="760" rx="250" ry="46" fill="none" stroke="#c8a85e" stroke-width="2" opacity=".45"/>
 <path d="M720 600 V 420 Q 800 340 880 420 V 600 Z" fill="${o.door||'#cfd8ff'}"/><path d="M738 600 V 425 Q 800 360 862 425 V 600" fill="none" stroke="#c8a85e" stroke-width="3"/>
 <path d="M720 600 V 420 Q 800 340 880 420 V 600" fill="url(#gViolet)" opacity=".7"/>`; }

ART.car = {
 observation(state){

  homeText:'高海拔溫帶山區・雲霧高山森林',
  intro:'被航道上的橫風帶進列車的羽貓獸。貓科般的軀幹、貓頭鷹般的頭部，背上一對虹彩羽翼在光下泛出淡淡的粉紫與銀光。',
  bio:'在晨光初現的高山幽谷中，雲霧猶如輕紗般纏繞著古老的巨木。羽貓獸輕巧地穿梭於峭壁邊緣，牠的爪子踩在帶有苔蘚的岩石上幾乎沒有發出一絲聲響。當第一道陽光穿透薄霧，灑在牠那雙泛著虹彩的羽翼上時，整隻生物彷彿與大自然融為一體。牠停下腳步，金黃色的眼眸轉向遠方的山嵐，耳翼微微顫動著，聆聽著風中的細語。對於山區的採藥人而言，偶爾在雲端瞥見羽貓獸的身影，往往被視為晴朗好天氣與旅途平安的象徵。',
  field:{alias:'雲端精靈、晨曦的巡林者、迎風貓頭鷹獸',cls:'半獸類／飛行獸類',danger:'低（除非領地遭受直接侵犯或幼獸受到威脅，否則牠們傾向於直接退避或快速飛離）',rarity:'稀有',
   looks:'羽貓獸擁有貓科動物般靈活而流線的軀幹，四肢覆蓋著細密柔軟的絨毛，末端為銳利的爪子，便於在岩壁與樹幹間攀爬。牠的頸部與前肢漸層過渡至帶有神祕紫調的深色，與背部及尾尖的白毛形成鮮明對比。頭部結合了貓科的輪廓與鳥類的靈巧特徵，長有一對金黃色的大眼睛與覆蓋著羽毛的耳翼。背部則長出一對構造精細、由虹彩羽毛組成的雙翼，能在飛行時折射出淡淡的粉紫與銀光。頸間自然環繞著一圈帶著小花與金屬飾品般的絨毛與斑紋，使其在野性中帶有一絲靈動與優雅。',
   habitat:'多數棲息於高海拔的溫帶山區、雲霧繚繞的高山森林，以及古老遺跡周邊的峭壁。牠們喜歡築巢於視野開闊、陽光充足的高聳崖壁縫隙或巨樹冠層。',
   habits:[['活動時間','日行性，活躍於清晨與黃昏的光影交替之際。'],['飲食','主要以高山上的小型靈巧獵物、花蜜及特定的高山漿果為主，屬於雜食偏肉食。'],['社會結構','多為獨居或以小家庭為單位活動，領域性中等。'],['性格','生性機警、好奇心強，對陌生氣息保持距離，但若長期處於安定環境中，會對特定人類或同行生物表現出溫和的親近感。']],
   abilities:[['御風滑翔','利用背部的羽翼與尾部的平衡，能在強風的山谷間進行長距離的無聲滑翔與高機動性轉向。'],['光影擬態','羽毛結構能在特定角度的陽光下折射出與周遭岩壁和霧氣相似的光澤，達到天然的視覺隱蔽效果。'],['敏銳感知','頭部耳翼的特殊羽毛結構對氣流與微弱聲音極度敏感，能提前預知山嵐的變化與潛在危險。']]},
  stay:2,
  talks:[
   {lines:['（牠停在懸浮棲息環的最高處，金黃色的眼睛一動也不動地看著你，耳翼微微轉向你的方向。）','我住在很高的山上。雲霧會繞著老樹，崖壁上有我的巢。','……這裡的風，是從哪裡吹來的？'],choices:[{t:'是列車航行時帶起的氣流。',r:'列車的風。沒有山的味道，但是很穩。……我可以在這裡停一下嗎？'},{t:'你是從哪裡飛進來的？',r:'我只是跟著一陣橫風滑翔。回過神來，就在這裡了。'}]},
   {lines:['（牠收起雙翼，羽毛在車廂的光下泛出淡淡的粉紫。）','我習慣在清晨和黃昏出來。光影交替的時候，最自在。','你們這裡的光，跟山上的晨光很像。斜斜的，很好藏起來。','……我是說，很好休息。'],choices:[{t:'你在躲什麼嗎？',r:'沒有。只是習慣了。在山上，太容易被看見的東西，常常會被盯上。'},{t:'這裡很安全。',r:'嗯。我的耳朵也這麼說。這裡的風裡，沒有危險的聲音。'}]},
