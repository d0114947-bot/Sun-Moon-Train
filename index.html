 leviathaurora:{name:'淵光巨',type:'other',species:'Leviathaurora',zone:'spring',spot:{x:41,y:70},spriteH:24,ar:'580/340',color:'radial-gradient(circle,#cfe8ff,#2c5a9e)',
  image:'assets/leviathaurora.webp',still:'assets/leviathaurora-still.webp',studies:['assets/leviathaurora-s1.webp','assets/leviathaurora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'深海海溝・海底峽谷・無光層水域',
  intro:'在航向星河浮島的途中，從靈泉深處浮現的淵光巨。墨藍色的修長身軀上，幽藍的螢光沿著肌肉與脊椎的紋理流動，宛如深海中的星圖。',
  bio:'在無光的海底世界裡，淵光巨是少數優雅而巨大的流浪者。牠們緩慢地穿梭於沉睡的海溝與海底山脈之間，每一次尾鰭的擺動都伴隨著點點藍光在黑暗中劃出優美的軌跡。當牠游過海底荒漠時，體表的幽光常吸引無數微小的深海生物聚攏，遠看就像是一座攜帶星海在深淵中漫步的移動島嶼。傳說水手如果在暴風雨的夜裡看見海面下透出幽藍的光暈，那便是淵光巨正浮上海面換氣的寧靜時刻。',
  field:{alias:'深淵的星河、夜航者的燈塔、蔚藍孤影',cls:'深海巨獸／遠古游魚類',danger:'低（性格溫和，除非遭受嚴重威脅，否則不具攻擊性）',rarity:'稀有',rarityNote:'棲息於極深的海域，人類難以窺其全貌。',
   looks:'<b>身體構造：</b>擁有修長而流線型的巨型身軀，體長可達數十公尺。頭部寬大扁平，下顎延伸出數根細長的觸鬚，宛如古老的編織漁網。<br><b>顏色與紋理：</b>深邃如深海夜空的墨藍色與碳黑色外皮，皮膚表面佈滿天然的有機骨質紋理。體側與背脊處生有巨大的背鰭與流線型胸鰭，邊緣呈半透明的深邃藍色。<br><b>發光機制：</b>牠的全身各處分佈著生物發光器官（Photophores），能沿著軀幹的肌肉紋理與脊椎線條透出幽藍色的螢光，宛如深海中的星圖與神經網絡。',
   habitat:'常年籠罩在永夜與極度高壓中的深海海溝、海底峽谷，或陽光無法觸及的無光層水域。',
   habits:[['活動時間','全天候活動，但在黑暗的深海中，牠們的螢光脈絡在獵食或求偶時會變得格外閃耀。'],['飲食','屬於濾食性巨獸，利用下顎的長鬚與巨大的口腔過濾深海中的浮游生物、微小甲殼類及有機微粒。'],['性格','性情溫和、孤傲且極具包容性，通常獨自游弋，對外界的騷擾多半選擇避開或緩慢潛入更深的海域。']],
   abilities:[['生物冷光共鳴','能透過體表螢光頻率的變化與同類進行長距離的深海通訊，甚至能微幅干擾周遭的水流與光線。'],['深海壓強適應','體內擁有特殊的骨骼與組織結構，能完美承受千米之下的恐怖水壓，並在高速游動時將阻力降到最低。']]},
  stay:2,
  talks:[
   {lines:['（靈泉的水面一圈一圈地暗下去，像是突然變得很深。一道幽藍的光，從水底慢慢浮了上來。）','……這裡的水，很淺。也很亮。','我來的地方沒有光，水重得像山一樣壓下來。','不過，很安靜。我喜歡安靜的地方。'],choices:[{t:'你是從深海來的嗎？',r:'深海……是很遠的地方。那裡沒有光，所以我們自己發光。'},{t:'這裡夠你休息嗎？',r:'夠了。我不需要很大的地方，只需要不被打擾。'}]},
   {lines:['（牠身上的光點沿著脊椎一路亮起，又一顆一顆熄滅，像在數著什麼。）','這是我們說話的方式。用光，而不是聲音。','在深淵裡，聲音傳得太遠，會驚動太多東西。光只會讓想看見的人看見。'],choices:[{t:'那你剛才說了什麼？',r:'我說：這列車的光，很像海面。'},{t:'我看見了。',r:'嗯。那就夠了。'}]},
   {lines:['水手們說，暴風雨的夜裡看見海面下的藍光，就是平靜的時刻。','我只是浮上來換一口氣而已。','……不過，如果那能讓他們安心，也很好。'],choices:[{t:'你一直都是獨自一個嗎？',r:'大多數時候。深海很大，同伴的光要很久才看得見一次。所以每一次看見，都會記得很久。'}]}
  ],
  farewell:['水的味道變了。','前面有很深、很暗的地方，我聽得見它在呼喚。','謝謝這片安靜的水。如果有一天，你在很深的地方看見一片會移動的星光，那就是我。']
 },
 /* 燼風帆獸：去背後的動態立繪。資料來自設定稿。 */
 cinder:{name:'燼風帆獸',type:'other',species:'Cinder-Sail Courser',zone:'crystal',spot:{x:71,y:52},spriteH:34,ar:'1268/697',color:'radial-gradient(circle,#fff1d6,#c79a5e)',
  image:'assets/cinder.webp',still:'assets/cinder-still.webp',studies:['assets/cinder-s1.webp','assets/cinder-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'烈日沙漠（The Blazing Sands）',
  intro:'在列車駛向日界時，乘著熾熱光線登車的燼風帆獸。修長纖細的沙褐色身軀，背上兩片半透明的帆在光下透出琥珀色。',
  bio:'在烈日沙漠的邊緣，商隊正頂著熱浪緩慢前行。突然間，領隊的嚮導停下腳步，指向遠處的沙丘。一隻燼風帆獸正以一種不可思議的姿態出現。牠的四肢幾乎懸空，輕盈地在沙脊上滑行。陽光透過牠的背帆，呈現出琥珀色的光澤。牠似乎察覺到了商隊，轉過頭，那雙巨大的眼睛好奇地看著他們，隨即一個華麗的轉身，尾舵一擺，便消失在熱浪之中。<br>年輕的學徒驚訝地問道：「那是龍嗎？」<br>嚮導笑著搖頭：「不，孩子，那是沙漠的靈魂。牠們不需要火焰，因為牠們本身就擁有了太陽的力量。」',
  field:{nameNote:'這個名稱結合了其棲息地的熾熱意象（燼）、背部如船帆般的特徵（風帆），以及牠優雅且善於奔跑的形態（獸）。',
   alias:'日行舟（Sun-Sailer）：商旅對牠們的稱呼，因為牠們常在烈日下與商隊並行。<br>沙漠舞者（Desert Dancer）：當地遊牧民族對牠們輕盈步伐的讚譽。<br>偽龍（False-Drake）：因其外型與龍相似，但缺乏噴火能力而被賦予的貶稱。',
   cls:'荒漠亞龍類（Desert Archosaurian）<br>屬於一種古老的爬行類亞種，與真正的龍類有遠親關係，但在漫長的演化中適應了乾旱環境，演化出獨特的帆狀構造。',
   danger:'低（Low）',dangerNote:'除非你試圖捕捉一隻健康的成年燼風帆獸（這幾乎是不可能的），否則牠們對人類不構成威脅。牠們的防禦機制主要是逃跑。',
   rarity:'少見（Uncommon）',rarityNote:'雖然牠們適應了嚴酷的環境，但因為天敵較少且繁殖率不高，加上特殊的棲息地，人們並不容易見到牠們。只有經驗豐富的嚮導和遊牧民才知道在哪裡能找到這些優雅的沙漠舞者。',
   looks:'燼風帆獸擁有極為纖細而強韌的四肢，這使牠們在沙地上能進行高速且省力的奔跑。牠們的體態修長，覆蓋著細密、沙褐色的鱗片，鱗片紋理細緻，能完美融入乾旱地貌。<br>最顯眼的特徵是背部中央長出的兩片巨大的、半透明的肉膜狀帆。這些帆由纖細的骨質支架支撐，形狀如風帆般高聳。在圖片中，我們可以看到牠們的頸部、背部直到尾部都有一排棘刺，為背帆提供了額外的穩定性。牠們的頭部呈三角形，有一雙如黑曜石般巨大、深邃的眼睛，顯示其優秀的視覺能力。<br>牠們的尾巴末端有一個如船舵般的尾鰭，能在高速奔跑時幫助平衡和轉向。這種構造，加上背帆，讓牠們在沙漠中的移動方式更像是「航行」而非單純的奔跑。',
   habitat:'<b>烈日沙漠（The Blazing Sands）</b><br>主要棲息於廣闊無垠、終年烈日當空的沙漠深處，特別是那些有巨大岩層和沙丘交錯的區域。牠們的鱗片顏色能隨環境微妙變化，從淺金黃到深赭色，提供絕佳的保護色。',
   habits:[['活動時間','晝行性（Diurnal）。這在沙漠生物中相當罕見。牠們依賴白天的陽光來活化背帆的特殊功能。'],['飲食','食蟲與掘根（Insectivorous and Root-foraging）。牠們利用靈敏的視覺和嗅覺在沙下尋找昆蟲、幼蟲，以及富含水分的塊根植物。牠們的嘴部構造適合啄食。'],['群居或獨居','半群居（Semi-social）。雖然大部分時間單獨行動，但在繁殖季節或遷徙時，會形成小型的家族群落（約 3–5 隻）。'],['攻擊性與性格','溫和而警覺（Gentle and Alert）。牠們天性膽小，面對威脅通常選擇逃跑而非戰鬥。牠們的奔跑速度極快，能輕易甩開大多數捕食者。除非被逼入絕境，否則不會展現攻擊性。']],
   abilities:[['太陽能航行（Solar-Sailing）','這是燼風帆獸最核心的能力。牠們背部的巨大皮帆富含感光細胞與微血管網。在烈日下，這些帆會吸收大量的太陽能，轉化為微弱的生物電能。這種能量不直接用於攻擊，而是用以刺激肌肉，減少長距離奔跑時的能量消耗，並保持體溫。這讓牠們能以驚人的速度持續奔跑數小時而不顯疲憊。這也是為什麼牠們只在白天活動。'],['擬態帆（Mimicry-Sail）','在休息或遇到危險時，牠們能透過肌肉控制收起背帆，或將其張開。張開時，帆的紋理和陰影能模擬出遠處岩石的形狀，讓牠們在靜止時看起來像是一塊被風化的岩石，從而騙過捕食者。']]},
  stay:2,
  talks:[
   {lines:['（牠一出現就退到晶石平台的邊緣，背上的兩片帆半收半張，黑曜石般的大眼睛盯著你。）','……你不是商隊。','我從烈日沙漠來。那裡的沙丘和岩層，一望無際，只有商隊會經過。','商隊會帶著水的味道。你身上，只有光的味道。'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈……沒聽過。不過，你沒有追過來。這樣就好。'},{t:'放心，這裡沒有人會抓你。',r:'每個人都這麼說。……不過你站得很遠。我相信站得遠的人。'}]},
   {lines:['（牠把背帆完全張開，對著晶石平台的光，帆面透出琥珀色。）','這裡的光不是太陽，可是很暖。','我的帆會把陽光存起來，讓腳不會累。','在沙漠裡，太陽下山以後我就不能跑了。在這裡，好像可以一直醒著。'],choices:[{t:'你喜歡奔跑嗎？',r:'不是喜歡或不喜歡。帆張開，風來了，腳就自己動了。就像你們的列車一樣。'},{t:'那你要好好休息。',r:'嗯。……我會把帆收一半。這是我們休息的樣子。'}]},
   {lines:['有人叫我們「偽龍」。因為我們長得像龍，卻不會噴火。','我不在意。火會燒掉東西，太陽不會。','嚮導說，我們是沙漠的靈魂。我比較喜歡這個名字。'],choices:[{t:'我也比較喜歡那個名字。',r:'（牠的尾舵輕輕擺了一下，像是在沙脊上轉了一個漂亮的彎。）'}]}
  ],
  farewell:['光的顏色變了。','前面有很亮、很熱的地方。我的帆在發燙。','我要下車了。如果你在熱浪裡看見一道琥珀色的帆影，不用叫住我。我跑得很快，但我會記得你。']
 },
 /* 艾莉絲（暮光耳廓鴞）：去背後的動態立繪。資料來自設定稿。 */
 aelis:{name:'艾莉絲',type:'other',species:'暮光耳廓鴞（Vespertine Fennec-Owl）',zone:'moss',spot:{x:16,y:79},spriteH:24,ar:'410/280',color:'radial-gradient(circle,#fff0dc,#d27a3c)',
  image:'assets/aelis.webp',still:'assets/aelis-still.webp',studies:['assets/aelis-s1.webp','assets/aelis-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'古老森林與沙漠交界的綠洲・乾旱岩石峽谷',
  intro:'在暮色中跳上列車的暮光耳廓鴞，名叫艾莉絲。一對巨大的狐狸耳朵、琥珀色的大眼睛，脖子上掛著刻有藤蔓與星辰圖案的葉形吊墜。',
  bio:'在古老沙漠的邊緣，流傳著關於「耳語者」的傳說。每當夜幕降臨，乾燥的風開始歌唱，這些精靈便會現身。據說，如果一個迷途的旅人在沙漠中遇見一隻佩戴著葉形吊墜的暮光耳廓鴞，並得到牠的指引，便能找到隱藏的綠洲或躲過致命的流沙。當地遊牧民族視牠們為沙漠的守護神，相信牠們是古老森林意志的延伸，在荒蕪中傳遞著生命的訊息。這隻名為「艾莉絲（Aelis）」的個體，因其特殊的吊墜，被認為是一位強大德魯伊的夥伴，甚至是信使。牠的身影總是在夕陽的最後一抹餘暉中出現，靈動地跳躍在沙丘與岩石之間，琥珀色的眼睛凝視著遠方，彷彿在傾聽大地的呼吸。',
  field:{alias:'沙狐貓頭鷹、耳語者、沙漠精靈',cls:'魔法混種／森林獸類（沙漠適應型）',
   danger:'低（Low）',dangerNote:'除非被逼入絕境，否則不會主動攻擊人類。',
   rarity:'稀有（Rare）',rarityNote:'僅在特定的沙漠與森林交界帶出現，且由於其謹慎的性格與夜行習性，極難被人類觀察到。佩戴吊墜的個體更是傳說中的存在。',
   looks:'<b>身體構造：</b>這種生物完美融合了貓頭鷹與耳廓狐的特徵。牠擁有圓潤、毛茸茸的貓頭鷹軀幹，覆蓋著柔軟、濃密的橙褐色絨毛，具有極佳的保溫與偽裝效果。牠的頭部比例較大，生有一對不成比例的巨大、靈活的狐狸狀耳朵，內側為淺奶油色，邊緣帶有深色毛尖。<br><b>臉部：</b>臉盤圓潤，有著巨大的、琥珀色的大眼睛，顯示其夜行性特徵。喙小而尖銳，隱藏在絨毛中。胸前的羽毛上帶有深褐色的斑點，類似樹皮紋理。<br><b>四肢與尾巴：</b>四肢強健，末端有著靈巧且銳利的爪子，覆蓋著深色毛髮。尾巴極為蓬鬆粗大，如同狐狸尾巴，末端有一撮明顯的白色絨毛，在平衡身體和夜間禦寒時起重要作用。<br><b>特殊飾物：</b>令人驚訝的是，這隻特定的「暮光耳廓鴞」脖子上佩戴著一條精緻的金屬細鏈，中央懸掛著一個刻有複雜藤蔓與星辰圖案的葉狀吊墜。這並非天生，而是象徵著牠與某個古老森林守護者種族的契約或共生關係。',
   habitat:'主要棲息於古老森林邊緣與廣闊沙漠交界處的綠洲地帶，或是乾旱岩石峽谷中的隱秘洞穴。牠們偏好日夜溫差極大、植被稀疏但水源充足的環境，這能同時發揮牠們的沙漠生存能力與夜間狩獵優勢。',
   habits:[['活動時間','嚴格的夜行性動物，黃昏與黎明時分最為活躍。'],['飲食','主要捕食在夜間活動的昆蟲、小型爬蟲類（如沙蜥）、小型夜行性齧齒動物以及果實。'],['群居或獨居','傾向於獨居或以極小的家庭單位（配偶與幼崽）行動。牠們的領域意識強烈，會利用尖銳的叫聲和氣味標記領地。'],['攻擊性及性格','牠們本質上是謹慎而好奇的。對陌生人通常保持距離，但若感到威脅，會發出如同狐狸尖叫與貓頭鷹鳴叫混合的刺耳聲響，並利用驚人的速度與敏捷性逃脫。牠們極為聰明，能輕易解決簡單的謎題或機關，表現出接近高等智慧生物的行為模式。']],
   abilities:[['聲納放大器','那對巨大的狐耳不僅能捕捉微小的聲音，還能透過細微的肌肉調整角度，形成類似生物聲納的系統，精確定位獵物在沙層下或岩石縫隙中的位置。'],['靜音飛行','保留了貓頭鷹羽毛的特殊結構，飛行時幾乎沒有聲音，能進行無聲的突襲。'],['視覺適應','琥珀色的大眼睛能在極低的光線下視物，並能短暫過濾強光，適應沙漠的刺眼陽光與星空。'],['自然共鳴（象徵）','佩戴吊墜的個體似乎能與周圍的自然能量產生微弱共鳴，這可能賦予了牠們預知沙塵暴或探測魔法能量的潛在能力，使牠們在惡劣環境中總能找到安全棲息地。']]},
  stay:2,
  talks:[
   {lines:['（一隻橙褐色的小生物停在自然棲台的邊緣，巨大的耳朵一轉，對準了你。）','……你的腳步聲很輕。','比旅人輕，比沙蜥重。你是誰？'],choices:[{t:'我是這列車的值勤精靈。',r:'精靈。……森林的老人們說過，精靈的腳步是聽不見的。看來他們也會說錯。'},{t:'你的耳朵真大。',r:'大耳朵聽得見沙子底下的心跳。也聽得見你剛才偷偷笑了一下。'}]},
   {lines:['白天我都在睡覺。等太陽落下，才出來找蟲子和沙蜥吃。','（牠用前爪輕輕撥了撥脖子上的葉形吊墜，藤蔓與星辰的紋路閃了一下。）','這是約定的記號，不是裝飾。','我答應過一位很老的朋友，要替他看看沙漠以外的世界，再回去告訴他。'],choices:[{t:'是什麼樣的朋友？',r:'他住在森林最深的地方，說話很慢，一句話要說一整個季節。……我只能說到這裡。'},{t:'那你要看得很仔細。',r:'我一直都看得很仔細。這是我的工作。'}]},
   {lines:['我叫艾莉絲。','我住在森林和沙漠交界的綠洲旁邊。晚上很冷，白天很燙。','沙漠的人叫我們「耳語者」。他們迷路的時候，會跟著我們找到綠洲。','如果有一天你迷路了……不對，你有一整列會自己走的車。你大概不會迷路。'],choices:[{t:'說不定還是會需要你。',r:'（牠尾巴尖那撮白毛輕輕搖了一下。）那我就在暮色裡等你。'}]}
  ],
  farewell:['暮色要來了。我聽得見風開始唱歌。','前面有森林的味道，也有沙的味道。那是我的地方。','我會把這列車的事告訴我的朋友。他會花一整個季節，慢慢聽完。']
 },
 /* 燼角巨獸：去背後的動態立繪。資料來自設定稿。 */
 pyro:{name:'燼角巨獸',type:'other',species:'Pyro-Cerasaurus',zone:'crystal',spot:{x:78,y:84},spriteH:28,ar:'498/280',color:'radial-gradient(circle,#ffd7a8,#7a2a14)',
  image:'assets/pyro.webp',still:'assets/pyro-still.webp',studies:['assets/pyro-s1.webp','assets/pyro-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'活火山帶・地殼裂隙頻繁的荒漠高原・熔岩峽谷',
  intro:'在赤紅天空下登車的燼角巨獸。漆黑的火山岩外皮佈滿裂縫，熔岩光在裂隙間流動；頭上的巨角像燃燒的木炭，仍散發著高溫。',
  bio:'在烈日與火山灰交織的荒原深處，燼角巨獸是當之無愧的霸主。當地人常說，當遠方的大地開始震動、天空被染成赤紅時，便是這位熔岩暴君在巡視牠的疆域。牠沉重的腳步每踏出一步，都會在地表留下冒煙的焦痕。獵人們對牠敬而遠之，因為任何貪婪的靠近，都將伴隨著被灰燼吞噬的命運。',
  field:{alias:'熔岩暴君、大地之傷',cls:'遠古巨獸／元素類巨獸',danger:'極高',rarity:'稀有',
   looks:'擁有如火山岩般堅硬、漆黑且佈滿裂縫的厚重外皮，裂隙間常年流淌著熾熱的熔岩光輝。<br>頭部前端長有一支巨大的角，其質地如同正在燃燒的木炭，頂端散發出猛烈的高溫與微光。<br>背部與尾巴覆蓋著一排銳利的鋸齒狀骨甲，兩側則生有巨大的蝙蝠狀皮革雙翼，翼膜邊緣殘破且帶有燃燒的痕跡。<br>雙眼呈赤紅色，猶如燃燒的火球，散發出威嚴而暴戾的氣息。',
   habitat:'活躍於活火山帶、地殼裂隙頻繁的荒漠高原，以及被熔岩流覆蓋的乾涸峽谷。',
   habits:[['活動時間','日夜皆可活動，但在地表溫度較高的午後顯得特別活躍。'],['飲食','肉食性，主要獵食大型地下岩棲生物，同時亦會吞食富含礦物質的高溫熔岩與金屬礦石以補充能量。'],['性格','極度孤僻且具強烈的領地意識，脾氣暴躁，對於闖入其領地的生物會毫不留情地發動毀滅性攻擊。']],
   abilities:[['熔岩核心','能夠將體內的熱能高度集中於頭部的巨角與背部裂隙中，進行蓄力衝撞或釋放高溫熱浪。'],['重甲護體','堅硬的岩質皮膚能免疫大部分物理攻擊與烈焰灼燒。']]},
  stay:2,
  talks:[
   {lines:['（棲息車廂的溫度一下子升高了。晶石平台前，一頭漆黑的巨獸低伏著，裂隙間的熔岩光一明一暗。）','……退後。','這不是你的地盤，也不是我的。在弄清楚之前，不要靠近。'],choices:[{t:'（停在原地）我不會靠近。',r:'……嗯。至少你聽得懂。'},{t:'這裡是列車，不屬於任何人。',r:'不屬於任何人的地方……我沒待過那種地方。'}]},
   {lines:['（牠的巨角頂端還在發燙，但背上的熔岩光暗了一些。）','我身體裡有熔岩。熱可以集中在角上，撞開任何擋路的東西。','這輛車在搖。很穩地搖。','在火山那裡，大地搖起來的時候，是在發怒。這裡不是。'],choices:[{t:'你可以在這裡休息。',r:'休息。……我很久沒有用過這個詞。'},{t:'晶石平台的光，夠你補充能量嗎？',r:'不夠熱。不過……不難受。'}]},
   {lines:['人們叫我「大地之傷」。','他們說我走過的地方，都會留下焦痕。那是真的。','但這輛車的地板，一道痕跡也沒有。……我走得很小心。'],choices:[{t:'謝謝你這麼小心。',r:'（牠哼出一口帶著火星的熱氣，轉過頭去，像是不想讓你看見牠的表情。）'}]}
  ],
  farewell:['地底的聲音在叫我。很熱，很深。','那裡才是我的地盤。','……這輛車，我記住了。如果哪天大地為你們震動，那不是我在發怒。']
 },
 /* 翡翠晶甲夜行獸：去背後的動態立繪。資料來自設定稿。 */
 vandora:{name:'翡翠晶甲夜行獸',type:'other',species:'Vandora Prism-Anuran',zone:'moss',spot:{x:24,y:61},spriteH:20,ar:'479/280',color:'radial-gradient(circle,#d8ffe9,#1f6a5a)',
  image:'assets/vandora.webp',still:'assets/vandora-still.webp',studies:['assets/vandora-s1.webp','assets/vandora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'熱帶雨林深處・巨型蕨葉之上・幽暗溪流沼澤邊',
  intro:'在夜色裡無聲登車的翡翠晶甲夜行獸。墨藍與深綠的鱗甲泛著寶石般的虹彩，頭側細長的翠綠觸鬚輕輕顫動，金黃色的雙眼在暗處一眨也不眨。',
  bio:'在雨林巨大的姑婆芋葉上，翡翠晶甲夜行獸正低伏著身體，嘴邊細長的觸鬚在微風中輕輕顫動。牠那寶石般閃耀的身軀與周圍的濃密綠意融為一體，是雨林中令人驚艷又敬畏的隱形獵手。',
  field:{alias:'雨林翡翠、苔原幻影',cls:'兩棲獸類／森林變異爬行種',danger:'中',rarity:'少見',
   looks:'外型介於巨貓與神話兩棲類之間，皮膚覆蓋著具有金屬光澤的墨藍與深綠色鱗甲，在光線下會折射出如寶石般的虹彩。頭部兩側長有如空氣鳳梨般細長的翠綠色觸鬚，雙眼呈銳利的金黃色。',
   habitat:'常年潮濕的熱帶雨林深處、巨型蕨類植物的葉片上或幽暗的溪流沼澤邊。',
   habits:[['活動時間','夜行性。'],['性格','性格敏捷、狡黠且具有強烈的領域性。'],['飲食與狩獵','以雨林中的昆蟲、小型爬蟲及樹液為食，擅長利用環境色進行無聲的伏擊。']],
   abilities:[['虹彩折射與觸鬚感應','體表鱗片能隨意折射光線達到光學迷彩的效果；頭部的翠綠觸鬚能極其靈敏地捕捉空氣中微小的濕度與震動變化。']]},
  stay:2,
  talks:[
   {lines:['（自然棲台的苔葉間，有一塊綠色忽然「動」了一下。仔細看，才發現那是一頭低伏的生物，鱗甲的顏色和葉子一模一樣。）','……你看見我了。','很少有東西能先看見我。通常是我先看見它們。'],choices:[{t:'是你的眼睛出賣了你。',r:'（金黃色的眼睛瞇了起來。）……下次我會閉上一隻。'},{t:'我只是剛好往這裡看。',r:'剛好。雨林裡沒有剛好。不過……這裡不是雨林。'}]},
   {lines:['（牠頭側的翠綠觸鬚慢慢舒展開，在空氣裡輕輕擺動，像在聞什麼。）','這裡的空氣太乾了。不過，有水的味道，從那邊的泉水飄過來。','還有震動。很規律、很穩的震動。這輛車一直在跑。'],choices:[{t:'你的觸鬚感覺得到這麼多？',r:'濕度、風、腳步。你走過來的時候，我在你說話之前就知道了。'},{t:'要我把車廂調得濕一點嗎？',r:'……不用。我會待在葉子底下。這樣就夠了。'}]},
   {lines:['（牠的鱗甲在車廂的燈光下泛起一層虹彩，一閃，又和苔綠融在一起。）','雨林的人叫我「苔原幻影」。他們說，看見我的時候，通常已經太晚了。','……我不會在這裡打獵。這裡不是我的領地。我分得清楚。'],choices:[{t:'謝謝你這麼說。',r:'不用謝。我只是不喜歡在別人的地盤上弄髒爪子。（牠的觸鬚輕輕抖了一下，像是在笑。）'}]}
  ],
  farewell:['空氣變濕了。我聞得到樹液和泥土的味道。','天快要黑了。那是我醒來的時間。','我要回葉子上去了。如果哪天你在雨林裡覺得有一片綠色在看你，不用找。那是我在跟你打招呼。']
 },
 /* 霜脊冰原獸：去背後的動態立繪。資料來自設定稿。 */
 frost:{name:'霜脊冰原獸',type:'other',species:'Frost-Ridge Ice-Beast',zone:'crystal',spot:{x:50,y:88},spriteH:22,ar:'570/300',color:'radial-gradient(circle,#f4fbff,#7fb4d8)',
  image:'assets/frost.webp',still:'assets/frost-still.webp',studies:['assets/frost-s1.webp','assets/frost-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'高海拔冰原・極圈冰川裂谷・極寒山脈',
  intro:'在駛向月界的寒氣裡登車的霜脊冰原獸。乳白色的厚重絨毛間，脊背與尾巴上的冰晶硬甲泛著微藍的光暈；一雙冰川般湛藍的眼睛，安靜地打量著車廂。',
  bio:'在極北之境的「萬古冰原」深處，霜脊冰原獸被當地原住民視為冰川之神的守望者。當暴風雪呼嘯而過、天地一片蒼茫之時，獵人往往只能看見一雙在風雪中幽藍髮光的雙眼，以及背脊上如冰刺般掠過的寒芒。牠們輕巧而寂靜地穿梭在數米深的厚雪之上，彷彿與周遭的冰山雪景融為一體，是這片白色禁區中無可動搖的頂級掠食者。',
  field:{alias:'冰原的白色追獵者、凝光雪獅、永凍之魂',cls:'極地巨型獸類／元素獸屬',
   danger:'高',dangerNote:'具備強大的物理破壞力與極度致命的嚴寒氣場',
   rarity:'稀有',rarityNote:'僅在極深處的無人冰原偶爾可見，極難被馴服或捕捉',
   looks:'體格龐大而結實，身形介於大型貓科動物與巨熊之間，覆蓋著一層厚重的乳白色稠密絨毛。其脊椎骨兩側、尾巴以及前肢局部，生長著半透明的冰晶狀硬甲與倒刺，這些冰晶在寒光下會折射出微藍的光暈。牠的頭部具有貓科動物般的輪廓，耳尖帶有銳利的黑色簇毛，雙眼呈現出如深谷冰川般的明亮湛藍色，面部與四肢的細密絨毛間也隱約鑲嵌著天然的晶體結構。',
   habitat:'常年被風雪覆蓋的高海拔冰原、極圈冰川裂谷，以及人跡罕至的極寒山脈。牠們多數時間棲息於避風的冰洞或岩縫中。',
   habits:[['活動時間','日夜皆宜，但在漫長而昏暗的極夜與暴風雪天氣中表現得最為活躍。'],['飲食','肉食性，主要捕獵冰原上的耐寒大型草食獸或冰角鹿。'],['社會結構','多數時間過著獨居生活，僅在嚴冬的繁殖季節短暫聚集。'],['性格與攻擊性','性格沉穩、警惕且極具領地意識。雖然不會無故主動攻擊過路旅人，但若被侵擾或感受到威脅，會展現出極具壓迫性的強大戰意。']],
   abilities:[['冰晶折射與偽裝','能夠將周遭的寒氣凝聚在體表的冰晶上，在暴風雪中形成完美的視覺折射，達到近似隱形的偽裝效果。'],['極寒爪擊','利爪與足底覆蓋著極低溫的寒霜，每一次踏地或揮擊都能瞬間凍結接觸面的水分或獵物的表皮。']]},
  stay:2,
  talks:[
   {lines:['（靈泉邊的空氣忽然冷了下來，水面結出一圈薄薄的霜。一頭乳白色的巨獸站在那裡，背脊上的冰晶泛著微藍的光。）','……你走路的聲音，我在車廂另一頭就聽見了。','不必緊張。我只是在確認，這裡誰是先來的。'],choices:[{t:'我是這列車的值勤精靈。',r:'值勤。……那這裡是你的領地。我會記住界線在哪裡。'},{t:'這裡沒有誰的領地。',r:'冰原上，每一片雪都有主人。沒有主人的地方……我需要一點時間習慣。'}]},
   {lines:['（牠低頭聞了聞靈泉的水，水面立刻凝起細小的冰花，又慢慢化開。）','這裡太暖了。不過，不討厭。','在萬古冰原，連呼吸都會結冰。所以我們很少開口。'],choices:[{t:'那你現在願意說話，我很高興。',r:'……嗯。這裡的空氣不會把話凍住。'},{t:'會不會太熱？',r:'我的爪子底下有霜。站久了，地板會涼一點。……抱歉，這是習慣。'}]},
   {lines:['獵人說，在暴風雪裡只看得見我們的眼睛。','那是因為我們不想被看見。在白色裡，消失是最安全的事。','可是在這輛車上，我好像不必躲。'],choices:[{t:'在這裡，你可以被看見。',r:'（牠背上的冰晶輕輕亮了一下，像是寒夜裡一盞很小的燈。）……那我就站在這裡。'}]}
  ],
  farewell:['風裡有雪的味道了。很遠，但是我認得。','冰原在叫我回去。那裡很冷，很安靜。','如果有一天你在風雪裡看見一雙藍色的眼睛，不用怕。那是我在替你看路。']
 },
 /* 霧羽海葵龍：單張立繪（透明背景），以影像變形做成觸鬚擺動與核心光點呼吸的循環動畫。資料來自設定稿。 */
 sirenora:{name:'霧羽海葵龍',type:'mind',species:'Sirenora',zone:'veil',spot:{x:71,y:21},spriteH:19,ar:'883/328',color:'radial-gradient(circle,#fff6fb,#b9a6d6)',
  image:'assets/sirenora.webp',still:'assets/sirenora-still.webp',studies:['assets/sirenora-s1.webp','assets/sirenora-s2.webp'],land:true,sprite:true,art:()=>ART.portrait.unknown(),
  homeText:'濃霧籠罩的無風峽灣・發光苔蘚的地下暗河・迷霧與潮汐的高山海岬',
  intro:'列車穿過濃霧時，悄悄飄進車廂的霧羽海葵龍。如海葵與發光水母交織的扇狀薄翼透著淡紫與乳白的暈光，中心一點柔和的光，像一盞在霧裡指路的燈。',
  bio:'在無盡迷霧籠罩的海岸線與高山交界處，老一輩的航海者總會告誡年輕人：如果在濃霧中看見一抹溫柔的粉白光暈，切記不要追逐，只需靜靜駐足。那是「霧羽海葵龍」在收集世人遺忘的夢境。牠們由那些未能歸家之人的思念所化，如同一盞孤燈，在潮汐與霧氣間無聲擺盪。當牠們舒展那如海葵般透明的羽翼時，整個峽灣的風都會安靜下來，彷彿連時間也在那柔和的光芒中暫停了腳步。',
  field:{alias:'幻海的悼亡者、深淵浮影、晨曦微光獸',
   cls:'意念生命（由群體意念形成的存在 —— 來自失落航海者對故鄉與歸宿的強烈思念、以及對無垠迷霧的敬畏所凝聚而成的意識體）。',
   danger:'低',dangerNote:'幾乎不具傷害性，甚至能安撫人心',
   rarity:'稀有',rarityNote:'僅在特定的濃霧季節與人跡罕至的潮汐峽灣中方得一見',
   looks:'<b>身體構造：</b>擁有流暢而修長的流線型軀體，覆蓋著如珍珠般溫潤的半透明鱗片，尾端延伸出如海草般優雅的靈動尾鰭。背部與頭部交界處綻放著一對巨大、如深海海葵與發光水母交織而成的扇狀薄翼，邊緣透著夢幻的淡紫與乳白色暈光。<br><b>顏色：</b>主體為銀白與珍珠灰，點綴著幽藍與淡粉的生物螢光脈絡；頭頂與觸鬚則帶著半透明的珍珠光澤，能在黑暗中散發指引方向的微光。<br><b>辨識特徵：</b>頭部沒有傳統的獸類雙耳，取而代之的是如珊瑚枝椏般向外延伸的感知觸鬚，能直接捕捉周遭生物的情緒波動與氣壓變化。',
   habitat:'終年被濃霧籠罩的無風峽灣、漂浮著發光苔蘚的地下暗河，或是交織著迷霧與潮汐的高山海岬。牠們不需要實質的物質庇護所，通常隨著微弱的氣流與潮汐磁場緩慢飄浮。',
   habits:[['活動時間','多數時間處於半夢半醒的漂浮狀態，但在晨昏交替或迷霧最濃郁的時刻最為活躍。'],['飲食','不需進食實體食物。牠們以空氣中流動的純粹情緒、夢境殘留的記憶碎片，以及微弱的乙太能量維生。'],['社會性','多數為獨居，但在氣候劇變或特定節令時，會成群在迷霧中交錯起舞，形成如夢似幻的「光之迴游」。'],['性格與攻擊性','性格溫和、羞怯而敏感。天生不具備實體攻擊性，當感受到威脅時，會釋放安撫心神的微光與低頻共鳴，使闖入者陷入平靜的睏意中，隨後悄然遁入霧氣。']],
   abilities:[['迷霧幻象（Mist Mimicry）','能夠將自身的生物螢光與周遭的霧氣融合，製造出海市蜃樓般的視覺干擾，使獵食者或不速之客在迷霧中迷失方向。'],['共鳴安撫（Aura Soothing）','透過背部如海葵般的巨大扇翼拍動，散發出能夠平息焦慮、撫平精神創傷的微弱電磁波與柔和光暈。']]},
  stay:2,
  talks:[

  ['序・日與月',`<h5>${GLYPH.sun}日界</h5><p>日界是現實世界，唯一包含地球。地球遵循一般的物理規則與時間流動，人類文明存在於此。地球上仍有人類無法觀測的生命、古老遺跡與特殊能量。</p>
   <h5>${GLYPH.moon}月界</h5><p>月界不是一顆星球，而是所有非地球領域的統稱：宇宙與星系、平行宇宙、異世界、五維與高維空間、虛無空間、時空裂隙，以及不受一般時空規則限制的未知領域。</p>
   <p>每個空間都可以有自己的物理規則與生命型態。它們不一定彼此相連，也無法畫在同一張地圖上。</p><p class="aside">日界與月界並非善惡對立，只是不同的領域體系。</p>`],
  ['起源・第一道晨曦',`<p>最初什麼都沒有，只有一片沒有形狀、也沒有時間的「渾沌之海」。</p><p>某一刻，第一道晨曦落進了海裡。光落下的地方，時間開始流動，萬物有了先後——那裡成為日界，也就是地球。</p>
   <p>光的周圍，留下了無數的倒影。每一道倒影都用自己的方式理解「光」：有的讓重力朝上，有的讓時間倒流，有的乾脆沒有形狀。這些倒影各自成為一個領域，合稱月界。</p>
   <p class="aside">古老的說法：日界是光，月界是光的千萬種倒影。沒有光，就沒有倒影；沒有倒影，光也無從被看見。</p>`],
  ['界壁・渡口・星河',`<h5>${GLYPH.ring}界壁</h5><p>每個領域都被一層看不見的薄膜包著，叫作界壁。界壁守住每個世界自己的規則；穿越它的生命，身上會沾上另一個世界的規則——這就是「界染」。積得太深，生命會被那個世界的規則慢慢改寫。</p>
   ${sec(any('clue_ring','clue_ferrykeepers'),`${GLYPH.ring}渡口`,'<p>界壁並不是到處一樣厚。少數變薄的地方叫作渡口，列車只能在渡口停靠。建造列車的人在每個渡口都留下了圓環印記——晨曦森林古樹上的圓環，就是其中之一。</p>','（找到古樹上的圓環之後，這一段才會顯現。）')}
   ${sec(any('clue_wall'),`${GLYPH.moon}界壁的呼吸`,'<p>界壁不是靜止的。它會像呼吸一樣一明一暗，變薄的那一瞬間，渡口就打開了。界壁極光，是人們唯一能用眼睛看見的呼吸。</p>','（觀賞過界壁極光之後，這一段才會顯現。）')}
   <h5>${GLYPH.leaf}星河</h5><p>在月界的領域之間，流著一條由光組成的長河。它是所有倒影彼此相連的地方，也是列車航道最早的樣子。星河有潮汐，潮水會把流落的東西帶往新的地方。</p>`],
  ['渡守',`${sec(any('clue_ring','clue_lumi_tale','clue_ferrykeepers'),`${GLYPH.ring}建造列車的人`,'<p>建造列車的古代守護者，自稱「渡守」。他們不屬於日界，也不屬於月界——據說他們誕生在界壁上，是光與倒影交界處長出來的生命。</p>','（讀到更多關於古代守護者的線索後，這一段才會顯現。）')}
   ${sec(any('clue_sola_legend','clue_ash','clue_ferrykeepers'),`${GLYPH.leaf}熄滅之前`,'<p>每一個世界都會走到盡頭，這不是誰的錯。但在熄滅之前，總有來不及離開的生命、還沒說完的故事，和一顆還想發芽的種子。渡守會在那之前趕到，列車就是為了把它們帶走而造的。</p>','（墨跡模糊。只看得出「熄滅」兩個字。）')}
   ${sec(has('clue_dimming'),`${GLYPH.moon}大熄滅`,'<p>很久以前，無數領域在同一個紀元裡相繼熄滅，留下的空白連成一片，成為寂滅虛空。渡守把剩下的力量都用來穩住界壁，讓空白不再擴大。列車在那之後，停在了沉睡之地。</p>','（墨跡模糊。這一頁似乎記著一場很大的災難。）')}
   ${sec(has('clue_wake2'),`${GLYPH.sun}時間的另一端`,'<p>渡守最後去了哪裡，沒有任何紀錄。古樹說他們離開時「看起來不難過」；星空裡留著一座古列車座；存檔水晶裡的訊息還有後半句——他們也許沒有消失，只是去了時間的另一端，在那裡等著。</p>','（最後一段的墨跡還沒有顯現。）')}`],
  ['曦淵與值勤精靈',`${sec(any('clue_dragon'),`${GLYPH.sun}曦淵`,'<p>「曦」是晨光，「淵」是深淵。領頭龍一半出生在日界的黎明，一半出生在月界最深的黑暗。牠是第一個登上列車的生命；渡守離開後，牠獨自守著沉睡的列車。</p>','（航行時多和領頭聊聊，這一段才會顯現。）')}
   ${sec(any('clue_dragon'),`${GLYPH.ring}值勤精靈`,'<p>你醒來的那一刻，有一點光落在你身上。那是渡守離開前，留在列車裡的最後一道晨曦。所以你不知道自己從哪裡來——你是從列車自己的光裡醒來的。</p>','（墨跡模糊。這一頁好像在寫你自己。）')}
   <h5>${GLYPH.leaf}列車</h5><ul class="facts"><li>由渡守建造，能穿越日界與月界，在渡口停靠。</li><li>沉睡多年，如今重新啟動。</li><li>由值勤精靈負責巡視、維護與探索。</li><li>不同領域的生命會自行登車，短暫停留後各自離開。</li></ul>`]
 ]; }

/* ---------- 狀態 ---------- */
function freshState(){ return {
 v:1, introDone:false, journeyCount:0, currentLocation:'origin', currentCarriage:'observation', currentPhase:'docked',
 duty:dutyFresh(), spirit:{contamination:null,contaminationLog:[],taint:6,pur:null,equipment:{tablet:false,compass:false,talisman:false}}, voyage:null,
 passengers:{}, completedEvents:[], pendingEvents:[], unlockedLocations:['dawnForest','starIslands'], visitedLocations:[],
 view:{}, seen:{}, discoveredLifeforms:[], collectibles:['seed_ancient_a','seed_ancient_b','seed_ancient_c'], clues:[], storyFlags:{natureLight:'dawn'},
 culture:null, log:[{j:0,t:'列車在沉睡之地甦醒。精靈接下了列車的值勤職責。'}]
};}
let state = load() || freshState();
function load(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return s&&s.v===1? Object.assign(freshState(),s):null; }catch(e){ return null; } }
function save(){ try{ state.savedAt=Date.now(); localStorage.setItem(SAVE_KEY,JSON.stringify(state)); }catch(e){} }

const aboard = id => !!(state.passengers[id]&&state.passengers[id].aboard);
const done = id => state.completedEvents.includes(id);
function complete(id){ if(!done(id)) state.completedEvents.push(id); state.pendingEvents=state.pendingEvents.filter(e=>e!==id); save(); }
function logJ(t,k){ const e={j:state.journeyCount+(state.currentPhase==='voyage'?1:0),t}; if(k) e.k=k; state.log.push(e); save(); }  /* 航行途中的事記到正在進行的那一趟 */
function addItem(id,quiet){ if(!state.collectibles.includes(id)){ state.collectibles.push(id); save(); if(!quiet) toast('收藏：'+COLLECTIBLES[id].name); return true;} return false; }
function addClue(id){ if(!state.clues.includes(id)){ state.clues.push(id); save(); setTimeout(()=>toast('守護者線索 +1'),300); } }
const STAGE_NAMES=['陌生','認識','熟悉','留下重要回憶'];

/* ---------- 版面與舞台 ---------- */
function layout(){
 const W=innerWidth,H=innerHeight, st=$('#stage'); let w,h;
 const pv=isPanoView();
 if(W/H>=16/9){ h=H; w=H*16/9; } else if(W/H>1.15){ w=W; h=W*9/16; } else if(pv){ w=W; h=H; } else { h=Math.min(H*.78,W*1.25); w=h*16/9; }
 st.style.width=w+'px'; st.style.height=h+'px';
 const vp=$('#viewport'); const pan=w>W+2; $('#panhint').hidden=!pan;
 if(pan && !layout.centered){ vp.scrollLeft=(w-W)/2; layout.centered=true; }
 if(!pan) layout.centered=false;
 if(PANO.active) panoResize();
}
addEventListener('resize',layout);
$('#viewport').addEventListener('scroll',()=>{ $('#panhint').style.opacity=0; },{passive:true});

function svgScene(inner){ return `<svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${ART.defs}${inner}</svg>`; }
function hs(x,y,label,act,cls=''){ return `<button class="hs ${cls}" style="left:${x}%;top:${y}%" data-act="${act}"><span class="mk"></span><span class="lb">${label}</span></button>`; }
function dust(n=14){ let o='<div class="dust">'; const r=rnd(n*7); for(let i=0;i<n;i++) o+=`<i style="left:${r()*100}%;top:${40+r()*55}%;animation-delay:${(r()*9).toFixed(1)}s"></i>`; return o+'</div>'; }

function neighbors(car){ const i=TRAIN.indexOf(car); return {fwd:TRAIN[i-1],back:TRAIN[i+1]}; }

function render(){ TAINT.fx(); if(RUNNING) checkReveal(); if(RUNNING&&state.currentCarriage==='habitat'&&state.currentPhase!=='outside') careCheck();
 layout();
 const sc=$('#scene'); let h='', panoView=null;
 if(state.currentPhase==='outside'){ h=renderOutside(); }
 else {
  const c=state.currentCarriage, C=CARRIAGES[c], nb=neighbors(c);
  if(isPanoView()){
   panoView=c;
   h+=`<div id="pano" class="pano"><div class="pano-loading">環景載入中</div>${dust()}<div class="vignette"></div><div id="phs" class="phs"></div>${state.storyFlags.panoHintDone?'':'<div class="pano-hint">‹ 拖曳環顧 360° ›</div>'}</div>`;
  } else {
  if(c==='cab') CAB.begin();
  if(c==='observatory'&&state.currentPhase==='voyage') h+='<canvas class="streaks" id="streaks"></canvas>';
  h += C.image? `<img class="bg" src="${C.image}" alt="${C.name}">` : svgScene(ART.car[c](state));
  h += dust();
  h += '<div class="vignette"></div>';
  h += hsRender(c);  // 統一熱點：物件＋相鄰車廂入口
  }
 }
 sc.innerHTML=h; if(panoView) panoMount(panoView); else PANO.active=null; if($('#streaks')) STREAK.start(); renderHUD(); save(); if(RUNNING){ scheduleAutoThumb(); SFX.ambient(HS_SCENE()); }
}

function renderOutside(){ const L=LOCATIONS[state.currentLocation]; return svgScene(L.art())+dust(20)+'<div class="vignette"></div>'+hsRender('out:'+state.currentLocation); }

function renderHUD(){
 const L=LOCATIONS[state.currentLocation], ph=state.currentPhase, v=state.voyage;
 const cars=TRAIN.map(c=>`<span class="car ${c==='cab'?'loco':''} ${c==='observatory'?'tail':''} ${c===state.currentCarriage&&ph!=='outside'?'on':''}" title="${CARRIAGES[c].name}"></span>`).join('');
 const head = ph==='voyage'&&v ? `<div class="realm">自動航行中</div><div class="name">前往 ${LOCATIONS[v.to].name}</div><div class="meta"><span class="vbar"><i id="vprog" style="width:${(v.progress*100).toFixed(1)}%"></i></span>旅程 <b>${state.journeyCount}</b></div>`
  : `<div class="realm">${L.realm}・${L.domain}</div><div class="name">${L.name}</div><div class="meta">旅程 <b>${state.journeyCount}</b>　乘客 ${Object.keys(PASSENGERS).filter(aboard).length}</div>`;
 const where = ph==='outside' ? '列車外' : CARRIAGES[state.currentCarriage].short;
 const pend = state.pendingEvents.filter(id=>EVENTS[id]).slice(0,2).map(id=>`<button class="evt" data-act="event:${id}">${EVENTS[id].title}</button>`).join('');
 $('#hud').innerHTML=`<div class="loc">${head}</div>
 <div class="train" aria-label="車廂位置">${cars}<span class="cn">${where}</span></div>
 <div class="right">${pend}<span class="phase">${ph==='docked'?'停靠中':ph==='outside'?'外部探索':'航行中'}</span><button class="snd careb ${state.currentCarriage==='habitat'&&state.currentPhase!=='outside'?'':'dim'}" data-act="care:open" aria-label="照顧需求">🌡️</button><button class="snd skb ${state.currentCarriage==='habitat'&&state.currentPhase!=='outside'?'':'dim'}" data-act="sketch:open" aria-label="觀察速寫">✍️</button><button class="snd nbk" data-act="notes:open" aria-label="筆記本">🗒️</button><button class="snd ${PREFS.sound===false?'off':''}" data-act="sound:toggle" aria-label="音效開關">♪</button></div>`;
}

/* ---------- 互動派發 ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const [k,v]=b.dataset.act.split(':'); act(k,v); });
function act(k,v){
 switch(k){
  case 'go': return moveTo(v);
  case 'exit': if(state.currentPhase!=='docked') return toast('航行中無法離開列車');
   if(state.currentLocation==='origin') return toast('列車停泊在沉睡之地，這裡無法下車');
   return exitChooser(()=>transition(()=>{ state.currentPhase='outside'; if(TAINT.once('out')) TAINT.add(TAINT_GAIN[realmKey(state.currentLocation)].out); logOnce('outside_'+state.currentLocation+'_'+state.journeyCount,'走出列車，踏上'+LOCATIONS[state.currentLocation].name+'。'); },null,true));
  case 'back': return transition(()=>{ state.currentPhase='docked'; state.currentCarriage='habitat'; state.companion=null; },null,true);
  case 'talk': return talk(v);
  case 'event': { const ev=EVENTS[v]; if(ev&&!done(v)){ complete(v); ev.run(); renderHUD(); } return; }
  case 'reunion': return reunion(v);
  case 'zone': return zoneInfo(v);
  case 'notes': return notebookPanel();
  case 'sketch': return sketchPicker();
  case 'care': return carePicker();
  case 'sound': PREFS.sound=PREFS.sound===false; savePrefs(); if(PREFS.sound===false){ SFX.stopDrone(); SFX.ambient(null); BGM.stop(500); } else { SFX.init(); if(state.currentPhase==='voyage') SFX.startDrone(); SFX.ambKey=null; SFX.ambient(HS_SCENE()); BGM.start(); } renderHUD(); return toast(PREFS.sound===false?'音樂與音效已關閉':'音樂與音效已開啟');
  default: return (INTERACT[k+':'+v]||(()=>{}))();
 }
}
function logOnce(key,t){ if(!state.storyFlags[key]){ state.storyFlags[key]=1; logJ(t); } }

function checkCarriageEvents(){
 Object.entries(EVENTS).forEach(([id,ev])=>{ if(ev.trigger==='carriage'&&ev.car===state.currentCarriage&&!done(id)&&!state.pendingEvents.includes(id)&&ev.need()){ state.pendingEvents.push(id); toast('新的事件：'+ev.title); } });
 renderHUD(); save();
}

/* 駕駛室：號誌與車門聯鎖（等待後才會轉綠／亮起） */
const CAB={leg:null,signal:'red',doors:'open',timers:[],
 begin(){ if(state.currentPhase!=='docked') return; const k=state.journeyCount+'@'+state.currentLocation; if(this.leg===k) return; this.leg=k;
  this.timers.forEach(clearTimeout); this.timers=[];
  this.signal=state.duty.signal?'green':'red'; this.doors=state.duty.doors?'lit':'open';
  const re=()=>{ if(RUNNING&&state.currentCarriage==='cab'&&state.currentPhase==='docked'){ const bg=document.querySelector('#scene svg.bg'); if(bg) bg.outerHTML=svgScene(ART.car.cab(state)); hsRefresh(); } };  // 只更新畫面與熱點狀態，不重建場景
  if(this.signal!=='green') this.timers.push(setTimeout(()=>{ this.signal='amber'; re(); },1400),setTimeout(()=>{ this.signal='green'; SFX.tone(988,0,.8,'sine',.03); re(); },4200));
  if(this.doors!=='lit') this.timers.push(setTimeout(()=>{ this.doors='closing'; re(); },900),setTimeout(()=>{ this.doors='lit'; re(); },3000)); },
 reset(){ this.leg=null; this.timers.forEach(clearTimeout); this.timers=[]; },
 signalView(){ return state.currentPhase==='voyage'?'green':this.signal; },
 doorView(){ return state.currentPhase==='voyage'?'lit':this.doors; }
};

 if(state.currentPhase==='voyage') return panel(`<div class="eyebrow">星光號誌</div><h2>綠光・航行中</h2><p>列車正在航道上自動行駛，號誌保持綠光。</p>`);
 const s=CAB.signal;
 if(s!=='green') return panel(`<div class="eyebrow">星光號誌</div><h2>${s==='red'?'紅光・停止':'琥珀光・確認中'}</h2><p>前方航道仍在確認中。號誌轉為綠光之前，不能向領頭取得出發許可，請稍候再確認。</p>`);
 if(!state.duty.signal){ state.duty.signal=true; logJ('確認前方星光號誌：綠光，平安號誌。'); save(); render(); SFX.tone(1175,0,.7,'sine',.04); }
 panel(`<div class="eyebrow">星光號誌</div><h2>綠光・平安號誌</h2><p>前方航道已確認安全。確認結果已記錄。</p>`);
}

 if(!state.duty.doors){ state.duty.doors=true; logJ('確認車門聯鎖安全燈：已亮起，車門全數關妥。'); save(); render(); SFX.tone(1175,0,.7,'sine',.04); }
 panel(`<div class="eyebrow">車門聯鎖符文燈</div><h2>安全符文已亮起</h2><p>全部車門已關妥並聯鎖。確認結果已記錄。</p>`);

/* 向領頭報備 */

 const first=!state.storyFlags.metDragon;
 const intro=first?[['dragon','……你醒了。'],['dragon','我是這列車的領頭，曦淵。列車由我引領，但能不能出發，要等值勤者把一切確認清楚。'],['dragon','從今天起，你就是這列車的值勤精靈。每次出發前，來向我報備。'],['self','是，領頭。']]:[];
 if(first){ state.storyFlags.metDragon=1; save(); }
 if(state.currentPhase==='voyage'){ state.storyFlags.dragonLore=state.storyFlags.dragonLore||[]; const L=DRAGON_LORE.find(x=>!state.storyFlags.dragonLore.includes(x.id)&&x.need());
  if(L) return dialogueScript(intro.concat(L.lines),()=>{ state.storyFlags.dragonLore.push(L.id); if(L.clue) addClue(L.clue); logJ('航行中，領頭曦淵說起了列車的往事。'); save(); });
  return dialogueScript(intro.concat([['dragon','航道很穩。去車廂裡走走吧，到站時我會讓你知道。']])); }
 const d=state.duty, miss=[];
 if(!d.scan) miss.push('身體污染值量測'); if(!equipAll()) miss.push('航程裝備'); if(!d.briefing) miss.push('星途符牒的資訊核對');
 if(!d.signal) miss.push('前方星光號誌'); if(!d.doors) miss.push('車門聯鎖安全燈');
 if(miss.length) return dialogueScript(intro.concat([['self','領頭，值勤精靈前來報備。'],['dragon',`等一下。${miss.join('、')}，還沒有確認。`],['dragon','確認完了再來找我。航道不會跑掉，不必急。']]));
 const L=LOCATIONS[nextStop()], c=state.spirit.contamination;
 if(c.value>=50) return dialogueScript(intro.concat([['self',`領頭，值勤精靈報備。身體污染值量測完成，界染度 ${c.value}……`],['dragon','重染。'],
  ['dragon','異界的殘留在你身上積得太深了。帶著這樣的身體穿越界壁，你會被拉走的。'],['dragon','先去淨化。守望藤、靈泉、培育艙的植株，或是能安撫心神的乘客，都可以幫你。降到 50 以下，再回晶環重新量測。']]));
 dialogueScript(intro.concat([
  ['self',`領頭，值勤精靈報備。${trainNo()}，出發準備完成。`],
  ['self',`一、身體污染值量測完成，界染度 ${c.value}，判定${c.level}。`]].concat(c.value>=20?[['dragon','微染。還能出發，但別讓它再積下去。到站之後，記得去淨化。']]:[]).concat([
  ['self',`二、星途符牒資訊已核對，預定停靠${L.name}。`],
  ['self','三、星途符牒、星軌羅盤、界域護符，均已領取。'],
  ['dragon','嗯，繼續。'],
  ['self','四、前方星光號誌已轉為綠光。'],
  ['self','五、車門聯鎖安全燈已亮起，車門全數關妥。'],
  ['self','六、列車狀態晶核顯示，各車廂狀態正常。'],
  ['dragon','（龍低下頭，看了一眼前方的光軌，又回頭看了一眼整列列車。）'],

  ['dragon','准許出發。']

}

/* ================================================================
   界染度（精靈污染值）
   - 實際數值存在 state.spirit.taint（0–100），平常看不到；只有在淨界晶環量測時才會顯示。
   - 增加：穿越界壁（日界 +3／月界 +6）、外部探索（日界 +2／月界 +5）、接觸空間異象 +6、失所生命同車 每趟 +2
   - 減少：抵達日界晨光沖刷 −8、守望藤旁靜坐 −10、淨化植株 −15、靈泉淨身 −6、乘客安撫（霧羽海葵龍 −12、露米 −5）
   - 判定：0–19 純淨・20–49 微染（可出發，領頭提醒）・50 以上 重染（不得值勤，須先淨化）
   - 淨化每個地點每次停靠（或每段航行）各能做一次
   ================================================================ */
const TAINT_GAIN={sun:{cross:3,out:2},moon:{cross:6,out:5},anomaly:6,lost:2};
const PURIFY={

/* 自動出發與自動行駛（玩家不操控列車） */
const VOYAGE_MS=40000; let RUNNING=false;
function startDeparture(){
 const dest=nextStop(), from=state.currentLocation, fromName=LOCATIONS[from].name;
 state.currentPhase='voyage'; state.voyage={from,to:dest,progress:0,evt:false,sky:skyForecast(dest)}; deckWander(); TAINT.add(TAINT_GAIN[realmKey(dest)].cross); CAB.reset(); save(); SFX.depart();   /* 穿越界壁：界染度增加 */
 cine(['領頭曦淵展開雙翼，前方的星光號誌化作一道長長的光軌。列車自行啟動了。',`列車離開${fromName}。`,'車輪下的軌道一節一節亮起，延伸進沒有地面的地方。','日與月的界線，在窗外緩緩翻轉。'],
  ()=>{ SFX.startDrone(); render(); toast('列車自動航行中・可在車廂間自由走動'); },'assets/voyage.jpg');
}
setInterval(()=>{
 if(!RUNNING||state.currentPhase!=='voyage'||!state.voyage) return;
 if(document.hidden||document.querySelector('#layer .cine,#layer .board,#layer .dlg')) return;  /* 過場演出時暫停，避免事件重疊 */
 const v=state.voyage; v.progress=Math.min(1,v.progress+250/VOYAGE_MS);
 const bar=$('#vprog'); if(bar) bar.style.width=(v.progress*100).toFixed(1)+'%';
 if(skyTick(v)){ save(); if(state.currentCarriage==='observatory'||state.currentCarriage==='observation') render(); }   /* 星象開始／結束 */
 if(v.progress>=.45&&!v.evt){ v.evt=true; const ev=Object.entries(EVENTS).find(([id,e])=>e.trigger==='voyage'&&!e.at&&!done(id)); if(ev){ complete(ev[0]); ev[1].run(()=>{}); } save(); }
 /* 指定進度的航行事件（例如航行途中登車的乘客），每趟最多觸發一次 */
 const timed=Object.entries(EVENTS).find(([id,e])=>e.trigger==='voyage'&&e.at&&v.progress>=e.at&&!done(id)&&(!e.need||e.need()));
 if(timed){ complete(timed[0]); timed[1].run(()=>{ render(); }); save(); return; }
 if(v.progress>=1) return voyageArrive();
 if(Math.round(v.progress*160)%8===0) save();
},250);
function voyageArrive(){
 const v=state.voyage, dest=v.to, from=LOCATIONS[v.from].name;
 state.voyage=null; state.journeyCount++; state.currentLocation=dest; state.currentPhase='docked';
 if(!state.visitedLocations.includes(dest)) state.visitedLocations.push(dest);
 if(state.culture && !state.culture.bloomed){ state.culture.bloomed=true; }   // 培植箱：經過一次航行即開花
 state.duty=dutyFresh();
 logJ(`列車自${from}出發，抵達${LOCATIONS[dest].name}。`);
 /* 界染度：失所生命同車的殘響；抵達日界時晨光沖刷 */
 const lost=Object.keys(PASSENGERS).filter(id=>aboard(id)&&PASSENGERS[id].type==='lost').length; if(lost) TAINT.add(TAINT_GAIN.lost*lost);
 deckWander();
 if(realmKey(dest)==='sun'){ TAINT.add(-8); logJ('抵達日界，晨光沖刷了身上的異界殘留，界染度下降。'); }
 SFX.stopDrone(); SFX.arrive(); render();
 cine([`<span class="big">${LOCATIONS[dest].name}</span><span class="sub">${LOCATIONS[dest].realm}・${LOCATIONS[dest].domain}・旅程 ${state.journeyCount}</span>`],()=>arrivalChecks(),null,true);
}
/* ---------- 音效（WebAudio 合成，不需音檔） ---------- */
const PREFS=(()=>{ try{ return JSON.parse(localStorage.getItem('riyue-prefs'))||{}; }catch(e){ return {}; } })();
function savePrefs(){ try{ localStorage.setItem('riyue-prefs',JSON.stringify(PREFS)); }catch(e){} }
const SFX={ctx:null,drone:null,
 on(){ return PREFS.sound!==false; },
 init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); return this.ctx; },
 tone(f,delay,dur,type,vol){ if(!this.on()) return; const c=this.init(); if(!c) return; const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.05,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); },
 noise(dur,f0,f1,vol){ if(!this.on()) return; const c=this.init(); if(!c) return; const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8; const t=c.currentTime; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.45); g.gain.linearRampToValueAtTime(0,t+dur); s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); },
 chime(){ [784,1175,1568].forEach((f,i)=>this.tone(f,i*.14,1.8,'sine',.045)); },
 depart(){ this.chime(); this.tone(55,.3,3.4,'triangle',.08); this.noise(3.4,180,2400,.05); },
 arrive(){ [1175,988,784].forEach((f,i)=>this.tone(f,i*.18,1.6,'sine',.045)); },
 startDrone(){ if(!this.on()||this.drone) return; const c=this.init(); if(!c) return; const g=c.createGain(); g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(.035,c.currentTime+2);
  const o1=c.createOscillator(), o2=c.createOscillator(), lfo=c.createOscillator(), lg=c.createGain(); o1.frequency.value=55; o2.frequency.value=82.6; lfo.frequency.value=.18; lg.gain.value=.012;
  lfo.connect(lg); lg.connect(g.gain); o1.connect(g); o2.connect(g); g.connect(c.destination); [o1,o2,lfo].forEach(o=>o.start()); this.drone={g,os:[o1,o2,lfo]}; },
 stopDrone(){ const c=this.ctx, d=this.drone; if(!c||!d) return; const t=c.currentTime; d.g.gain.cancelScheduledValues(t); d.g.gain.setValueAtTime(d.g.gain.value,t); d.g.gain.linearRampToValueAtTime(0,t+1.2); d.os.forEach(o=>o.stop(t+1.3)); this.drone=null; }
};

/* ---------- 展望台：航行中逐漸遠去的星光 ---------- */
const STREAK={raf:0,parts:[],
 spawn(any){ return {a:Math.random()*Math.PI*2,d:any?.1+Math.random()*.9:1,sp:.0018+Math.random()*.003,warm:Math.random()<.2}; },
 cloud(any){ return {a:Math.random()*Math.PI*2,d:any?.25+Math.random()*.75:1,sp:.0007+Math.random()*.0006,h:[262,200,298,186][Math.floor(Math.random()*4)]}; },
 start(){ const cv=$('#streaks'); if(!cv) return; const r=cv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2); cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr);
  this.parts=[]; for(let i=0;i<150;i++) this.parts.push(this.spawn(true)); this.cl=[0,1,2,3,4].map(()=>this.cloud(true)); if(!this.raf) this.raf=requestAnimationFrame(()=>this.tick()); },
 tick(){ this.raf=0; const cv=$('#streaks'); if(!cv) return; const g=cv.getContext('2d'), W=cv.width, H=cv.height, cx=W*.5, cy=H*.42, R=Math.hypot(W,H)*.7;
  g.clearRect(0,0,W,H);
  for(const c of this.cl){ c.d-=c.sp*(.3+c.d); if(c.d<=.04){ Object.assign(c,this.cloud(false)); continue; } const x=cx+Math.cos(c.a)*R*.5*c.d, y=cy+Math.sin(c.a)*R*.35*c.d, rr=R*.32*c.d, gr=g.createRadialGradient(x,y,0,x,y,rr);
   gr.addColorStop(0,`hsla(${c.h},60%,62%,${(.22*c.d).toFixed(3)})`); gr.addColorStop(1,'hsla(0,0%,0%,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,rr,0,Math.PI*2); g.fill(); }
  for(const p of this.parts){ const d0=p.d; p.d-=p.sp*(.4+p.d); if(p.d<=.02){ Object.assign(p,this.spawn(false)); continue; } const d1=p.d;
   const x0=cx+Math.cos(p.a)*R*d0*d0, y0=cy+Math.sin(p.a)*R*d0*d0*.7, x1=cx+Math.cos(p.a)*R*(d1+.04)*(d1+.04), y1=cy+Math.sin(p.a)*R*(d1+.04)*(d1+.04)*.7;
   g.strokeStyle=(p.warm?'rgba(255,230,170,':'rgba(225,220,255,')+Math.min(1,d0*1.2).toFixed(2)+')'; g.lineWidth=Math.max(.6,3.2*d0); g.lineCap='round';
   g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); }
  this.raf=requestAnimationFrame(()=>this.tick()); } };

/* ================================================================
   存檔水晶：存檔／讀檔（多欄位、縮圖、重新命名、覆蓋、二次確認刪除）
   ================================================================ */
const SLOT_KEY='riyue-slots-v1', AUTO_THUMB_KEY='riyue-autothumb', SLOT_MAX=12;
function slotsGet(){ try{ const a=JSON.parse(localStorage.getItem(SLOT_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function slotsSet(a){ try{ localStorage.setItem(SLOT_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
function fmtTime(t){ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function stateSummary(s){ const L=LOCATIONS[s.currentLocation]||LOCATIONS.origin, voy=s.currentPhase==='voyage'&&s.voyage;
 const ab=Object.keys(s.passengers||{}).filter(id=>s.passengers[id].aboard&&PASSENGERS[id]).map(id=>PASSENGERS[id].name);
 const d=s.duty||{}, eq=(s.spirit&&s.spirit.equipment)||{};
 const n=[d.scan,eq.tablet&&eq.compass&&eq.talisman,d.briefing,d.signal,d.doors].filter(Boolean).length;
 return {loc:voy?`前往 ${LOCATIONS[s.voyage.to].name}`:L.name, realm:voy?LOCATIONS[s.voyage.to].realm:L.realm, journey:s.journeyCount,
  where:s.currentPhase==='outside'?'列車外・'+L.name:((CARRIAGES[s.currentCarriage]||{}).name||''),
  run:voy?`自動航行中（${Math.round(s.voyage.progress*100)}%）`:s.currentPhase==='outside'?'停靠中・外部探索':'停靠中',
  pass:ab.length?ab.join('、'):'無', life:(s.discoveredLifeforms||[]).length, clues:(s.clues||[]).length,
  duty:voy?'已取得出發許可':`${n} / 5 項完成`, cont:s.spirit&&s.spirit.contamination?`界染度 ${s.spirit.contamination.value}（${s.spirit.contamination.level}）`:'尚未量測'}; }

/* 縮圖：把目前畫面的各圖層（環景 WebGL、SVG 場景、圖片、星光畫布）合成到 Canvas */
async function captureThumb(){
 const W=320,H=180, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d'); g.fillStyle='#0b0d22'; g.fillRect(0,0,W,H);
 const cover=(src,sw,sh)=>{ if(!sw||!sh) return; const k=Math.max(W/sw,H/sh), dw=sw*k, dh=sh*k; g.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh); };
 const layers=[...document.querySelectorAll('#scene canvas, #scene svg.bg, #scene img.bg')];
 for(const el of layers){ try{
  if(el.tagName==='CANVAS'){ if(el===PANO.canvas&&PANO.active) panoDraw(); cover(el,el.width,el.height); }
  else if(el.tagName==='IMG'){ if(!el.complete) await new Promise(r=>{ el.addEventListener('load',r,{once:true}); el.addEventListener('error',r,{once:true}); }); cover(el,el.naturalWidth,el.naturalHeight); }
  else { const c=el.cloneNode(true); c.setAttribute('width','1600'); c.setAttribute('height','900');
   const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c)); await img.decode(); g.drawImage(img,0,0,W,H); }
 }catch(e){} }
 try{ return cv.toDataURL('image/jpeg',.72); }catch(e){ return null; }
}
let thumbT=0, thumbLast=0;
function scheduleAutoThumb(){ clearTimeout(thumbT); thumbT=setTimeout(async()=>{ if(!RUNNING) return; const now=Date.now(); if(now-thumbLast<8000) return; thumbLast=now;
 const t=await captureThumb(); if(t) try{ localStorage.setItem(AUTO_THUMB_KEY,t); }catch(e){} },1500); }

function savePanel(mode){   /* mode: 'game' 可封存與喚回；'title' 只能喚回 */
 const ov=panel('','pearl'), pn=ov.querySelector('.panel'); let sel=null, msg='';
 const thumbImg=t=>t?`<img src="${t}" alt="">`:`<div class="noth">無縮圖</div>`;
 const autoItem=()=>{ let t=null; try{ t=localStorage.getItem(AUTO_THUMB_KEY); }catch(e){}
  return (mode==='title'&&state.introDone)?{id:'auto',name:'最近一次的旅程',auto:true,updated:state.savedAt||Date.now(),thumb:t,state:clone(state)}:null; };
 const confirmBox=(text,yesLabel,danger,yes)=>{ const c=pn.querySelector('#sl-cf'); c.innerHTML=`<p class="pmsg">${text}</p><div class="acts"><button class="pbtn ${danger?'warn':'pri'}" id="cf-y">${yesLabel}</button><button class="pbtn" id="cf-n">取消</button></div>`;
  c.querySelector('#cf-y').onclick=yes; c.querySelector('#cf-n').onclick=()=>{ c.innerHTML=''; }; };
 const draw=()=>{
  const a=autoItem(), list=(a?[a]:[]).concat(slotsGet().sort((x,y)=>y.updated-x.updated)), s=sel&&list.find(x=>x.id===sel);
  let h=`<button class="close" aria-label="關閉">✕</button><div class="eyebrow">存檔水晶</div><h2>${mode==='title'?'接續旅程':'存檔與讀檔'}</h2>${msg?`<p class="pmsg">${msg}</p>`:''}`;
  if(!s){
   h+=`<p>${mode==='title'?'選擇一段旅程記憶，確認後從那一刻接續。':'把此刻的旅程封存成一段記憶，或喚回過去封存的記憶。'}</p><div class="slots">`;
   if(mode==='game') h+=`<button class="slot new" id="sl-new"><div class="th"><span>＋</span></div><div class="nm">封存目前的旅程</div><div class="mt">建立新的記憶（${slotsGet().length} / ${SLOT_MAX}）</div></button>`;
   h+=list.map(x=>{ const m=stateSummary(x.state); return `<button class="slot" data-id="${x.id}"><div class="th">${thumbImg(x.thumb)}${x.auto?'<span class="badge">自動紀錄</span>':''}</div><div class="nm">${esc(x.name)}</div><div class="mt">旅程 ${m.journey}・${esc(m.loc)}</div><div class="mt">${fmtTime(x.updated)}</div></button>`; }).join('');
   if(!list.length&&mode==='title') h+='<p class="empty">目前還沒有任何可接續的旅程。</p>';
   h+='</div>'+(mode==='game'?'<button class="plink" id="sl-home">回到列車主畫面</button>':'');
  } else { const m=stateSummary(s.state);
   h+=`<div class="sdet"><div class="th">${thumbImg(s.thumb)}</div><div>
    ${s.auto?`<div class="nm">${esc(s.name)}</div>`:`<label class="rn">記憶名稱<input type="text" id="sl-name" maxlength="20" value="${esc(s.name)}"></label>`}
    <dl><dt>停靠站</dt><dd>${esc(m.loc)}（${m.realm}）</dd><dt>旅程次數</dt><dd>${m.journey}</dd><dt>所在位置</dt><dd>${esc(m.where)}</dd><dt>列車狀態</dt><dd>${m.run}</dd>
    <dt>乘車中</dt><dd>${esc(m.pass)}</dd><dt>值勤程序</dt><dd>${m.duty}</dd><dt>小精靈</dt><dd>${m.cont}</dd><dt>典藏</dt><dd>生命 ${m.life} 種・線索 ${m.clues} 片</dd><dt>封存時間</dt><dd>${fmtTime(s.updated)}</dd></dl>
    <div class="acts"><button class="pbtn pri" id="sl-load">喚回這段旅程</button>${s.auto?'':`${mode==='game'?'<button class="pbtn" id="sl-over">以目前旅程覆蓋</button>':''}<button class="pbtn" id="sl-ren">儲存名稱</button><button class="pbtn warn" id="sl-del">刪除</button>`}</div>
    <div id="sl-cf"></div><button class="plink" id="sl-back">‹ 返回所有記憶</button></div></div>`;
  }
  pn.innerHTML=h; const q=k=>pn.querySelector(k);
  pn.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ sel=b.dataset.id; msg=''; draw(); });
  if(q('#sl-home')) q('#sl-home').onclick=()=>{ save(); showMain(); };
  if(q('#sl-new')) q('#sl-new').onclick=async()=>{ const all=slotsGet(); if(all.length>=SLOT_MAX){ msg=`記憶欄位已滿（${SLOT_MAX} 個）。請選擇一段記憶覆蓋，或先刪除。`; return draw(); }
   q('#sl-new').disabled=true; const t=await captureThumb(), now=Date.now();
   const x={id:'s'+now.toString(36),name:`旅程 ${state.journeyCount}・${state.currentPhase==='voyage'?'航行中':LOCATIONS[state.currentLocation].name}`,created:now,updated:now,thumb:t,state:clone(state)};
   all.push(x); if(!slotsSet(all)){ msg='封存失敗：瀏覽器的儲存空間不足。'; return draw(); } msg='已封存目前的旅程。'; sel=x.id; SFX.chime(); draw(); };
  if(!s) return;
  q('#sl-back').onclick=()=>{ sel=null; msg=''; draw(); };
  q('#sl-load').onclick=()=>confirmBox(mode==='title'?'從這段記憶接續旅程？':'喚回這段記憶後，目前尚未封存的進度會被取代。確定嗎？','確認喚回',false,()=>{ ov.remove(); loadGame(s.state,s.name); });
  if(s.auto) return;
  if(q('#sl-over')) q('#sl-over').onclick=()=>confirmBox(`以目前的旅程覆蓋「${esc(s.name)}」？原本的內容會被取代。`,'覆蓋',false,async()=>{ const t=await captureThumb(), all=slotsGet(), x=all.find(o=>o.id===s.id); if(!x) return;
   Object.assign(x,{thumb:t,state:clone(state),updated:Date.now()}); msg=slotsSet(all)?'已覆蓋。':'覆蓋失敗：儲存空間不足。'; draw(); });

function normalizeState(){

 if(!CARRIAGES[state.currentCarriage]) state.currentCarriage='observation';
 if(state.currentCarriage==='prep') state.currentCarriage='cab';
 if(state.currentPhase==='voyage'&&!state.voyage) state.currentPhase='docked';
 const f=freshState(); state.spirit=Object.assign(f.spirit,state.spirit||{}); state.spirit.equipment=Object.assign({tablet:false,compass:false,talisman:false},state.spirit.equipment||{});
 state.duty=Object.assign(dutyFresh(),state.duty||{}); if(!state.seen) state.seen={};

function arrivalChecks(){
 const q=[];
 // 乘客離開（固定條件）
 Object.keys(PASSENGERS).forEach(id=>{ const s=state.passengers[id]; if(s&&s.aboard&&state.journeyCount-s.boardedJourney>=PASSENGERS[id].stay&&readyToLeave(id)) q.push(next=>farewell(id,next));   /* 故事、筆記、速寫都完成後才下車 */ });
 // 停靠事件
 Object.entries(EVENTS).forEach(([id,e])=>{ if(e.trigger==='arrive'&&e.loc===state.currentLocation&&!done(id)&&(!e.need||e.need())) q.push(next=>e.run(next)); });
 const run=()=>{ const f=q.shift(); if(f) f(run); else { render(); checkCarriageEvents(); } }; run();
}

function skyForecast(dest){ const jc=state.journeyCount, moon=realmKey(dest)==='moon', list=moon?['aurora','tide','meteor']:['meteor','eclipse'];

 try{ gl=c.getContext('webgl',{antialias:false,alpha:false})||c.getContext('experimental-webgl'); }catch(e){}

  f:`precision ${hi} float;varying vec2 vn;uniform sampler2D tex;uniform vec3 f;uniform vec3 r;uniform vec3 u;uniform vec2 tf;uniform float hr;uniform float ready;
  void main(){vec3 d=f+r*(vn.x*tf.x)+u*(vn.y*tf.y);float rho=length(d.xz);float yaw=atan(d.x,d.z);
  float uu=fract(1.0-yaw/6.28318531);float vv=0.5-(d.y/rho)/hr;

function panoMount(car){

 const ent=ENTRY_FROM&&PANO_ENTRY[car]&&PANO_ENTRY[car][ENTRY_FROM]; PANO.backTo=ENTRY_FROM||PANO.backTo; ENTRY_FROM=null;

function panoResize(){

function panoBasis(){ const lo=PANO.lon*D2R, la=PANO.lat*D2R;

const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

  if(!p){ el.style.visibility='hidden'; return; } el.style.visibility='visible'; el.style.left=p[0].toFixed(1)+'px'; el.style.top=p[1].toFixed(1)+'px'; }); }

const HS_SCENE=()=>state.currentPhase==='outside'?'out:'+state.currentLocation:state.currentCarriage;
const hsName=h=>typeof h.name==='function'?h.name():h.name;
const hsVer=h=>h.ver?String(h.ver()):'1';
function hsList(scene){ return HSDEF.filter(h=>h.scene===scene&&(!h.show||h.show())); }
function hsState(h){
 if(h.lock&&h.lock()) return 'locked';
 if(h.imp&&h.imp()) return 'important';
 if(h.done) return h.done()?'done':'normal';
 const seen=seenOf(h.id);
 if(seen!==undefined&&seen!==hsVer(h)) return 'important';           // 讀過之後有新內容
 if(seen!==undefined&&(h.shape||'obj')==='obj') return 'done';        // 已閱讀
 return 'normal';
}
function hsBtn(h,pano){ const st=hsState(h), sh=h.shape||'obj', nm=esc(hsName(h));
 const attrs=`data-hs="${h.id}"${pano?` data-hid="${h.id}"`:''} style="${pano?'visibility:hidden':`left:${h.at.x}%;top:${h.at.y}%`}${h.sx||''}"`;
 if(sh==='npc'&&h.sprite) return `<button class="mote sprite st-${st} ${h.cls||''}" ${attrs} aria-label="${nm}"><span class="spr"><img src="${h.sprite}" alt="" draggable="false"></span><span class="lb">${nm}</span></button>`;
 if(sh==='npc') return `<button class="mote st-${st} ${h.cls||''}" ${attrs} aria-label="${nm}"><span class="orb" style="background:${h.color()}"></span><span class="lb">${nm}</span></button>`;
 return `<button class="hs st-${st} ${sh==='obj'?'':sh}" ${attrs} aria-label="${nm}${st==='locked'?'（尚未開啟）':''}"><span class="mk"></span><span class="lb">${nm}</span></button>`;
}
function hsRender(scene){ return hsList(scene).map(h=>hsBtn(h,false)).join(''); }
function hsRefresh(){ document.querySelectorAll('#scene [data-hs]').forEach(el=>{ const h=HSDEF.find(x=>x.id===el.dataset.hs); if(!h) return;
 el.classList.remove('st-normal','st-important','st-locked','st-done'); el.classList.add('st-'+hsState(h)); const lb=el.querySelector('.lb'); if(lb&&!lb.querySelector('.whisper')) lb.textContent=hsName(h); }); }

/* 點擊：防連點、光效回饋、依層級開啟內容、記錄已讀 */
const HSC={until:0,last:null,lastT:0,layer:0};
document.addEventListener('click',e=>{ let el=e.target.closest('[data-hs]'); if(!el||!el.closest('#scene')) return;
 if(el.classList.contains('sprite')&&!e.target.closest('.lb')&&!spriteHit(el,e.clientX,e.clientY)){   // 點到動態立繪的透明處 → 交給下方的熱點
  el=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest&&n.closest('[data-hs]')).find(n=>n&&n!==el&&n.closest('#scene')); if(!el) return; }
 hsClick(el.dataset.hs,el); });
function spriteHit(el,x,y){ const img=el.querySelector('.spr img'); if(!img||!img.naturalWidth) return true;
 const r=img.getBoundingClientRect(), k=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight), ox=r.left+(r.width-img.naturalWidth*k)/2, oy=r.top+(r.height-img.naturalHeight*k)/2;
 const px=(x-ox)/k, py=(y-oy)/k; if(px<0||py<0||px>=img.naturalWidth||py>=img.naturalHeight) return false;
 const R=Math.max(2,Math.round(6/k)), D=R*2+1;   // 容許點擊位置周圍約 6px：動態生物在移動，點擊要寬容一點
 const c=spriteHit.c||(spriteHit.c=document.createElement('canvas')); c.width=c.height=D; const g=c.getContext('2d',{willReadFrequently:true});
 g.clearRect(0,0,D,D); g.drawImage(img,R-Math.floor(px),R-Math.floor(py)); try{ const d=g.getImageData(0,0,D,D).data; for(let i=3;i<d.length;i+=4) if(d[i]>40) return true; return false; }catch(err){ return true; } }
function hsClick(id,el){
 const now=performance.now();
 if(now<HSC.until||(HSC.last===id&&now<HSC.lastT+700)||TRANS.busy||document.querySelector('#layer .cine,#layer .dlg,#layer .ov:not(.closing)')) return;
 const h=HSDEF.find(x=>x.id===id); if(!h||h.scene!==HS_SCENE()||(h.show&&!h.show())) return;
 HSC.until=now+260; HSC.last=id; HSC.lastT=now; hsBurst(el);
 const lk=h.lock&&h.lock();
 if(lk){ SFX.tone(330,0,.3,'sine',.02); if(h.onLocked){ HSC.layer=2; try{ h.onLocked(); }finally{ HSC.layer=0; } return; } return whisper(el,lk,'lock'); }
 SFX.tone(1175,0,.35,'sine',.015);
 if(h.layer===1) whisper(el,typeof h.hint==='function'?h.hint():h.hint);
 else { const n=$('#layer').children.length; HSC.layer=h.layer;
  try{ typeof h.act==='function'?h.act(el):runAct(h.act); }finally{ HSC.layer=0; }
  const last=$('#layer').lastElementChild; if($('#layer').children.length>n&&last&&last.classList.contains('ov')) last.dataset.key=id; }
 if(h.track!==false&&(h.shape||'obj')==='obj'){ state.seen=state.seen||{}; state.seen[id]=hsVer(h); save(); }
 setTimeout(hsRefresh,40);
}
function runAct(a){ const i=a.indexOf(':'); act(a.slice(0,i),a.slice(i+1)); }
function hsBurst(el){ const mk=el.querySelector('.mk')||el.querySelector('.orb')||el.querySelector('.spr'); if(!mk) return; const b=document.createElement('i'); b.className='hsb'; mk.appendChild(b); setTimeout(()=>b.remove(),700); }
function whisper(el,text,kind){
 document.querySelectorAll('.whisper').forEach(w=>w.remove()); document.querySelectorAll('.talking').forEach(x=>x.classList.remove('talking'));
 clearTimeout(whisper.t1); clearTimeout(whisper.t2);
 if(!el||!el.isConnected||!text) return;
 const w=document.createElement('div'); w.className='whisper'+(kind?' '+kind:''); w.setAttribute('role','status'); w.textContent=text;
 const r=el.getBoundingClientRect(), cx=r.left+r.width/2;
 if(cx<160) w.classList.add('wl'); else if(cx>innerWidth-160) w.classList.add('wr');
 if(r.top<130) w.classList.add('wb');
 el.classList.add('talking'); el.appendChild(w);
 const dur=Math.min(6500,2400+text.length*75);
 whisper.t1=setTimeout(()=>w.classList.add('out'),dur); whisper.t2=setTimeout(()=>{ w.remove(); el.classList.remove('talking'); },dur+450);
}
function spotEvent(spot){ return Object.entries(EVENTS).find(([id,e])=>e.trigger==='spot'&&e.spot===spot&&!done(id)&&(!e.need||e.need())); }

/* 視窗：淡入（CSS）與淡出；Esc 關閉最上層 */
function panel(html,cls=''){ if(!cls&&HSC.layer===2) cls='small';
 const ov=document.createElement('div'), t0=performance.now(); ov.className='ov '+cls; ov.innerHTML=`<div class="panel">${html}<button class="close" aria-label="關閉">✕</button></div>`;
 ov.addEventListener('click',e=>{ if(e.target===ov&&performance.now()-t0<450) return; if(e.target===ov||e.target.closest('.close')) closeOv(ov); }); $('#layer').appendChild(ov); return ov; }
function closeOv(ov){ if(!ov||!ov.isConnected||ov.classList.contains('closing')) return; ov.classList.add('closing'); setTimeout(()=>{ ov.remove(); hsRefresh(); },260); }
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; const ov=[...document.querySelectorAll('#layer .ov:not(.closing)')].pop(); if(ov) closeOv(ov); });

/* 車廂轉場：開門動畫 → 載入相鄰車廂 → 開門；動畫期間不接受第二次切換 */
const TRANS={busy:false}; let ENTRY_FROM=null;
function transition(change,after,door){
 if(TRANS.busy) return; TRANS.busy=true; whisper(null);
 const sc=$('#scene'), fx=$('#doorfx'), swap=()=>{ try{ change(); render(); }catch(err){ console.error(err); } };
 const fin=d=>setTimeout(()=>{ TRANS.busy=false; if(after) after(); },d);
 if(door&&fx){ SFX.door(); fx.classList.add('shut');
  setTimeout(()=>{ swap(); setTimeout(()=>fx.classList.remove('shut'),120); fin(480); },340); }
 else { sc.classList.add('out'); setTimeout(()=>{ swap(); requestAnimationFrame(()=>sc.classList.remove('out')); fin(520); },480); }
}
function moveTo(car){
 if(TRANS.busy) return;
 const nb=neighbors(state.currentCarriage); if(car!==nb.fwd&&car!==nb.back) return; // 只能前往相鄰車廂
 const from=state.currentCarriage;
 transition(()=>{ ENTRY_FROM=from; state.currentCarriage=car; },()=>checkCarriageEvents(),true);
}

/* 環景載入失敗：提供重試與返回 */
function panoWatch(car){ clearTimeout(PANO.wt); PANO.wt=setTimeout(()=>{ if(PANO.active===car&&!PANO.ready[car]) panoFail(car); },15000); }
function panoFail(car){ const host=$('#pano'); if(!host||PANO.active!==car) return; clearTimeout(PANO.wt);
 const l=host.querySelector('.pano-loading'); if(l) l.remove();
 let f=host.querySelector('.pano-fail'); if(!f){ f=document.createElement('div'); f.className='pano-fail'; host.appendChild(f); }
 const nb=neighbors(car), back=(PANO.backTo===nb.fwd||PANO.backTo===nb.back)?PANO.backTo:nb.fwd;
 f.innerHTML=`<p>環景圖片沒有載入成功。</p><div class="row" style="justify-content:center"><button class="btn" data-pf="retry">重新載入</button><button class="btn ghost" data-pf="back">返回${CARRIAGES[back].name}</button></div>`;
 f.addEventListener('pointerdown',e=>e.stopPropagation());
 f.querySelector('[data-pf=retry]').onclick=()=>{ delete PANO.tex[car]; PANO.ready[car]=false; f.remove(); host.insertAdjacentHTML('afterbegin','<div class="pano-loading">環景載入中</div>'); panoTexture(car); panoWatch(car); };
 f.querySelector('[data-pf=back]').onclick=()=>moveTo(back);
}

/* ---------- 背景音樂：進入遊戲後自動播放，10 首隨機循環（每輪全部播完才重新洗牌，不會連續重複同一首） ---------- */
const BGM={list:['assets/bgm-01.mp3','assets/bgm-02.mp3','assets/bgm-03.mp3','assets/bgm-04.mp3','assets/bgm-05.mp3','assets/bgm-06.mp3','assets/bgm-07.mp3','assets/bgm-08.mp3','assets/bgm-09.mp3','assets/bgm-10.mp3'].filter(Boolean),
 el:null,queue:[],last:null,on:false,vol:.42,fails:0,_fade:0,
 ensure(){ if(this.el) return this.el; const a=this.el=new Audio(); a.preload='auto'; a.volume=0;
  a.addEventListener('ended',()=>{ if(this.on) this.next(); });
  a.addEventListener('playing',()=>{ this.fails=0; });
  a.addEventListener('error',()=>{ if(!this.on) return; if(++this.fails>=this.list.length){ this.on=false; return; } setTimeout(()=>{ if(this.on) this.next(); },400); });
  return a; },
 shuffle(){ const q=this.list.slice(); for(let i=q.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
  if(q.length>1&&q[0]===this.last){ const k=1+Math.floor(Math.random()*(q.length-1)); [q[0],q[k]]=[q[k],q[0]]; } return q; },
 next(){ const a=this.ensure(); if(!this.queue.length) this.queue=this.shuffle(); const f=this.queue.shift(); this.last=f; a.src=f; this.play(); },
 play(){ const a=this.el; if(!a) return; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); this.fadeTo(this.vol,1800); },
 fadeTo(v,ms,done){ const a=this.el; if(!a) return; clearInterval(this._fade); const v0=a.volume, t0=performance.now();
  this._fade=setInterval(()=>{ const k=Math.min(1,(performance.now()-t0)/ms); try{ a.volume=Math.max(0,Math.min(1,v0+(v-v0)*k)); }catch(e){} if(k>=1){ clearInterval(this._fade); if(done) done(); } },50); },
 start(){ if(!this.list.length||!SFX.on()) return; this.on=true; const a=this.ensure(); if(!a.src) this.next(); else if(a.paused) this.play(); else this.fadeTo(this.vol,1200); },
 stop(ms=1200){ this.on=false; const a=this.el; if(!a||a.paused) return; this.fadeTo(0,ms,()=>{ if(!this.on) a.pause(); }); },
 nowPlaying(){ return this.on&&this.last; }
};
/* 分頁切到背景時暫停，回來時繼續；手機若擋下自動播放，下一次點擊畫面時補播 */
document.addEventListener('visibilitychange',()=>{ const a=BGM.el; if(!a||!BGM.on) return; if(document.hidden) a.pause(); else BGM.play(); });
document.addEventListener('pointerdown',()=>{ if(BGM.on&&BGM.el&&BGM.el.paused&&!document.hidden) BGM.play(); },true);

/* ---------- 主畫面：火車音效（合成：行駛低鳴、蒸汽噴氣、鐵軌節奏，開頭一聲汽笛） ---------- */
const TRAINSFX={out:null,srcs:[],timer:0,next:0,beat:0,
 start(){ if(this.out||!SFX.on()) return; const c=SFX.init(); if(!c) return; const t=c.currentTime;
  const out=this.out=c.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(1,t+1.6); out.connect(c.destination);
  const loop=(type,f,q,vol)=>{ const s=c.createBufferSource(); s.buffer=SFX.noiseBuf(); s.loop=true; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
   const g=c.createGain(); g.gain.value=vol; s.connect(fl); fl.connect(g); g.connect(out); s.start(t); this.srcs.push(s); return g; };
  const rumble=loop('lowpass',140,.7,.16);            // 車輪與車身的低沉行駛聲
  loop('bandpass',900,.4,.012);                         // 車外的風聲
  const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=.35; lg.gain.value=.04; lfo.connect(lg); lg.connect(rumble.gain); lfo.start(t); this.srcs.push(lfo);
  this.whistle(t+.6); this.next=t+.3; this.beat=0;
  this.timer=setInterval(()=>this.tick(),120); this.tick(); },
 burst(at,dur,type,f0,f1,q,vol){ const c=SFX.ctx; if(!c||!this.out) return; const s=c.createBufferSource(); s.buffer=SFX.noiseBuf(); const fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q;
  fl.frequency.setValueAtTime(f0,at); fl.frequency.exponentialRampToValueAtTime(f1,at+dur); const g=c.createGain(); g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(vol,at+dur*.18); g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  s.connect(fl); fl.connect(g); g.connect(this.out); s.start(at,Math.random()*1.5); s.stop(at+dur+.05); },
 thump(at,vol){ const c=SFX.ctx; if(!c||!this.out) return; const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.setValueAtTime(110,at); o.frequency.exponentialRampToValueAtTime(55,at+.09);
  g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.12); o.connect(g); g.connect(this.out); o.start(at); o.stop(at+.15); },
 tick(){ const c=SFX.ctx; if(!c||!this.out) return; const ahead=c.currentTime+.5;
  while(this.next<ahead){ const at=this.next, b=this.beat%8;
   this.burst(at,.26,'bandpass',1500,520,1.1,b%4===0?.11:.07);          // 蒸汽噴氣「嚓」：每拍一次，每四拍一重音
   if(b===0||b===4){ this.burst(at+.05,.025,'highpass',3200,2600,.7,.05); this.thump(at+.05,.06); this.burst(at+.19,.025,'highpass',3000,2500,.7,.045); this.thump(at+.19,.05); }  // 鐵軌接縫「喀噠」
   this.beat++; this.next+=.42; } },
 whistle(at){ const c=SFX.ctx; if(!c||!this.out) return; const g=c.createGain(); g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(.035,at+.25); g.gain.setValueAtTime(.035,at+1.1); g.gain.exponentialRampToValueAtTime(.0001,at+1.9); g.connect(this.out);
  const vib=c.createOscillator(), vg=c.createGain(); vib.frequency.value=5.5; vg.gain.value=4; vib.connect(vg);
  [523.3,659.3,784].forEach(f=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.value=f; vg.connect(o.frequency); o.connect(g); o.start(at); o.stop(at+2); }); vib.start(at); vib.stop(at+2); },
 stop(){ const c=SFX.ctx; clearInterval(this.timer); this.timer=0; if(!c||!this.out) return; const t=c.currentTime, out=this.out, srcs=this.srcs; this.out=null; this.srcs=[];
  out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value,t); out.gain.linearRampToValueAtTime(0,t+.7); srcs.forEach(s=>{ try{ s.stop(t+.8); }catch(e){} }); setTimeout(()=>{ try{ out.disconnect(); }catch(e){} },1000); }
};

/* 車廂環境音（合成，極低音量；可由 ♪ 關閉） */
const AMBIENT={
 nature:{noise:['bandpass',1500,.7,.009,.07],tones:[[196,.003]]},
 habitat:{noise:['lowpass',520,.5,.014,.11]},
 observation:{tones:[[110,.007],[164.8,.004]]},
 memory:{tones:[[523.3,.0022],[784,.0015],[130.8,.0035]]},
 cab:{tones:[[73.4,.008],[110,.0035]]},
 prep:{tones:[[98,.005]]},
 observatory:{noise:['bandpass',420,.6,.018,.09]},
 'out:dawnForest':{noise:['bandpass',2300,.5,.006,.05]},
 'out:starIslands':{tones:[[220,.0028],[329.6,.0018]]}
};
Object.assign(SFX,{amb:null,ambKey:null,_nb:null,
 noiseBuf(){ if(this._nb) return this._nb; const c=this.ctx,n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return this._nb=b; },
 ambient(key){ if(key===this.ambKey) return; this.ambKey=key; this.stopAmb(); const c=this.ctx, cfg=key&&AMBIENT[key]; if(!this.on()||!c||!cfg) return;
  const out=c.createGain(); out.gain.setValueAtTime(0,c.currentTime); out.gain.linearRampToValueAtTime(1,c.currentTime+1.4); out.connect(c.destination); const nodes=[];
  (cfg.tones||[]).forEach(([f,v])=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; g.gain.value=v; o.connect(g); g.connect(out); o.start(); nodes.push(o); });
  if(cfg.noise){ const [type,f,q,v,lfo]=cfg.noise, s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain(); s.buffer=this.noiseBuf(); s.loop=true; fl.type=type; fl.frequency.value=f; fl.Q.value=q; g.gain.value=v;
   s.connect(fl); fl.connect(g); g.connect(out); if(lfo){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=lfo; lg.gain.value=v*.6; l.connect(lg); lg.connect(g.gain); l.start(); nodes.push(l); } s.start(); nodes.push(s); }
  this.amb={out,nodes}; },
 stopAmb(){ const c=this.ctx,a=this.amb; this.amb=null; if(!c||!a) return; const t=c.currentTime; a.out.gain.cancelScheduledValues(t); a.out.gain.setValueAtTime(a.out.gain.value,t); a.out.gain.linearRampToValueAtTime(0,t+.8); a.nodes.forEach(n=>{ try{ n.stop(t+.9); }catch(e){} }); },
 door(){ this.noise(.5,260,1300,.028); this.tone(523,.08,.7,'sine',.018); },
 page(){ this.noise(.34,3400,900,.03); }
});

/* ---------- 主畫面：整列列車 + 火車頭「上班」 ---------- */
/* 主畫面火車：使用提供的影片（已去除浮水印、首尾交疊成無縫循環）；舊的 SVG 列車 ART.trainExterior 保留未刪 */
const MAIN_TRAIN={video:'assets/train-main.mp4',poster:'assets/train-main.jpg',anim:'assets/train-main.webp',ar:864/496};
/* 滿版排版：容器保持影片比例並蓋滿畫面；直向畫面把焦點放在火車頭（影片寬度 27% 處） */
function msLayout(){ const ms=document.getElementById('mainscreen'); if(!ms) return; const vw=ms.clientWidth, vh=ms.clientHeight;
 const W=Math.max(vw,vh*MAIN_TRAIN.ar), H=W/MAIN_TRAIN.ar, portrait=vw/vh<1.05, fx=portrait?.27:.5;
 const L=Math.min(0,Math.max(vw-W,vw/2-fx*W)), T=Math.min(0,Math.max(vh-H,vh/2-.5*H));
 ms.classList.toggle('portrait',portrait); const st=ms.querySelector('.ms-train').style;
 st.setProperty('--mw',W+'px'); st.setProperty('--mh',H+'px'); st.setProperty('--ml',L+'px'); st.setProperty('--mt',T+'px'); }
window.addEventListener('resize',msLayout); window.addEventListener('orientationchange',()=>setTimeout(msLayout,200));
/* 確保火車在動：影片自動播放被擋（例如手機低耗電模式）時，改用動態 WebP（一定會動） */
function msPlay(ms){ const v=ms.querySelector('video'); if(!v) return;
 const swap=()=>{ if(!v.isConnected) return; const im=document.createElement('img'); im.className='ms-anim'; im.alt=''; im.src=MAIN_TRAIN.anim; v.replaceWith(im); };
 const tryPlay=()=>{ v.muted=true; v.defaultMuted=true; const p=v.play(); if(p&&p.catch) p.catch(()=>{}); };
 tryPlay(); v.addEventListener('error',swap);
 setTimeout(()=>{ if(!v.isConnected) return; if(v.paused||v.currentTime<.05){ tryPlay(); setTimeout(()=>{ if(v.isConnected&&(v.paused||v.currentTime<.05)) swap(); },900); } },1600);
 ms.addEventListener('pointerdown',()=>{ if(v.isConnected&&v.paused) tryPlay(); },{once:true}); }
/* 從火車頭「上班」長出的金色枝條，分別伸向兩個選項（座標系 1600×918，對應影片比例） */
ART.branchV=function(lx=288,rx=976,ly=292){
 const leaf=(x,y,r,d)=>`<ellipse class="leaf" cx="${x}" cy="${y}" rx="11" ry="5" fill="#e8f5c8" transform="rotate(${r} ${x} ${y})" style="animation-delay:${d}s"/>`;
 return `<path class="br" pathLength="440" d="M400 578 C ${400+(lx-400)*.15} 480 ${400+(lx-400)*.55} 390 ${lx} ${ly}"/><path class="br" pathLength="440" d="M400 578 C ${400+(rx-400)*.14} 450 ${400+(rx-400)*.55} 330 ${rx} ${ly}"/>
 <path class="tw" pathLength="90" d="M378 474 C 360 446 338 434 312 436"/><path class="tw" pathLength="90" d="M540 428 C 560 400 584 390 612 390"/>
 ${leaf(390,520,-70,.35)}${leaf(348,410,-40,.5)}${leaf(312,436,-15,.62)}${leaf(452,500,40,.35)}${leaf(612,390,20,.55)}${leaf(760,330,25,.66)}
 <circle class="leaf" cx="${lx}" cy="${ly}" r="10" fill="#fff6d8" style="animation-delay:.75s"/><circle class="leaf" cx="${rx}" cy="${ly}" r="10" fill="#fff6d8" style="animation-delay:.75s"/>`; };
function showMain(){
 RUNNING=false; TAINT.fx(); SFX.stopDrone(); SFX.ambient(null); BGM.stop(); closeAll(); const old=$('#mainscreen'); if(old) old.remove();
 const hasAny=!!state.introDone||slotsGet().length>0;
 const el=document.createElement('div'); el.className='mainscreen'; el.id='mainscreen';
 el.innerHTML=`<div class="ms-logo"><div class="logo">日月更迭</div><div class="en">Between the Sun &amp; the Moon</div></div>
 <div class="ms-train" id="mst">
  <video class="ms-anim" src="${MAIN_TRAIN.video}" poster="${MAIN_TRAIN.poster}" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
  <svg class="ms-branch" viewBox="0 0 1600 918" preserveAspectRatio="none" aria-hidden="true"><g class="bl">${ART.branchV(288,976,328)}</g><g class="bp">${ART.branchV(304,544,292)}</g></svg>
  <button class="hs exit cta" id="ms-work"><span class="mk"></span><span class="lb">上班</span></button>
  <button class="ms-opt" id="ms-new" tabindex="-1">初次值勤<span class="s">開始新的旅程</span></button>
  <button class="ms-opt ${hasAny?'':'off'}" id="ms-cont" tabindex="-1">接續旅程<span class="s">${hasAny?'喚回封存的記憶':'尚無可接續的旅程'}</span></button>
 </div>
 <div class="ms-shade"></div>
 <button class="snd ms-snd ${PREFS.sound===false?'off':''}" id="ms-snd" aria-label="音樂與音效">♪</button>
 <div class="ms-note" id="ms-note">輕觸火車頭的「上班」開始值勤</div>`;
 document.body.appendChild(el); msLayout(); msPlay(el);
 /* 火車音效：瀏覽器規定要先有一次點擊才能出聲，所以在主畫面第一次點擊時開始；已解鎖（例如從遊戲回到主畫面）就直接播放 */
 if(SFX.ctx&&SFX.ctx.state==='running') TRAINSFX.start();
 const wake=()=>{ if($('#mainscreen')===el) TRAINSFX.start(); }; el.addEventListener('pointerdown',wake,{once:true}); el.addEventListener('keydown',wake,{once:true});
 el.querySelector('#ms-snd').onclick=e=>{ e.stopPropagation(); PREFS.sound=PREFS.sound===false; savePrefs(); e.currentTarget.classList.toggle('off',PREFS.sound===false);
  if(PREFS.sound===false) TRAINSFX.stop(); else TRAINSFX.start(); };
 const mst=el.querySelector('#mst'), note=el.querySelector('#ms-note');
 el.querySelector('#ms-work').onclick=()=>{ const o=!mst.classList.contains('open'); mst.classList.toggle('open',o);
  el.querySelectorAll('.ms-opt').forEach(b=>b.tabIndex=o?0:-1); note.textContent=o?'選擇今天的值勤方式':'輕觸火車頭的「上班」開始值勤'; if(o) SFX.tone(1318,0,.7,'sine',.03); };
 el.querySelector('#ms-new').onclick=()=>{
  if(state.introDone){ note.innerHTML=`開始新的值勤會取代最近一次的自動紀錄；已封存的記憶會保留。<span class="ms-cf"><button id="ms-y">開始初次值勤</button><button id="ms-n">取消</button></span>`;
   note.querySelector('#ms-y').onclick=startNew; note.querySelector('#ms-n').onclick=()=>{ note.textContent='選擇今天的值勤方式'; }; }
  else startNew(); };
 el.querySelector('#ms-cont').onclick=()=>{ if(!hasAny){ note.textContent='目前尚無可接續的旅程。請先選擇「初次值勤」。'; return; } savePanel('title'); };
}
function startNew(){ const ms=$('#mainscreen'); if(ms) ms.remove(); SFX.init(); TRAINSFX.stop(); BGM.start(); CAB.reset(); state=freshState(); save(); PANO.active=null; RUNNING=true; render(); intro(); }

/* ---------- 開場（原有開場文字，未改動） ---------- */
function intro(){
 cine(['很久很久，什麼都沒有動。','然後，一點光落在你身上。','你睜開眼睛。四周是白色的石、金色的弧，與一扇巨大的窗。','這是一列由古代守護者建造的列車。它沉睡了很久，而現在，它和你一起醒來了。','你不知道它為什麼停在這裡，也不知道建造它的人去了哪裡。','你只知道一件事：從今天起，由你來巡視它。'],()=>{
  state.introDone=true; addClue('clue_wake');
  /* 開場結束 → 進入小精靈的值勤準備 */
  state.currentCarriage='cab'; render();
  cine(['<span class="big">值勤準備</span><span class="sub">駕駛室・身體量測・裝備領取・資訊核對</span>'],()=>{ toast('點擊發光的標記，依序完成值勤準備'); arrivalChecks(); },null,true);
 });
}
function boot(){ normalizeState(); render(); showMain(); }
boot();
</script>
